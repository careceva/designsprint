<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advantage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ============================================================================
   ADVANTAGE
   Built against PRODUCT.md, advantage-GAP-ANALYSIS.md and advantage-ux/journey.json.

   User        : one person — the SMB owner or bookkeeper who represents the company.
                 Multi-user is a KNOWN UNBUILT GAP (gap analysis Tier 2 #5). It is
                 flagged in the UI, not silently designed around. See §SEAM.
   Finish line : not activation — the first correctly-priced order (Tier 1 #3).
                 That is why "How to buy" sits ABOVE Terms on every agreement page.
   Attention   : queue · notifications · inbox stay three separate things, never one
                 merged feed (PRODUCT.md principle).
   Routing     : agreement and category pages are real ?routes — linkable,
                 bookmarkable, forwardable to a colleague (Tier 1 #4).
   Copy        : English only. NO/SE/DK language switching is an unbuilt Tier 3 item.
   Assets      : real brand SVGs + supplier logos, inlined so the file stays portable.
   ========================================================================= */
:root{
  --general-background:#fafafa; --general-foreground:#0f0f0f;
  --general-primary:#1b64dc; --general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff; --general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2; --general-muted-foreground:#707070;
  --general-accent:#ff9b3d; --general-destructive:#dc2626;
  --general-border:#bdd7ff; --general-input:#ffffff;
  --sidebar-border:#e0e0e0; --sidebar-foreground:#1c1c1c;
  --sentiment-positive:#009689; --sentiment-negative:#f54a00;
  --surface:#ffffff; --brand-midnight:#000a45; --brand-ice:#edf5ff;
  --brand-cornflower:#73abff;

  --font-sans:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-5xl:48px;

  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;
  --rounded-xl:20px;--rounded-2xl:25px;--rounded-full:9999px;

  --shadow-2xs:0 1px 0 0 #0000000d;
  --shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --shadow-xl:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;

  --hairline:#ececec; --card-stroke:#e7e7ea; --card-stroke-hover:#d2d3d8;
  --t-fast:.15s ease; --t:.28s cubic-bezier(.2,.7,.3,1);

  /* sampled from assets/advantage-logo.svg — the only gradient in the product */
  --brand-grad:linear-gradient(135deg,#2170ed,#0b00ab);
  --brand-grad-soft:linear-gradient(135deg,#92beff,#2170ed);
  --pos-tint:#f4fcfb; --pos-stroke:#00968930;
  --warn-tint:#fff8f0; --warn-stroke:#ff9b3d40;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--font-sans);background:var(--general-background);
  color:var(--general-foreground);font-size:var(--text-base);line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-weight:600;text-wrap:balance}
h1{font-size:var(--text-4xl);letter-spacing:-1.1px;line-height:1.12}
h2{font-size:var(--text-2xl);letter-spacing:-.7px;line-height:1.2}
h3{font-size:var(--text-lg);letter-spacing:-.3px}
h4{font-size:var(--text-base);letter-spacing:-.2px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--general-primary)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--general-muted-foreground)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
[tabindex="-1"]:focus-visible{outline:none}
::selection{background:var(--general-secondary)}
img{max-width:100%;display:block}
svg{flex:0 0 auto}

/* ---- layout primitives: gap on containers, never sibling margins ---- */
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g1{gap:var(--s1)}.g2{gap:var(--s2)}.g3{gap:var(--s3)}.g4{gap:var(--s4)}
.g6{gap:var(--s6)}.g8{gap:var(--s8)}.g12{gap:var(--s12)}
.wrap{flex-wrap:wrap}.spread{justify-content:space-between}.push{margin-left:auto}
.top{align-items:flex-start}
.hsec{padding-top:var(--s8);border-top:1px solid var(--hairline)}

/* ---- buttons: one height scale shared with inputs ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:44px;padding:0 var(--s6);border:1px solid transparent;cursor:pointer;
  border-radius:var(--rounded-full);font-size:var(--text-sm);font-weight:500;
  white-space:nowrap;transition:background-color var(--t-fast),border-color var(--t-fast),
  box-shadow var(--t-fast),transform .1s ease}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{cursor:not-allowed;opacity:.45}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--general-primary);color:var(--general-primary-foreground);
  box-shadow:0 1px 2px #1b64dc40,inset 0 1px 0 #ffffff26}
.btn-primary:hover:not([disabled]){background:#1757c0}
.btn-ghost{background:var(--surface);border-color:var(--card-stroke)}
.btn-ghost:hover{border-color:var(--card-stroke-hover);background:#fcfcfd}
.btn-quiet{background:transparent;color:var(--general-primary);padding:0 var(--s3)}
.btn-quiet:hover{background:var(--brand-ice)}
.btn-sm{height:34px;padding:0 var(--s4);font-size:var(--text-xs)}
.btn-xs{height:28px;padding:0 var(--s3);font-size:var(--text-xs);gap:var(--s1)}
.btn-wide{width:100%}

/* ---- surfaces. nested radius always steps DOWN ---- */
.card{background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--rounded-xl);box-shadow:var(--shadow-sm)}
.card-in{border-radius:var(--rounded-lg);box-shadow:none}
.pad{padding:var(--s6)}.pad-sm{padding:var(--s4)}.pad-lg{padding:var(--s8)}

.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.chip{display:inline-flex;align-items:center;gap:var(--s1);height:26px;padding:0 var(--s3);
  border-radius:var(--rounded-full);background:var(--general-muted);
  font-size:var(--text-xs);font-weight:500;white-space:nowrap}
.chip-pos{background:var(--pos-tint);border:1px solid var(--pos-stroke);color:#00756b}
.chip-info{background:var(--general-secondary);color:#154a9e}
.chip-warn{background:var(--warn-tint);border:1px solid var(--warn-stroke);color:#8a4d09}
.chip-est{background:var(--general-muted);color:var(--general-muted-foreground);
  border:1px dashed #c9c9c9}
.figure{font-weight:600;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.05}
.f-hero{font-size:var(--text-5xl);letter-spacing:-1.6px}
.f-xl{font-size:var(--text-4xl)}.f-lg{font-size:var(--text-2xl)}.f-md{font-size:var(--text-xl)}
.pos{color:var(--sentiment-positive)}

/* ---- shell: 3 primary destinations, so "where am I" is answerable instantly ---- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.topbar{position:sticky;top:0;z-index:60;grid-column:1/-1;height:64px;display:flex;
  align-items:center;gap:var(--s4);padding:0 var(--s6);background:#ffffffe6;
  backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
.logo{height:22px;width:auto;flex:0 0 auto}
.logo-slot{width:196px;flex:0 0 auto;display:flex;align-items:center}
.search{flex:1 1 auto;max-width:460px;height:40px;display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s4);border:1px solid var(--card-stroke);background:#fcfcfd;
  border-radius:var(--rounded-full);color:var(--general-muted-foreground);cursor:pointer;
  font-size:var(--text-sm);transition:border-color var(--t-fast)}
.search:hover{border-color:var(--card-stroke-hover);background:var(--surface)}
.search kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;
  background:var(--general-muted);border-radius:var(--rounded-xs);padding:2px 6px}
.tb-r{display:flex;align-items:center;gap:var(--s2);margin-left:auto}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:var(--rounded-md);
  display:grid;place-items:center;cursor:pointer;color:#43576c;position:relative}
.iconbtn:hover{background:var(--general-muted)}
.iconbtn img{width:20px;height:20px;opacity:.75}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:var(--rounded-full);background:var(--general-destructive);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.who{display:flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s2) 0 var(--s1);
  border:1px solid var(--card-stroke);border-radius:var(--rounded-full);background:var(--surface);
  cursor:pointer;font-size:var(--text-xs);text-align:left}
.who:hover{border-color:var(--card-stroke-hover)}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-grad);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 auto}
.who-c{display:flex;flex-direction:column;line-height:1.2}
.who-c b{font-size:var(--text-xs);white-space:nowrap}
.who-c span{font-size:10.5px;color:var(--general-muted-foreground);white-space:nowrap}

.side{border-right:1px solid var(--sidebar-border);background:var(--surface);
  padding:var(--s6) var(--s3);display:flex;flex-direction:column;gap:var(--s6);
  position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.navgrp{display:flex;flex-direction:column;gap:var(--s1)}
.navlbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--general-muted-foreground);padding:0 var(--s3) var(--s1)}
.ni{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;
  padding:var(--s2) var(--s3);border:0;background:transparent;border-radius:var(--rounded-md);
  cursor:pointer;font-size:var(--text-sm);font-weight:500;color:var(--sidebar-foreground);
  text-align:left;transition:background var(--t-fast)}
.ni:hover{background:var(--general-muted)}
.ni.on{background:var(--brand-ice);color:#0f4bb0;font-weight:600}
.ni.on .ni-ic{background:var(--general-primary);color:#fff}
.ni-ic{width:26px;height:26px;border-radius:var(--rounded-sm);background:var(--general-muted);
  color:#43576c;display:grid;place-items:center;flex:0 0 auto;transition:all var(--t-fast)}
.ni-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ni-badge{margin-left:auto;min-width:21px;height:21px;padding:0 6px;
  border-radius:var(--rounded-full);background:var(--general-destructive);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center}
/* §SEAM — multi-user is not built. This is the flagged insertion point, not a feature. */
.seam{margin-top:auto;padding:var(--s3);border:1px dashed var(--card-stroke-hover);
  border-radius:var(--rounded-md);display:flex;flex-direction:column;gap:var(--s2)}
.seam b{font-size:var(--text-xs)}
.seam span{font-size:11px;color:var(--general-muted-foreground);line-height:1.4}

.canvas{padding:var(--s8);min-width:0;display:flex;flex-direction:column;gap:var(--s8)}
.view{display:none;flex-direction:column;gap:var(--s8)}
.view.on{display:flex}
.wrapm{max-width:1120px;width:100%}
.vhead{display:flex;flex-direction:column;gap:var(--s2);max-width:70ch}
.vhead p{color:var(--general-muted-foreground)}
.crumb{display:flex;align-items:center;gap:var(--s2);font-size:var(--text-xs);
  color:var(--general-muted-foreground)}
.crumb button{border:0;background:transparent;color:var(--general-primary);cursor:pointer;
  font-size:var(--text-xs);padding:0}
.crumb button:hover{text-decoration:underline}

/* ---- grids ---- */
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.g-side{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:var(--s8);align-items:start}

/* ---- the three-way attention split: queue / notifications / inbox ---- */
.tabs{display:flex;gap:var(--s6);border-bottom:1px solid var(--hairline)}
.tab{height:46px;padding:0;border:0;background:transparent;cursor:pointer;
  font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground);
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:var(--s2)}
.tab.on{color:var(--general-foreground);border-bottom-color:var(--general-primary);font-weight:600}
.tab .cnt{min-width:20px;height:20px;padding:0 5px;border-radius:var(--rounded-full);
  background:var(--general-muted);font-size:11px;font-weight:600;display:grid;place-items:center}
.tab.on .cnt{background:var(--general-primary);color:#fff}
.pane{display:none;flex-direction:column;gap:var(--s4)}
.pane.on{display:flex}

/* ---- queue item: something with your name on it ---- */
.q{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4);background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--rounded-lg);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.q:hover{border-color:var(--card-stroke-hover);box-shadow:var(--shadow-sm)}
.q-ic{width:40px;height:40px;border-radius:var(--rounded-md);display:grid;place-items:center;
  background:var(--brand-ice);color:#0f4bb0}
.q-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.q-ic.warn{background:var(--warn-tint);color:#8a4d09}
.q-ic.pos{background:var(--pos-tint);color:#00756b}
.q-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.q-b b{font-size:var(--text-sm)}
.q-b span{font-size:var(--text-xs);color:var(--general-muted-foreground);line-height:1.45}
.n-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:var(--s3);
  align-items:start;padding:var(--s3) var(--s4);border-bottom:1px solid var(--hairline)}
.n-row:last-child{border-bottom:0}
.n-unread{width:8px;height:8px;border-radius:50%;background:var(--general-primary);margin-top:7px}
.n-read{width:8px;height:8px;border-radius:50%;background:transparent;
  border:1.5px solid var(--card-stroke-hover);margin-top:7px}
.n-row b{font-size:var(--text-sm);font-weight:600;display:block}
.n-row span{font-size:var(--text-xs);color:var(--general-muted-foreground)}
.n-when{font-size:11px;color:var(--general-muted-foreground);white-space:nowrap}
.thread{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);
  padding:var(--s4);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  background:var(--surface);cursor:pointer;text-align:left;align-items:center}
.thread:hover{border-color:var(--card-stroke-hover)}

/* ---- supplier mark: real artwork where it exists, initials where it doesn't ---- */
.mark{width:44px;height:44px;flex:0 0 auto;border-radius:var(--rounded-md);
  border:1px solid var(--hairline);background:var(--surface);display:grid;place-items:center;
  overflow:hidden;padding:5px}
.mark img{width:100%;height:100%;object-fit:contain}
.mark.ini{background:var(--general-muted);border-color:transparent;color:#3a4a5c;
  font-weight:700;font-size:13px;padding:0}
.mark-lg{width:64px;height:64px;border-radius:var(--rounded-lg);padding:8px}
.mark-sm{width:32px;height:32px;border-radius:var(--rounded-sm);padding:3px;font-size:11px}

/* ---- the diagnosis block: category pages argue before they list ---- */
.diag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;
  border:1px solid var(--hairline);border-radius:var(--rounded-lg);overflow:hidden;
  background:var(--surface)}
.diag-c{padding:var(--s4);border-right:1px solid var(--hairline);display:flex;
  flex-direction:column;gap:var(--s1)}
.diag-c:last-child{border-right:0}
.diag-c .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.diag-c .sub{font-size:var(--text-xs);color:var(--general-muted-foreground)}
.verdict{padding:var(--s4);background:var(--brand-ice);border:1px solid #cfe0ff;
  border-radius:var(--rounded-lg);display:flex;gap:var(--s3);align-items:flex-start}
.verdict img{width:22px;height:24px;margin-top:1px}
.verdict p{font-size:var(--text-sm);line-height:1.55}
/* peer percentile — a position, not a number */
.pct{height:34px;border-radius:var(--rounded-full);background:linear-gradient(90deg,
  #e8f6f4 0%,#f2f2f2 50%,#fff1e6 100%);position:relative;border:1px solid var(--hairline)}
.pct-you{position:absolute;top:-5px;width:3px;height:42px;background:var(--general-foreground);
  border-radius:2px}
.pct-you::after{content:"You";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:700;white-space:nowrap}
.pct-ends{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--general-muted-foreground)}

/* ---- HOW TO BUY — the finish line. Tier 1 #3. Sits above Terms. ---- */
.buy{border:2px solid var(--general-primary);border-radius:var(--rounded-xl);
  background:var(--surface);overflow:hidden;box-shadow:0 4px 20px #1b64dc14}
.buy-h{padding:var(--s4) var(--s6);background:var(--brand-grad);color:#fff;
  display:flex;align-items:center;gap:var(--s3)}
.buy-h img{width:20px;height:22px;filter:brightness(0) invert(1)}
.buy-h .col{gap:1px}
.buy-h b{font-size:var(--text-base)}
.buy-h span{font-size:var(--text-xs);opacity:.85}
.buy-b{padding:var(--s6);display:flex;flex-direction:column;gap:var(--s6)}
.buy-num{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  background:var(--brand-ice);border:1px solid #cfe0ff;border-radius:var(--rounded-md)}
.buy-num .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:#3d6199}
.buy-num b{font-family:var(--font-mono);font-size:var(--text-xl);letter-spacing:.5px;
  color:#123c78;flex:1 1 auto}
.chan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;
  padding:var(--s3) var(--s4);border:1px solid var(--hairline);border-radius:var(--rounded-md);
  background:var(--surface)}
.chan.fast{border-color:var(--pos-stroke);background:var(--pos-tint)}
.chan .col{gap:2px;min-width:0}
.chan b{font-size:var(--text-sm)}
.chan span{font-size:var(--text-xs);color:var(--general-muted-foreground)}
.ck{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--s3);align-items:flex-start;
  padding:var(--s2) 0;border-bottom:1px solid var(--hairline);cursor:pointer;text-align:left;
  background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.ck:last-child{border-bottom:0}
.ck-box{width:22px;height:22px;border:1.5px solid var(--card-stroke-hover);
  border-radius:var(--rounded-xs);display:grid;place-items:center;background:var(--surface);
  margin-top:1px;transition:all var(--t-fast)}
.ck.done .ck-box{background:var(--sentiment-positive);border-color:var(--sentiment-positive)}
.ck-box img{width:12px;height:10px;opacity:0;filter:brightness(0) invert(1)}
.ck.done .ck-box img{opacity:1}
.ck-t{font-size:var(--text-sm);line-height:1.5}
.ck.done .ck-t{color:var(--general-muted-foreground);text-decoration:line-through}
.ck-t small{display:block;font-size:var(--text-xs);color:var(--general-muted-foreground);
  text-decoration:none;margin-top:2px}
.contact{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);
  border:1px solid var(--hairline);border-radius:var(--rounded-md);background:#fcfcfd}
.portrait{width:44px;height:44px;border-radius:50%;background:var(--brand-grad-soft);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:var(--text-sm);flex:0 0 auto}

/* ---- opportunity card ---- */
.opp{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);text-align:left;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  cursor:pointer;transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast)}
.opp:hover{border-color:var(--card-stroke-hover);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s1)}
.stat .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.stat .sub{font-size:var(--text-xs);color:var(--general-muted-foreground)}

/* ---- the value reveal: journey stage 4, emotion 5/5. The one hero moment. ---- */
.reveal{background:var(--brand-grad);border-radius:var(--rounded-xl);padding:var(--s12);
  color:#fff;display:flex;flex-direction:column;gap:var(--s4);position:relative;overflow:hidden}
.reveal::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;
  border-radius:50%;background:#ffffff14;pointer-events:none}
.reveal .eyebrow{color:#ffffffb3}
.reveal-f{font-size:clamp(44px,7vw,76px);font-weight:700;letter-spacing:-2.4px;line-height:1;
  font-variant-numeric:tabular-nums}
.reveal p{max-width:56ch;color:#ffffffd9;font-size:var(--text-base)}
.reveal-split{display:flex;gap:var(--s8);flex-wrap:wrap;padding-top:var(--s4);
  border-top:1px solid #ffffff2e}
.reveal-split .col{gap:2px}
.reveal-split .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:#ffffffa6}
.reveal-split b{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.6px}

/* ---- steps ---- */
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:var(--s3);position:relative;
  padding-bottom:var(--s4)}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--hairline)}
.step:last-child::before{display:none}
.step-d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:2px solid var(--hairline);
  color:var(--general-muted-foreground);font-size:11px;font-weight:700;z-index:1}
.step.done .step-d{background:var(--sentiment-positive);border-color:var(--sentiment-positive);color:#fff}
.step.done::before{background:var(--sentiment-positive)}
.step.now .step-d{border-color:var(--general-primary);color:var(--general-primary);
  box-shadow:0 0 0 4px #1b64dc1a}
.step-d img{width:11px;height:9px;filter:brightness(0) invert(1)}
.step-b{display:flex;flex-direction:column;gap:2px}
.step-b .t{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.step-b b{font-size:var(--text-sm)}
.step-w{font-size:var(--text-xs);color:var(--general-muted-foreground);font-variant-numeric:tabular-nums}
.step-s{font-size:var(--text-xs);color:var(--general-muted-foreground);max-width:60ch}
.step.todo b,.step.todo .step-s{opacity:.55}

/* ---- overlays ---- */
.scrim{position:fixed;inset:0;background:#0b132480;backdrop-filter:blur(3px);z-index:90;
  display:none;align-items:center;justify-content:center;padding:var(--s6)}
.scrim.on{display:flex}
.sheet{width:min(640px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);
  border-radius:var(--rounded-xl);box-shadow:var(--shadow-xl);padding:var(--s8);
  display:flex;flex-direction:column;gap:var(--s6)}
.sheet-h{display:flex;align-items:flex-start;gap:var(--s4)}
.x{width:34px;height:34px;border:0;background:var(--general-muted);border-radius:50%;
  cursor:pointer;display:grid;place-items:center;flex:0 0 auto;margin-left:auto;
  font-size:18px;line-height:1;color:var(--general-muted-foreground)}
.x:hover{background:#e6e6e6}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.field input,.field textarea{height:44px;padding:0 var(--s3);border:1px solid var(--card-stroke);
  border-radius:var(--rounded-md);background:var(--surface);outline:none;font-size:var(--text-sm);
  box-shadow:inset 0 1px 2px #0000000a}
.field textarea{height:auto;min-height:112px;padding:var(--s3);resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus{border-color:var(--brand-cornflower);
  box-shadow:0 0 0 3px #1b64dc14}
.draft{background:#fcfcfd;border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  padding:var(--s4);font-size:var(--text-xs);line-height:1.7;white-space:pre-wrap;
  font-family:var(--font-mono)}
.pal{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;
  padding:11vh var(--s6) var(--s6);background:#0b132466;backdrop-filter:blur(3px)}
.pal.on{display:flex}
.pal-box{width:min(600px,100%);background:var(--surface);border-radius:var(--rounded-xl);
  box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column}
.pal-in{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);
  border-bottom:1px solid var(--hairline)}
.pal-in input{flex:1 1 auto;border:0;outline:none;font-size:var(--text-lg);background:transparent}
.pal-l{max-height:50vh;overflow-y:auto;padding:var(--s2)}
.pal-i{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3);border:0;
  background:transparent;border-radius:var(--rounded-md);cursor:pointer;text-align:left}
.pal-i:hover,.pal-i.cur{background:var(--brand-ice)}
.pal-k{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--general-muted-foreground)}
.toast{position:fixed;left:50%;bottom:var(--s6);transform:translate(-50%,14px);z-index:120;
  background:var(--brand-midnight);color:#fff;padding:var(--s3) var(--s6);
  border-radius:var(--rounded-full);font-size:var(--text-xs);font-weight:500;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:opacity var(--t),transform var(--t)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:var(--s12) var(--s6);text-align:center;display:flex;flex-direction:column;
  gap:var(--s3);align-items:center;border:1px dashed var(--card-stroke-hover);
  border-radius:var(--rounded-lg)}
.empty img{width:34px;height:38px;opacity:.4}

@media (max-width:1180px){ .g-side{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1024px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .g-3,.diag{grid-template-columns:repeat(2,minmax(0,1fr))}
  .diag-c:nth-child(2){border-right:0}
}
@media (max-width:680px){
  .canvas{padding:var(--s6) var(--s4) var(--s24)}
  .g-2,.g-3,.diag{grid-template-columns:minmax(0,1fr)}
  .diag-c{border-right:0;border-bottom:1px solid var(--hairline)}
  .diag-c:last-child{border-bottom:0}
  .search span,.who-c{display:none}
  .q{grid-template-columns:40px minmax(0,1fr)}
  .q>.btn{grid-column:2}
  .reveal{padding:var(--s6)}
  .btn{width:100%}
  .row.wrap>.btn{width:auto}
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important;animation:none!important} }
</style>
</head>

function sdate(a,i){ const b=Date.now()+(a.sent||0)*DAY, o=[0,5,14,34][i];

let viewAt='today', catAt=null, agrAt=null;
function url(){
  const p=new URLSearchParams();
  if(agrAt) p.set('agreement',agrAt);
  else if(catAt) p.set('category',catAt);
  else if(viewAt!=='today') p.set('view',viewAt);
  if(ME!=='bob') p.set('as',ME);
  const q=p.toString();
  return location.pathname+(q?'?'+q:'');
}
function push(){ history.replaceState(null,'',url()); }
function readUrl(){
  const p=new URLSearchParams(location.search);
  if(p.get('as')&&PEOPLE[p.get('as')]) ME=p.get('as');
  if(p.get('agreement')&&findAgr(p.get('agreement'))) return openAgr(p.get('agreement'),true);
  if(p.get('category')&&findCat(p.get('category'))) return openCat(p.get('category'),true);
  const v=p.get('view');
  return go(['today','opps','value','data'].includes(v)?v:'today',true);
}

const queue=()=>{
  const q=[];
  if(!connected()) q.push({ ic:'ic_ic_edit', kind:'warn', t:'Connect your spend data',
    s:'Every figure you see is a peer estimate until you do. Takes about two minutes.',
    cta:'Connect', go:()=>go('data') });
  all().filter(dormant).forEach(a=>q.push({ ic:'ic_ic_contract', kind:'warn',
    t:a.n+' is active but nothing is being ordered through it',
    s:'Nothing invoiced for '+quiet(a)+' days. '+money(save(a))+' a year is sitting unclaimed.',
    cta:'How to buy', go:()=>openAgr(a.n) }));
  all().filter(a=>a.on&&stage(a)<3&&!a.dormant).forEach(a=>q.push({ ic:'ic_ic_contract', kind:'',
    t:a.n+' — '+ACT[stage(a)+1][0].toLowerCase(),
    s:'Sent '+(-a.sent)+' days ago. Expected '+sdate(a,stage(a)+1)+'.',
    cta:'Track', go:()=>openAgr(a.n) }));
  const top=all().filter(a=>!a.on).sort((x,y)=>save(y)-save(x))[0];
  if(top) q.push({ ic:'ic_ic_dash', kind:'pos', t:'Biggest opportunity: '+top.n,
    s:money(save(top))+' a year on spend you already have, in '+top.c.n.toLowerCase()+'.',
    cta:'See the case', go:()=>openCat(top.c.id) });
  return q;
};

function ico(k,cls){ return '<img src="'+A[k]+'" alt="" '+(cls?'class="'+cls+'"':'')+'>'; }
function markOf(a,sz){
  const c='mark '+(sz||'')+(a.file&&A[a.file]?'':' ini');

    ? '<span class="'+c+'"><img src="'+A[a.file]+'" alt="'+esc(a.n)+'"></span>'
    : '<span class="'+c+'">'+ini(a.n)+'</span>';
}
function ini(n){ const w=n.split(/[\s-]+/).filter(Boolean);

  agrAt=n; catAt=null; viewAt='opps';

/* ---- activation: ends by pointing at the ordering instructions, not a receipt ---- */
function activate(n){
  const a=findAgr(n); if(!a||a.on) return;
  sheet('<div class="col g4" style="align-items:center;text-align:center;padding:var(--s8) 0">'
    +'<div class="portrait" style="width:56px;height:56px">'+ico('sda')+'</div>'
    +'<h2>Sending your request…</h2>'
    +'<p class="muted" style="font-size:var(--text-sm);max-width:44ch">We pass your volumes and CVR '
    +'to '+esc(n)+'. Nothing changes on your side yet.</p></div>');
  const fast=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    a.on=true; a.sent=0; a.cust=a.cust||'DK-PENDING';
    NOTES.unshift({ t:n+' request sent', s:'We will tell you the moment the price is live',
      when:'just now', read:false, go:()=>openAgr(n) });
    paintBell();
    sheet('<div class="sheet-h"><div class="col g1"><span class="eyebrow">On its way</span>'
      +'<h2>'+esc(n)+' is being set up</h2></div><button class="x" data-x>×</button></div>'
      +'<p class="muted" style="font-size:var(--text-sm)">Confirmation expected '+sdate(a,1)
      +'. But activation is not the finish line — the first correctly-priced order is.</p>'
      +'<div class="card card-in pad-sm col g2" style="border:1px solid var(--general-border);background:var(--brand-ice)">'
      +'<b style="font-size:var(--text-sm)">What you will need</b>'
      +'<span class="muted" style="font-size:var(--text-xs)">A customer number, the right place to '
      +'order, and someone to call. All of it lands on this agreement page as soon as the supplier '
      +'confirms — we will notify you.</span></div>'
      +'<div class="row g2 wrap"><button class="btn btn-primary btn-sm" id="gAgr">Open the agreement page</button>'
      +'<button class="btn btn-ghost btn-sm" data-x>Later</button></div>');
    $('#gAgr').onclick=()=>{ shut(); openAgr(n); };
    renderNav();
  }, fast?300:1700);
}

    s:Math.round(c.cover*100)+'% on agreement · '+(pot(c)?money(pot(c))+' open':'nothing open'),
    go:()=>openCat(c.id)}));
  all().forEach(a=>o.push({t:a.n,k:a.on?'Active agreement':'Available',
    s:a.c.n+' · '+money(save(a))+(a.on&&a.cust?' · '+a.cust:''),go:()=>openAgr(a.n)}));
  all().filter(a=>a.on).forEach(a=>o.push({t:'How to buy on '+a.n,k:'Action',
    s:'Customer number, order channels, contact',go:()=>openAgr(a.n)}));
  return o;
}
let palCur=0, palShow=[];
function openPal(){ $('#pal').classList.add('on'); $('#palIn').value=''; palCur=0; paintPal('');
  setTimeout(()=>$('#palIn').focus(),30); }
function paintPal(q){
  q=(q||'').toLowerCase().trim();
  palShow=(q?palItems().filter(i=>(i.t+' '+(i.s||'')+' '+i.k).toLowerCase().includes(q))
            :palItems().slice(0,8)).slice(0,30);
  if(palCur>=palShow.length) palCur=0;
  $('#palL').innerHTML=palShow.length?palShow.map((i,n)=>'<button class="pal-i'+(n===palCur?' cur':'')
    +'" data-p="'+n+'"><span class="col" style="gap:1px;min-width:0">'
    +'<b style="font-size:var(--text-sm);font-weight:500">'+esc(i.t)+'</b>'
    +(i.s?'<span class="muted" style="font-size:11.5px">'+esc(i.s)+'</span>':'')
    +'</span><span class="pal-k">'+i.k+'</span></button>').join('')
    :'<div style="padding:var(--s6);text-align:center" class="muted">Nothing matches “'+esc(q)+'”.</div>';
  $$('[data-p]').forEach(b=>b.onclick=()=>runPal(+b.dataset.p));
}
function runPal(n){ const i=palShow[n]; if(!i) return; $('#pal').classList.remove('on'); i.go(); }
$('#searchBtn').onclick=openPal;
$('#palIn').oninput=e=>{ palCur=0; paintPal(e.target.value); };
$('#palIn').onkeydown=e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); palCur=Math.min(palCur+1,palShow.length-1); paintPal($('#palIn').value); }
  if(e.key==='ArrowUp'){ e.preventDefault(); palCur=Math.max(palCur-1,0); paintPal($('#palIn').value); }
  if(e.key==='Enter'){ e.preventDefault(); runPal(palCur); }
};
$('#pal').onclick=e=>{ if(e.target.id==='pal') $('#pal').classList.remove('on'); };

/* ---- assistant: context-bound, never a generic launcher (gap analysis) ---- */
$('#askBtn').onclick=()=>{
  const where=agrAt?('the '+agrAt+' agreement'):catAt?findCat(catAt).n.toLowerCase():'your account';
  const qs=agrAt
    ? ['Is anyone actually ordering through this?','What do I need to place the first order?','Why is the saving what it is?']
    : catAt ? ['Which of these should I do first?','Why am I behind my trade here?','How was this calculated?']
            : ['What should I do first?','What changed this week?','Where am I leaving the most money?'];
  sheet('<div class="sheet-h"><span class="portrait">'+ico('sda')+'</span>'
    +'<div class="col g1"><span class="eyebrow">Saving assistant</span>'
    +'<h2>Ask about '+esc(where)+'</h2></div><button class="x" data-x>×</button></div>'
    +'<p class="muted" style="font-size:var(--text-sm)">Seeded with what you are looking at — it '
    +'answers from your own account, not from a help centre.</p>'
    +'<div class="col g2">'+qs.map(q=>'<button class="chan" data-ask="'+esc(q)+'" '
      +'style="cursor:pointer;text-align:left;width:100%">'
      +'<span class="col"><b>'+esc(q)+'</b></span>'+ico('ic_arrow_right_icon')+'</button>').join('')+'</div>'
    +'<div class="field"><label>Or ask your own</label>'
    +'<input id="askIn" placeholder="Type a question…"></div>'
    +'<div class="row g2 wrap"><button class="btn btn-primary btn-sm" id="askGo">Ask</button>'
    +'<button class="btn btn-ghost btn-sm" id="askHuman">Ask a person instead</button></div>');
  $$('[data-ask]').forEach(b=>b.onclick=()=>answer(b.dataset.ask));
  $('#askGo').onclick=()=>answer($('#askIn').value);
  $('#askHuman').onclick=()=>{ shut(); tTab='inbox'; go('today'); toast('Your advisor has your account open'); };
};
function answer(q){
  if(!q||!q.trim()) return;
  const a=agrAt?findAgr(agrAt):null, c=catAt?findCat(catAt):null;
  let r;
  if(a&&dormant(a)) r='No. '+a.n+' is live and correctly priced, but nothing has been invoiced '
    +'through it for '+quiet(a)+' days — so it is saving you nothing. The fix is not renegotiation, '
    +'it is ordering: customer number '+a.cust+', and the fastest channel is '
    +(CHANNELS[a.n]?CHANNELS[a.n][0][0].toLowerCase():'the webshop')+'.';
  else if(a&&/first order|need|place/.test(q.toLowerCase())) r='Three things: your customer number ('
    +a.cust+'), the right channel — '+(CHANNELS[a.n]?CHANNELS[a.n][0][1]:'the webshop')
    +' — and '+a.contact[0]+' on '+a.contact[2]+' if the price comes out wrong.';
  else if(a) r=money(save(a))+' a year: '+Math.round(a.rate*100)+'% off list on '+fmt(a.covers)
    +' of spend you already have. '+(connected()?'Verified against your invoices.'
    :'A range, estimated from '+me().peers+' peers, until your data is connected.');
  else if(c) r=c.diag+' You are at '+Math.round(c.cover*100)+'% coverage against '+c.pct
    +'% for your trade, which is why it ranks where it does.';
  else { const t=all().filter(x=>!x.on).sort((x,y)=>save(y)-save(x))[0];
    const d=all().filter(dormant)[0];
    r=d?'Before anything new: '+d.n+' is active but nothing is being ordered through it. That is '
      +money(save(d))+' a year you are already entitled to and not collecting.'
      :t?t.n+' in '+t.c.n.toLowerCase()+' — '+money(save(t))+' a year.':'Everything is working.'; }
  sheet('<div class="sheet-h"><span class="portrait">'+ico('sda')+'</span>'
    +'<div class="col g1"><span class="eyebrow">Saving assistant</span>'
    +'<h2 style="font-size:var(--text-lg)">'+esc(q)+'</h2></div><button class="x" data-x>×</button></div>'
    +'<p style="font-size:var(--text-sm);line-height:1.65">'+esc(r)+'</p>'
    +'<div class="row g2 wrap">'+(a?'<button class="btn btn-primary btn-sm" id="aGo">Open how-to-buy</button>':'')
    +'<button class="btn btn-ghost btn-sm" data-x>Close</button></div>');
  const g=$('#aGo'); if(g) g.onclick=()=>{ shut(); openAgr(a.n); };
}

$('#bellBtn').onclick=()=>{ tTab='notes'; go('today'); };
$('#whoBtn').onclick=()=>{
  ME=ME==='bob'?'fanny':'bob';
  /* Fanny's world: nothing activated, so the honesty model makes everything a range */
  if(ME==='fanny'){ all().forEach(a=>{ if(a._on===undefined) a._on=a.on; a.on=false; }); }
  else all().forEach(a=>{ if(a._on!==undefined) a.on=a._on; });
  paintWho(); renderNav(); go('today');
  toast(me().name+' · '+(connected()?'data connected, figures verified'
    :'no data yet — '+me().peers+' peers, everything a range'));
};
function paintWho(){
  $('#whoAv').textContent=me().av; $('#whoName').textContent=me().name; $('#whoCo').textContent=me().co;
}
$('#seamBtn').onclick=()=>sheet('<div class="sheet-h"><div class="col g1">'
  +'<span class="eyebrow">Known gap</span><h2>Why can’t I invite anyone?</h2></div>'
  +'<button class="x" data-x>×</button></div>'
  +'<p class="muted" style="font-size:var(--text-sm)">Advantage currently assumes one person per '
  +'company — the owner or bookkeeper who represents the business. Real firms have an owner, a '
  +'bookkeeper and site managers, and none of them can be invited, delegated to, or audited yet.</p>'
  +'<p class="muted" style="font-size:var(--text-sm)">This is the single largest remaining structural '
  +'gap in the product, and it is deliberately not faked here. The seam is left visible so it reads '
  +'as a decision rather than an oversight.</p>'
  +'<div class="row g2 wrap"><button class="btn btn-ghost btn-sm" data-x>Understood</button></div>');

/* ---- boot ---- */
paintWho(); paintBell(); readUrl(); renderNav();
window.addEventListener('popstate',readUrl);
</script>
