<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advantage — To do this month</title>
<!--
  ================================================================
  DESIGN BRIEF — Advantage v9 B: The Worklist
  ================================================================
  Reader: Bjørn Halvorsen, 61, procurement manager, 22 years in the job. Expert buyer,
  not a software person. He reads; he does not scan or hover or guess.

  THE STANCE
  Procurement is a job with tasks. So the front page is not a picture of his money — it is
  a numbered list of work, laid out like a well-designed paper form: a count at the top, a
  ruled row per job, what each is worth in kroner a year, one short paragraph of why, and
  two buttons that say out loud what pressing them does. Finish one and it drops to
  "Done this month" at the bottom, where the kroner add up. The pile visibly shrinks.
  Nothing on this page needs to be discovered; everything is written down.

  THE SINGLE SENTENCE THAT STATES THE ASK (top of the first page, in words)
  "There are three things to do this month. Each one takes two or three minutes — about
   ten minutes in all."

  FOUR SECTIONS (was seven)
  1. To do        — the worklist, later this year, done this month, the savings figure
  2. Agreements   — the 8 he uses, the one waiting, and the three real agreement pages
  3. Messages     — Mette (a named person with a phone number) plus everything the system
                    wants to tell him, in one place
  4. Your buying  — the 14 200 000 kr a year, category by category, and the cash back

  WHAT I CUT AND WHY
  - Cut the seven-section navigation: "Categories", "Savings" and "Spending" were three
    views of one table, so they became one page called Your buying. A separate notification
    centre became Messages, because he does not distinguish a message from an alert.
  - Cut all charts, bars, rings and percentage badges from the front page. A bar cannot be
    read aloud. Every figure is written out in kroner with its period: 118 000 kr a year.
  - Cut every icon-only control, every hover reveal, every keyboard-only path.
  - Cut software words entirely (no dashboard, no activate, no queue, no coverage %).
    Kept his own trade words: framework agreement, list price, notice period, invoice,
    volume, credit note, cash back.
  - Cut the idea that he should explore. He is told, in order, what to do.
  - One accent colour (the system blue) and it only ever means "you can press this".
    Done rows are marked with the word "Done", never with colour alone.
  ================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400..800&family=DM+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --general-background:#fafafa;--general-foreground:#0f0f0f;
  --general-primary:#1b64dc;--general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff;--general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2;--general-muted-foreground:#707070;
  --general-accent:#ff9b3d;--general-accent-foreground:#1c1c1c;
  --general-destructive:#dc2626;--general-destructive-foreground:#ffffff;
  --general-border:#bdd7ff;--general-input:#ffffff;
  --focus-ring:#c7c7c7;--focus-ring-error:#fca5a5;
  --sidebar:#fafafa;--sidebar-foreground:#3d3d3d;--sidebar-accent:#f2f2f2;
  --sidebar-primary:#1c1c1c;--sidebar-primary-foreground:#fafafa;
  --sidebar-accent-foreground:#1c1c1c;--sidebar-border:#e0e0e0;--sidebar-ring:#c7c7c7;
  --data-positive:#57b844;--data-positive-strong:#429632;--data-positive-light:#d5fccc;
  --data-positive-soft:#a4e396;
  --font-sans:"Rethink Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-size-0:12px;--font-size-1:14px;--font-size-2:16px;--font-size-3:18px;
  --font-size-4:20px;--font-size-5:24px;--font-size-6:30px;--font-size-7:48px;
  --rounded-xs:2px;--rounded-sm:4px;--rounded-md:6px;--rounded-lg:8px;
  --rounded-xl:12px;--rounded-2xl:16px;--rounded-3xl:24px;--rounded-full:9999px;
  --shadow-2xs:0 1px 0 0 #0000000d;--shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --shadow-xl:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--general-background);color:var(--general-foreground);
  font-family:var(--font-body);font-size:var(--font-size-3);line-height:1.62;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-sans);margin:0;line-height:1.24;font-weight:700}
p{margin:0 0 14px}
p:last-child{margin-bottom:0}
a{color:var(--general-primary)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

/* ---------- top bar ---------- */
.top{background:#fff;border-bottom:1px solid var(--sidebar-border)}
.top .wrap{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;padding-top:18px;padding-bottom:18px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo img{height:26px;width:auto;display:block}
.who{margin-left:auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;font-size:var(--font-size-2)}
.who .name{font-weight:600;font-size:var(--font-size-2)}
.who .kind{color:var(--general-muted-foreground)}
.switch{font-size:var(--font-size-2)}

/* ---------- sections nav ---------- */
nav.sections{background:#fff;border-bottom:1px solid var(--sidebar-border)}
nav.sections ul{display:flex;flex-wrap:wrap;gap:4px 8px;list-style:none;margin:0;padding:0}
nav.sections a{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--sidebar-foreground);font-family:var(--font-sans);font-weight:600;
  font-size:var(--font-size-3);padding:14px 16px;border-bottom:4px solid transparent;
}
nav.sections a svg{width:22px;height:22px;flex:none}
nav.sections a:hover{color:var(--general-foreground);background:var(--general-muted)}
nav.sections a[aria-current="page"]{color:var(--general-primary);border-bottom-color:var(--general-primary)}

/* ---------- page ---------- */
main{padding:36px 0 96px}
.sheet{background:#fff;border:1px solid var(--sidebar-border);border-radius:var(--rounded-3xl);
  box-shadow:var(--shadow-xs);padding:40px}
.sheet+.sheet{margin-top:28px}
.sheet-title{font-size:var(--font-size-6);letter-spacing:-.01em}
.stamp{font-family:var(--font-sans);font-size:var(--font-size-2);font-weight:600;
  color:var(--general-muted-foreground);text-transform:none;margin-bottom:10px}
.ask{font-size:var(--font-size-4);margin:18px 0 0;max-width:62ch}
.count{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-5);margin:22px 0 0}
.rule{height:1px;background:var(--sidebar-border);border:0;margin:28px 0 0}

/* ---------- worklist rows ---------- */
ol.jobs{list-style:none;margin:0;padding:0}
ol.jobs>li{border-top:1px solid var(--sidebar-border);padding:30px 0}
ol.jobs>li:first-child{border-top:2px solid var(--general-foreground)}
.job{display:grid;grid-template-columns:52px minmax(0,1fr) 230px;gap:8px 24px;align-items:start}
.jobno{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-5);
  border:2px solid var(--general-foreground);border-radius:var(--rounded-lg);
  width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.job h3{font-size:var(--font-size-5);max-width:34ch}
.job .why{margin-top:12px;max-width:62ch}
.job .mins{color:var(--general-muted-foreground);font-size:var(--font-size-2);margin-top:10px}
.worth{border-left:1px solid var(--sidebar-border);padding-left:20px}
.worth .lab{font-size:var(--font-size-2);color:var(--general-muted-foreground)}
.worth .fig{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-5);
  line-height:1.2;margin-top:4px}
.worth .per{font-size:var(--font-size-2);color:var(--general-muted-foreground)}
.actions{grid-column:2/4;display:flex;flex-wrap:wrap;gap:12px 14px;margin-top:22px;align-items:center}
.more{grid-column:2/4;margin-top:14px;font-size:var(--font-size-2)}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-3);
  border-radius:var(--rounded-full);padding:14px 24px;border:2px solid var(--general-primary);
  background:var(--general-primary);color:var(--general-primary-foreground);
  cursor:pointer;text-align:left;line-height:1.3;
}
.btn:hover{background:#1a4bd7;border-color:#1a4bd7}
.btn.sec{background:#fff;color:var(--general-foreground);border-color:var(--sidebar-border)}
.btn.sec:hover{background:var(--general-muted)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--general-primary);
  font:inherit;font-size:var(--font-size-2);text-decoration:underline;cursor:pointer}

/* ---------- put off / done ---------- */
.pile{margin-top:28px}
.pile h2{font-size:var(--font-size-5);margin-bottom:6px}
.pile .note{color:var(--general-muted-foreground);font-size:var(--font-size-2);max-width:62ch}
ul.flat{list-style:none;margin:14px 0 0;padding:0}
ul.flat>li{border-top:1px solid var(--sidebar-border);padding:18px 0;
  display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:6px 24px;align-items:start}
ul.flat .tag{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-2);
  border:2px solid var(--general-foreground);border-radius:var(--rounded-full);
  padding:2px 12px;display:inline-block;margin-right:10px}
ul.flat .sub{color:var(--general-muted-foreground);font-size:var(--font-size-2);margin-top:4px}
ul.flat .right{border-left:1px solid var(--sidebar-border);padding-left:20px;
  font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-3)}
ul.flat .right .per{font-family:var(--font-body);font-weight:400;
  font-size:var(--font-size-2);color:var(--general-muted-foreground)}
.total{margin-top:18px;border-top:2px solid var(--general-foreground);padding-top:18px;
  display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:6px 24px}
.total .t1{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-4)}
.total .t2{border-left:1px solid transparent;padding-left:20px;
  font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-4)}

/* ---------- money summary ---------- */
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.money .cell .lab{font-size:var(--font-size-2);color:var(--general-muted-foreground)}
.money .cell .fig{font-family:var(--font-sans);font-weight:800;font-size:var(--font-size-6);
  line-height:1.15;margin:6px 0 4px}
.money .cell .exp{font-size:var(--font-size-2);color:var(--general-muted-foreground)}

/* ---------- plain tables ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--font-size-3)}
caption{text-align:left;font-size:var(--font-size-2);color:var(--general-muted-foreground);
  padding-bottom:12px}
th,td{text-align:left;padding:16px 18px 16px 0;border-bottom:1px solid var(--sidebar-border);
  vertical-align:top}
th{font-family:var(--font-sans);font-size:var(--font-size-2);font-weight:700}
td.r,th.r{text-align:right;padding-right:0}
tr.sum td{border-bottom:0;border-top:2px solid var(--general-foreground);font-weight:700}
.cat{display:flex;align-items:center;gap:12px}
.cat svg{width:24px;height:24px;flex:none;color:var(--sidebar-foreground)}

/* ---------- agreement rows ---------- */
ul.agmts{list-style:none;margin:0;padding:0}
ul.agmts>li{border-top:1px solid var(--sidebar-border);padding:24px 0;
  display:grid;grid-template-columns:150px minmax(0,1fr) 210px;gap:12px 24px;align-items:start}
.chipbox{background:#fff;border:1px solid var(--sidebar-border);border-radius:var(--rounded-xl);
  height:64px;display:flex;align-items:center;justify-content:center;padding:10px}
.chipbox img{max-width:100%;max-height:44px;width:auto;height:auto;display:block}
.supname{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-2);
  margin-top:6px;text-align:center}
ul.agmts h3{font-size:var(--font-size-4)}
ul.agmts .sub{font-size:var(--font-size-2);color:var(--general-muted-foreground);margin-top:6px}

/* ---------- key/value rows ---------- */
dl.rows{margin:0}
dl.rows>div{display:grid;grid-template-columns:280px minmax(0,1fr);gap:8px 24px;
  border-top:1px solid var(--sidebar-border);padding:16px 0}
dl.rows dt{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-3);margin:0}
dl.rows dd{margin:0}
.howtobuy{background:var(--general-muted);border-radius:var(--rounded-2xl);padding:28px;margin-top:28px}
.howtobuy h3{font-size:var(--font-size-5)}
.howtobuy dl.rows>div{border-top-color:#dcdcdc}
.howtobuy ol{margin:12px 0 0;padding-left:26px}
.howtobuy li{margin-bottom:8px}
.callout{border:2px solid var(--general-foreground);border-radius:var(--rounded-2xl);
  padding:24px;margin-top:28px;max-width:70ch}
.callout h3{font-size:var(--font-size-4);margin-bottom:8px}

/* ---------- messages ---------- */
ul.msgs{list-style:none;margin:0;padding:0}
ul.msgs>li{border-top:1px solid var(--sidebar-border)}
ul.msgs a.row{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:6px 24px;
  padding:22px 0;text-decoration:none;color:inherit}
ul.msgs a.row:hover{background:var(--general-muted)}
ul.msgs .from{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-3)}
ul.msgs .subj{font-size:var(--font-size-3);margin-top:2px}
ul.msgs .prev{font-size:var(--font-size-2);color:var(--general-muted-foreground);margin-top:4px}
ul.msgs .when{font-size:var(--font-size-2);color:var(--general-muted-foreground);text-align:right}
ul.msgs .open{font-size:var(--font-size-2);color:var(--general-primary);
  text-decoration:underline;text-align:right;margin-top:4px}
.bubble{border:1px solid var(--sidebar-border);border-radius:var(--rounded-2xl);
  padding:24px;margin-top:20px;max-width:70ch}
.bubble.mine{background:var(--general-muted);margin-left:auto}
.bubble .head{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-2);
  margin-bottom:10px}
.person{display:flex;align-items:center;gap:16px;margin-top:8px}
.initials{width:56px;height:56px;border-radius:var(--rounded-full);flex:none;
  background:var(--general-secondary);color:var(--general-secondary-foreground);
  font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-4);
  display:flex;align-items:center;justify-content:center}
.person .pn{font-family:var(--font-sans);font-weight:700}
.person .pr{font-size:var(--font-size-2);color:var(--general-muted-foreground)}
textarea{width:100%;font-family:var(--font-body);font-size:var(--font-size-3);
  padding:16px;border:1px solid var(--sidebar-border);border-radius:var(--rounded-xl);
  background:var(--general-input);min-height:140px;color:inherit}
label.fl{display:block;font-family:var(--font-sans);font-weight:700;
  font-size:var(--font-size-3);margin:0 0 8px}

/* ---------- estimate mark ---------- */
.est{font-family:var(--font-sans);font-weight:700;font-size:var(--font-size-2);
  border:2px dashed var(--general-muted-foreground);border-radius:var(--rounded-full);
  padding:1px 12px;display:inline-block;color:var(--sidebar-foreground)}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;background:#0f0f0fcc;display:flex;align-items:flex-start;
  justify-content:center;padding:32px 16px;overflow-y:auto;z-index:50}
.dlg{background:#fff;border-radius:var(--rounded-3xl);max-width:640px;width:100%;
  padding:36px;box-shadow:var(--shadow-xl)}
.dlg h2{font-size:var(--font-size-5)}
.dlg h3{font-size:var(--font-size-3);margin-top:24px}
.dlg ul{margin:8px 0 0;padding-left:26px}
.dlg li{margin-bottom:8px}
.dlg .btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.dlg .after{margin-top:12px;font-size:var(--font-size-2);color:var(--general-muted-foreground)}

/* ---------- flash ---------- */
.flash{border:2px solid var(--general-foreground);border-radius:var(--rounded-2xl);
  padding:20px 24px;margin-bottom:24px;background:#fff;max-width:70ch}
.flash .h{font-family:var(--font-sans);font-weight:700}

.skip{position:absolute;left:-9999px;top:auto}
.skip:focus{left:12px;top:12px;background:#fff;padding:12px 18px;z-index:99;border-radius:var(--rounded-lg)}
footer.foot{border-top:1px solid var(--sidebar-border);background:#fff;padding:28px 0}
footer.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;font-size:var(--font-size-2);
  color:var(--general-muted-foreground)}

/* ---------- narrow ---------- */
@media (max-width:900px){
  .sheet{padding:26px 20px;border-radius:var(--rounded-2xl)}
  .job{grid-template-columns:46px minmax(0,1fr)}
  .worth{grid-column:1/3;border-left:0;padding-left:0;margin-top:18px;
    border-top:1px solid var(--sidebar-border);padding-top:14px}
  .actions,.more{grid-column:1/3}
  ul.flat>li,.total{grid-template-columns:minmax(0,1fr)}
  ul.flat .right,.total .t2{border-left:0;padding-left:0}
  ul.agmts>li{grid-template-columns:minmax(0,1fr)}
  .chipbox{max-width:150px}
  dl.rows>div{grid-template-columns:minmax(0,1fr)}
  ul.msgs a.row{grid-template-columns:minmax(0,1fr)}
  ul.msgs .when,ul.msgs .open{text-align:left}
  .sheet-title{font-size:var(--font-size-5)}
  .money .cell .fig{font-size:var(--font-size-5)}
}
@media (max-width:560px){
  .btn{width:100%;text-align:center}
  .dlg{padding:24px}
}
</style>
</head>

function person(){ return state.personId === "fanny" ? FANNY : BJORN; }
function statusOf(id){ return state.status[id] || "todo"; }

/* Escape, and keep every written-out figure on one line: 118 000 kr never splits. */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/(\d)\s(?=\d)/g,"$1\u00a0")
    .replace(/(\d)\s(kr)\b/g,"$1\u00a0$2");
}

/* ------------------------- 1. TO DO ------------------------- */

function minutesWord(n){
  if(n === 1) return "About 3 minutes.";
  return "About " + n + " minutes.";
}

function todoPage(){
  var p = person();
  var open = p.jobs.filter(function(j){ return statusOf(j.id) === "todo"; });
  var later = p.jobs.filter(function(j){ return statusOf(j.id) === "later"; });
  var done = p.jobs.filter(function(j){ return statusOf(j.id) === "done"; });
  var mins = open.reduce(function(a,j){ return a + j.mins; }, 0);

  var countLine, askLine;
  if(open.length === 0){
    countLine = "Nothing left to do this month.";
    askLine = "You have finished everything on the list for " + p.monthName +
      ". We look at your invoices again at the start of next month and write a new list. If something turns up before then, Mette telephones you.";
  } else {
    countLine = (open.length === 1 ? "1 thing to do." : open.length + " things to do.") +
      " " + minutesWord(mins);
    askLine = (open.length === 1
      ? "There is one thing to do this month. It takes about " + mins + " minutes."
      : "There are " + (open.length === 2 ? "two" : open.length === 3 ? "three" : open.length) +
        " things to do this month. Each one takes two or three minutes — about " + mins + " minutes in all." +
        " Do them in order, or do one and leave the rest until next month.");
  }

  var h = "";
  if(state.flash){
    h += '<div class="flash" role="status"><div class="h">'+state.flash.h+'</div><div>'+state.flash.b+'</div></div>';
  }

  h += '<section class="sheet">';
  h += '<div class="stamp">'+esc(p.name)+' — '+p.monthName+' 2026' +
       (p.isEstimate ? ' — every figure on this page is an estimate' : '') + '</div>';
  h += '<h1 class="sheet-title">To do this month</h1>';
  h += '<p class="count" aria-live="polite">'+countLine+'</p>';
  h += '<p class="ask">'+askLine+'</p>';
  h += '<hr class="rule">';

  if(open.length){
    h += '<ol class="jobs">';
    open.forEach(function(j, i){
      h += '<li><div class="job">';
      h += '<div class="jobno" aria-hidden="true">'+(i+1)+'</div>';
      h += '<div><h3>'+esc(j.title)+'</h3><div class="why"><p>'+j.why+'</p></div>' +
           '<div class="mins">Takes about '+j.mins+' minutes. Number '+(i+1)+' of '+open.length+'.</div></div>';
      h += '<div class="worth"><div class="lab">What it is worth</div><div class="fig">' +
           kr(j.worth) + '</div><div class="per">a year' +
           (j.worthEstimated ? ', estimated' : '') + '</div>' +
           (j.worthEstimated ? '<div class="per" style="margin-top:8px"><span class="est">Estimated</span></div>' : '') +
           '</div>';
      h += '<div class="actions">' +
        '<button class="btn" data-act="ask:'+j.id+'">'+esc(j.primary)+'</button>' +
        '<button class="btn sec" data-act="later:'+j.id+'">'+esc(j.secondary)+'</button>' +
        '</div>';
      if(j.link){
        h += '<div class="more"><a href="'+j.link.href+'">'+esc(j.link.text)+'</a></div>';
      }
      h += '</div></li>';
    });
    h += '</ol>';
  } else {
    h += '<p style="max-width:62ch">The next list is written on 1 September. It will have the telecom' +
         ' agreement on it, because that one ends on 20 October.</p>';
  }
  h += '</section>';

  /* later this year */
  h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">Coming later this year</h2>';
  h += '<p class="note" style="color:var(--general-muted-foreground);font-size:var(--font-size-2)">' +
       'Nothing here needs doing today. It is written down so you know it is coming.</p>';
  h += '<ul class="flat">';
  p.later.forEach(function(l){
    h += '<li><div><span class="tag">'+esc(l.when)+'</span><div style="margin-top:10px">'+l.text+'</div></div>' +
         '<div class="right">Nothing to do<div class="per">we write to you first</div></div></li>';
  });
  h += '</ul></section>';

  /* put off */
  if(later.length){
    h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">Put off until next month</h2>';
    h += '<p class="note" style="color:var(--general-muted-foreground);font-size:var(--font-size-2)">' +
         'These come back on the list on 1 September. You can put any of them back now.</p>';
    h += '<ul class="flat">';
    later.forEach(function(j){
      h += '<li><div><strong>'+esc(j.title)+'</strong>' +
        '<div class="sub">Still worth '+kr(j.worth)+' a year whenever you get to it.</div>' +
        '<div style="margin-top:14px"><button class="btn sec" data-act="back:'+j.id+'">Put this back on the list</button></div></div>' +
        '<div class="right">'+kr(j.worth)+'<div class="per">a year, not taken</div></div></li>';
    });
    h += '</ul></section>';
  }

  /* done this month */
  var doneRows = [];
  p.alreadyDone.forEach(function(d){ doneRows.push({ title:d.title, worth:d.worth, when:d.when, note:d.note }); });
  done.forEach(function(j){
    doneRows.push({ title:j.title, worth:j.worth, when:"Done today", note:j.done, estimated:j.worthEstimated });
  });
  var totalDone = doneRows.reduce(function(a,d){ return a + d.worth; }, 0);

  h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">' +
       'Done this month</h2>';
  if(doneRows.length === 0){
    h += '<p style="max-width:62ch">Nothing finished yet this month. The first thing you finish moves' +
         ' down here, with what it is worth a year beside it, and the kroner add up at the bottom.</p>';
  } else {
    h += '<p class="note" style="color:var(--general-muted-foreground);font-size:var(--font-size-2)">' +
         doneRows.length + (doneRows.length === 1 ? ' thing' : ' things') +
         ' finished in ' + p.monthName + '. This is money that comes off your buying from now on.</p>';
    h += '<ul class="flat">';
    doneRows.forEach(function(d){
      h += '<li><div><span class="tag">Done</span><strong>'+esc(d.title)+'</strong>' +
        '<div class="sub">'+esc(d.when)+'. '+esc(d.note)+'</div></div>' +
        '<div class="right">'+kr(d.worth)+'<div class="per">a year'+(d.estimated?', estimated':'')+'</div></div></li>';
    });
    h += '</ul>';
    h += '<div class="total"><div class="t1">What you have saved by finishing these</div>' +
         '<div class="t2">'+kr(totalDone)+'<div class="per" style="font-family:var(--font-body);font-weight:400;font-size:var(--font-size-2);color:var(--general-muted-foreground)">a year, from now on</div></div></div>';
  }
  h += '</section>';

  /* money summary + how we work this out */
  h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">' +
       'Where you stand this year</h2><div class="money" style="margin-top:22px">';
  if(p.id === "bjorn"){
    h += '<div class="cell"><div class="lab">Money you have already saved</div><div class="fig">' +
      kr(p.savedThisYear) + '</div><div class="exp">this year, through the agreements you already use</div></div>';
  } else {
    h += '<div class="cell"><div class="lab">Money you have already saved</div><div class="fig">' +
      kr(0) + '</div><div class="exp">You have not started using any agreement yet</div></div>';
  }
  var takenNow = p.isEstimate ? 0 : done.reduce(function(a,j){ return a + j.worth; }, 0);
  var stillLeft = p.stillToSave - takenNow;
  h += '<div class="cell"><div class="lab">Money you could still save</div><div class="fig">' +
    kr(stillLeft) + '</div><div class="exp">a year' + (p.isEstimate ? ', estimated from 148 firms of your size'
      : ', on buying that is still at full price') + '</div>' +
    (takenNow ? '<div class="exp" style="margin-top:8px">It was ' + kr(p.stillToSave) +
      ' a year at the start of the month. You have taken ' + kr(takenNow) + ' a year off it.</div>' : '') +
    '</div>';
  h += '</div>';
  h += '<p style="margin-top:22px"><button class="linkbtn" data-act="how">How we work this out</button>' +
       ' — where these figures come from, in plain words. You may be asked to defend them.</p>';
  h += '</section>';

  return h;
}

    p.plainAgreements.forEach(function(a){
      h += '<li><div><strong>'+esc(a.name)+' — '+esc(a.what)+'</strong><div class="sub">'+esc(a.state)+'</div></div>' +
        '<div class="right">'+kr(a.saves)+'<div class="per">a year saved</div></div></li>';
    });
    h += '</ul>';
  }

  h += '<div class="callout"><h3>'+p.allAgreements+' framework agreements exist in all</h3>' +
    '<p>We only put the ones in front of you that fit what you actually buy. If you want the full list' +
    ' of '+p.allAgreements+', write to Mette and she posts it to you or sends it as a spreadsheet.</p>' +
    '<p style="margin-bottom:0"><a href="#message/new">Write to Mette about another agreement</a></p></div>';
  h += '</section>';
  return h;
}

function agreementPage(key){

    '<p><a href="#agreements">Go back to your agreements</a></p></section>';

  var h = '';
  if(state.flash){
    h += '<div class="flash" role="status"><div class="h">'+state.flash.h+'</div><div>'+state.flash.b+'</div></div>';
  }
  h += '<section class="sheet">';
  h += '<div class="stamp"><a href="#agreements">Your agreements</a> — '+esc(a.name)+'</div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-top:8px">';
  h += '<div style="width:170px"><div class="chipbox" style="height:76px"><img src="'+LOGO[a.sup]+'" alt="'+esc(a.name)+'"></div></div>';
  h += '<div style="flex:1 1 320px;min-width:0"><h1 class="sheet-title">'+esc(a.name)+' — '+esc(a.what)+'</h1>' +
       '<p style="margin-top:10px">'+esc(a.lead)+'</p></div>';

  h += '<div class="money" style="margin-top:30px;border-top:2px solid var(--general-foreground);padding-top:26px">';

       a.yearFigure.replace(/^(Worth|Saves you)\s/, "") + '</div><div class="exp">' +
       a.yearNote + (p.isEstimate ? ' These are estimates until your accounting system is connected.' : '') + '</div></div>';
  h += '<div class="cell"><div class="lab">Are you using it?</div><div class="fig" style="font-size:var(--font-size-5)">' +
       (a.started ? "Yes, in use" : "Not yet") + '</div><div class="exp">' +
       (a.started ? 'You can buy on it today with the customer number below.' :
        'Nothing is bought on this agreement yet. The button at the bottom starts it.') + '</div></div>';
  h += '</div>';

  h += '<h2 style="font-size:var(--font-size-5);margin-top:38px">The terms, in plain rows</h2>';
  h += '<dl class="rows">';
  a.terms.forEach(function(t){
    h += '<div><dt>'+esc(t[0])+'</dt><dd>'+esc(t[1])+'</dd></div>';
  });
  h += '</dl>';

  h += '<div class="howtobuy"><h3>How to buy on it</h3><p>'+esc(a.buy.lead)+'</p>';
  h += '<dl class="rows">';
  a.buy.rows.forEach(function(r){ h += '<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>'; });
  h += '</dl>';
  h += '<h3 style="font-size:var(--font-size-3);margin-top:24px">The ordering steps</h3><ol>';
  a.buy.steps.forEach(function(s){ h += '<li>'+esc(s)+'</li>'; });
  h += '</ol></div>';

  h += '<div style="margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center">';
  h += '<button class="btn" data-act="ask:'+a.confirmKey+'">'+esc(a.primary)+'</button>';

  h += '</div>';
  h += '<p style="margin-top:18px;font-size:var(--font-size-2);color:var(--general-muted-foreground)">' +

  h += '</section>';

/* ------------------------- 3. MESSAGES ------------------------- */

function messagesPage(){
  var p = person();
  var h = '';
  if(state.flash){
    h += '<div class="flash" role="status"><div class="h">'+state.flash.h+'</div><div>'+state.flash.b+'</div></div>';
  }
  h += '<section class="sheet">';
  h += '<div class="stamp">'+esc(p.name)+' — messages</div>';
  h += '<h1 class="sheet-title">Messages</h1>';
  h += '<p class="ask">Everything we want to tell you is in this one place: letters from Mette, and' +
    ' anything the system has noticed about your agreements. Nothing here is urgent today.</p>';
  h += '<div class="person"><div class="initials" aria-hidden="true">MS</div><div>' +
    '<div class="pn">Mette Sørensen</div>' +
    '<div class="pr">Your advisor. Telephone 51 80 44 12, or write below. She answers within one working day.</div>' +
    '</div></div>';
  h += '<div style="margin-top:22px"><a href="#message/new" class="btn" style="text-decoration:none;display:inline-block">Write a new message to Mette</a></div>';
  h += '<hr class="rule">';
  h += '<ul class="msgs">';
  p.threads.forEach(function(t){
    h += '<li><a class="row" href="#message/'+t.id+'">' +
      '<div><div class="from">'+esc(t.from)+'<span style="font-family:var(--font-body);font-weight:400;font-size:var(--font-size-2);color:var(--general-muted-foreground)"> — '+esc(t.role)+'</span></div>' +
      '<div class="subj">'+esc(t.subj)+'</div>' +
      '<div class="prev">'+esc(t.prev)+'</div></div>' +
      '<div><div class="when">'+esc(t.when)+'</div><div class="open">Read the whole message</div></div>' +
      '</a></li>';
  });
  h += '</ul></section>';
  return h;
}

function threadPage(id){
  var p = person();
  if(id === "new"){
    var h = '<section class="sheet"><div class="stamp"><a href="#messages">Messages</a> — new message</div>';
    h += '<h1 class="sheet-title">Write to Mette</h1>';
    h += '<p class="ask">Write it the way you would write an email. Mette answers within one working day,' +
      ' and she telephones you instead if it is quicker.</p>';
    h += '<div style="margin-top:26px;max-width:70ch"><label class="fl" for="body">Your message to Mette Sørensen</label>' +
      '<textarea id="body" placeholder="For example: what is the notice period on the Bygma agreement?"></textarea></div>';
    h += '<div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:14px">' +
      '<button class="btn" data-act="sendnew">Send this to Mette</button>' +
      '<a href="#messages" class="btn sec" style="text-decoration:none;display:inline-block">Not now — go back to messages</a></div>';
    h += '</section>';
    return h;
  }
  var t = null;
  p.threads.forEach(function(x){ if(x.id === id) t = x; });
  if(!t) return '<section class="sheet"><h1 class="sheet-title">That message is not here</h1>' +
    '<p><a href="#messages">Go back to messages</a></p></section>';

  var h = '';
  if(state.flash){
    h += '<div class="flash" role="status"><div class="h">'+state.flash.h+'</div><div>'+state.flash.b+'</div></div>';
  }
  h += '<section class="sheet"><div class="stamp"><a href="#messages">Messages</a> — '+esc(t.when)+'</div>';
  h += '<h1 class="sheet-title" style="font-size:var(--font-size-5);max-width:34ch">'+esc(t.subj)+'</h1>';
  h += '<p style="color:var(--general-muted-foreground);font-size:var(--font-size-2);margin-top:10px">' +
    esc(t.from) + ' — ' + esc(t.role) + '</p>';
  t.msgs.forEach(function(m){
    var mine = (m.who === p.name);
    h += '<div class="bubble'+(mine?' mine':'')+'"><div class="head">'+esc(m.who)+' — '+esc(m.when)+'</div>' +
      '<p>'+esc(m.text)+'</p></div>';
  });
  if(state.sent[t.id]){
    h += '<div class="bubble mine"><div class="head">'+esc(p.name)+' — today, just now</div>' +
      '<p>Sent to Mette. She has it, and she answers within one working day. Nothing else on your list' +
      ' has changed while you wrote it.</p></div>';
  }
  h += '<div style="margin-top:28px;display:flex;flex-wrap:wrap;gap:14px">' +
    '<button class="btn" data-act="reply:'+t.id+'">'+esc(t.reply)+'</button>' +
    '<a href="#messages" class="btn sec" style="text-decoration:none;display:inline-block">Back to messages</a></div>';
  h += '</section>';
  return h;
}

/* ------------------------- 4. YOUR BUYING ------------------------- */

function buyingPage(){
  var p = person();
  var h = '<section class="sheet">';
  h += '<div class="stamp">'+esc(p.name)+' — your buying, last twelve months' +
    (p.isEstimate ? ' — estimated, not your own figures' : '') + '</div>';
  h += '<h1 class="sheet-title">Your buying</h1>';
  if(p.id === "bjorn"){
    h += '<p class="ask">This is everything you bought in the last twelve months, biggest first, read' +
      ' straight from your supplier invoices. Nothing to do on this page. It is the page you print when' +
      ' someone asks you to show your figures.</p>';
  } else {
    h += '<p class="ask">You have no invoices with us yet, so every figure on this page is an estimate' +
      ' from 148 building firms of your size in your trade. It is a fair guess, not your books.' +
      ' Connect your accounting system and these become your own numbers within two working days.</p>';
    h += '<p><span class="est">Estimated</span> <span style="font-size:var(--font-size-2);color:var(--general-muted-foreground)">' +
      'Every figure on this page carries this word until your invoices are read.</span></p>';
  }

  h += '<div class="money" style="margin-top:30px;border-top:2px solid var(--general-foreground);padding-top:26px">';
  h += '<div class="cell"><div class="lab">What you buy in all</div><div class="fig">'+kr(p.buyingTotal)+
    '</div><div class="exp">a year'+(p.isEstimate?', estimated':'')+', across '+p.categoryCount+' kinds of buying</div></div>';
  h += '<div class="cell"><div class="lab">Bought at the agreed price</div><div class="fig">'+kr(p.atAgreed)+
    '</div><div class="exp">a year'+(p.isEstimate?', estimated':'')+', on '+p.usedAgreements+' framework agreements</div></div>';
  h += '<div class="cell"><div class="lab">Bought at full price</div><div class="fig">'+kr(p.atFull)+
    '</div><div class="exp">a year'+(p.isEstimate?', estimated':'')+'. This is where the money on your list comes from.</div></div>';
  h += '</div>';
  h += '<p style="margin-top:20px"><button class="linkbtn" data-act="how">How we work this out</button></p>';
  h += '</section>';

  h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">' +
    'What you buy, kind by kind</h2>';
  h += '<div class="tablewrap"><table><caption>Biggest first. Every figure is kroner for the last twelve months' +
    (p.isEstimate ? ', estimated from 148 firms of your size' : ', from your own supplier invoices') + '.</caption>';
  h += '<thead><tr><th scope="col">What you buy</th><th scope="col">Who you buy it from</th>' +
    '<th scope="col">The price you pay</th><th scope="col" class="r">Bought a year</th>' +
    '<th scope="col" class="r">Money you could still save</th></tr></thead><tbody>';
  var sorted = p.categories.slice().sort(function(a,b){ return b.spend - a.spend; });
  var sumSpend = 0, sumWorth = 0;
  sorted.forEach(function(c){
    sumSpend += c.spend; sumWorth += c.worth;
    h += '<tr><td><span class="cat">'+ICON[c.icon]+'<span>'+esc(c.name)+'</span></span></td>' +
      '<td>'+esc(c.sup)+'</td><td>'+esc(c.price)+'</td>' +
      '<td class="r">'+kr(c.spend)+'</td>' +
      '<td class="r">'+(c.worth ? kr(c.worth)+' a year' : 'Nothing — you are on the agreed price')+'</td></tr>';
  });
  h += '<tr class="sum"><td>All your buying</td><td>'+p.usedAgreements+' agreements in use</td>' +
    '<td>'+kr(p.atAgreed)+' at the agreed price, '+kr(p.atFull)+' at full price</td>' +
    '<td class="r">'+kr(sumSpend)+'</td><td class="r">'+kr(sumWorth)+' a year</td></tr>';
  h += '</tbody></table></div></section>';

  if(p.id === "bjorn"){
    h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">' +
      'Cash back you have earned</h2>';
    h += '<p style="max-width:62ch">Three of your agreements pay you a share of what you buy, once a year,' +
      ' in the spring. This is money you have already earned. Nothing to do.</p>';
    h += '<ul class="flat">';
    h += '<li><div><strong>Earned this year</strong><div class="sub">Bygma, Hilti and Q8 together, on what you have bought so far.</div></div>' +
      '<div class="right">'+kr(p.cashback.earned)+'<div class="per">this year</div></div></li>';
    h += '<li><div><strong>Already paid into your account</strong><div class="sub">Bygma and Hilti, paid in June. It is on the June invoice as a credit note.</div></div>' +
      '<div class="right">'+kr(p.cashback.paid)+'<div class="per">paid in June</div></div></li>';
    h += '<li><div><strong>Still to come</strong><div class="sub">Q8, after summer, on the same invoice as the fuel.</div></div>' +
      '<div class="right">'+kr(p.cashback.due)+'<div class="per">after summer</div></div></li>';
    h += '</ul></section>';
  } else {
    h += '<section class="sheet"><h2 class="sheet-title" style="font-size:var(--font-size-5)">' +
      'Cash back you could earn</h2>';
    h += '<p style="max-width:62ch">Several agreements pay you a share of what you buy, once a year, in the' +
      ' spring. We cannot say what yours would be until we can see what you buy. A firm of your size in' +
      ' your trade usually earns between 18 000 kr and 26 000 kr a year. <span class="est">Estimated</span></p>';
    h += '</section>';
  }
  return h;
}

/* ------------------------- how we work this out ------------------------- */

function howDialog(){
  var p = person();
  var h = '<h2>How we work this out</h2>';
  if(p.isEstimate){
    h += '<p>You have no invoices with us yet, so nothing on these pages is measured — it is all' +
      ' estimated. Here is exactly how the estimate is made.</p>';
    h += '<h3>Where the figures come from</h3><ul>' +
      '<li>148 building firms of your size — between 15 and 40 people — in your trade, in Rogaland.</li>' +
      '<li>What they buy a year, kind by kind, scaled to your 24 people.</li>' +
      '<li>The difference between the list prices they used to pay and the agreed prices they pay now.</li></ul>';
    h += '<h3>What that means for the numbers you see</h3><ul>' +
      '<li>They are a fair middle. Half of those 148 firms buy more than the figure shown, half buy less.</li>' +
      '<li>They can be wrong for you by a fifth either way, and we would not argue with you about it.</li>' +
      '<li>Nothing here is a promise. Connect your accounting system and we replace all of it with your own invoice lines within two working days.</li></ul>';
  } else {
    h += '<p>You may be asked to defend these figures, so here they are in the order we work them out.' +
      ' Mette will go through any single line with you on the telephone.</p>';
    h += '<h3>Where the figures come from</h3><ul>' +
      '<li>Your own supplier invoices for the last twelve months, read from your accounting system. Not a sample — every invoice line.</li>' +
      '<li>The agreed price lists from the framework agreements we negotiated, as they stood on the day of each invoice.</li>' +
      '<li>Nothing is included that we cannot show you an invoice for.</li></ul>';
    h += '<h3>How the two figures are worked out</h3><ul>' +
      '<li><strong>Money you have already saved, '+kr(1240000)+' this year:</strong> for every invoice line bought at an agreed price, the list price on that day minus what you actually paid. Added up.</li>' +
      '<li><strong>Money you could still save, about '+kr(840000)+' a year:</strong> for every invoice line bought at full price, what the same goods would have cost on an agreement, on that day. Added up, then reduced by a fifth because nobody moves every last order.</li></ul>';
    h += '<h3>What is left out on purpose</h3><ul>' +
      '<li>Freight and delivery charges, unless the agreement changes them.</li>' +
      '<li>Cash back, which is counted separately under Your buying so it is never counted twice.</li>' +
      '<li>Anything bought outside Norway, and anything under 500 kr a year.</li></ul>';
  }
  h += '<div class="btns"><button class="btn" data-act="close">Close and go back</button>' +
    '<a class="btn sec" href="#message/new" data-act="close" style="text-decoration:none;display:inline-block">Ask Mette to go through a figure with me</a></div>';
  return h;
}

/* ------------------------- confirmation dialogs ------------------------- */

var EXTRA_CONFIRM = {
  cards:{
    title:"Order three more fuel cards?",
    changes:[
      "Three cards are ordered on your customer number 100 44 812 and posted to the yard. They come in three working days.",
      "Each card is billed on your usual twice-monthly invoice, with the registration number on the line."
    ],
    stays:[
      "The cards you already have keep working. Nothing is blocked and no numbers change.",
      "The cards themselves are free. You only pay for the fuel, at 1.42 kr off the pump price."
    ],
    yes:"Yes, order three cards", no:"Go back, I want to think about it",
    doneHead:"Three fuel cards ordered.",
    doneBody:"They come to the yard in three working days, on customer number 100 44 812. Mette has a copy of the order. Nothing changed on the cards you already have."
  }
};

function askDialog(id){
  var p = person();
  var job = null;
  p.jobs.forEach(function(j){ if(j.id === id) job = j; });
  var c = job ? job.confirm : EXTRA_CONFIRM[id];
  if(!c) return null;
  var h = '<h2>'+esc(c.title)+'</h2>';
  h += '<p>Read these two lists before you press. Nothing has happened yet.</p>';
  h += '<h3>What changes if you say yes</h3><ul>';
  c.changes.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul>';
  h += '<h3>What does not change</h3><ul>';
  c.stays.forEach(function(x){ h += '<li>'+x+'</li>'; });
  h += '</ul>';
  h += '<div class="btns"><button class="btn" data-act="yes:'+id+'">'+esc(c.yes)+'</button>' +
    '<button class="btn sec" data-act="close">'+esc(c.no)+'</button></div>';
  h += '<div class="after">You can undo this by telephoning Mette on 51 80 44 12 the same day.</div>';
  return h;
}

function renderDialog(){
  var box = document.getElementById("dialog");
  if(!state.dialog){ box.innerHTML = ""; return; }
  var inner = state.dialog === "how" ? howDialog() : askDialog(state.dialog.replace("ask:",""));
  if(!inner){ box.innerHTML = ""; state.dialog = null; return; }
  box.innerHTML = '<div class="scrim" data-scrim="1"><div class="dlg" role="dialog" aria-modal="true" ' +
    'aria-label="Read this before you decide">' + inner + '</div></div>';
  var first = box.querySelector(".dlg button, .dlg a");
  if(first) first.focus();
}

/* ------------------------- routing + render ------------------------- */

function render(){
  renderChrome();
  var parts = state.route.split("/");
  var head = parts[0];
  var app = document.getElementById("app");
  if(head === "#agreements") app.innerHTML = agreementsPage();
  else if(head === "#agreement") app.innerHTML = agreementPage(parts[1]);
  else if(head === "#messages") app.innerHTML = messagesPage();
  else if(head === "#message") app.innerHTML = threadPage(parts[1]);
  else if(head === "#buying") app.innerHTML = buyingPage();
  else app.innerHTML = todoPage();
  renderDialog();
}

function goto(hash){
  if(location.hash !== hash){ location.hash = hash; }
  else { state.route = hash; render(); }
}

function readHash(){
  var h = location.hash || "#todo";
  if(h.indexOf("#switch/") === 0){
    state.personId = h.split("/")[1] === "fanny" ? "fanny" : "bjorn";
    state.status = {}; state.sent = {}; state.flash = null; state.dialog = null;
    location.replace(location.pathname + "#todo");
    state.route = "#todo";
    render();
    return;
  }
  state.route = h;
  if(state.flashKeep){ state.flashKeep = false; } else { state.flash = null; }
  render();
}

window.addEventListener("hashchange", function(){
  state.dialog = null;
  readHash();
});

document.addEventListener("click", function(ev){
  var t = ev.target;
  while(t && t !== document.body && !t.getAttribute("data-act")) t = t.parentNode;
  if(t && t.getAttribute && t.getAttribute("data-scrim")) { /* handled below */ }
  var act = (t && t.getAttribute) ? t.getAttribute("data-act") : null;
  if(!act) {
    if(ev.target.getAttribute && ev.target.getAttribute("data-scrim")){
      state.dialog = null; renderDialog();
    }
    return;
  }
  var p = person();

  if(act === "how"){ ev.preventDefault(); state.dialog = "how"; renderDialog(); return; }
  if(act === "close"){ state.dialog = null; renderDialog(); return; }

  if(act.indexOf("ask:") === 0){
    ev.preventDefault(); state.dialog = act; renderDialog(); return;
  }
  if(act.indexOf("later:") === 0){
    var lid = act.split(":")[1];
    state.status[lid] = "later";
    state.flash = { h:"Put off until next month.",
      b:"It comes back on your list on 1 September, and it is still worth the same then. Nothing was sent to anyone and no supplier was told." };
    state.dialog = null; render(); window.scrollTo(0,0); return;
  }
  if(act.indexOf("back:") === 0){
    var bid = act.split(":")[1];
    state.status[bid] = "todo";
    state.flash = { h:"Back on your list.", b:"It is number one again at the top of the page." };
    render(); window.scrollTo(0,0); return;
  }
  if(act.indexOf("yes:") === 0){
    var yid = act.split(":")[1];
    var job = null;
    p.jobs.forEach(function(j){ if(j.id === yid) job = j; });
    state.dialog = null;
    if(job){
      state.status[yid] = "done";
      state.flash = { h:"Done. " + job.title + ".",
        b:job.done + " It has moved to Done this month at the bottom of the page, and the " +
          "kroner are in the total there. Nothing changed on invoices you have already paid." };
      state.flashKeep = true;
      goto("#todo");
      state.route = "#todo"; render(); window.scrollTo(0,0);
    } else if(EXTRA_CONFIRM[yid]){
      state.flash = { h:EXTRA_CONFIRM[yid].doneHead, b:EXTRA_CONFIRM[yid].doneBody };
      render(); window.scrollTo(0,0);
    }
    return;
  }
  if(act.indexOf("reply:") === 0){
    var tid = act.split(":")[1];
    state.sent[tid] = true;
    state.flash = { h:"Sent to Mette.",
      b:"She answers within one working day, here and by email. If it is quicker to talk she telephones you instead. Nothing on your list changed." };
    render(); window.scrollTo(0,0); return;
  }
  if(act === "sendnew"){
    state.flash = { h:"Your message is sent to Mette Sørensen.",
      b:"She has it now and answers within one working day. You will find her answer under Messages, and she also sends it to your email." };
    state.flashKeep = true;
    goto("#messages"); state.route = "#messages"; render(); window.scrollTo(0,0); return;
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && state.dialog){ state.dialog = null; renderDialog(); }
});

readHash();
</script>
