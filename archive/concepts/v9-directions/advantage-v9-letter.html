<!--
================================================================================
DESIGN BRIEF — Advantage v9 A. "The Letter"
================================================================================
READER. Bjorn Halvorsen, 61, procurement manager of 22 years. He reads; he does
not scan. So the overview is not a screen of figures — it is a letter from a
named human being, in full sentences, and it asks him one question at a time.

THE SINGLE SENTENCE THAT STATES THE ASK, near the top of every page:
  "There is one thing to decide this month. It takes about two minutes."

WHAT I CUT, AND WHY.
 - All charts, bars, sparklines, percentage rings and figure boxes. He does not
   need a picture of 14 200 000 kr; he needs the sentence that tells him what it
   means and what to do. Every figure in this build is inside a sentence.
 - Every coloured status marker. Status is now a short clause in the prose
   ("you already use this one"), because a colour is not a sentence and he will
   not learn a legend.
 - The seven-section navigation, down to four. Savings and Categories were both
   really "your buying", so they are one section. The separate notification
   place is folded into Messages, so there is exactly one place where somebody
   or something has said something to him.
 - The whole software vocabulary. Nothing on this page is switched on, rolled
   out, tracked or scored. Things are set up, asked for, agreed and paid.
 - Hover. Nothing is revealed by hovering and nothing needs the keyboard. Every
   path is read-it, then click-it.

THE FOUR SECTIONS.
  1. Overview        — the letter, and the questions.
  2. Your agreements — what he has, what he could have, and how to buy on each.
  3. Messages        — Mette, plus anything the system wants to say. One place.
  4. Your buying     — where the 14 200 000 kr went, in sentences.

TYPE. Letter text 20px, ordinary body 19px, secondary 17px, nothing below 16px.
Line length is held near 66 characters and line height at 1.65, because 60-year
-old eyes lose the line before they lose the word.

COLOUR. One accent, the system blue, and it means one thing only: you can click
this. Nothing anywhere carries meaning by colour alone.

INTERACTION. The letter reveals itself one question at a time. A "yes" always
opens a plain confirmation that says what changes and what does not before
anything is committed. A "not now" is always offered in the same size and the
same words every time, and it is never a dead end — he can come back to it.

SIGNED. Mette Sorensen, a real name, with her initials, her hours and her
telephone number, at the bottom of the letter and at the bottom of every page.
================================================================================
-->
<style>
:root{
  --general-background:#fafafa;--general-foreground:#0f0f0f;
  --general-primary:#1b64dc;--general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff;--general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2;--general-muted-foreground:#5c5c5c;
  --general-border:#bdd7ff;--general-input:#ffffff;
  --line:#e3e3e3;
  --focus-ring:#1b64dc;
  --font-sans:"Rethink Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --rounded-sm:4px;--rounded-lg:8px;--rounded-xl:12px;--rounded-2xl:16px;--rounded-full:9999px;
  --shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  /* Bjørn is 61. Letter text 20px, ordinary reading text 19px, detail rows and
     labels 18px, and the only things allowed at 16px are short standing notes. */
  --t-lead:20px;--t-body:19px;--t-sec:18px;--t-min:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--general-background);color:var(--general-foreground);
  font-family:var(--font-body);font-size:var(--t-body);line-height:1.65;
  overflow-x:hidden;
}
img,svg{max-width:100%}
a{color:var(--general-primary)}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:var(--rounded-sm)}

/* ---------- masthead ---------- */
.mast{background:#fff;border-bottom:1px solid var(--line)}
.mast .in{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;gap:20px;
  align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{height:27px;width:auto;display:block}
.who{font-size:var(--t-sec);color:var(--general-muted-foreground);margin:0;max-width:44ch}
.who b{color:var(--general-foreground);font-weight:600}
.who a{font-weight:600}

nav.sections{background:#fff;border-bottom:1px solid var(--line)}
nav.sections ul{max-width:1080px;margin:0 auto;padding:0 12px;list-style:none;display:flex;
  flex-wrap:wrap;gap:2px}
nav.sections a{display:flex;align-items:center;gap:9px;padding:14px 14px;
  font-family:var(--font-sans);font-size:var(--t-sec);font-weight:600;
  text-decoration:none;color:var(--general-muted-foreground);
  border-bottom:3px solid transparent}
nav.sections a:hover{color:var(--general-foreground)}
nav.sections a[aria-current="page"]{color:var(--general-foreground);border-bottom-color:var(--general-primary)}
.ico{display:inline-flex;flex:0 0 auto}
.ico svg{width:20px;height:20px;display:block}

/* ---------- page shell ---------- */
main{max-width:1080px;margin:0 auto;padding:34px 24px 20px}
.col{max-width:680px}
h1{font-family:var(--font-sans);font-size:33px;line-height:1.22;letter-spacing:-.02em;
  font-weight:700;margin:0 0 14px}
h2{font-family:var(--font-sans);font-size:25px;line-height:1.28;letter-spacing:-.015em;
  font-weight:700;margin:38px 0 12px}
h3{font-family:var(--font-sans);font-size:21px;line-height:1.35;font-weight:700;margin:26px 0 8px}
p{margin:0 0 18px}
.lead{font-size:var(--t-lead);line-height:1.68}
.ask{font-size:var(--t-lead);font-weight:600;font-family:var(--font-sans);
  margin:0 0 26px;padding:0 0 0 18px;border-left:4px solid var(--general-primary);line-height:1.5}
.sub{color:var(--general-muted-foreground);font-size:var(--t-sec)}
.small{font-size:var(--t-min);color:var(--general-muted-foreground)}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sec);font-weight:600;
  text-decoration:none;margin:0 0 18px}
.back:hover{text-decoration:underline}
.back .ico svg{transform:scaleX(-1)}

/* ---------- letter ---------- */
.letter{background:#fff;border:1px solid var(--line);border-radius:var(--rounded-2xl);
  padding:38px 40px 34px;box-shadow:var(--shadow-xs);max-width:700px}
.letter p{font-size:var(--t-lead);line-height:1.68}
.letter p.small{font-size:var(--t-min);line-height:1.6}
.reveal{animation:fade .45s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.explain{font-weight:600;background:none;border:0;padding:0;margin:0;cursor:pointer;
  font-family:inherit;font-size:inherit;color:var(--general-primary);
  text-decoration:underline;text-underline-offset:3px}
.explain:hover{text-decoration-thickness:2px}

/* ---------- question ---------- */
.q{border:2px solid var(--general-primary);border-radius:var(--rounded-xl);
  padding:26px 26px 24px;margin:8px 0 6px;background:#f7fbff}
.q h3{margin:0 0 6px;font-size:22px}
.q .qsub{font-size:var(--t-sec);color:var(--general-muted-foreground);margin:0 0 20px}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--font-sans);font-size:var(--t-sec);font-weight:700;line-height:1.35;
  padding:14px 22px;border-radius:var(--rounded-full);border:2px solid var(--general-primary);
  background:var(--general-primary);color:var(--general-primary-foreground);cursor:pointer;
  text-align:left;text-decoration:none;display:inline-block}
.btn:hover{background:#164fb0;border-color:#164fb0}
.btn.out{background:#fff;color:var(--general-primary)}
.btn.out:hover{background:var(--general-secondary)}
.btn.quiet{background:#fff;color:var(--general-foreground);border-color:#9a9a9a}
.btn.quiet:hover{background:var(--general-muted)}

/* ---------- answered record ---------- */
.rec{border-left:4px solid var(--general-primary);background:#f7fbff;
  padding:18px 20px;margin:0 0 24px;border-radius:0 var(--rounded-lg) var(--rounded-lg) 0}
.rec .tag{font-family:var(--font-sans);font-weight:700;font-size:var(--t-min);
  text-transform:none;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.rec p{font-size:var(--t-sec);line-height:1.6;margin:0 0 10px}
.rec p:last-child{margin-bottom:0}
.rec ul{margin:0 0 10px;padding-left:22px;font-size:var(--t-sec)}
.rec li{margin-bottom:6px}
.relink{background:none;border:0;padding:0;font:inherit;font-size:var(--t-sec);font-weight:600;
  color:var(--general-primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- signature ---------- */
.sig{display:flex;gap:16px;align-items:flex-start;margin-top:30px;padding-top:26px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.avatar{flex:0 0 auto;width:58px;height:58px;border-radius:var(--rounded-full);
  background:var(--general-secondary);color:var(--general-secondary-foreground);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);
  font-weight:700;font-size:20px}
.sig .sn{font-family:var(--font-sans);font-size:21px;font-weight:700;margin:2px 0 2px}
.sig .sr{font-size:var(--t-sec);color:var(--general-muted-foreground);margin:0 0 6px}
.sig .sp{font-size:var(--t-lead);font-weight:600;margin:0 0 12px}

/* ---------- plain cards / rows ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rounded-2xl);
  padding:26px 28px;margin:0 0 20px;box-shadow:var(--shadow-xs);max-width:700px}
.card h3:first-child{margin-top:0}
.rows{border-top:1px solid var(--line);margin-top:6px}
.row{border-bottom:1px solid var(--line);padding:18px 0;display:flex;gap:24px;flex-wrap:wrap}
.row .rl{flex:0 0 210px;font-family:var(--font-sans);font-weight:700;font-size:var(--t-sec);
  line-height:1.45}
.row .rv{flex:1 1 300px;min-width:0;font-size:var(--t-sec);line-height:1.6}
.row .rv p{margin:0 0 10px;font-size:var(--t-sec)}
.row .rv p:last-child{margin:0}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps>li{counter-increment:s;border-bottom:1px solid var(--line);padding:20px 0 20px 46px;
  position:relative;font-size:var(--t-sec);line-height:1.6}
.steps>li:last-child{border-bottom:0;padding-bottom:0}
.steps>li::before{content:counter(s);position:absolute;left:0;top:18px;width:30px;height:30px;
  border-radius:var(--rounded-full);background:var(--general-secondary);
  color:var(--general-secondary-foreground);font-family:var(--font-sans);font-weight:700;
  font-size:var(--t-min);display:flex;align-items:center;justify-content:center}
.steps>li>b:first-child{font-family:var(--font-sans);font-size:var(--t-body);display:block;
  margin-bottom:6px}
.steps>li>b.mono:first-child{display:inline-block}
.mono{font-family:var(--font-sans);font-weight:700;font-size:var(--t-body);letter-spacing:.02em}

/* logo boxes */
.logo-box{flex:0 0 auto;width:96px;height:66px;background:#fff;border:1px solid var(--line);
  border-radius:var(--rounded-xl);display:flex;align-items:center;justify-content:center;padding:10px}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.agr-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.agr-head .t{flex:1 1 300px;min-width:0}

/* list of agreements / messages / categories */
.plainlist{list-style:none;margin:0;padding:0;max-width:700px}
.plainlist>li{background:#fff;border:1px solid var(--line);border-radius:var(--rounded-xl);
  margin-bottom:14px;box-shadow:var(--shadow-xs)}
.plainlist a.blk,.plainlist .blk{display:flex;gap:18px;align-items:flex-start;padding:22px 24px;
  text-decoration:none;color:inherit}
.plainlist a.blk:hover{background:#f7fbff}
.plainlist .bt{flex:1 1 auto;min-width:0}
.plainlist .bt h3{margin:0 0 5px;font-size:var(--t-body)}
.plainlist .bt p{margin:0;font-size:var(--t-sec);line-height:1.55;color:var(--general-muted-foreground)}
.plainlist .bt p.k{color:var(--general-foreground)}
.go{flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:8px;
  font-family:var(--font-sans);font-weight:700;font-size:var(--t-sec);color:var(--general-primary)}
.go svg{width:19px;height:19px}
.unread{display:inline-block;font-family:var(--font-sans);font-weight:700;font-size:var(--t-min);
  background:var(--general-primary);color:var(--general-primary-foreground);
  border-radius:var(--rounded-full);padding:2px 12px;margin-left:0}

/* thread */
.msg{background:#fff;border:1px solid var(--line);border-radius:var(--rounded-xl);
  padding:22px 24px;margin-bottom:14px;max-width:700px}
.msg .mh{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.msg .mh .avatar{width:44px;height:44px;font-size:var(--t-min)}
.msg .mh .mn{font-family:var(--font-sans);font-weight:700;font-size:var(--t-sec)}
.msg .mh .md{font-size:var(--t-min);color:var(--general-muted-foreground)}
.msg p{font-size:var(--t-sec);line-height:1.62}
.msg.mine{background:#f7fbff;border-color:var(--general-border)}
label.fl{display:block;font-family:var(--font-sans);font-weight:700;font-size:var(--t-sec);
  margin:0 0 8px}
textarea{width:100%;font-family:var(--font-body);font-size:var(--t-body);line-height:1.6;
  padding:14px 16px;border:1px solid #9a9a9a;border-radius:var(--rounded-lg);
  background:var(--general-input);resize:vertical;min-height:120px}

/* buying */
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--rounded-xl);
  padding:22px 24px;margin-bottom:14px;max-width:700px}
.cat .ch{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cat .ch h3{margin:0;font-size:var(--t-body)}
.cat p{margin:0 0 8px;font-size:var(--t-sec);line-height:1.6}
.cat p:last-child{margin:0}

/* dialog */
.veil{position:fixed;inset:0;background:#0f0f0fdb;display:flex;align-items:flex-start;
  justify-content:center;padding:24px;overflow-y:auto;z-index:50}
.dlg{background:#fff;border-radius:var(--rounded-2xl);box-shadow:var(--shadow-lg);
  max-width:620px;width:100%;padding:32px 34px 28px;margin:auto}
.dlg h2{margin:0 0 14px;font-size:26px}
.dlg p{font-size:var(--t-body);line-height:1.62}
.dlg .rows{margin-bottom:22px}
.dlg .row{padding:16px 0}
.dlg .row .rl{flex:0 0 190px}

.footnote{max-width:700px;margin:44px 0 12px;padding-top:22px;border-top:1px solid var(--line);
  font-size:var(--t-sec);color:var(--general-muted-foreground)}
.footnote b{color:var(--general-foreground)}
.est{font-family:var(--font-sans);font-weight:700;font-size:var(--t-min);
  border:1px solid #9a9a9a;border-radius:var(--rounded-full);padding:2px 12px;
  display:inline-block;white-space:nowrap}

@media (max-width:820px){
  .letter{padding:28px 24px 26px}
  .row .rl{flex:0 0 100%}
  .dlg .row .rl{flex:0 0 100%}
}
@media (max-width:520px){
  main{padding:24px 16px 16px}
  .mast .in{padding:14px 16px}
  h1{font-size:27px}
  h2{font-size:22px}
  .letter{padding:22px 18px 22px;border-radius:var(--rounded-xl)}
  .card{padding:20px 18px}
  .btn{width:100%;text-align:center}
  .acts{gap:10px}
  .dlg{padding:24px 20px 22px}
  .plainlist a.blk,.plainlist .blk{padding:18px 18px;gap:14px}
}
</style>
</head>

  ? { intro:BJORN_INTRO, steps:STEPS, close:BJORN_CLOSE, threads:THREADS, verified:true,
      first:'Bjørn', full:'Bjørn Halvorsen', firm:'Halvorsen Bygg og Anlegg' }
  : { intro:FANNY_INTRO, steps:FANNY_STEPS, close:FANNY_CLOSE, threads:FANNY_THREADS, verified:false,
      first:'Fanny', full:'Fanny Kristensen', firm:'Kristensen Entreprenør' }; }

var ASK={
  overview:'There is one thing to decide this month. It takes about two minutes.',
  overviewF:'There is one thing to decide, and it takes about two minutes: connect your accounting system.',
  agreements:'Nothing on this page needs deciding today. It is here so you can look something up.',
  messages:'Read these when it suits you. If you write to Mette she answers within one working day.',
  buying:'Nothing to decide here either. This is where your money went, so you can check my arithmetic.'
};

/* ======================================================================
   chrome
   ====================================================================== */
var NAV=[['#overview','Overview','overview'],['#agreements','Your agreements','agreements'],
         ['#messages','Messages','messages'],['#buying','Your buying','buying']];

function sectionOf(r){
  if(r.indexOf('#agreement')===0) return '#agreements';
  if(r.indexOf('#messages')===0) return '#messages';
  if(r.indexOf('#buying')===0) return '#buying';
  if(r.indexOf('#agreements')===0) return '#agreements';
  return '#overview';
}
function unreadCount(){ var n=0,t=persona().threads,i;
  for(i=0;i<t.length;i++){ if(t[i].unread && !S.sent['read-'+t[i].id]) n++; } return n; }

function drawChrome(){
  var p=persona(), sec=sectionOf(S.route);
  document.getElementById('who').innerHTML =
    'Signed in as <b>'+esc(p.full)+'</b>, '+esc(p.firm)+'.<br>'+
    (S.who==='bjorn'
      ? '<a href="#" data-act="switch:fanny">Switch to Fanny Kristensen (new customer)</a>'
      : '<a href="#" data-act="switch:bjorn">Switch back to Bjørn Halvorsen</a>');
  var u=unreadCount();
  document.getElementById('nav').innerHTML = NAV.map(function(n){
    var extra = (n[0]==='#messages' && u) ? ' <span class="unread">'+u+' unread</span>' : '';
    return '<li><a href="'+n[0]+'"'+(n[0]===sec?' aria-current="page"':'')+'>'+ic(n[2])+
      '<span>'+n[1]+'</span>'+extra+'</a></li>';
  }).join('');
}

function signature(){
  return '<div class="sig"><span class="avatar" aria-hidden="true">'+METTE.ini+'</span><div>'+
   '<p class="sn">'+esc(METTE.name)+'</p>'+
   '<p class="sr">'+esc(METTE.role)+'</p>'+
   '<p class="sp">'+esc(METTE.phone)+'</p>'+
   '<div class="acts"><a class="btn out" href="#messages/new">Write to Mette</a></div></div></div>';
}
function footSig(){
  return '<div class="footnote"><p>Anything unclear on this page? Ring <b>'+esc(METTE.name)+'</b>, your '+
   'advisor, on <b>21 09 44 30</b>, weekdays 8 in the morning to 4 in the afternoon — or '+
   '<a href="#messages/new">write to Mette</a> and she answers within one working day.</p></div>';
}

/* ======================================================================
   the overview: the letter
   ====================================================================== */
function letterPage(){
  var p=persona(), h='', i, st, a;
  h+='<h1>'+(S.who==='bjorn'?'Your letter for August':'Your first letter')+'</h1>';
  var ansCount=0;
  for(i=0;i<p.steps.length;i++){ if(S.answers[p.steps[i].key]) ansCount++; }
  h+='<p class="ask">'+(ansCount===p.steps.length
     ? 'You have answered everything in this letter. There is nothing left to decide this month.'
     : (S.who==='bjorn'?ASK.overview:ASK.overviewF))+'</p>';
  h+='<div class="letter">';
  if(!p.verified){
    h+='<p class="small"><span class="est">Estimated figures</span> Every kroner figure in this letter is an '+
       'estimate based on 148 similar firms, because your accounting system is not connected yet. Nothing '+
       'here has been read from your own invoices.</p>';
  }
  h+=p.intro.join('');
  var done=0;
  for(i=0;i<p.steps.length;i++){
    st=p.steps[i]; a=S.answers[st.key];
    h+='<div'+(S.focusKey===st.key?' id="focus-here"':'')+'>'+st.para+'</div>';
    if(a){
      var d = (a==='yes') ? st.done : st.notnow;
      h+='<div class="rec"><p class="tag">'+ic(a==='yes'?'check':'hand')+'<span>'+esc(d.head)+'</span></p>';
      h+=d.lines.map(function(l){return '<p>'+l+'</p>';}).join('');
      if(a==='yes' && st.done.link){
        h+='<p><a class="relink" href="'+st.done.link.href+'">'+esc(st.done.link.label)+'</a></p>';
      }else if(a==='no'){
        h+='<p><button class="relink" data-act="reopen:'+st.key+'">I have changed my mind — ask me again now</button></p>';
      }
      h+='</div>';
      done++;
    }else{
      h+='<div class="q reveal"'+(S.focusKey==='q-'+st.key?' id="focus-here"':'')+
         ' role="group" aria-label="Question">'+
         '<h3>'+esc(st.q)+'</h3><p class="qsub">'+esc(st.qsub)+'</p>'+
         '<div class="acts">'+
         '<button class="btn" data-act="ask:'+st.key+'">'+esc(st.yes)+'</button>'+
         '<button class="btn quiet" data-act="no:'+st.key+'">'+esc(st.no)+'</button>'+
         '</div></div>';
      break;
    }
  }
  if(done===p.steps.length){
    h+='<div class="reveal">'+p.close+'</div>';
  }else{
    var rem=p.steps.length-done-1;
    h+='<p class="small">'+(rem===0
      ? 'Answer the question above and that is the whole letter. It is the only thing I need from you this month.'
      : 'Answer the question above and the next part of the letter appears. There '+
        (rem===1?'is one more thing':'are '+rem+' more things')+' after this one.')+'</p>';
  }
  h+=signature();
  h+='</div>';
  return h;
}

function agreementPage(id){
  var a=AGR[id], p=persona(), h='';
  if(!a) return '<h1>That agreement is not here</h1><p class="lead">Go back to <a href="#agreements">your '+
    'agreements</a> and pick one from the list.</p>';
  h+='<a class="back" href="#agreements">'+ic('arrow')+'<span>Back to your agreements</span></a>';
  h+='<div class="agr-head">'+logoBox(a.logo,a.alt+' logo')+'<span class="t"><h1>'+esc(a.name)+'</h1>'+
     '<p class="sub" style="margin:0">'+esc(a.supplier)+' · '+ic(a.catIcon)+' '+esc(a.catWord)+'</p>'+
     '</span></div>';
  var standing=a.standing;
  if(p.verified && a.primary.act.indexOf('step:')===0){
    var sk=a.primary.act.slice(5);
    if(S.answers[sk]==='yes'){ standing = a.id==='lyreco'
      ? 'You said yes to this one in your letter. Lyreco are opening your account and your customer number is on its way.'
      : 'You said yes in your letter. Ahlsell have been asked to link the four trade counters, which takes three working days.'; }
    if(S.answers[sk]==='no'){ standing = a.standing+' You said not now in your letter, so nothing has been sent.'; }
  }
  h+='<p class="ask">'+esc(p.verified?standing:'You are not using this agreement yet. Everything below is the '+
     'agreement itself, which does not change from firm to firm.')+'</p>';
  h+='<div class="card"><h3>What this agreement is</h3><p>'+a.what+'</p></div>';
  h+='<div class="card"><h3>What it is worth to you a year</h3>'+
     (p.verified?'<p>'+a.worth+'</p>':'<p>Until your accounting system is connected I cannot put a real '+
      'figure on this one for you. For a firm your size it is worth an <b>estimated</b> '+
      kr(a.id==='q8'?70000:(a.id==='lyreco'?55000:85000))+' a year, taken from 148 similar firms.</p>')+
     '<p class="small"><button class="explain" data-act="how">How we work this out</button></p></div>';
  h+='<div class="card"><h3>How to buy on this agreement</h3><ol class="steps">'+
     a.buy.map(function(b){ return '<li><b>'+esc(b[0])+'</b>'+b[1]+'</li>'; }).join('')+'</ol></div>';
  h+='<div class="card"><h3>The terms, in plain words</h3><div class="rows">'+
     a.terms.map(function(t){ return '<div class="row"><div class="rl">'+esc(t[0])+'</div>'+
       '<div class="rv"><p>'+t[1]+'</p></div></div>'; }).join('')+'</div></div>';

  /* one clear primary action */
  var pa=a.primary, act=pa.act, label=pa.label, note=a.note, doneNote=null;
  if(act.indexOf('step:')===0){
    var k=act.slice(5), ans=S.answers[k];
    if(ans==='yes'){ doneNote='You have already said yes to this, in your letter. '+
      (k==='lyreco'?'Lyreco are opening your account and your customer number is on its way.'
                   :'Ahlsell have been asked to link the four trade counters.'); }
    if(ans==='no'){ note='You said not now in your letter. Nothing has been sent. You can still say yes here.'; }
  }
  if(act==='order-cards' && S.sent.cards){ doneNote='Two more fuel cards are on their way to your office. '+
    'They arrive within four working days and nothing on your invoice changes until they are used.'; }
  h+='<div class="card">';
  if(!p.verified){
    h+='<h3>If you want this agreement</h3>'+
       '<p>Say the word and I will set it up for you. There is nothing to sign and no minimum you have to '+
       'buy, and it takes one working day.</p>'+
       '<div class="acts"><a class="btn" href="#messages/new">Ask Mette to set this one up for us</a>'+
       '<a class="btn quiet" href="#agreements">Not now — back to the list</a></div>';
  }else if(doneNote){
    h+='<div class="rec" style="margin:0"><p class="tag">'+ic('check')+'<span>Done — nothing more to do here</span></p>'+
       '<p>'+esc(doneNote)+'</p></div>';
  }else{
    h+='<div class="acts"><button class="btn" data-act="'+(act.indexOf('step:')===0?('ask:'+act.slice(5)):'cards')+
       '">'+esc(label)+'</button>'+
       '<a class="btn quiet" href="#messages/new">I want to think about it — write to Mette</a></div>'+
       '<p class="small" style="margin:14px 0 0">'+esc(note)+'</p>';
  }
  h+='</div>';
  h+=footSig();
  return h;
}

  var p=persona(), t=null, i;
  for(i=0;i<p.threads.length;i++){ if(p.threads[i].id===id) t=p.threads[i]; }
  if(!t) return messagesPage();
  S.sent['read-'+id]=true;
  var h='<a class="back" href="#messages">'+ic('arrow')+'<span>Back to messages</span></a>';
  h+='<h1>'+esc(t.subject)+'</h1>';
  h+='<p class="ask">Nothing here needs an answer unless you want to give one.</p>';
  h+=t.msgs.map(function(m){
    return '<div class="msg'+(m.who==='me'?' mine':'')+'"><div class="mh">'+
      '<span class="avatar" aria-hidden="true">'+(m.who==='mette'?METTE.ini:(m.who==='me'?'BH':'AN'))+'</span>'+
      '<span><span class="mn">'+esc(m.name)+'</span><br><span class="md">'+esc(m.when)+'</span></span></div>'+
      m.body.map(function(b){return '<p>'+b+'</p>';}).join('')+'</div>';
  }).join('');
  if(S.sent['reply-'+id]){
    h+='<div class="rec"><p class="tag">'+ic('check')+'<span>Your reply has been sent to Mette</span></p>'+
      '<p>She has it now and answers within one working day, usually the same morning. Nothing else has '+
      'changed and no supplier has been contacted.</p></div>';
  }else{
    h+='<div class="card"><label class="fl" for="reply">Write back to '+esc(t.who==='mette'?METTE.name:'Advantage Nordic')+'</label>'+
      '<textarea id="reply" placeholder="Type as much or as little as you like."></textarea>'+
      '<div class="acts" style="margin-top:16px">'+
      '<button class="btn" data-act="reply:'+id+'">Send this to '+esc(t.who==='mette'?'Mette':'Advantage Nordic')+'</button>'+
      '<a class="btn quiet" href="#messages">Leave it for now</a></div>'+
      '<p class="small" style="margin:14px 0 0">Sending a message does not commit you to anything. It goes '+
      'to a person, not to a supplier.</p></div>';
  }
  h+=footSig();
  return h;
}

var lastFocus=null;
function openDialog(html){
  lastFocus=document.activeElement;
  document.getElementById('dlg-host').innerHTML =
    '<div class="veil" data-veil="1"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgh">'+
    html+'</div></div>';
  var b=document.querySelector('.dlg .btn'); if(b) b.focus();
}
function closeDialog(){
  document.getElementById('dlg-host').innerHTML='';
  if(lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){}
}
function askDialog(key){
  var p=persona(), st=null, i;
  for(i=0;i<p.steps.length;i++){ if(p.steps[i].key===key) st=p.steps[i]; }
  if(!st) return;
  var d=st.dlg;
  openDialog(
   '<h2 id="dlgh">'+esc(d.title)+'</h2>'+
   '<p>'+esc(d.intro)+'</p>'+
   '<div class="rows">'+
   '<div class="row"><div class="rl">What changes</div><div class="rv"><p>'+esc(d.changes)+'</p></div></div>'+
   '<div class="row"><div class="rl">What does not change</div><div class="rv"><p>'+esc(d.stays)+'</p></div></div>'+
   '</div>'+
   '<div class="acts"><button class="btn" data-act="yes:'+key+'">'+esc(d.yes)+'</button>'+
   '<button class="btn quiet" data-act="close">Take me back — do not do it yet</button></div>'+
   '<p class="small" style="margin:16px 0 0">Nothing has been sent yet. Nothing happens until you press the '+
   'first button.</p>');
}

      'your size in the same trade, which is why every figure is marked as an estimate.')+'</p></div></div>'+
   '<div class="row"><div class="rl">Money you have already saved</div><div class="rv"><p>For each invoice '+
   'line bought at an agreed price, we take the supplier’s own published list price on that day and '+
   'subtract what you actually paid. Add those up and you get '+kr(1240000)+' for the last twelve months. '+
   'It is not modelled — it is the difference on lines you have already paid.</p></div></div>'+
   '<div class="row"><div class="rl">Money you could still save</div><div class="rv"><p>For each line bought '+
   'at full price we apply the discount in the agreement that covers those goods, then we knock 20 per cent '+
   'off the answer, because in practice some of it is bought in a hurry or in quantities too small to '+
   'qualify. That deliberately cautious sum is the '+kr(840000)+' a year.</p></div></div>'+
   '<div class="row"><div class="rl">What we leave out</div><div class="rv"><p>Wages, taxes, rent, insurance, '+
   'bank charges, plant you own and anything under '+kr(500)+'. We also leave out one-off purchases, because '+
   'an agreement cannot help you with something you bought once.</p></div></div>'+
   '<div class="row"><div class="rl">Compared with firms like yours</div><div class="rv"><p>Where I say a '+
   'figure is normal or high, I am comparing you with 148 contracting firms of 40 to 120 people that buy '+
   'through us. Not with the whole country, and not with firms ten times your size.</p></div></div>'+
   '<div class="row"><div class="rl">Who checks it</div><div class="rv"><p>I do, by hand, before I write to '+
   'you. If a figure here is wrong I would rather you rang me and told me so — '+esc(METTE.phone)+
   '.</p></div></div>'+
   '</div>'+
   '<div class="acts"><button class="btn" data-act="close">Close this explanation</button>'+
   '<a class="btn quiet" href="#messages/new" data-act="close-go">Ask Mette about a figure</a></div>');
}

/* ======================================================================
   render + routing
   ====================================================================== */
function render(){
  drawChrome();
  var r=S.route, h;
  if(r.indexOf('#agreement/')===0) h=agreementPage(r.slice(11));
  else if(r==='#agreements') h=agreementsPage();
  else if(r==='#messages/new') h=newMessagePage();
  else if(r.indexOf('#messages/')===0) h=threadPage(r.slice(10));
  else if(r==='#messages') h=messagesPage();
  else if(r==='#buying') h=buyingPage();
  else h=letterPage();
  document.getElementById('main').innerHTML=h;
  drawChrome();
  var f=document.getElementById('focus-here');
  if(f){
    try{ f.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){ f.scrollIntoView(); }
    S.focusKey=null;
  }
}
function navTo(hash){
  if(('#'+String(location.hash).replace(/^#/,''))!==hash){ location.hash=hash; }
  S.route=hash; render();
}
function onHash(){
  var r=location.hash||'#overview';
  S.route=r; render(); if(!document.getElementById('focus-here')) window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var t=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t){
    var v=e.target.closest? e.target.closest('.veil'):null;
    if(v && e.target===v) closeDialog();
    return;
  }
  var act=t.getAttribute('data-act');
  if(act==='close-go'){ closeDialog(); return; }
  e.preventDefault();
  if(act==='how'){ howDialog(); return; }
  if(act==='close'){ closeDialog(); return; }
  if(act==='cards'){ cardsDialog(); return; }
  if(act==='cards-yes'){ S.sent.cards=true; closeDialog(); render(); return; }
  if(act.indexOf('switch:')===0){
    S.who=act.slice(7); S.answers={}; S.sent={}; closeDialog(); navTo('#overview'); window.scrollTo(0,0); return;
  }
  if(act.indexOf('ask:')===0){ askDialog(act.slice(4)); return; }
  if(act.indexOf('yes:')===0){
    var k=act.slice(4); S.answers[k]='yes'; S.focusKey=k; closeDialog(); render(); return;
  }
  if(act.indexOf('no:')===0){
    var k2=act.slice(3); S.answers[k2]='no'; S.focusKey=k2; render(); return;
  }
  if(act.indexOf('reopen:')===0){
    var k3=act.slice(7); delete S.answers[k3]; S.focusKey='q-'+k3; render(); return;
  }
  if(act.indexOf('reply:')===0){ S.sent['reply-'+act.slice(6)]=true; render(); return; }
  if(act==='sendnew'){ S.sent['new']=true; render(); return; }
},false);

document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('dlg-host').innerHTML) closeDialog();
});
window.addEventListener('hashchange',onHash);
onHash();
</script>
