<!doctype html>
<!--
================================================================================
ADVANTAGE — ALT 3 · "MONEY MOVEMENT"
================================================================================

THESIS (2 sentences)
The current Advantage dashboard is a beautifully built measuring instrument that
never moves a krone: it quantifies 423.985 kr. of savings potential in nine
different framings and then hands the hardest part — telling the supplier,
changing the account code, checking the next invoice — to a button labelled
"Activate". This version deletes the measuring and builds the second half of the
product: a dated commitment, a supplier handoff artefact you can actually send,
named internal prerequisites, and a verification loop that reads the next invoice
and says whether the discounted rate appeared, disputed it when it did not.

REMOVED FROM v2, AND WHY
· "Benchmarked against 148 companies", "5 of 24 agreements in use", "savings
  potential up to 35%" — comparison as entertainment. None of the three changes
  what anybody does on Monday. (The 148-peer basis survives only as a provenance
  footnote on Fanny's estimates, where it is the reason a number is a range.)
· "Companies like yours" framing everywhere — flattery with no action attached.
· The savings gauge and the three generic assistant tips — a needle and three
  suggestions that were true of any construction company in Denmark.
· The category savings list as a browsing surface. It rendered 19 handsome
  agreement cards worth, in aggregate, 0 kr., because 16 of them sat in
  categories already covered by an active agreement. This version shows the 3
  commitments that carry real incremental money (47.544 kr.) and says out loud
  that the rest are alternates worth nothing extra.
· Weekly discovery, the activity rail's empty state, the announcement banner —
  three surfaces whose job was to have something on them.

ADDED, AND WHY
· A commitment step with a date. Committing produces a dated plan — day 0, day 3,
  day 14, day 45 — not a toast.
· The supplier handoff. Activation is a message to a human at the supplier. The
  product now generates it: framework agreement number, customer account number,
  effective date, what to confirm and by when, copy to clipboard.
· Internal prerequisites with named owners — the ERP discount profile and the
  person who actually places the orders. Most activations die here, silently.
· The verification loop, the centrepiece. Every invoice from an activated
  supplier is checked against the agreed rate: awaiting first invoice →
  confirmed, rate matched → discrepancy, invoiced at list price. Simulate the
  next invoice to watch it advance.
· Promised vs realised over time, with leakage broken out — Stark quietly raised
  prices and invoiced at 0%, −18.400 kr., which is the single most valuable thing
  this product will do this year.
· A dispute path: deviation letter, credit note, resolution that flows back into
  realised.

THE STRONGEST OBJECTION TO THIS VERSION
Nobody activates anything on a page that only tracks activations. v2's browsing
surfaces are not decoration — they are the demand generation, and a procurement
manager who opens Advantage twice a year needs a reason to look before he needs a
task list. By deleting the measuring instrument I have optimised for the five
customers already in flight and made the product almost unusable as a pitch to
the ninety-five who are not: Fanny's version is honest, and honestly empty. A
fairer product probably keeps one discovery surface and puts the entire
verification machine behind it, rather than replacing it. I accept that trade and
argue it anyway, because a savings product that never checks whether the saving
happened is a brochure, and v2 shipped nine ways to read the brochure.
================================================================================
-->

<style>
/* ==========================================================================
   Advantage Design System — tokens copied from advantage-v2-visual.html.
   Semantic tokens only. No raw hex in components.
   NOTE: the scale has no --s5/--s7/--s9/--s10 — always var(--s5,20px) etc.
   ========================================================================== */
:root{
  --general-background:#fafafa;
  --general-foreground:#0f0f0f;
  --general-primary:#1b64dc;
  --general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff;
  --general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2;
  --general-muted-foreground:#707070;
  --general-accent:#ff9b3d;
  --general-accent-foreground:#1c1c1c;
  --general-destructive:#dc2626;
  --general-border:#bdd7ff;
  --general-input:#ffffff;

  --sidebar-border:#e0e0e0;

  --sentiment-positive:#009689;
  --sentiment-negative:#f54a00;

  --surface:#ffffff;
  --brand-midnight:#000a45;
  --brand-ice:#edf5ff;
  --brand-cornflower:#73abff;

  --font-sans:"Rethink Sans","Rethink Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-5xl:48px;

  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;
  --rounded-xl:20px;--rounded-2xl:25px;--rounded-3xl:40px;--rounded-full:9999px;

  --shadow-2xs:0 1px 0 0 #0000000d;
  --shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --shadow-xl:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;

  --hairline:#ececec;

  --t-fast:.15s ease;
  --t:.28s cubic-bezier(.2,.7,.3,1);
  --t-slow:.5s cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--font-body);background:var(--surface);color:var(--general-foreground);
  font-size:var(--text-base);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-sans);font-weight:600;text-wrap:balance}
h1{font-size:var(--text-5xl);letter-spacing:-1.2px;line-height:1.1}
h2{font-size:var(--text-2xl);letter-spacing:-.7px;line-height:1.18}
h3{font-size:var(--text-lg);letter-spacing:-.3px}
h4{font-size:var(--text-sm)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--general-muted-foreground)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
[tabindex="-1"]:focus-visible{outline:none}
::selection{background:var(--general-secondary)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:44px;padding:0 var(--s6);border:1px solid transparent;cursor:pointer;
  border-radius:var(--rounded-full);font-size:var(--text-sm);font-weight:500;white-space:nowrap;
  transition:background-color var(--t-fast),color var(--t-fast),border-color var(--t-fast),
             box-shadow var(--t-fast),opacity var(--t-fast),transform .1s ease}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn-primary{background:var(--general-primary);color:var(--general-primary-foreground);
  box-shadow:0 1px 2px #1b64dc40,inset 0 1px 0 #ffffff26}
.btn-primary:hover:not([disabled]){background:#1553bb}
.btn-primary[disabled]{background:var(--general-muted);color:#a3a3a3;box-shadow:none}
.btn-secondary{background:var(--surface);border-color:var(--sidebar-border);box-shadow:var(--shadow-xs)}
.btn-secondary:hover:not([disabled]){background:var(--brand-ice);border-color:var(--general-border)}
.btn-secondary[disabled]{background:var(--general-muted);border-color:transparent;color:#8f8f8f;box-shadow:none}
.btn-ghost{background:transparent;color:var(--general-primary);padding:0 var(--s3);height:36px}
.btn-ghost:hover{background:var(--brand-ice)}
.btn-danger{background:var(--general-destructive);color:#fff}
.btn-danger:hover:not([disabled]){background:#b81d1d}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 var(--s4);font-size:var(--text-xs)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--general-primary);
  font-size:var(--text-sm);font-weight:500;border-radius:var(--rounded-xs)}
.linkbtn:hover{text-decoration:underline}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rounded-full);
  font-size:13px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.chip svg{width:12px;height:12px}
.chip-rec{background:var(--general-primary);color:var(--general-primary-foreground)}
.chip-soft{background:var(--general-muted);color:var(--general-muted-foreground)}
.chip-warn{background:#fff2e0;color:#a35c00}
.chip-good{background:#d9f2ef;color:var(--sentiment-positive)}
.chip-bad{background:#feeae4;color:var(--sentiment-negative)}
.est-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rounded-full);
  background:var(--general-muted);color:var(--general-muted-foreground);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.est-chip svg{width:11px;height:11px}

/* ==========================================================================
   LOGIN
   ========================================================================== */
.flow{min-height:100vh;display:flex;flex-direction:column}
.stage{flex:1 1 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1 1 auto}
.scr.on{display:flex;flex-direction:column}
.scr.on.mid{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;
  padding:var(--s12) var(--s6)}
.scr.on>*{animation:rise var(--t-slow) both;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.login{width:420px;max-width:100%;text-align:center}
.login .mark{height:40px;width:auto;margin:0 auto var(--s8);display:block}
.login h1{font-size:var(--text-5xl);letter-spacing:-2px}
.login .lead{font-size:var(--text-base);margin:var(--s3) auto 0;max-width:38ch;
  color:var(--general-muted-foreground);line-height:1.55}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-xl);
  box-shadow:var(--shadow-sm)}
.login .card{margin-top:var(--s12);padding:var(--s8);text-align:left}
.login-choice{display:flex;flex-direction:column;gap:var(--s3)}
.login-persona{display:flex;align-items:center;gap:var(--s4);width:100%;padding:var(--s4);
  border:1px solid var(--hairline);border-radius:var(--rounded-lg);background:var(--surface);
  cursor:pointer;text-align:left;transition:var(--t-fast)}
.login-persona:hover,.login-persona:focus-visible{border-color:var(--general-border);background:var(--brand-ice)}
.login-persona-av{flex:0 0 auto;width:40px;height:40px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--brand-ice);color:var(--general-primary);
  font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.login-persona:hover .login-persona-av{background:var(--surface)}
.login-persona-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.login-persona-txt b{font-size:var(--text-sm);font-weight:600}
.login-persona-txt span{font-size:12px;color:var(--general-muted-foreground)}
.login-persona-go{flex:0 0 auto;width:16px;height:16px;color:#a3a3a3;transition:color var(--t-fast)}
.login-persona:hover .login-persona-go{color:var(--general-primary)}
.tinyfoot{margin-top:var(--s6);font-size:var(--text-xs);color:#8f8f8f;text-align:center}

/* ==========================================================================
   APP SHELL
   ========================================================================== */
body.in-app{background:var(--brand-midnight);overflow:hidden}
body.in-app .flow{display:none}
.app{display:none;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--s3)}
.app.on{display:flex;animation:rise var(--t-slow) both}
.wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--rounded-2xl) var(--rounded-2xl) 0 0;overflow:hidden;
  box-shadow:0 -1px 0 #ffffff1a,var(--shadow-xl)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s4);height:68px;padding:0 var(--s6);
  border-bottom:1px solid var(--hairline)}
.appbar .brand{display:flex;align-items:center;flex:0 0 auto}
.appbar .brand img{height:28px;width:auto;display:block}
.appbar .spacer{flex:1}
.erp{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s3);
  background:var(--surface);border:1px solid var(--sidebar-border);border-radius:var(--rounded-full);
  box-shadow:var(--shadow-2xs);cursor:pointer;transition:var(--t-fast)}
.erp:hover{border-color:var(--general-border);background:var(--brand-ice)}
.erp .live{position:relative;width:8px;height:8px;flex:0 0 auto;border-radius:var(--rounded-full);
  background:var(--sentiment-positive)}
.erp .live::after{content:"";position:absolute;inset:-4px;border-radius:var(--rounded-full);
  border:1.5px solid var(--sentiment-positive);opacity:.45;animation:pip 2.4s ease-out infinite}
.erp.none .live{background:var(--sentiment-negative)}
.erp.none .live::after{border-color:var(--sentiment-negative)}
@keyframes pip{0%{transform:scale(.6);opacity:.5}70%,100%{transform:scale(1.5);opacity:0}}
.erp .et{display:flex;flex-direction:column;line-height:1.25;text-align:left}
.erp .et b{font-size:var(--text-xs);font-weight:600;white-space:nowrap}
.erp .et span{font-size:13px;color:var(--general-muted-foreground);font-family:var(--font-mono)}
@media(max-width:1080px){.erp .et span{display:none}}
.userwrap{position:relative;flex:0 0 auto}
.user{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s2);background:none;
  border:none;cursor:pointer;border-radius:var(--rounded-full);transition:var(--t-fast)}
.user:hover{background:var(--general-muted)}
.user .uav{width:30px;height:30px;flex:0 0 auto;border-radius:var(--rounded-full);display:grid;
  place-items:center;color:#fff;font-family:var(--font-sans);font-size:13px;font-weight:600;
  background:linear-gradient(135deg,#2170ed,#0b00ab)}
.user .un{font-size:var(--text-xs);font-weight:600;text-align:left;line-height:1.25;white-space:nowrap}
.user .un span{display:block;font-weight:400;color:var(--general-muted-foreground)}
.user .uc{width:14px;height:14px;color:var(--general-muted-foreground)}
@media(max-width:1000px){.user .un{display:none}}
.upop{position:absolute;top:calc(100% + 8px);right:0;z-index:35;width:260px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  box-shadow:var(--shadow-xl);opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast)}
.upop.on{opacity:1;transform:none;pointer-events:auto}
.up-h{padding:var(--s4);border-bottom:1px solid var(--hairline)}
.up-h b{display:block;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.up-h span{display:block;font-size:13px;color:var(--general-muted-foreground);margin-top:1px}
.up-i{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);
  background:none;border:none;cursor:pointer;text-align:left;font-size:var(--text-sm);
  transition:var(--t-fast)}
.up-i:hover{background:var(--general-muted)}
.up-i svg{width:16px;height:16px;flex:0 0 auto;color:var(--general-muted-foreground)}
.up-sep{padding:var(--s3) var(--s4) var(--s1);border-top:1px solid var(--hairline);margin-top:var(--s1)}
.up-sep span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.up-persona-av{flex:0 0 auto;width:28px;height:28px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--brand-ice);color:var(--general-primary);
  font-family:var(--font-sans);font-size:12px;font-weight:600}
.up-persona-txt{display:flex;flex-direction:column;min-width:0}
.up-persona-txt span{font-size:12px;color:var(--general-muted-foreground)}

/* --- rail --- */
.appbody{flex:1 1 auto;min-height:0;display:flex}
.rail{flex:0 0 auto;width:252px;display:flex;flex-direction:column;padding:var(--s4) var(--s3);
  border-right:1px solid var(--hairline);transition:width var(--t)}
.rail.mini{width:76px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0}
.ni{position:relative;display:flex;align-items:center;gap:var(--s3);width:100%;height:44px;
  padding:0 var(--s3);background:none;border:none;cursor:pointer;border-radius:var(--rounded-md);
  font-size:var(--text-sm);font-weight:500;text-align:left;
  transition:background-color var(--t-fast),color var(--t-fast)}
.ni:hover{background:var(--general-muted)}
.ni.on{background:var(--brand-ice);color:var(--general-primary);font-weight:600}
.ni .nic{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center}
.ni .nic svg{width:20px;height:20px}
.ni .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity var(--t-fast)}
.ni .nb{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--general-accent);color:var(--general-accent-foreground);
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ni .nb.bad{background:var(--general-destructive);color:#fff}
.rail.mini .ni{justify-content:center;padding:0}
.rail.mini .ni .nt{opacity:0;width:0;flex:0 0 0}
.rail.mini .ni .nb{position:absolute;top:5px;right:9px;min-width:16px;height:16px;padding:0 4px;font-size:13px}
.rail.mini .ni::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;
  transform:translateY(-50%) translateX(-4px);padding:5px 10px;border-radius:var(--rounded-sm);
  background:var(--brand-midnight);color:var(--surface);font-size:var(--text-xs);font-weight:500;
  white-space:nowrap;pointer-events:none;opacity:0;z-index:5;box-shadow:var(--shadow-md);
  transition:opacity var(--t-fast),transform var(--t-fast)}
.rail.mini .ni:hover::after,.rail.mini .ni:focus-visible::after{opacity:1;transform:translateY(-50%)}
.railtog{display:flex;align-items:center;gap:var(--s3);flex:0 0 auto;height:40px;margin-top:var(--s3);
  padding:0 var(--s3);background:none;border:none;border-top:1px solid var(--hairline);cursor:pointer;
  color:var(--general-muted-foreground);font-size:var(--text-xs);font-weight:500;transition:var(--t-fast)}
.railtog:hover{color:var(--general-foreground)}
.railtog svg{width:20px;height:20px;flex:0 0 auto;transition:transform var(--t)}
.rail.mini .railtog{justify-content:center;padding:0}
.rail.mini .railtog svg{transform:rotate(180deg)}
.rail.mini .railtog span{display:none}

/* --- canvas --- */
.canvas{flex:1 1 auto;min-width:0;overflow:auto;background:var(--surface)}
.page{width:100%;max-width:1200px;margin:0 auto;padding:var(--s12) var(--s8) var(--s16);
  display:flex;flex-direction:column;gap:var(--s12)}
@media(max-width:760px){.page{padding:var(--s8) var(--s4) var(--s12)}
  .appbar{padding:0 var(--s4);gap:var(--s3)}}
.view[hidden]{display:none}

/* ==========================================================================
   SHARED PAGE FURNITURE
   ========================================================================== */
.hello{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3)}
.hello h1{font-size:var(--text-4xl);letter-spacing:-1.3px}
.hello-p{font-size:var(--text-lg);line-height:1.55;color:var(--general-muted-foreground);max-width:74ch}
.hello-p b{font-weight:600;color:var(--general-foreground)}
.sec{display:flex;flex-direction:column;gap:var(--s4)}
.sec-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.sec-h .spacer{flex:1}
.sec-h p{flex:1 1 100%;font-size:var(--text-sm);line-height:1.6;color:var(--general-muted-foreground);
  max-width:78ch}
.hr{border:none;border-top:1px solid var(--hairline)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
  padding:0;font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.back:hover{color:var(--general-primary)}
.back svg{width:15px;height:15px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3)}
.tile{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--rounded-md);box-shadow:var(--shadow-xs)}
.tile.hi{border-color:var(--general-border);background:linear-gradient(160deg,#f7fbff,#fff)}
.tile.bad{border-color:#f7c9b6;background:linear-gradient(160deg,#fff6f2,#fff)}
.tile-l{font-size:13px;line-height:1.25;color:var(--general-muted-foreground)}
.tile-v{font-family:var(--font-sans);font-size:var(--text-2xl);font-weight:600;letter-spacing:-.7px;
  line-height:1;font-variant-numeric:tabular-nums}
.tile-v.pos{color:var(--sentiment-positive)}
.tile-v.neg{color:var(--sentiment-negative)}
.tile-v small{font-family:var(--font-body);font-size:13px;font-weight:400;letter-spacing:0;
  color:var(--general-muted-foreground);margin-left:5px}

/* ==========================================================================

.logo{flex:0 0 auto;width:40px;height:40px;border-radius:var(--rounded-sm);display:grid;

  font-weight:700;color:var(--general-muted-foreground)}

.act-id{min-width:0;display:flex;flex-direction:column;gap:3px}

}

/* stage track — five dots and a rule, computed from real state */
.track-wrap{min-width:0}
.track5{display:flex;align-items:center;gap:0;min-width:0}
.track5 .tn{flex:0 0 auto;position:relative;width:14px;height:14px;border-radius:var(--rounded-full);

.track5 .tn.now{border-color:var(--general-accent);box-shadow:0 0 0 3px #ff9b3d33}

/* verification state pill */
.vstate{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--rounded-full);

.vstate.discrepancy{background:#feeae4;color:var(--sentiment-negative)}

.alert{display:flex;align-items:flex-start;gap:var(--s4);padding:var(--s4) var(--s5,20px);

/* ==========================================================================

.det-head{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap}
.det-head .logo{width:56px;height:56px;border-radius:var(--rounded-md)}
.det-head-t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.det-head-t h1{font-size:var(--text-3xl);letter-spacing:-1px}
.det-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:13px;

.panel{padding:var(--s6);background:var(--surface);border:1px solid var(--hairline);

.panel-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}

.panel p.note{font-size:13px;line-height:1.6;color:var(--general-muted-foreground)}

/* dated plan */
.plan{list-style:none;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:76px 18px minmax(0,1fr);gap:var(--s3);
  padding:var(--s3) 0;border-top:1px solid var(--hairline)}
.plan li:first-child{border-top:none;padding-top:0}
.plan .d{font-family:var(--font-mono);font-size:13px;color:var(--general-muted-foreground);

.plan .d b{display:block;font-family:var(--font-sans);font-size:var(--text-xs);font-weight:700;

.plan li.now .pip{border-color:var(--general-accent);box-shadow:0 0 0 3px #ff9b3d33}
.plan li.bad .pip{background:var(--sentiment-negative);border-color:var(--sentiment-negative)}
.plan .pt{min-width:0}

/* supplier handoff artefact */

/* prerequisite tasks */
.tasks{list-style:none;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3) 0;

.tk{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:var(--rounded-xs);

.tasks .tb{flex:1 1 auto;min-width:0}
.tasks .tb b{display:block;font-size:var(--text-sm);font-weight:600}
.tasks li.done .tb b{color:var(--general-muted-foreground);text-decoration:line-through}
.tasks .tb span{display:block;margin-top:2px;font-size:13px;line-height:1.55;
  color:var(--general-muted-foreground)}
.owner{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:2px 8px;
  border-radius:var(--rounded-full);background:var(--general-muted);font-size:12px;font-weight:600;

/* verification */
.vhero{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5,20px);
  border-radius:var(--rounded-md);border:1px solid var(--hairline);background:var(--general-muted)}
.vhero.awaiting{background:#fffaf3;border-color:#ffdcb0}
.vhero.confirmed{background:#f2fbfa;border-color:#b9e5e1}
.vhero.discrepancy{background:#fff6f2;border-color:#f7c9b6}
.vhero-ic{flex:0 0 auto;width:40px;height:40px;border-radius:var(--rounded-full);display:grid;
  place-items:center;background:var(--surface);box-shadow:var(--shadow-xs)}
.vhero-ic svg{width:20px;height:20px}
.vhero.awaiting .vhero-ic{color:#a35c00}
.vhero.confirmed .vhero-ic{color:var(--sentiment-positive)}
.vhero.discrepancy .vhero-ic{color:var(--sentiment-negative)}
.vhero-b b{display:block;font-family:var(--font-sans);font-size:var(--text-base);font-weight:600}
.vhero-b p{margin-top:2px;font-size:13px;line-height:1.55;color:var(--general-muted-foreground)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--text-xs)}
table.tbl caption{text-align:left;font-size:13px;color:var(--general-muted-foreground);
  padding-bottom:var(--s2)}
table.tbl th,table.tbl td{text-align:right;padding:var(--s2) var(--s2);
  border-bottom:1px solid var(--hairline);white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl thead th{font-family:var(--font-body);font-size:12px;font-weight:600;
  color:var(--general-muted-foreground);text-transform:uppercase;letter-spacing:.04em}
table.tbl td.n{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
table.tbl tr.bad td{background:#fff6f2}
table.tbl tr.tot td{border-bottom:none;border-top:2px solid var(--general-foreground);font-weight:700}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border:1px dashed var(--sidebar-border);border-radius:var(--rounded-md);background:#fbfcfe}
.sim .sl{flex:1 1 180px;font-size:12px;line-height:1.5;color:var(--general-muted-foreground)}
.sim .sl b{display:block;font-size:var(--text-xs);color:var(--general-foreground)}

/* ==========================================================================
   LEDGER — promised vs realised
   ========================================================================== */
.chart{display:flex;align-items:flex-end;gap:var(--s3);height:220px;padding:var(--s4) 0;
  border-bottom:1px solid var(--sidebar-border)}
.cbar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:6px;height:100%}
.cbar .stack{position:relative;width:100%;max-width:62px;display:flex;flex-direction:column;
  justify-content:flex-end;height:100%}
.cbar .seg{width:100%;border-radius:var(--rounded-xs) var(--rounded-xs) 0 0;
  transition:height var(--t-slow)}
.cbar .seg.r{background:var(--general-primary)}
.cbar .seg.l{background:var(--sentiment-negative);border-radius:var(--rounded-xs) var(--rounded-xs) 0 0}
.cbar .seg.r + .seg{border-radius:0}
.cbar .cm{font-size:12px;color:var(--general-muted-foreground);font-variant-numeric:tabular-nums}
.cbar.pending .stack::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;
  border-radius:var(--rounded-xs);background:repeating-linear-gradient(90deg,
    var(--general-muted) 0 4px,transparent 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4);font-size:13px;color:var(--general-muted-foreground)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;

.legend i.r{background:var(--general-primary)}
.legend i.l{background:var(--sentiment-negative)}
.bonus{display:flex;flex-direction:column;gap:var(--s2)}
.bonus-row{display:flex;align-items:baseline;gap:var(--s3);font-size:var(--text-sm);
  padding:var(--s2) 0;border-top:1px solid var(--hairline)}
.bonus-row:first-child{border-top:none}
.bonus-row .spacer{flex:1}
.bonus-row .bv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.bonus-row.tot{border-top:2px solid var(--general-foreground);font-weight:700}

/* ==========================================================================

.commit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:var(--s8);align-items:start}

.pick{display:flex;flex-direction:column;gap:var(--s3)}

.pick-o .pv{flex:0 0 auto;text-align:right}

.dead{padding:var(--s4);border:1px dashed var(--sidebar-border);border-radius:var(--rounded-md);

.flabel{font-size:var(--text-xs);font-weight:600;color:var(--general-muted-foreground)}

.fhint{font-size:12px;line-height:1.5;color:var(--general-muted-foreground)}

.mach{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3);

.mach-s p{font-size:13px;line-height:1.55;color:var(--general-muted-foreground)}
.empty{padding:var(--s8) var(--s6);text-align:center;border:1px dashed var(--sidebar-border);

.empty b{display:block;font-family:var(--font-sans);font-size:var(--text-lg);font-weight:600}
.empty p{margin:var(--s2) auto 0;max-width:56ch;font-size:var(--text-sm);line-height:1.6;

.dlg-h h2{font-size:var(--text-xl)}

/* ---------- customer bonus: tiered on covered volume, recomputed every render ---------- */
const BONUS_TIERS = [
  {upTo:1e6,      rate:0.010, label:'first 1.000.000 kr. at 1,0%'},
  {upTo:3e6,      rate:0.015, label:'1.000.000 – 3.000.000 kr. at 1,5%'},
  {upTo:Infinity, rate:0.020, label:'above 3.000.000 kr. at 2,0%'}
];
function bonusBreakdown(vol){
  let prev = 0, out = [], total = 0;
  BONUS_TIERS.forEach(t => {
    const band = Math.max(0, Math.min(vol, t.upTo) - prev);
    const amt  = Math.round(band * t.rate);
    if(band > 0){ out.push({label:t.label, band, amt}); total += amt; }
    prev = t.upTo;
  });
  return {rows:out, total};
}
const bonusOf = vol => bonusBreakdown(vol).total;

const PERSONAS = {

/* ==========================================================================
   ACTIVATIONS — a commitment with a date, a supplier who has been told,
   internal prerequisites with owners, and an invoice-by-invoice rate check.
   ========================================================================== */
function taskSet(a, doneFlags){
  const c = cat(a.catId);
  const defs = [
    {t:`Link account ${a.acct} to ${a.fw} in the ERP`,
     d:`Set the discount profile on the supplier card in ${P.erp || 'the finance system'} so posted invoices are checked against the agreement rate, not the list price.`,
     owner:`${P.user}, finance`},
    {t:'Brief whoever places the orders',
     d:`Every ${c.n.toLowerCase()} order must go through the business account ${a.acct}. Trade-counter and cash purchases fall outside the agreement and carry no discount.`,
     owner:P.orderOwner},
    {t:'File the supplier’s written confirmation',
     d:'Keep the confirmation with the agreement. Without it there is nothing to point at when an invoice comes back at list price.',
     owner:`${P.user}, finance`}
  ];
  return defs.map((d,i) => ({...d, done: !!(doneFlags && doneFlags[i])}));
}

let INVNO = 0;
function invoice(prefix, date, expected, rate, got){
  INVNO++;
  return {
    no: `${prefix}-${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(200+INVNO)}`,
    date, base: Math.round(expected / (rate/100)), expected, got,
    credited:false
  };
}

function makeAct(o){
  const c = cat(o.catId);
  const a = {
    id: o.id, agrName: o.agrName, catId: o.catId, promised: c.save, rate: c.rate,
    acct: o.acct, fw: agr(o.agrName).fw,
    committedAt: o.committedAt, eff: o.eff,
    confirmBy: dayAdd(o.eff, 3),
    notifiedAt: o.notifiedAt || null,
    tasks: [], invoices: [], dispute: null,
    orderOwner: P.orderOwner
  };
  a.tasks = taskSet(a, o.done);
  return a;
}

/* Bob: five activations at five different stages, one of them a live discrepancy.
   Invoice discounts are the real per-invoice amounts, not 1/12 of the annual
   figure — they sum to 98.959 kr. realised and 117.359 kr. entitled, and the
   18.400 kr. gap is the whole of the Stark deviation. */
function seedBob(){
  const A = [];
  const stark = makeAct({id:'ACT-2026-0148', agrName:'Stark Byggecenter', catId:'mat',
    acct:'88214-03', committedAt:atMonth(5,-12), eff:atMonth(5,1),

  [14820, 16402, 15947, 16800].forEach((d,i) =>
    stark.invoices.push(invoice('SB', atMonth(5-i,12), d, 9, d)));
  /* the deviation: Stark put through a 4% price increase and invoiced at list price */
  const bad = invoice('SB', atMonth(1,12), 18400, 9, 0);
  bad.note = 'Invoiced at list price after a 4% price increase — agreement rate not applied.';
  stark.invoices.push(bad);
  stark.dispute = {state:'open', invNo:bad.no, amount:18400, sentAt:null, resolvedAt:null,
                   raisedAt:atMonth(1,15)};
  A.push(stark);

  const hilti = makeAct({id:'ACT-2026-0151', agrName:'Hilti Erhverv', catId:'tool',
    acct:'44190-11', committedAt:atMonth(4,-12), eff:atMonth(4,1),
    notifiedAt:atMonth(4,-11), done:[1,1,1]});
  [5980, 6240, 6010, 6146].forEach((d,i) =>
    hilti.invoices.push(invoice('HI', atMonth(4-i,12), d, 11, d)));
  A.push(hilti);

  const q8 = makeAct({id:'ACT-2026-0155', agrName:'Q8 Fuel Card', catId:'fuel',
    acct:'70552-08', committedAt:atMonth(3,-12), eff:atMonth(3,1),
    notifiedAt:atMonth(3,-11), done:[1,1,1]});
  [3480, 3602, 3532].forEach((d,i) =>
    q8.invoices.push(invoice('Q8', atMonth(3-i,12), d, 8, d)));
  A.push(q8);

  /* notified, prerequisites closed, nothing invoiced yet */
  A.push(makeAct({id:'ACT-2026-0161', agrName:'Lyreco Erhverv', catId:'off',
    acct:'31877-02', committedAt:dayAdd(TODAY,-31), eff:dayAdd(TODAY,-24),
    notifiedAt:dayAdd(TODAY,-30), done:[1,1,1]}));

  /* youngest: supplier told, two prerequisites still open — this is where
     activations die quietly in the current product */
  A.push(makeAct({id:'ACT-2026-0166', agrName:'Cramo Danmark', catId:'rent',
    acct:'52034-07', committedAt:dayAdd(TODAY,-12), eff:dayAdd(TODAY,-9),

/* ---------- derived state: everything below is computed, never stored ---------- */
const actById = id => ACTS.find(a => a.id === id);
const openLeak = a => a.invoices.reduce((s,i) => s + (i.credited ? 0 : i.expected - i.got), 0);
const realisedOf = a => a.invoices.reduce((s,i) => s + i.got, 0);
const entitledOf = a => a.invoices.reduce((s,i) => s + i.expected, 0);
const recoveredOf = a => a.invoices.reduce((s,i) => s + (i.credited ? i.expected - 0 : 0), 0);
const prereqDone = a => a.tasks.every(t => t.done);

/* the three verification states, derived from the invoices themselves */
function vstate(a){
  if(openLeak(a) > 0) return 'discrepancy';
  if(a.invoices.length === 0) return 'awaiting';
  return 'confirmed';
}
const VLABEL = {
  awaiting:'Awaiting first invoice',
  confirmed:'Confirmed — rate matched',
  discrepancy:'Discrepancy — invoiced at old rate'
};
const VICON = {awaiting:CLOCK, confirmed:TICK, discrepancy:BANG};

/* five-stage track: committed · supplier notified · prerequisites · first invoice · verified */
const STAGES = ['Committed','Supplier notified','Prerequisites','First invoice','Verified'];
function stageOf(a){
  let i = 1;                                  // committed is always true
  if(a.notifiedAt) i++;
  if(prereqDone(a)) i++;
  if(a.invoices.length) i++;
  if(vstate(a) === 'confirmed' && a.invoices.length) i++;
  return i;                                    // 1..5
}
function stageLabel(a){
  const v = vstate(a);
  if(v === 'discrepancy') return 'Deviation raised against the agreement';
  if(v === 'confirmed')   return `Verified on ${a.invoices.length} invoice${a.invoices.length===1?'':'s'}`;
  if(!prereqDone(a))     return `${a.tasks.filter(t=>!t.done).length} prerequisite(s) still open`;
  return 'Waiting for the first invoice after the effective date';
}

/* portfolio aggregates */
function totals(){
  const promised  = ACTS.reduce((s,a) => s + a.promised, 0);
  const realised  = ACTS.reduce((s,a) => s + realisedOf(a), 0);
  const entitled  = ACTS.reduce((s,a) => s + entitledOf(a), 0);
  const leak      = ACTS.reduce((s,a) => s + openLeak(a), 0);
  const recovered = ACTS.reduce((s,a) => s + recoveredOf(a), 0);
  const covered   = ACTS.reduce((s,a) => s + cat(a.catId).spend, 0);
  const committedCats = new Set(ACTS.map(a => a.catId));
  const open      = CATS.filter(c => !committedCats.has(c.id));
  return {
    promised, realised, entitled, leak, recovered, covered,
    leaking: TOTAL_SPEND - covered,
    openCats: open,
    openSave: open.reduce((s,c) => s + c.save, 0),
    bonus: bonusBreakdown(covered),
    invChecked: ACTS.reduce((s,a) => s + a.invoices.length, 0)
  };
}

/* clipboard with a synchronous fallback for file:// origins where the async
   Clipboard API is unavailable */
async function copyText(txt, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2){ ok = false; }
    ta.remove();
  }
  const flag = btn && btn.parentElement.querySelector('.copied');
  if(flag){
    flag.textContent = ok ? 'Copied to clipboard' : 'Copy failed — select the text above';
    setTimeout(() => { flag.textContent = ''; }, 4000);
  }
  say(ok ? 'Copied to clipboard.' : 'Copy failed. Select the text manually.');
}

function planOf(a){
  const v = vstate(a), firstInv = a.invoices[0], lastInv = a.invoices[a.invoices.length-1];
  const secondWindow = dayAdd(a.eff, 45);
  return [
    {day:'Day 0', date:a.committedAt, state:'done',
     t:'Committed', d:`Effective date set to ${daFull(a.eff)}. Framework agreement ${a.fw}
        locked to account ${a.acct}, and everything below scheduled from that date.`},
    {day:'Day 0', date:a.notifiedAt || dayAdd(a.committedAt,1),
     state:a.notifiedAt ? 'done' : 'now',
     t:a.notifiedAt ? 'Notification sent to the supplier' : 'Send the notification to the supplier',
     d:a.notifiedAt
       ? `Sent to the ${a.agrName} account team. Nobody at the supplier applies a rate they were never told about.`
       : `Nothing has been sent yet. Until the ${a.agrName} account team has this in writing, the agreement is not in force on their side.`},
    {day:'Day 3', date:a.confirmBy, state:prereqDone(a) ? 'done' : 'now',
     t:'Prerequisites closed, confirmation received',
     d:prereqDone(a)
       ? `ERP profile set, order placers briefed, supplier confirmation filed.`
       : `${a.tasks.filter(t=>!t.done).length} of ${a.tasks.length} internal steps still open, and the supplier’s written confirmation was due ${daShort(a.confirmBy)}.`},
    {day:'Day 14', date:firstInv ? firstInv.date : dayAdd(a.eff,14),
     state:firstInv ? (openLeak(a) > 0 ? 'bad' : 'done') : 'now',
     t:firstInv ? 'First invoice checked' : 'First invoice after the effective date',
     d:firstInv
       ? (openLeak(a) > 0
          ? `Invoice ${firstInv.no} onwards checked. A later invoice came back at list price — see verification below.`
          : `Invoice ${firstInv.no}, ${fmt(firstInv.base)} kr. net, carried ${pct(a.rate)}% as agreed.`)
       : `We check the applied rate against ${pct(a.rate)}% the moment an invoice from ${a.agrName} lands on account ${a.acct}.`},
    {day:'Day 45', date:secondWindow,
     state: a.invoices.length > 1 ? (openLeak(a) > 0 ? 'bad' : 'done') : 'now',
     t:'Second invoice re-check', d:`A rate that appears once can disappear again after a price
        revision. Every subsequent invoice is checked the same way — this is how a quiet
        reversion gets caught instead of being discovered at year end.`}
  ];
}

/* the loop, made demonstrable: the next invoice arrives, at the agreed rate or not */
function simulate(a, ok){
  const expected = Math.round(a.promised / 12);
  const prefix = a.invoices.length ? a.invoices[0].no.split('-')[0] : initials(a.agrName);
  const inv = invoice(prefix, new Date(TODAY), expected, a.rate, ok ? expected : 0);
  if(!ok) inv.note = 'Invoiced at list price — agreement rate not applied.';
  a.invoices.push(inv);
  if(!ok){
    a.dispute = {state:'open', invNo:inv.no, amount:expected, sentAt:null,
                 resolvedAt:null, raisedAt:new Date(TODAY)};
    say(`Invoice ${inv.no} from ${a.agrName} arrived at the old rate. ${fmt(expected)} kr. short — discrepancy raised.`);
  } else {
    say(`Invoice ${inv.no} from ${a.agrName} confirmed at ${pct(a.rate)}%. ${fmt(expected)} kr. realised.`);
  }
  renderDetail(); renderNav();
}

/* ==========================================================================
   THE DISPUTE PATH — review, send the deviation letter, resolve on credit note.
   ========================================================================== */
let dlgAct = null;
function openDispute(id){
  dlgAct = actById(id);
  if(!dlgAct || !dlgAct.dispute) return;
  $('#scrim').classList.add('on');
  $('#dlg').classList.add('on');
  $('#dlg').setAttribute('aria-hidden','false');
  renderDispute();
  setTimeout(() => $('#dlgT').focus(), 80);
}
function closeDispute(){
  $('#scrim').classList.remove('on');
  $('#dlg').classList.remove('on');
  $('#dlg').setAttribute('aria-hidden','true');
  dlgAct = null;
  if(view === 'detail') renderDetail(); else if(view === 'queue') renderQueue(); else renderFlight();
  renderNav();
}
$('#scrim').addEventListener('click', closeDispute);
$('#dlgX').addEventListener('click', closeDispute);
addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#dlg').classList.contains('on')) closeDispute();
});

function renderDispute(){
  const a = dlgAct, d = a.dispute, c = cat(a.catId);
  const inv = a.invoices.find(i => i.no === d.invNo);
  const step = d.state === 'open' ? 0 : d.state === 'sent' ? 1 : 2;
  const names = ['Review the deviation','Deviation sent','Credit note received'];

  $('#dlgSteps').innerHTML = names.map((n,i) =>
    `<span class="s3 ${i === step ? 'on' : ''} ${i < step ? 'done' : ''}"><i></i>${n}</span>`).join('');
  $('#dlgT').textContent = `Price deviation — ${a.agrName}`;
  $('#dlgSub').textContent = `Invoice ${inv.no} of ${daFull(inv.date)} · framework ${a.fw}`;

  $('#dlgBody').innerHTML = `
    <div class="vhero discrepancy">
      <span class="vhero-ic">${BANG}</span>
      <span class="vhero-b"><b>${fmt(d.amount)} kr. short on this invoice</b>
        <p>${esc(a.agrName)} notified a 4% price increase this quarter and applied it to the
          agreement assortment, invoicing at list price. Account ${esc(a.acct)} either is not
          linked to ${esc(a.fw)} on their side, or the link was dropped in the price revision.</p></span>
    </div>
    <dl class="kv">
      <dt>Invoiced, net of VAT</dt><dd>${fmt(inv.base)} kr.</dd>
      <dt>Agreement rate (${esc(a.fw)})</dt><dd>${pct(c.rate)}%</dd>
      <dt>Discount due on this invoice</dt><dd>${fmt(inv.expected)} kr.</dd>
      <dt>Discount applied</dt><dd>${fmt(inv.got)} kr.</dd>
      <dt>Shortfall</dt><dd class="neg">−${fmt(d.amount)} kr.</dd>
      <dt>Exposure if it repeats for a year</dt><dd class="neg">−${fmt(a.promised)} kr.</dd>
    </dl>
    ${step === 2 ? `<p class="note">Credit note received ${daFull(d.resolvedAt)} and posted against
      invoice ${esc(inv.no)}. The ${fmt(d.amount)} kr. now counts as realised, and the next invoice
      from ${esc(a.agrName)} is checked the same way.</p>` : `
    <div class="artefact">
      <div class="artefact-h">${COPY}<span>Price deviation — ${esc(a.agrName)} account team</span></div>
      <pre>${esc(disputeText(a))}</pre>
      <div class="artefact-f">
        <button class="btn btn-primary btn-sm" type="button" id="copyDisp">${COPY} Copy deviation letter</button>
        <span class="spacer"></span><span class="copied" role="status"></span>
      </div>
    </div>`}
    ${step === 1 ? `<p class="note">Sent ${daFull(d.sentAt)}. Awaiting a credit note of
      ${fmt(d.amount)} kr. and written confirmation that account ${esc(a.acct)} is linked to
      ${esc(a.fw)}. Nothing on the next invoice is trusted until both arrive.</p>` : ''}`;

  $('#dlgFoot').innerHTML =
    step === 0 ? `<button class="btn btn-secondary" type="button" id="dlgLater">Not now</button>
                  <button class="btn btn-danger" type="button" id="dlgSend">Mark deviation as sent</button>`
  : step === 1 ? `<button class="btn btn-secondary" type="button" id="dlgLater">Still waiting</button>
                  <button class="btn btn-primary" type="button" id="dlgRes">Credit note received — resolve</button>`
  :              `<button class="btn btn-primary" type="button" id="dlgLater">Done</button>`;

  const cd = $('#copyDisp');
  if(cd) cd.addEventListener('click', e => copyText(disputeText(a), e.currentTarget));
  $('#dlgLater').addEventListener('click', closeDispute);
  const s = $('#dlgSend'), r = $('#dlgRes');
  if(s) s.addEventListener('click', () => {
    d.state = 'sent'; d.sentAt = new Date(TODAY);
    say(`Deviation letter for invoice ${inv.no} marked as sent to ${a.agrName}.`);
    renderDispute();
  });
  if(r) r.addEventListener('click', () => {
    d.state = 'resolved'; d.resolvedAt = new Date(TODAY);
    inv.credited = true; inv.got = inv.expected;
    say(`Credit note of ${fmt(d.amount)} kr. from ${a.agrName} posted. Realised savings now ${fmt(totals().realised)} kr.`);
    renderDispute(); renderNav();
  });
}

/* ==========================================================================
   VIEW 3 · PROMISED VS REALISED, over time, with leakage broken out
   ========================================================================== */
function monthSeries(n){
  const out = [];
  for(let m = n - 1; m >= 0; m--){
    const d = atMonth(m, 1), key = monthKey(d);
    let realised = 0, leak = 0;
    ACTS.forEach(a => a.invoices.forEach(i => {
      if(monthKey(i.date) !== key) return;
      realised += i.got;
      if(!i.credited) leak += i.expected - i.got;
    }));
    out.push({d, label:DA_S[d.getMonth()], realised, leak, current:key === MKEY_NOW});
  }
  return out;
}

    $('#viewQueue').innerHTML = `

      </table>
    </section>`;
  wireActRows();
  $$('[data-dispute]').forEach(b => b.addEventListener('click', () => openDispute(b.dataset.dispute)));
}

/* ==========================================================================
   VIEW 5 · COMMIT — the step v2 replaced with a toast
   ========================================================================== */
let commitPick = null;
function commitCandidates(){
  const taken = new Set(ACTS.map(a => a.catId));
  if(!P.verified) return [agr('Stark Byggecenter')];
  return CATS.filter(c => !taken.has(c.id)).map(c => AGRS.find(a => a.c === c.id));
}
function renderCommit(){
  const cands = commitCandidates();
  if(!cands.length){
    $('#viewCommit').innerHTML = `
      <header class="hello"><h1>Start an activation</h1>
        <p class="hello-p">Every category with incremental money is already committed. The
          remaining agreements sit in categories an activation covers, so activating them
          would add 0 kr.</p></header>
      <div class="empty"><b>Nothing left worth committing to</b>
        <p>Your effort is better spent on the verification queue than on the catalogue.</p></div>`;
    return;
  }
  if(!commitPick || !cands.some(c => c.n === commitPick)) commitPick = cands[0].n;
  const picked = agr(commitPick), pc = cat(picked.c);
  const nextFirst = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 1);
  const taken = new Set(ACTS.map(a => a.catId));
  const alternates = AGRS.filter(a => taken.has(a.c));

  $('#viewCommit').innerHTML = `
    <header class="hello"><h1>Start an activation</h1>
      <p class="hello-p">Committing sets an effective date and generates the plan: the
        notification to the supplier, the internal prerequisites with owners, and the invoice
        date from which we check the rate. It is not a toast.</p></header>

    <div class="commit">
      <section class="sec" aria-labelledby="pk-h">
        <div class="sec-h"><h2 id="pk-h">What are you committing to?</h2></div>
        <div class="pick">
          ${cands.map(a => { const c = cat(a.c); return `
            <button class="pick-o" type="button" data-pick="${esc(a.n)}"
              aria-pressed="${a.n === commitPick}">
              ${logoHtml(a.n)}
              <span class="pb"><b>${esc(a.n)}</b>
                <span>${esc(c.n)} · ${esc(a.fw)} · ${pct(c.rate)}% on the assortment</span></span>
              <span class="pv"><b>${P.verified ? fmt(c.save) : 'up to ' + fmt(estHi(c.save))}</b>
                <span>kr./year${P.verified ? '' : ' · estimated'}</span></span>
            </button>`; }).join('')}
        </div>
        ${alternates.length ? `<div class="dead"><b>${alternates.length} other agreements are not listed.</b>
          They cover categories an existing activation already discounts
          (${[...taken].map(id => esc(cat(id).n.toLowerCase())).join(', ')}). Committing to a second
          agreement in the same category moves no additional money, so it is not an
          opportunity — it is an alternative supplier, and it belongs in a supplier list, not here.</div>` : ''}
        ${P.verified ? '' : `<div class="dead"><b>Only one agreement can be committed to today.</b>
          The rest need your invoice history to fix a rate and an account number to quote.
          Showing them as opportunities with estimated figures would be a promise we cannot
          verify later.</div>`}
      </section>

      <section class="panel" aria-labelledby="cf-h">
        <div class="panel-h"><h3 id="cf-h">The commitment</h3></div>
        <div class="fgrp"><label class="flabel" for="cEff">Effective date</label>
          <span class="fin"><input id="cEff" type="date" value="${iso(nextFirst)}" min="${iso(TODAY)}"></span>
          <span class="fhint">Day 0 of the plan. Suppliers apply rates from a date, not from a
            click — pick the start of a billing period.</span></div>
        <div class="fgrp"><label class="flabel" for="cAcct">Your account number with ${esc(picked.n)}</label>
          <span class="fin"><input id="cAcct" type="text" value="${P.verified ? '61408-05' : '20551-01'}"
            inputmode="numeric" autocomplete="off"></span>
          <span class="fhint">Quoted in the notification. Without it the supplier cannot link
            the framework agreement to anything.</span></div>
        <div class="fgrp"><label class="flabel" for="cOwner">Who places the orders?</label>
          <span class="fin"><input id="cOwner" type="text" value="${esc(P.orderOwner)}" autocomplete="off"></span>
          <span class="fhint">They get the prerequisite that stops orders going through outside
            the account. This is where most activations quietly fail.</span></div>
        <hr class="hr">
        <dl class="kv">
          <dt>Framework agreement</dt><dd>${esc(picked.fw)}</dd>
          <dt>Rate on the assortment</dt><dd>${pct(pc.rate)}%</dd>
          <dt>Spend in scope</dt><dd>${fmt(pc.spend)} kr./year</dd>
          <dt>Promised, annualised</dt><dd>${P.verified ? fmt(pc.save) : 'up to ' + fmt(estHi(pc.save))} kr.</dd>
          <dt>Customer bonus after this</dt><dd>${fmt(bonusOf(totals().covered + pc.spend))} kr.</dd>
        </dl>
        <button class="btn btn-primary btn-block" type="button" id="cGo">Commit and generate the plan</button>
        <p class="note">You will get a dated plan, a notification to copy, and three
          prerequisites with named owners. Nothing is sent automatically.</p>
      </section>
    </div>`;

  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    commitPick = b.dataset.pick; renderCommit();
  }));
  $('#cGo').addEventListener('click', () => {
    const effVal = $('#cEff').value;
    const parts = effVal ? effVal.split('-').map(Number) : null;
    const eff = parts ? new Date(parts[0], parts[1]-1, parts[2], 9) : new Date(nextFirst);
    const acctVal = $('#cAcct').value.trim() || '00000-00';
    const ownerVal = $('#cOwner').value.trim() || P.orderOwner;
    P.orderOwner = ownerVal;
    const a = makeAct({
      id:`ACT-${TODAY.getFullYear()}-0${seq++}`, agrName:picked.n, catId:picked.c,
      acct:acctVal, committedAt:new Date(TODAY), eff, notifiedAt:null, done:[0,0,0]
    });
    ACTS.push(a);
    say(`${picked.n} committed, effective ${daFull(eff)}. Plan generated — the supplier has not been told yet.`);
    commitPick = null;
    go('detail', a.id);
  });
}

/* ---------- boot ---------- */
applyPersona('bob');
renderErp();
</script>
</body>
</html>
