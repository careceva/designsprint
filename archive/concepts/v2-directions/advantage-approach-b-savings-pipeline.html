<!doctype html>
<!--
  ADVANTAGE V2 — APPROACH B · SAVINGS PIPELINE
  ============================================================================
  THESIS
  Every supplier-agreement opportunity is a deal with a stage, a value and an
  owner, so Advantage should be a pipeline you work rather than a report you
  read. Savings count only once a card reaches Realised and lands on an
  invoice — everything earlier is forecast, shown separately and never blended
  in, because that separation is what makes the number defensible.

  WHO IT IS FOR
  The person whose job this is: the owner or bookkeeper at a 20–60 person Danish
  construction or trades company — Bob Iversen at Nordvik Byg, connected and
  verified; Fanny Kristensen at Kristensen Elektro, brand new and benchmarked.

  THE THREE FEATURES THAT CARRY IT
  1. A real board, not a list with status labels. Categories are swimlanes,
     agreements are cards, position is the status (Identified → Business case →
     Approved → Implementing → Realised). Cards carry value, confidence, effort
     and the one-line reason on their face so triage needs no drilling. Moves
     work by drag, by button and by arrow key.
  2. Implementation as the working surface. Opening a card puts negotiated terms
     on one side and a live task list on the other — owner, due date, hard
     dependencies. Realised is gated on the tasks actually being finished, and a
     card sitting in Implementing past four weeks is flagged STALLED from its
     own stage date. No dashboard ever tells you that.
  3. Realised versus forecast, kept strictly apart. Bob: 376.441 kr. of verified
     discount plus a 60.656 kr. tiered bonus recomputed from covered volume =
     437.097 kr. realised, with the open lanes sitting in a separate forecast
     panel. Fanny's ledger honestly reads 0 kr. realised with her
     320.000–433.000 kr. estimate quarantined in forecast. Realising a card
     visibly moves value from one side to the other and pushes covered volume
     through the bonus tiers.

  VISUAL LANGUAGE
  Deliberately NOT its own. Tokens, shell, login flow and components are taken
  from advantage-v2-visual.html verbatim — the same :root scale, the same dark
  bannerwrap → rounded white .wrap → .appbar → .rail → .canvas → .page shell,
  the same .btn/.chip/.est-chip/.card/.dw-sum components and hairline dividers.
  Approach B differs from the existing product in structure, information design
  and features, not in identity. Everything new here (stage columns, swimlanes,
  drag affordances, task rows, the tier meter) is built from those same tokens.

  DELIBERATELY LEFT OUT
  No charts or trend graphs (a pipeline's shape is the chart). No PDF/export
  flow, no invoice-line viewer, no supplier marketplace, no mobile board
  layout, no multi-user permissions, no negotiation or chat with suppliers, and
  no blended "estimated + realised" headline number anywhere — that omission is
  the point. The Saving assistant is a real rail entry but only triages; it does
  not converse.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Advantage — Savings pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap">
<style>
/* ==========================================================================
   Advantage Design System — tokens taken verbatim from advantage-v2-visual.html
   Semantic tokens only. No raw hex in components.
   ========================================================================== */
:root{
  --general-background:#fafafa;
  --general-foreground:#0f0f0f;
  --general-primary:#1b64dc;
  --general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff;
  --general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2;
  --general-muted-foreground:#707070;
  --general-accent:#ff9b3d;
  --general-accent-foreground:#1c1c1c;
  --general-destructive:#dc2626;
  --general-border:#bdd7ff;
  --general-input:#ffffff;

  --sidebar-border:#e0e0e0;
  /* v2 references --sidebar-foreground without declaring it, which silently drops
     those colour declarations. Declared here so the rail and bell inherit properly. */
  --sidebar-foreground:#1c1c1c;

  --sentiment-positive:#009689;
  --sentiment-negative:#f54a00;

  --surface:#ffffff;
  --brand-midnight:#000a45;
  --brand-ice:#edf5ff;
  --brand-cornflower:#73abff;

  --font-sans:"Rethink Sans","Rethink Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-5xl:48px;

  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;
  --rounded-xl:20px;--rounded-2xl:25px;--rounded-3xl:40px;--rounded-full:9999px;

  --shadow-2xs:0 1px 0 0 #0000000d;
  --shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --shadow-xl:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;

  /* 8pt spacing scale — note there is deliberately no --s5/--s7/--s9/--s10.
     In-between values use the house convention var(--s5,20px). */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;

  --hairline:#ececec;

  --t-fast:.15s ease;
  --t:.28s cubic-bezier(.2,.7,.3,1);
  --t-slow:.5s cubic-bezier(.2,.7,.3,1);

  /* --- pipeline additions, expressed as semantic tokens like the rest --- */
  --stage-realised-bg:#f4fbfa;   /* the terminal column, tinted with the positive hue */
  --stage-drop-bg:var(--brand-ice);
  --risk-bg:#fff2e0;
  --risk-fg:#a35c00;
  --bad-bg:#fdecec;
  --bad-fg:#b91c1c;
  --good-bg:#d9f2ef;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);background:var(--general-background);color:var(--general-foreground);
  font-size:var(--text-base);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:var(--font-sans);font-weight:600;text-wrap:balance}
h1{font-size:var(--text-5xl);letter-spacing:-1.2px;line-height:1.1}
h2{font-size:var(--text-2xl);letter-spacing:-.7px;line-height:1.18}
h3{font-size:var(--text-lg);letter-spacing:-.3px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--general-muted-foreground)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
[tabindex="-1"]:focus-visible{outline:none}
::selection{background:var(--general-secondary)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:44px;padding:0 var(--s6);border:1px solid transparent;cursor:pointer;
  border-radius:var(--rounded-full);font-size:var(--text-sm);font-weight:500;white-space:nowrap;
  transition:background-color var(--t-fast),color var(--t-fast),border-color var(--t-fast),
             box-shadow var(--t-fast),opacity var(--t-fast),transform .1s ease}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn-primary{background:var(--general-primary);color:var(--general-primary-foreground);
  box-shadow:0 1px 2px #1b64dc40,inset 0 1px 0 #ffffff26}
.btn-primary:hover:not([disabled]){background:#1553bb}
.btn-primary[disabled]{background:var(--general-muted);color:#a3a3a3;box-shadow:none}
.btn-secondary{background:var(--surface);border-color:var(--sidebar-border);box-shadow:var(--shadow-xs)}
.btn-secondary:hover:not([disabled]){background:var(--brand-ice);border-color:var(--general-border)}
.btn-secondary[disabled]{background:var(--general-muted);border-color:transparent;color:#8f8f8f;box-shadow:none}
.btn-ghost{background:transparent;color:var(--general-primary);padding:0 var(--s3);height:36px}
.btn-ghost:hover{background:var(--brand-ice)}
.btn-good{background:var(--sentiment-positive);color:#fff;box-shadow:0 1px 2px #00968940,inset 0 1px 0 #ffffff26}
.btn-good:hover:not([disabled]){background:#007a70}
.btn-good[disabled]{background:var(--general-muted);color:#a3a3a3;box-shadow:none}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 var(--s4);font-size:var(--text-xs)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--general-primary);
  font-size:var(--text-sm);font-weight:500;border-radius:var(--rounded-xs)}
.linkbtn:hover{text-decoration:underline}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rounded-full);
  font-size:13px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.chip svg{width:12px;height:12px}
.chip-rec{background:var(--general-primary);color:var(--general-primary-foreground)}
.chip-soft{background:var(--general-muted);color:var(--general-muted-foreground)}
.chip-warn{background:var(--risk-bg);color:var(--risk-fg)}
.chip-good{background:var(--good-bg);color:var(--sentiment-positive)}
.chip-bad{background:var(--bad-bg);color:var(--bad-fg)}
.chip-xs{padding:2px 8px;font-size:12px}
.est-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rounded-full);
  background:var(--general-muted);color:var(--general-muted-foreground);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.est-chip svg{width:11px;height:11px}

/* ==========================================================================
   1 · LOGIN — v2's pattern: centred screen, .login card, .login-persona rows
   ========================================================================== */
.flow{min-height:100vh;display:flex;flex-direction:column}
.stage{flex:1 1 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1 1 auto}
.scr.on{display:flex;flex-direction:column}
.scr.on.mid{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;
  padding:var(--s16) var(--s6)}
.scr.on>*{animation:rise var(--t-slow) both;min-width:0}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-xl);
  padding:var(--s6)}
.login{width:440px;max-width:100%;text-align:center}
.login .mark{height:40px;width:auto;margin:0 auto var(--s8)}
.login h1{font-size:var(--text-5xl);letter-spacing:-2px}
.login .lead{font-size:var(--text-base);color:var(--general-muted-foreground);line-height:1.55;
  margin:var(--s3) auto 0;max-width:36ch;text-align:center}
.login .card{margin-top:var(--s12);padding:var(--s8);text-align:left}
.login-choice{display:flex;flex-direction:column;gap:var(--s3)}
.login-persona{display:flex;align-items:center;gap:var(--s4);width:100%;padding:var(--s4);
  background:var(--general-muted);border:1px solid transparent;border-radius:var(--rounded-md);
  cursor:pointer;text-align:left;transition:background var(--t-fast),border-color var(--t-fast)}
.login-persona:hover,.login-persona:focus-visible{border-color:var(--general-border);background:var(--brand-ice)}
.login-persona-av{flex:0 0 auto;width:40px;height:40px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--surface);color:var(--general-primary);
  font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;
  transition:background var(--t-fast)}
.login-persona:hover .login-persona-av{background:var(--surface)}
.login-persona-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.login-persona-txt b{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.login-persona-txt span{font-size:12px;color:var(--general-muted-foreground);line-height:1.45}
.login-persona-go{flex:0 0 auto;width:16px;height:16px;color:#a3a3a3;transition:color var(--t-fast)}
.login-persona:hover .login-persona-go,.login-persona:focus-visible .login-persona-go{color:var(--general-primary)}
.tinyfoot{margin-top:var(--s6);font-size:var(--text-xs);color:#8f8f8f;text-align:center}

/* ==========================================================================
   2 · APP SHELL — dark bannerwrap, rounded white wrap, appbar, rail, canvas
   ========================================================================== */
body.in-app{background:var(--brand-midnight);overflow:hidden}
body.in-app .flow{display:none}
.app{display:none;flex-direction:column;height:100vh;height:100dvh}
.app.on{display:flex;animation:rise var(--t-slow) both}

.banner{flex:1 1 auto;width:100%;min-width:0;display:flex;align-items:center;gap:var(--s4);
  min-height:46px;padding:var(--s2) calc(var(--s6) + 40px) var(--s2) var(--s6);
  color:#dce6fb;font-size:var(--text-sm)}
.banner b{color:var(--surface);font-weight:600}
.btitle{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;color:var(--surface);font-weight:600}
.btitle svg{width:14px;height:14px;opacity:.65}
.banner .btxt{flex:1 1 auto;min-width:0;text-align:center}
.bcta{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:28px;
  padding:0 var(--s3);border:none;border-radius:var(--rounded-sm);cursor:pointer;
  background:var(--general-primary);color:#fff;font-size:13px;font-weight:600;
  white-space:nowrap;transition:background var(--t-fast)}
.bcta:hover{background:#1553bb}
.bcta svg{width:13px;height:13px}
.bannerwrap{position:relative;display:flex;justify-content:center;flex:0 0 auto}
.bannerwrap .bx{position:absolute;top:50%;right:var(--s6);transform:translateY(-50%);
  width:26px;height:26px;display:grid;place-items:center;background:none;border:none;cursor:pointer;
  border-radius:var(--rounded-full);color:#8fa3d6;transition:var(--t-fast)}
.bannerwrap .bx:hover{background:#ffffff1f;color:var(--surface)}
.bannerwrap .bx svg{width:14px;height:14px}

.wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--rounded-2xl) var(--rounded-2xl) 0 0;overflow:hidden;
  box-shadow:0 -1px 0 #ffffff1a,var(--shadow-xl)}

.appbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s4);height:68px;padding:0 var(--s6);
  border-bottom:1px solid var(--hairline)}
.appbar .brand{display:flex;align-items:center;flex:0 0 auto}
.appbar .brand img{height:28px;width:auto;display:block}
.appbar .spacer{flex:1}
.search{position:relative;display:flex;align-items:center;gap:var(--s2);min-width:0;width:min(460px,42vw);
  height:38px;padding:0 var(--s3);border:1px solid transparent;border-radius:var(--rounded-full);
  background:var(--general-muted);transition:var(--t-fast)}
.search:hover{background:var(--general-muted)}
.search:focus-within{background:var(--surface);border-color:var(--general-primary);box-shadow:0 0 0 3px #1b64dc1f}
.search svg{width:17px;height:17px;color:var(--general-muted-foreground);flex:0 0 auto}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:var(--text-sm)}
.search input::placeholder{color:#8f8f8f}
.search kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 5px;border-radius:var(--rounded-xs);background:var(--surface);border:1px solid var(--sidebar-border);
  box-shadow:var(--shadow-2xs);font-family:var(--font-mono);font-size:13px;color:var(--general-muted-foreground)}

.erp{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s1) 0 var(--s3);
  background:var(--surface);border:1px solid var(--sidebar-border);border-radius:var(--rounded-full);
  box-shadow:var(--shadow-2xs);cursor:pointer;transition:var(--t-fast)}
.erp:hover{border-color:var(--general-border);background:var(--brand-ice)}
.erp .live{position:relative;width:8px;height:8px;flex:0 0 auto;border-radius:var(--rounded-full);
  background:var(--sentiment-positive)}
.erp .live::after{content:"";position:absolute;inset:-4px;border-radius:var(--rounded-full);
  border:1.5px solid var(--sentiment-positive);opacity:.45;animation:pip 2.4s ease-out infinite}
.erp.none .live{background:var(--sentiment-negative)}
.erp.none .live::after{border-color:var(--sentiment-negative)}
.erp.none .et b{color:var(--general-primary)}
@keyframes pip{0%{transform:scale(.6);opacity:.5}70%,100%{transform:scale(1.5);opacity:0}}
.erp .et{display:flex;flex-direction:column;line-height:1.25;padding-right:var(--s2)}
.erp .et b{font-size:var(--text-xs);font-weight:600;white-space:nowrap}
.erp .et span{font-size:13px;color:var(--general-muted-foreground);font-family:var(--font-mono)}
@media(max-width:1080px){.erp .et span{display:none}}

.notif{position:relative;flex:0 0 auto}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;background:none;
  border:none;cursor:pointer;border-radius:var(--rounded-full);color:var(--sidebar-foreground);
  transition:var(--t-fast)}
.bell:hover{background:var(--general-muted)}
.bell.on{background:var(--brand-ice);color:var(--general-primary)}
.bell svg{width:20px;height:20px}
.bell .bdg{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;
  border-radius:var(--rounded-full);background:var(--general-destructive);color:#fff;
  font-size:13px;font-weight:700;line-height:17px;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2px var(--surface)}
.bell .bdg[hidden]{display:none}
.npop{position:absolute;top:calc(100% + 10px);right:0;z-index:35;width:min(420px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  box-shadow:var(--shadow-xl);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:100% 0;
  pointer-events:none;transition:opacity var(--t-fast),transform var(--t-fast)}
.npop.on{opacity:1;transform:none;pointer-events:auto}
.np-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3)}
.np-h b{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.np-h .spacer{flex:1}
.np-h .linkbtn{font-size:var(--text-xs)}
.np-b{max-height:min(440px,60vh);overflow-y:auto;padding-bottom:var(--s2)}
.ngrp+.ngrp{border-top:1px solid var(--hairline);margin-top:var(--s2);padding-top:var(--s2)}
.ngrp .gh{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);
  font-family:var(--font-mono);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.note{display:grid;grid-template-columns:8px 1fr auto;align-items:start;gap:var(--s3);width:100%;
  padding:var(--s3) var(--s4);background:none;border:none;text-align:left;cursor:pointer;
  transition:var(--t-fast)}
.note:hover{background:#fafbfd}
.note .dot{width:8px;height:8px;margin-top:5px;border-radius:var(--rounded-full);background:var(--general-primary)}
.note.read .dot{background:transparent}
.note .nb{min-width:0}
.note .nb b{display:block;font-size:var(--text-sm);font-weight:600;line-height:1.4}
.note .nb span{display:block;margin-top:2px;font-size:13px;color:var(--general-muted-foreground);line-height:1.45}
.note.read .nb b{font-weight:400;color:var(--general-muted-foreground)}
.note .nv{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:600;
  white-space:nowrap;color:var(--sentiment-positive)}
.note .nv.dn{color:var(--sentiment-negative)}
.np-empty{padding:var(--s8) var(--s4);text-align:center;font-size:var(--text-sm);color:var(--general-muted-foreground)}

.userwrap{position:relative;flex:0 0 auto}
.user{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s2);background:none;
  border:none;cursor:pointer;border-radius:var(--rounded-full);transition:var(--t-fast)}
.user:hover{background:var(--general-muted)}
.user .uav{width:30px;height:30px;flex:0 0 auto;border-radius:var(--rounded-full);display:grid;
  place-items:center;color:#fff;font-family:var(--font-sans);font-size:13px;font-weight:600;
  background:linear-gradient(135deg,#2170ed,#0b00ab)}
.user .un{font-size:var(--text-xs);font-weight:600;text-align:left;line-height:1.25;white-space:nowrap}
.user .un span{display:block;font-weight:400;color:var(--general-muted-foreground);white-space:nowrap}
.user .uc{width:14px;height:14px;color:var(--general-muted-foreground)}
@media(max-width:1000px){.user .un{display:none}}
.upop{position:absolute;top:calc(100% + 8px);right:0;z-index:35;width:266px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  box-shadow:var(--shadow-xl);opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast)}
.upop.on{opacity:1;transform:none;pointer-events:auto}
.up-h{padding:var(--s4);border-bottom:1px solid var(--hairline)}
.up-h b{display:block;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.up-h span{display:block;font-size:13px;color:var(--general-muted-foreground);margin-top:1px}
.up-i{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);

.appbody{flex:1 1 auto;min-height:0;display:flex}

.nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0}

.ni.hero{height:auto;padding:var(--s3);margin-bottom:var(--s6);align-items:flex-start;

.ni.hero .hb{display:flex;flex-direction:column;gap:2px;min-width:0}
.ni.hero .hb b{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.ni.hero .hb span{font-size:13px;color:var(--general-muted-foreground);line-height:1.4}
.rail.mini .ni.hero{padding:0;height:44px;align-items:center;justify-content:center;
  border-color:transparent;background:var(--brand-ice)}

.rail.mini .ni::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;

.railtog{display:flex;align-items:center;gap:var(--s3);flex:0 0 auto;height:40px;margin-top:var(--s3);
  padding:0 var(--s3);background:none;border:none;border-top:1px solid var(--hairline);cursor:pointer;

  border-radius:0 0 var(--rounded-md) var(--rounded-md);transition:color var(--t-fast)}

.agent-btn{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);width:100%;

.agent-btn .ab{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.agent-btn .ab b{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.agent-btn .ab span{font-size:13px;color:var(--general-muted-foreground);white-space:nowrap}
.rail.mini .agent-btn{justify-content:center;padding:0;height:44px}
.rail.mini .agent-btn .ab{display:none}
.rail.mini .agent-btn::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;
  transform:translateY(-50%) translateX(-4px);padding:5px 10px;border-radius:var(--rounded-sm);
  background:var(--brand-midnight);color:var(--surface);font-size:var(--text-xs);font-weight:500;
  white-space:nowrap;pointer-events:none;opacity:0;z-index:5;box-shadow:var(--shadow-md);
  transition:opacity var(--t-fast),transform var(--t-fast)}
.rail.mini .agent-btn:hover::after{opacity:1;transform:translateY(-50%)}

.canvas{flex:1 1 auto;min-width:0;overflow:auto;background:var(--surface)}
.page{width:100%;max-width:1200px;margin:0 auto;padding:var(--s12) var(--s8) var(--s16);
  display:flex;flex-direction:column;gap:var(--s8)}
/* the board needs the full width of the canvas, so this variant lifts the cap */
.page.full{max-width:none;padding:var(--s8) var(--s8) var(--s6)}
@media(max-width:760px){.page{padding:var(--s8) var(--s4) var(--s12)}}

/* ==========================================================================
   3 · PAGE HEADER + SUMMARY TILES (built from the same tokens)
   ========================================================================== */
.phead{display:flex;align-items:flex-end;gap:var(--s6);flex-wrap:wrap}
.phead .ptitle{min-width:0;flex:1 1 320px}
.phead h1{font-size:var(--text-4xl);letter-spacing:-1.3px}

  color:var(--general-primary);margin-bottom:var(--s2)}

.tiles{display:flex;gap:var(--s6);flex-wrap:wrap}
.tile{flex:0 0 auto;padding-left:var(--s6);border-left:1px solid var(--hairline);min-width:132px}
.tile:first-child{padding-left:0;border-left:0}

.tile .tv{display:block;margin-top:2px;font-family:var(--font-sans);font-size:var(--text-2xl);
  font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.good .tv{color:var(--sentiment-positive)}
.tile.warn .tv{color:var(--risk-fg)}
.tile.est .tv{color:var(--general-muted-foreground);font-size:var(--text-xl);letter-spacing:-.5px}
.tv.bump{animation:rise var(--t) both}

/* ---------- filter bar ---------- */
.filters{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding-bottom:var(--s4);border-bottom:1px solid var(--hairline)}
.tg{height:36px;padding:0 var(--s4);border:1px solid var(--sidebar-border);border-radius:var(--rounded-full);
  background:var(--surface);cursor:pointer;font-size:var(--text-xs);font-weight:500;
  color:var(--general-muted-foreground);transition:var(--t-fast)}
.tg:hover{background:var(--brand-ice);border-color:var(--general-border)}
.tg[aria-pressed="true"]{background:var(--general-secondary);border-color:var(--general-border);
  color:var(--general-primary);font-weight:600}

.filters .hint{margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:var(--text-xs);color:var(--general-muted-foreground)}
.filters kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 5px;border-radius:var(--rounded-xs);background:var(--general-muted);
  border:1px solid var(--sidebar-border);font-family:var(--font-mono);font-size:12px}

/* ==========================================================================
   4 · THE BOARD — categories are rows, stages are columns
   ========================================================================== */
.boardwrap{border:1px solid var(--hairline);border-radius:var(--rounded-lg);overflow:auto;
  background:var(--surface);max-height:calc(100vh - 340px)}
.board{display:grid;grid-template-columns:224px repeat(5,minmax(228px,1fr));min-width:1364px}
.bh{position:sticky;top:0;z-index:5;background:var(--surface);padding:var(--s3) var(--s4);

  color:var(--general-muted-foreground)}

.bh.terminal{background:var(--stage-realised-bg)}

.lane{position:sticky;left:0;z-index:4;background:var(--surface);
  border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}

  letter-spacing:-.2px;line-height:1.3}
.lane .lm{font-family:var(--font-mono);font-size:13px;color:var(--general-muted-foreground);line-height:1.5}
.lane .trk{width:100%;height:6px;border-radius:var(--rounded-full);background:var(--general-muted);overflow:hidden}
.lane .trk i{display:block;height:100%;border-radius:var(--rounded-full);background:var(--sentiment-positive)}
.lane .ls{font-size:var(--text-xs);font-weight:600;color:var(--sentiment-positive);line-height:1.4}
.lane .ls.open{color:var(--general-muted-foreground);font-weight:500}
.lane.setup{background:var(--brand-ice)}
.conflict{margin-top:var(--s1);padding:var(--s2) var(--s3);border-radius:var(--rounded-sm);
  background:var(--bad-bg);font-size:12px;line-height:1.45;color:var(--bad-fg)}
.conflict b{font-weight:700}
.conflict .linkbtn{display:block;margin-top:var(--s1);font-size:12px;color:var(--bad-fg);
  text-decoration:underline;font-weight:600}

.cell{border-bottom:1px solid var(--hairline);border-right:1px solid var(--hairline);
  padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-height:96px;
  transition:background var(--t-fast)}
.cell.terminal{background:var(--stage-realised-bg)}
.cell.drop{background:var(--stage-drop-bg);box-shadow:inset 0 0 0 2px var(--general-primary)}
.cell .void{font-family:var(--font-mono);font-size:13px;color:#c9c9c9}

/* the card face: everything triage needs, nothing more */
.pcard{position:relative;display:flex;flex-direction:column;gap:var(--s2);cursor:grab;
  padding:var(--s3);border:1px solid var(--hairline);border-radius:var(--rounded-md);
  background:var(--surface);box-shadow:var(--shadow-2xs);
  transition:box-shadow var(--t-fast),transform var(--t-fast),border-color var(--t-fast)}

.pcard.done{background:var(--surface);border-color:#cfe9e5}

.pcard.alarm{border-color:#f3caca;box-shadow:inset 3px 0 0 var(--general-destructive),var(--shadow-2xs)}
.pcard.flash{animation:rise var(--t) both}
.pc-top{display:flex;gap:var(--s2);align-items:flex-start}

  place-items:center;overflow:hidden;box-shadow:0 1px 3px #00000018}

.pc-name{flex:1 1 auto;min-width:0;font-family:var(--font-sans);font-size:var(--text-sm);

  letter-spacing:0}
.pc-val.est{color:var(--general-foreground)}
.pc-val.protect{color:var(--risk-fg);font-size:var(--text-lg)}
.pc-why{font-size:13px;line-height:1.5;color:var(--general-muted-foreground);text-wrap:pretty}
.pc-chips{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.eff{display:flex;gap:3px;align-items:center;margin-left:auto}
.eff i{width:5px;height:5px;border-radius:var(--rounded-full);background:var(--sidebar-border)}
.eff i.on{background:var(--general-muted-foreground)}
.pc-foot{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s1);
  padding-top:var(--s2);border-top:1px solid var(--hairline)}
.mv{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border:none;cursor:pointer;
  border-radius:var(--rounded-full);background:var(--general-muted);color:var(--general-primary);
  transition:var(--t-fast)}

  color:var(--general-muted-foreground);white-space:nowrap}
.pc-foot .btn-ghost{height:28px;font-size:var(--text-xs);font-weight:600}

/* ==========================================================================
   5 · CARD DETAIL — a full canvas page, like v2's opportunity detail
   ========================================================================== */
.detail{display:flex;flex-direction:column;gap:var(--s6);width:100%}
.back{align-self:flex-start}
.back svg{width:16px;height:16px}
.dhero{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s6);
  flex-wrap:wrap;padding-bottom:var(--s6);border-bottom:1px solid var(--hairline)}
.dhero .dh-l{display:flex;gap:var(--s4);align-items:flex-start;min-width:0;flex:1 1 380px}
.dhero .logo{width:52px;height:52px;border-radius:var(--rounded-md)}
.dhero h1{font-size:var(--text-3xl);letter-spacing:-.9px}
.dhero .dh-sub{margin-top:var(--s1);font-size:var(--text-sm);color:var(--general-muted-foreground)}

  color:var(--sentiment-positive);white-space:nowrap;font-variant-numeric:tabular-nums}
.dhero .dh-v small{font-size:var(--text-base);font-weight:500;color:var(--general-muted-foreground)}
.dhero .dh-v.est{color:var(--general-foreground)}

/* stage stepper — position is the status, so this is the primary control */
.stepper{display:flex;flex-wrap:wrap;gap:var(--s2)}

  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  border:1px solid var(--sidebar-border);border-radius:var(--rounded-md);background:var(--surface);
  font-size:var(--text-xs);font-weight:600;color:var(--general-muted-foreground);
  transition:var(--t-fast)}
.stepper button em{font-style:normal;font-family:var(--font-mono);font-size:11px;font-weight:500;
  color:var(--general-muted-foreground)}
.stepper button:hover:not([disabled]){border-color:var(--general-border);background:var(--brand-ice)}
.stepper button.past{background:var(--good-bg);border-color:#c2e6e0;color:var(--sentiment-positive)}

.stepper button[aria-current="true"]{background:var(--general-primary);border-color:var(--general-primary);
  color:#fff;box-shadow:0 1px 2px #1b64dc40}

.dcols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8)}

.sec h4{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;margin-bottom:var(--s4)}
.kv{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;

.msg{margin-top:var(--s4);padding:var(--s4);border-radius:var(--rounded-md);

/* task list — the working surface */
.tprog{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}

  transition:width var(--t)}

  color:var(--general-muted-foreground)}
.tasks{list-style:none}
.tk{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--hairline);align-items:flex-start}

.cb{width:20px;height:20px;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;cursor:pointer;
  border:1.5px solid var(--sidebar-border);border-radius:var(--rounded-xs);background:var(--general-input);
  transition:var(--t-fast)}
.cb:hover:not([disabled]){border-color:var(--general-primary)}
.cb[aria-checked="true"]{background:var(--sentiment-positive);border-color:var(--sentiment-positive);color:#fff}
.cb[aria-disabled="true"]{background:var(--general-muted);cursor:not-allowed}
.cb svg{width:12px;height:12px}
.tk .tt{font-size:var(--text-sm);line-height:1.45}

.tk .tm{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:3px;font-size:12px;
  color:var(--general-muted-foreground)}

<script>
'use strict';
/* ========================================================================== *
 *  ADVANTAGE — SAVINGS PIPELINE
 *  Accounting rules, applied everywhere, never bent:
 *   R1  A lane (category) can have at most ONE Realised card. Agreements inside
 *       a lane are alternative routes to the SAME spend, not additive.
 *   R2  REALISED = sum of category saving for lanes with a Realised card, plus
 *       the bonus on covered volume. Nothing else counts. Ever.
 *   R3  Bonus = tiered function of covered volume, where covered volume = sum
 *       of category spend for lanes with a Realised card. Recomputed, never
 *       stored.
 *   R4  FORECAST = per lane WITHOUT a Realised card, the value of the
 *       furthest-advanced card, counted once. Displayed on its own side of the
 *       ledger, dashed, and never added to realised.
 * ========================================================================== */

/* ---------- format ---------- */
const kr = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toString()
  .replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const krs = n => kr(n) + ' kr.';
const r1k = n => kr(Math.round(n / 1000) * 1000);
const DAY = 86400000;
const NOW = Date.now();
const ago = d => new Date(NOW - d * DAY);
const dk = t => t.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
const weeksSince = ts => Math.floor((NOW - ts) / (7 * DAY));

/* ---------- constants ---------- */
const AGREEMENTS_TOTAL = 24, INVOICES_YEAR = 1284, PEERS = 148;
const BAND = 0.15;            // peer estimate band, ±15%
const SHARP_BAND = 0.025;     // after own invoices are read, ±2,5%
const STALL_WEEKS = 4;

const CATS = [
  { id:'mat',  name:'Building materials',        spend:2132300, rate:9,  saving:191907, suppliers:18, invoices:424 },
  { id:'tool', name:'Tools & workwear',          spend:664800,  rate:11, saving:73128,  suppliers:11, invoices:178 },
  { id:'fuel', name:'Fuel & transport',          spend:530700,  rate:8,  saving:42456,  suppliers:5,  invoices:223 },
  { id:'off',  name:'Office supplies',           spend:205000,  rate:19, saving:38950,  suppliers:5,  invoices:62  },
  { id:'rent', name:'Machine & equipment rental',spend:500000,  rate:6,  saving:30000 },
  { id:'frg',  name:'Freight & delivery',        spend:328800,  rate:8,  saving:26304 },
  { id:'tel',  name:'Telecom & IT',              spend:290400,  rate:5,  saving:14520 },
  { id:'site', name:'Site services & waste',     spend:168000,  rate:4,  saving:6720  }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const TOTAL_SPEND = CATS.reduce((s, c) => s + c.spend, 0);      // 4.820.000
const TOTAL_SAVING = CATS.reduce((s, c) => s + c.saving, 0);    // 423.985
/* Peers realise a median 88,8% of the theoretical lane total. Anchored so that
   Fanny's midpoint lands exactly on Bob's verified 376.441. */
const CAPTURE = 376441 / TOTAL_SAVING;
/* …and the matching share of spend that ends up routed through agreements:
   4.032.800 of 4.820.000. Used only to forecast the bonus, never to book it. */
const VOL_CAPTURE = 4032800 / TOTAL_SPEND;

const STAGES = [
  { id:'identified',   label:'Identified',    short:'Found in your invoices' },
  { id:'case',         label:'Business case', short:'Numbers written up' },
  { id:'approved',     label:'Approved',      short:'Decision made' },
  { id:'implementing', label:'Implementing',  short:'Tasks in flight' },
  { id:'realised',     label:'Realised',      short:'Confirmed on an invoice' }
];
const SI = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));

const LOGOS = {
  stark:      { src:'assets/company-logos/stark.jpeg', bg:'#f48222' },
  hilti:      { src:'assets/company-logos/hilti.png',  bg:'#d2091e' },
  lyreco:     { src:'assets/company-logos/lyreco.png', bg:'#2e2e88' },
  ahlsell:    { src:'assets/company-logos/ahlsell.png', bg:'#ffffff' },
  q8:         { src:'assets/company-logos/q8.png',      bg:'#ffffff' },
  bygma:      { src:'assets/company-logos/bygma-logo-png_seeklogo-381076.png', bg:'#ffffff' }
};

/* ---------- tiered bonus (R3) — computed, never hardcoded ---------- */
const TIERS = [
  { upto:1000000, pct:1.0 },
  { upto:3000000, pct:1.5 },
  { upto:Infinity, pct:2.0 }
];
function bonusBreak(volume) {
  let low = 0, out = [], total = 0;
  for (const t of TIERS) {
    const hi = Math.min(volume, t.upto);
    if (hi > low) {
      const amt = (hi - low) * t.pct / 100;
      out.push({ from: low, to: hi, pct: t.pct, amt });
      total += amt;
    }
    low = t.upto;
    if (volume <= t.upto) break;
  }
  return { rows: out, total: Math.round(total) };
}
const bonusOf = v => bonusBreak(v).total;
const tierIndexOf = v => TIERS.findIndex(t => v <= t.upto);

/* ---------- task helper ---------- */
let TID = 0;
const T = (text, owner, dueDays, done, dep) =>
  ({ id: 't' + (++TID), text, owner, due: NOW + dueDays * DAY, done: !!done, dep: dep || null });

/* generic implementation tasks — the same five beats every activation has */
function stdTasks(sup, cat, doneCount) {
  const list = [
    T('Sign the framework addendum with ' + sup, 'Bob Iversen', -6, false),
    T('Notify ' + sup + ' of the Advantage customer number', 'Advantage rådgiver', -2, false),
    T('Update the supplier account code in Visma.net', 'Mette Holm · bogholder', 3, false),
    T('Route open purchase orders to the new terms', 'Bob Iversen', 7, false),
    T('Confirm the negotiated rate on the first ' + cat.name.toLowerCase() + ' invoice', 'Mette Holm · bogholder', 16, false)
  ];
  for (let i = 1; i < list.length; i++) list[i].dep = list[i - 1].id;
  for (let i = 0; i < (doneCount || 0); i++) list[i].done = true;
  return list;
}

/* ---------- card factory ---------- */
function C(o) {
  return Object.assign({
    alt: false, protect: 0, flagRisk: null, delta: null, kind: 'agreement',
    effort: 2, tasks: []
  }, o, { since: NOW - (o.sinceDays || 0) * DAY });
}

    total += cat.saving;
    rows.push({ cat, lead });
  }
  return { total, rows };

const cardValue = c => c.kind === 'onboarding' ? 0 : (c.protect ? 0 : CAT[c.cat].saving);

const taskBlocked = (c, t) => {
  if (!t.dep) return false;

/* ======================== announcements ================================ */
function say(msg) { document.getElementById('live').textContent = msg; }
function toast(msg, kind, action) {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  const s = document.createElement('span'); s.textContent = msg; el.appendChild(s);
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'linkbtn'; b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.run(); });
    el.appendChild(b);
  }
  wrap.appendChild(el);
  setTimeout(() => el.remove(), action ? 12000 : 5200);
  say(msg);
}

/* ======================== stage moves ================================== */
/** Returns {ok, reason, replace} — the honest gate on Realised. */
function canEnter(c, stageId) {
  if (c.kind === 'onboarding' && stageId === 'realised') {
    const t = taskCount(c);
    if (t.done < t.all) return { ok:false, reason:'Upload not finished — ' + (t.all - t.done) + ' step(s) left. Open the card.' };
    return { ok:true };
  }
  if (stageId !== 'realised') return { ok:true };
  const t = taskCount(c);
  if (!t.all) return { ok:false, reason:'No implementation plan yet. Move it through Implementing first.' };
  if (t.done < t.all) return { ok:false, reason:(t.all - t.done) + ' of ' + t.all + ' implementation tasks remain. Realised means confirmed on an invoice.' };
  const cur = realisedIn(c.cat);
  if (cur && cur.id !== c.id) return { ok:false, replace:cur, reason:CAT[c.cat].name + ' is already realised via ' + cur.sup + '. Agreements in one lane are alternative routes, not extra savings.' };
  return { ok:true };
}

function setStage(id, stageId, opts) {
  const c = byId(id);
  if (!c || c.stage === stageId) return;
  const gate = canEnter(c, stageId);
  if (!gate.ok) {
    if (!gate.replace) { toast(gate.reason, 'bad'); return; }
    /* A lane conflict is the one refusal the user can override, because
       replacing the route is a legitimate decision — but only explicitly. */
    if (!(opts && opts.replace)) {
      toast(gate.reason, 'bad', { label:'Replace ' + gate.replace.sup, run:() => setStage(id, stageId, { replace:true }) });
      return;
    }
  }
  /* An implementation plan is written the moment a card reaches Business case —
     which is exactly what makes "Approved" mean something and what the Realised
     gate later measures against. Doing it here rather than in the seed data means
     it holds for every card, including the alternative routes. */
  if (c.kind === 'agreement' && !c.tasks.length && SI[stageId] >= SI.case) {
    c.tasks = stdTasks(c.sup, CAT[c.cat], 0);
  }
  if (stageId === 'realised' && c.kind === 'agreement') {
    const cur = realisedIn(c.cat);
    if (cur && cur.id !== c.id) {
      cur.stage = 'identified'; cur.since = NOW; cur.alt = true; cur.replaced = true;
      cur.atRisk = 0; cur.flagRisk = null;
      cur.why = 'Replaced by ' + c.sup + ' on ' + dk(new Date()) + '. Kept on the board as a route you can come back to.';
      if (c.protect) { c.protect = 0; c.why = 'Route switched in time. The 18.400 kr. that Stark\'s price raise would have taken is protected.'; }
    }
  }
  const before = realisedSaving(), beforeTier = tierIndexOf(coveredVolume());
  c.stage = stageId; c.since = NOW; c.flash = true;
  const after = realisedSaving(), afterTier = tierIndexOf(coveredVolume());

  render();
  if (c.kind === 'onboarding' && stageId === 'realised') { sharpen(); return; }
  if (after > before) {
    state.bumped = true;
    toast('Realised: ' + c.sup + '. ' + krs(after - before) + ' moved from forecast to realised — bonus recomputed on ' + krs(coveredVolume()) + ' of covered volume.', 'good');
    if (afterTier > beforeTier) {
      setTimeout(() => toast('Bonus tier crossed — covered volume passed ' + krs(TIERS[beforeTier].upto) + '. Volume above it now earns ' + String(TIERS[afterTier].pct).replace('.', ',') + '%.', 'good'), 700);
    }
  } else if (after < before) {
    state.bumped = true;
    toast(c.sup + ' moved out of Realised. ' + krs(before - after) + ' went back to forecast — realised-only accounting cuts both ways.', 'bad');
  } else {
    say(c.sup + ' moved to ' + STAGES[SI[stageId]].label + ' in ' + (c.cat === 'setup' ? 'Getting started' : CAT[c.cat].name) + '.');
  }
}
function nudge(id, dir) {
  const c = byId(id); if (!c) return;
  const i = SI[c.stage] + dir;
  if (i < 0 || i > 4) return;
  setStage(id, STAGES[i].id);
}

/* ---- Fanny's upload lands: estimates sharpen ---- */
function sharpen() {
  state.sharpened = true;
  for (const c of state.cards) {
    if (c.kind !== 'agreement') continue;
    c.sharp = true;
    const cat = CAT[c.cat];
    c.why = 'Verified from your own invoices: ' + kr(cat.spend) + ' kr. of spend in ' +
      cat.name.toLowerCase() + ', ' + cat.rate + '% above the frame rate.' +
      (cat.invoices ? ' ' + cat.invoices + ' invoices, ' + cat.suppliers + ' suppliers.' : '');
  }
  render();
  toast('Invoices read. ' + kr(INVOICES_YEAR) + ' invoices, ' + krs(TOTAL_SPEND) + ' of spend. Estimates sharpened from ±' + krs(Math.round(376441 * BAND)) + ' to ±' + krs(Math.round(376441 * SHARP_BAND)) + '.', 'good');
  setTimeout(() => toast('Realised still reads 0 kr. — precision is not a saving. It only sharpened the forecast. Move a card to Realised to change the left-hand number.'), 900);
}

/* ---- conflict resolution ---- */
function resolveConflict(cid, keepId) {
  const losers = laneCards(cid).filter(c => c.kind === 'agreement' && c.id !== keepId &&
    (c.stage === 'approved' || c.stage === 'implementing'));
  losers.forEach(c => {
    c.stage = 'case'; c.since = NOW; c.alt = true;
    c.why = 'Sent back to Business case — ' + byId(keepId).sup + ' is the chosen route for this lane.';
  });
  render();
  toast('One route per lane. ' + byId(keepId).sup + ' keeps ' + CAT[cid].name + '; ' + losers.map(c => c.sup).join(', ') + ' back to Business case.');
}

/* ======================== task toggling ================================ */
function toggleTask(cardId, taskId) {
  const c = byId(cardId); const t = c.tasks.find(x => x.id === taskId);
  if (!t) return;
  if (!t.done && taskBlocked(c, t)) {
    toast('Blocked by “' + c.tasks.find(x => x.id === t.dep).text + '”. Do that one first.', 'bad');
    return;
  }
  if (t.done) {
    const dependents = c.tasks.filter(x => x.dep === t.id && x.done);
    if (dependents.length) {
      toast('Cannot un-tick — “' + dependents[0].text + '” depends on it and is already done.', 'bad');
      return;
    }
  }
  t.done = !t.done;
  if (c.stage === 'implementing' || c.stage === 'approved') c.since = c.since; // stage age unaffected by task work — that is what makes stalling visible
  render();
  const n = taskCount(c);
  say((t.done ? 'Done: ' : 'Reopened: ') + t.text + '. ' + n.done + ' of ' + n.all + ' complete.');
  if (t.done && n.done === n.all) {
    if (c.kind === 'onboarding') toast('Upload complete. Ready to move to Realised.', 'good');
    else toast('All ' + n.all + ' tasks done — ' + c.sup + ' can now be moved to Realised.', 'good');
  }
}

function passesFilter(c) {

    const hay = (c.sup + ' ' + (c.cat === 'setup' ? 'getting started' : CAT[c.cat].name) + ' ' + c.why).toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  if (state.fFlag && !needsAttention(c)) return false;
  if (state.fAlt && c.alt) return false;
  if (state.fVer && isEst(c)) return false;
  return true;
}

function cardHTML(c) {
  const t = taskCount(c);
  const i = SI[c.stage];
  const cls = ['pcard'];
  if (c.stage === 'realised') cls.push('done');
  if (c.alt) cls.push('alt');
  if (stalled(c) || c.flagRisk) cls.push('alarm');
  if (c.flash) cls.push('flash');
  const money = c.kind === 'onboarding' ? '47.000 kr. of precision'
    : (isEst(c) ? 'up to ' : '') + krs(c.protect || cardValue(c)) + ' per year';
  return '<article class="' + cls.join(' ') + '" tabindex="0" draggable="true" data-card="' + c.id + '"' +
    ' data-fkey="card:' + c.id + '" aria-label="' + esc(c.sup + ' — ' + STAGES[i].label + '. ' + money + '.' +
      (stalled(c) ? ' Stalled ' + weeksSince(c.since) + ' weeks.' : '')) + '">' +
    '<div class="pc-top">' + logoTile(c) + '<span class="pc-name">' + esc(c.sup) + '</span></div>' +
    valueHTML(c) +
    '<p class="pc-why">' + esc(c.why) + '</p>' +
    '<div class="pc-chips">' + chips(c) + effDots(c.effort) + '</div>' +
    '<div class="pc-foot">' +
      '<button class="mv" type="button" data-mv="-1" data-id="' + c.id + '"' + (i === 0 ? ' disabled' : '') +
        ' aria-label="Move ' + esc(c.sup) + ' back to ' + (i > 0 ? STAGES[i - 1].label : '') + '">' + CHEV_L + '</button>' +
      '<button class="mv" type="button" data-mv="1" data-id="' + c.id + '"' + (i === 4 ? ' disabled' : '') +
        ' aria-label="Move ' + esc(c.sup) + ' forward to ' + (i < 4 ? STAGES[i + 1].label : '') + '">' + CHEV_R + '</button>' +
      '<span class="tk">' + (t.all ? t.done + '/' + t.all + ' tasks' : 'no plan') + '</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-open="' + c.id + '">Open</button>' +
    '</div></article>';
}

function boardHTML() {
  const cards = state.cards.filter(passesFilter);
  const lanes = [];
  if (state.cards.some(c => c.cat === 'setup')) lanes.push({ id:'setup', name:'Getting started', setup:true });
  CATS.forEach(c => lanes.push(c));

  let h = '<div class="boardwrap"><div class="board" role="grid" aria-label="Savings pipeline board">' +
    '<div class="bh corner" role="columnheader"><div class="bt"><b>Category</b></div>' +
    '<div class="bs">' + krs(TOTAL_SPEND) + ' annual spend</div></div>';
  STAGES.forEach((s, i) => {
    const n = cards.filter(c => c.stage === s.id).length;
    const sum = i === 4 ? realisedSaving()
      : CATS.filter(cat => !realisedIn(cat.id) && laneCards(cat.id).some(c => c.stage === s.id))
            .reduce((a, cat) => a + cat.saving, 0);
    h += '<div class="bh' + (i === 4 ? ' terminal' : '') + '" role="columnheader">' +
      '<div class="bt"><b>' + s.label + '</b><em>' + n + '</em></div>' +
      '<div class="bs">' + (i === 4 ? krs(sum) + ' counted' : (sum ? krs(sum) + ' lane value' : s.short)) + '</div></div>';
  });

  lanes.forEach(lane => {
    const isSetup = !!lane.setup;
    const cat = isSetup ? null : CAT[lane.id];
    const rl = isSetup ? null : realisedIn(lane.id);
    h += '<div class="lane' + (isSetup ? ' setup' : '') + '" role="rowheader"><h3>' + esc(lane.name) + '</h3>';
    if (isSetup) {
      h += '<div class="lm">no spend of its own</div>' +
        '<div class="ls open">Onboarding is the first win, not a gate before the product</div>';
    } else {
      h += '<div class="lm">' + kr(cat.spend) + ' kr. · ' + cat.rate + '% gap<br>' +
        (cat.invoices ? cat.invoices + ' inv. · ' + cat.suppliers + ' suppl.' : 'not itemised yet') + '</div>' +
        '<div class="trk" role="img" aria-label="' + (rl ? 100 : 0) + '% of this lane realised"><i style="width:' + (rl ? 100 : 0) + '%"></i></div>' +
        (rl ? '<div class="ls">Realised ' + krs(cat.saving) + ' via ' + esc(rl.sup) + '</div>'
            : '<div class="ls open">Open · ' + (P().verified || state.sharpened ? '' : 'up to ') + krs(cat.saving) + '</div>');
      if (conflictLane(lane.id)) {
        const rivals = laneCards(lane.id).filter(c => c.kind === 'agreement' && (c.stage === 'approved' || c.stage === 'implementing'));
        h += '<div class="conflict"><b>Two routes in play.</b> Alternative routes to the same ' + kr(cat.spend) + ' kr. — only one can be realised.' +
          rivals.map(c => '<button class="linkbtn" type="button" data-keep="' + c.id + '" data-lane="' + lane.id + '">Keep ' + esc(c.sup) + '</button>').join('') +
          '</div>';
      }
    }
    h += '</div>';
    STAGES.forEach((s, i) => {
      const inCell = cards.filter(c => c.cat === lane.id && c.stage === s.id);
      h += '<div class="cell' + (i === 4 ? ' terminal' : '') + '" role="gridcell"' +
        ' data-drop-stage="' + s.id + '" data-drop-lane="' + lane.id + '"' +
        ' aria-label="' + esc(lane.name) + ' — ' + s.label + ', ' + inCell.length + ' card(s)">' +
        (inCell.map(cardHTML).join('') || '<span class="void">·</span>') + '</div>';
    });
  });
  return h + '</div></div>';
}

/* ==========================================================================
   CARD DETAIL — terms on one side, the live task list on the other
   ========================================================================== */
function detailHTML() {
  const c = byId(state.open);
  if (!c) return '';
  const cat = c.cat === 'setup' ? null : CAT[c.cat];
  const i = SI[c.stage];
  const tc = taskCount(c);
  const gate = canEnter(c, 'realised');
  const bonusNow = bonusOf(coveredVolume());
  const bonusAfter = cat ? bonusOf(coveredVolume() + (realisedIn(c.cat) ? 0 : cat.spend)) : bonusNow;
  const kv = (a, b, cls) => '<div class="kv"><dt>' + a + '</dt><dd class="' + (cls || '') + '">' + b + '</dd></div>';

  let h = '<div class="detail">' +
    '<button class="btn btn-ghost back" type="button" data-back>' + CHEV_L + ' Back to the pipeline</button>' +
    '<div class="dhero"><div class="dh-l">' + logoTile(c) +
      '<div><h1 tabindex="-1" id="dtitle">' + esc(c.sup) + '</h1>' +
      '<div class="dh-sub">' + (cat
        ? esc(cat.name) + ' · ' + kr(cat.spend) + ' kr. of annual spend · ' + cat.rate + '% above the frame rate'
        : 'Getting started · onboarding, priced like any other card') + '</div>' +
      '<div class="dh-chips">' + chips(c) + '</div></div></div>' +
      '<div class="dh-fig"><span class="dh-l2">' + (c.stage === 'realised' ? 'Realised' : 'Forecast, not counted') + '</span>' +
      valueHTML(c, true) + '</div></div>';

  /* stage stepper — position is the status */
  h += '<div class="stepper" role="group" aria-label="Stage">' + STAGES.map((s, k) => {
    const cur = k === i;
    return '<button type="button" class="' + (cur ? '' : (k < i ? 'past' : '')) + '" data-stage="' + s.id + '"' +
      (cur ? ' aria-current="true"' : '') + '><span>' + s.label + '</span><em>' +
      (cur ? 'since ' + dk(new Date(c.since)) : (k < i ? 'done' : s.short)) + '</em></button>';
  }).join('') + '</div>';

  h += '<div class="dcols"><section class="sec"><h4>Negotiated terms</h4><dl>';
  h += kv('Discount', esc(c.terms.disc));
  h += kv('Tier', esc(c.terms.tier));
  h += kv('Timeline', esc(c.terms.lead));
  if (cat) {
    h += kv('Your spend in this lane', kr(cat.spend) + ' kr.');
    h += kv('Gap to the frame rate', cat.rate + '%');
    h += kv(isEst(c) ? 'Estimated saving' : 'Saving on the invoice', (isEst(c) ? 'up to ' : '') + krs(cat.saving), 'pos');
    h += kv('Bonus volume it routes', kr(cat.spend) + ' kr.');
    h += kv('Bonus effect if realised', realisedIn(c.cat) && realisedIn(c.cat).id === c.id
      ? 'already counted' : '+' + krs(bonusAfter - bonusNow), 'pos');
    h += kv('Evidence', cat.invoices ? cat.invoices + ' invoices · ' + cat.suppliers + ' suppliers'
      : (isEst(c) ? PEERS + ' peer companies' : 'ledger totals, not itemised'));
  } else {
    h += kv('Precision today', '±' + krs(Math.round(376441 * BAND)));
    h += kv('Precision after upload', '±' + krs(Math.round(376441 * SHARP_BAND)));
    h += kv('Uncertainty removed', krs(47000), 'pos');
  }
  h += '</dl><div class="msg"><b>Nothing changes operationally.</b> Same supplier, same delivery, same people on site — only the price on the invoice changes. That is why this lane can be realised without running a project.</div>';
  if (c.protect) h += '<div class="msg warn"><b>This is a protect, not a gain.</b> It keeps ' + krs(c.protect) +
    ' that Stark\'s 4% raise would otherwise take out of an already-realised lane. Realising it replaces Stark and the lane total stays at ' + krs(CAT[c.cat].saving) + ' — the honest reading.</div>';
  if (c.delta != null) h += '<div class="msg warn"><b>Delta against the realised route: ' + (c.delta > 0 ? '+' : '') + krs(c.delta) +
    '.</b> Worth 42.500 kr. against Q8\'s verified 42.456 kr. Not counted until it is confirmed on an invoice, and not worth the switching effort.</div>';
  if (c.flagRisk) h += '<div class="msg bad"><b>' + esc(c.flagRisk) + '.</b> The new list price from 1 Oct takes ' + krs(c.atRisk) +
    ' out of this lane. Still counted — the invoices to date are real — but the route needs a decision.</div>';
  if (c.replaced) h += '<div class="msg"><b>Replaced route.</b> Left on the board because switching back is a decision you may want later.</div>';
  h += '</section>';

  /* --- implementation --- */
  h += '<section class="sec"><h4>Implementation</h4>';
  if (!c.tasks.length) {
    h += '<div class="msg">No plan yet. A plan is written when the card reaches <b>Business case</b> — that is what makes Approved mean something.</div>';
  } else {
    h += '<div class="tprog"><div class="trk"><i style="width:' + (tc.all ? tc.done / tc.all * 100 : 0) + '%"></i></div><em>' +
      tc.done + '/' + tc.all + '</em></div>';
    if (stalled(c)) h += '<div class="msg bad"><b>Stalled ' + weeksSince(c.since) + ' weeks.</b> In Implementing since ' +
      dk(new Date(c.since)) + ' with ' + (tc.all - tc.done) + ' task(s) open. Ticking a task does not reset the stage clock — that is deliberate, and it is the only reason you can see this.</div>';
    h += '<ul class="tasks">';
    c.tasks.forEach(t => {
      const blocked = taskBlocked(c, t);
      const dep = t.dep ? c.tasks.find(x => x.id === t.dep) : null;
      const late = !t.done && t.due < NOW;
      h += '<li class="tk' + (t.done ? ' on' : '') + (blocked ? ' blocked' : '') + '">' +
        '<button class="cb" type="button" role="checkbox" aria-checked="' + t.done + '"' +
        (blocked ? ' aria-disabled="true"' : '') + ' data-task="' + t.id + '" data-fkey="task:' + t.id + '"' +
        ' aria-label="' + esc(t.text + (blocked ? ' — blocked by ' + dep.text : '')) + '">' +
        (t.done ? TICK : '') + '</button>' +
        '<div><div class="tt">' + esc(t.text) + '</div><div class="tm">' +
        '<span class="own">' + esc(t.owner) + '</span>' +
        '<span class="due' + (late ? ' late' : '') + '">' + (t.done ? 'done' : (late ? 'overdue ' : 'due ') + dk(new Date(t.due))) + '</span>' +
        (blocked ? '<span class="dep">blocked by “' + esc(dep.text) + '”</span>' : '') +
        '</div></div></li>';
    });
    h += '</ul>';
  }
  h += '</section></div>';

  const canR = gate.ok && c.stage !== 'realised';
  h += '<div class="dcta">' +
    '<button class="btn btn-secondary btn-sm" type="button" data-nudge="-1"' + (i === 0 ? ' disabled' : '') + '>' +
      CHEV_L + (i > 0 ? STAGES[i - 1].label : 'Back') + '</button>' +
    '<button class="btn btn-secondary btn-sm" type="button" data-nudge="1"' + (i === 4 ? ' disabled' : '') + '>' +
      (i < 4 ? STAGES[i + 1].label : 'Realised') + CHEV_R + '</button>' +
    '<span class="say">' + (c.stage === 'realised'
      ? (c.kind === 'onboarding'
        ? 'Upload landed and the forecast is sharpened — but precision is not a saving, so realised counts 0 kr. from this card.'
        : 'Counted as realised since ' + dk(new Date(c.since)) + '.')
      : gate.ok ? 'Everything needed is done. Moving to Realised will move value out of forecast.'
      : esc(gate.reason)) + '</span>' +
    (c.stage !== 'realised'
      ? '<button class="btn ' + (canR ? 'btn-good' : 'btn-primary') + ' btn-sm" type="button" data-stage="realised"' +
        (canR ? '' : ' disabled') + '>' + (c.kind === 'onboarding' ? 'Finish upload' : 'Mark realised') + '</button>'
      : '') +
    '</div></div>';
  return h;
}

/* ==========================================================================
   REALISED & FORECAST
   ========================================================================== */
function ledgerHTML() {
  const ver = P().verified || state.sharpened;
  const realised = realisedSaving();
  const vol = coveredVolume();
  const bb = bonusBreak(vol);
  const total = realised + bb.total;
  const fc = openLaneLead();
  const rows = realisedLanes().map(cat => ({ cat, c: realisedIn(cat.id) }))
    .sort((a, b) => b.cat.saving - a.cat.saving);
  const maxVol = 5000000, pctOf = v => Math.min(100, v / maxVol * 100);
  const raw = fc.total;
  const mid = Math.round(raw * CAPTURE);
  const band = state.sharpened ? SHARP_BAND : BAND;
  const lo = r1k(mid * (1 - band)), hi = r1k(mid * (1 + band));
  const openSpend = CATS.filter(c => !realisedIn(c.id)).reduce((s, c) => s + c.spend, 0);
  const bonusFc = bonusOf(vol + openSpend * VOL_CAPTURE);

  let h = '<div class="split"><div><div class="panel">' +
    '<h4>Realised · counted</h4>' +
    '<div class="big' + (total ? '' : ' zero') + (state.bumped ? ' bump' : '') + '">' + kr(total) + ' <small>kr./år</small></div>' +
    '<p class="sumline">' + (total
      ? '<b>' + kr(realised) + ' kr.</b> discount confirmed on invoices + <b>' + kr(bb.total) +
        ' kr.</b> customer bonus on routed volume. ' + rows.length + ' of ' + CATS.length + ' lanes live.'
      : 'Nothing has reached Realised, so the honest figure is <b>0 kr.</b> Your forecast is on the right, and it stays there until a card lands on an invoice.') + '</p>';

  h += '<h4 style="margin-top:var(--s8)">Discount realised · ' + krs(realised) + '</h4><div class="rows">';
  if (!rows.length) h += '<div class="r none">No lane has reached Realised. Move a card into the last column and both this list and the number above change.</div>';
  rows.forEach(({ cat, c }) => {
    h += '<div class="r">' + logoTile(c) +
      '<span><b>' + esc(cat.name) + '</b><span class="sub">' + esc(c.sup) + ' · ' + cat.rate + '% on ' + kr(cat.spend) + ' kr.</span></span>' +
      '<span class="d">' + dk(new Date(c.since)) + '</span><span class="a">' + krs(cat.saving) + '</span></div>';
  });
  h += '</div>';

  h += '<h4 style="margin-top:var(--s8)">Customer bonus · ' + krs(bb.total) + '</h4>' +
    '<p class="sumline">Paid annually on volume routed through realised agreements. Covered volume today: <b>' + krs(vol) + '</b> of ' + krs(TOTAL_SPEND) + '.</p>' +
    '<div class="meter" role="img" aria-label="Covered volume ' + krs(vol) + ' against the bonus tiers">' +
      '<i style="width:' + pctOf(vol) + '%"></i><s style="left:' + pctOf(1000000) + '%"></s><s style="left:' + pctOf(3000000) + '%"></s></div>' +
    '<div class="ticks"><span style="left:' + pctOf(1000000) + '%">1,0 mio → 1,5%</span>' +
      '<span style="left:' + pctOf(3000000) + '%">3,0 mio → 2,0%</span>' +
      '<span style="left:99%;transform:translateX(-100%)">5,0 mio</span></div><div class="rows">';
  if (!bb.rows.length) h += '<div class="r none">No covered volume, so no bonus. The tiers start earning at the first realised lane.</div>';
  bb.rows.forEach(r => {
    h += '<div class="r"><span class="d">' + String(r.pct).replace('.', ',') + '%</span>' +
      '<span>' + kr(r.from) + ' – ' + kr(r.to) + ' kr. of covered volume</span><span></span>' +
      '<span class="a">' + krs(r.amt) + '</span></div>';
  });
  h += '</div><div class="audit"><code>' + kr(realised) + ' discount + ' + kr(bb.total) + ' bonus = ' + kr(total) +
    ' kr. realised</code>. Covered volume ' + kr(vol) + ' + off-agreement ' + kr(TOTAL_SPEND - vol) + ' = ' + kr(TOTAL_SPEND) +
    ' kr. total spend. Realised ' + kr(realised) + ' + forecast ' + kr(raw) + ' = ' + kr(TOTAL_SAVING) +
    ' kr. of identified discount — the two never overlap and never double-count.</div></div></div>';

  /* ---- forecast, quarantined ---- */
  h += '<div><div class="panel dashed"><h4>' + DASH + ' Forecast · not counted</h4>' +
    '<div class="big neutral">' + (ver ? kr(raw) : kr(lo) + ' – ' + kr(hi)) + ' <small>kr./år</small></div>' +
    '<p class="sumline">' + (ver
      ? 'Open pipeline value: ' + fc.rows.length + ' lane(s) with no realised route, counted once per lane from the furthest-advanced card. Verified from your own invoices, but not yet on an invoice at the new price — so it sits here, not on the left.'
      : 'Estimated from ' + PEERS + ' peer companies matched on sector, company size and location — industry data plus AI web research, <b>not your invoices</b>. The lane estimates sum to ' + krs(raw) +
        '; peers realise a median ' + (CAPTURE * 100).toFixed(1).replace('.', ',') + '% of that, giving a midpoint of ' + krs(mid) + ' and a ±' + Math.round(band * 100) + '% band.') +
    '</p><div class="rows">';
  fc.rows.forEach(({ cat, lead }) => {
    h += '<div class="r">' + logoTile(lead) +
      '<span><b>' + esc(cat.name) + '</b><span class="sub">' + esc(lead.sup) + ' · ' + STAGES[SI[lead.stage]].label + '</span></span>' +
      '<span></span><span class="a n">' + (ver ? '' : 'up to ') + krs(cat.saving) + '</span></div>';
  });
  if (!ver) {
    h += '<div class="r"><span class="d">bonus</span><span>Customer bonus at the peer capture rate</span><span></span>' +
      '<span class="a n">' + r1k(bonusFc * (1 - band)) + ' – ' + r1k(bonusFc * (1 + band)) + ' kr.</span></div>' +
      '<div class="r"><span class="d">spend</span><span>Estimated annual spend</span><span></span>' +
      '<span class="a n">' + r1k(TOTAL_SPEND * (1 - band)) + ' – ' + r1k(TOTAL_SPEND * (1 + band)) + ' kr.</span></div>';
  }
  h += '</div></div>';

  if (atRiskTotal()) {
    h += '<div class="panel risk"><h4 style="color:var(--bad-fg)">' + WARN + ' At risk</h4>' +
      '<div class="big bad">' + kr(atRiskTotal()) + ' <small style="color:var(--bad-fg)">kr.</small></div>' +
      '<p class="sumline" style="color:var(--bad-fg)">Realised, but a supplier moved. Stark Byggecenter raises list prices 4% on 1 Oct, which takes 18.400 kr. out of the materials lane unless the route changes. Still counted on the left — the invoices to date are real — but it falls if nothing is done.</p></div>';
  }
  const st = state.cards.filter(stalled);
  if (st.length) {
    h += '<div class="panel"><h4>Stalled implementation</h4>' + st.map(c =>
      '<p class="sumline" style="margin-top:0"><b>' + esc(c.sup) + '</b> has sat in Implementing for ' + weeksSince(c.since) +
      ' weeks (' + taskCount(c).done + ' of ' + taskCount(c).all + ' tasks done). ' + krs(CAT[c.cat].saving) +
      ' is waiting on ' + (taskCount(c).all - taskCount(c).done) + ' task(s). ' +
      '<button class="rowbtn" type="button" data-open="' + c.id + '">Open the card</button></p>').join('') + '</div>';
  }
  h += '<div class="panel"><h4>How this page counts</h4><p class="sumline" style="margin-top:0">' +
    'One realised route per category — agreements in a lane are alternatives to the same spend, never additive. Discount is the category gap applied to the category spend. Bonus is recomputed from covered volume every time a card is realised, so crossing 1,0 or 3,0 mio. kr. changes the rate on the volume above it. Forecast is counted once per open lane, from its furthest-advanced card. Nothing estimated is ever added to realised. Nothing is counted twice.</p></div>';
  return h + '</div></div>';
}
