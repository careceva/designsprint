      '<td class="rt amt' + (c.stage === 'realised' ? ' pos' : '') + '">' +
      (c.kind === 'onboarding' ? '47.000 precision' : (isEst(c) ? 'up to ' : '') + kr(c.protect || cardValue(c))) + '</td>' +
      '<td><span class="chip ' + (c.stage === 'realised' ? 'chip-good' : 'chip-soft') + ' chip-xs">' + STAGES[SI[c.stage]].label + '</span></td>' +
      '<td class="rt amt">' + (t.all ? t.done + '/' + t.all : '—') + '</td>' +
      '<td>' + (chips(c).replace(/<span class="chip chip-good chip-xs">[\s\S]*?<\/span>/, '') || '—') + '</td>' +
      '<td class="rt"><button class="rowbtn" type="button" data-open="' + c.id + '">Open</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function activityHTML() {
  let h = '<ul class="feed">';
  EVENTS[state.p].forEach(e => {
    h += '<li class="ev ' + (e.k || '') + '">' +
      (e.amt != null ? '<span class="ea">' + (e.amt > 0 ? '+' : '') + krs(e.amt) + '</span>' : '') +
      '<div class="et2">' + esc(e.t) + '</div>' +
      '<div class="em2">' + esc(e.m) + ' · ' + dk(ago(e.d)) + '</div></li>';
  });
  return h + '</ul>';
}

/* ==========================================================================
   PAGE CHROME
   ========================================================================== */
const VIEW_META = {
  pipeline: { nav:'pipeline', title:'Savings pipeline',
    lede:'Categories are the swimlanes, agreements are the cards, and the column a card sits in <b>is</b> its status. Move a card with the arrows, the arrow keys or by dragging it along its own lane. Nothing counts as a saving until it reaches Realised.' },
  ledger: { nav:'ledger', title:'Realised &amp; forecast',
    lede:'Two numbers, never one. <b>Realised</b> counts only cards that reached the last column. <b>Forecast</b> is everything still in flight. They stay on separate sides of this page and are never added together — that separation is what makes the realised figure something you can put in front of a finance director.' },
  categories: { nav:'categories', title:'Categories',
    lede:'The eight lanes of the board, as a ledger. Agreements inside one category are <b>alternative routes to the same spend</b>, so only one of them can ever be realised at a time.' },
  agreements: { nav:'agreements', title:'Agreements',
    lede:'All ' + AGREEMENTS_TOTAL + ' framework agreements as a flat list, ordered by how far each one has travelled. Same filters as the board.' },
  activity: { nav:'discover', title:'Weekly discovery',
    lede:'Everything that moved the pipeline, newest first. Amounts are the effect at the moment it happened.' },
  card: { nav:'pipeline', title:'', lede:'' }
};

function tilesHTML() {
  const realised = realisedSaving(), bonus = bonusOf(coveredVolume());
  const fc = openLaneLead();
  const est = !P().verified && !state.sharpened;
  const mid = Math.round(fc.total * CAPTURE);
  const flagged = state.cards.filter(needsAttention).length;
  const tiles = [
    { k:'good', l:'Realised discount', v: krs(realised) },
    { k:'good', l:'Bonus on ' + krs(coveredVolume()), v: krs(bonus) },
    { k:'est',  l:(est ? 'Forecast' : 'Open pipeline') + ' · not counted',
      v: est ? r1k(mid * (1 - BAND)) + '–' + r1k(mid * (1 + BAND)) + ' kr.' : krs(fc.total) },
    { k: flagged ? 'warn' : 'est', l:'Needs attention', v: String(flagged) }
  ];
  return '<div class="tiles">' + tiles.map(t =>
    '<div class="tile ' + t.k + '"><span class="tl">' + t.l + '</span>' +
    '<span class="tv' + (state.bumped && t.k === 'good' ? ' bump' : '') + '">' + t.v + '</span></div>').join('') + '</div>';
}

function filtersHTML() {
  const flagged = state.cards.filter(needsAttention).length;
  return '<div class="filters">' +
    '<button class="tg alarm" type="button" data-f="fFlag" aria-pressed="' + state.fFlag + '">Needs attention · ' + flagged + '</button>' +
    '<button class="tg" type="button" data-f="fAlt" aria-pressed="' + state.fAlt + '">Hide alternative routes</button>' +
    '<button class="tg" type="button" data-f="fVer" aria-pressed="' + state.fVer + '">Verified only</button>' +
    (state.q ? '<button class="tg" type="button" data-clearq aria-pressed="true">“' + esc(state.q) + '” ✕</button>' : '') +
    '<span class="hint">Card focused: <kbd>←</kbd><kbd>→</kbd> move stage · <kbd>↵</kbd> open · dragging works too</span></div>';
}

const NAV = [
  { id:'discover', view:'activity', n:'Weekly discovery', hero:true,
    icon:'<path d="M12 3l2.1 4.7 4.9.6-3.6 3.4.9 5-4.3-2.5-4.3 2.5.9-5L5 8.3l4.9-.6L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' },
  { id:'pipeline', view:'pipeline', n:'Pipeline',
    icon:'<rect x="3" y="3" width="7" height="9" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="5" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="12" width="7" height="9" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="16" width="7" height="5" rx="1.6" stroke="currentColor" stroke-width="1.7"/>' },
  { id:'ledger', view:'ledger', n:'Realised & forecast',
    icon:'<rect x="4" y="3" width="16" height="18" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h8M8 12h8M8 16h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' },
  { id:'categories', view:'categories', n:'Categories',
    icon:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.8" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8" stroke="currentColor" stroke-width="1.7"/>' },
  { id:'agreements', view:'agreements', n:'Agreements',
    icon:'<path d="M13 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9l-6-6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 3v6h6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 16c1.5-2.5 2.5-2.5 3 0s1.5 1 3-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' }
];

function renderNav() {
  const here = (VIEW_META[state.view] || VIEW_META.pipeline).nav;
  const flagged = state.cards.filter(needsAttention).length;
  const moved = EVENTS[state.p].filter(e => e.d <= 16).length;
  $('#nav').innerHTML = NAV.map(i => {
    const on = i.id === here ? ' on' : '';
    if (i.hero) return '<button class="ni hero' + on + '" type="button" data-nav="' + i.id + '" data-tip="' + i.n + '">' +
      '<span class="nic"><svg viewBox="0 0 24 24" fill="none">' + i.icon + '</svg></span>' +
      '<span class="hb"><b>' + i.n + '</b><span>' + moved + ' findings in the last two weeks</span></span></button>';
    const badge = i.id === 'agreements' && flagged ? '<span class="nb">' + flagged + '</span>' : '';
    return '<button class="ni' + on + '" type="button" data-nav="' + i.id + '" data-tip="' + i.n + '">' +
      '<span class="nic"><svg viewBox="0 0 24 24" fill="none">' + i.icon + '</svg></span>' +
      '<span class="nt">' + i.n + '</span>' + badge + '</button>';
  }).join('');
  $('#agentSub').textContent = flagged ? flagged + ' cards need you today' : 'Nothing needs you today';
}

function renderAppbar() {
  const p = P();
  $('#userAv').textContent = p.init;
  $('#userName').textContent = p.name;
  $('#userCo').textContent = p.co;
  $('#erpPill').className = 'erp' + (p.verified ? '' : ' none');
  $('#erpPill').innerHTML = '<span class="live"></span><span class="et">' +
    (p.verified
      ? '<b>Visma.net connected</b><span>' + kr(INVOICES_YEAR) + ' invoices / year</span>'
      : '<b>Connect Visma.net</b><span>' + PEERS + ' peers benchmarked</span>') + '</span>';

  const other = Object.values(PERSONAS).filter(x => x.key !== state.p);
  $('#userPop').innerHTML =
    '<div class="up-h"><b>' + esc(p.name) + '</b><span>' + esc(p.co) + '</span></div>' +
    '<button class="up-i" type="button" data-signout>' +
      '<svg viewBox="0 0 24 24" fill="none"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 8l-4 4 4 4M6 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      'Sign out</button>' +
    '<div class="up-sep"><span>Demo as</span></div>' +
    other.map(x => '<button class="up-i" type="button" data-persona="' + x.key + '">' +
      '<span class="up-persona-av">' + x.init + '</span>' +
      '<span class="up-persona-txt"><b>' + esc(x.name) + '</b><span>' + esc(x.short) + '</span></span></button>').join('') +
    '<p class="up-f">Progress is kept per browser tab.</p>';

  /* notifications, straight off the activity feed */
  const evs = EVENTS[state.p];
  const unread = evs.filter((e, i) => !readNotes.has(state.p + ':' + i));
  const badge = $('#bellBadge');
  badge.textContent = String(unread.length);
  badge.hidden = unread.length === 0;
  const groups = [
    { h:'This week', items: evs.map((e, i) => ({ e, i })).filter(x => x.e.d <= 16) },
    { h:'Earlier',   items: evs.map((e, i) => ({ e, i })).filter(x => x.e.d > 16) }
  ].filter(g => g.items.length);
  $('#npBody').innerHTML = groups.length ? groups.map(g =>
    '<div class="ngrp"><div class="gh">' + g.h + '</div>' + g.items.map(({ e, i }) =>
      '<button class="note' + (readNotes.has(state.p + ':' + i) ? ' read' : '') + '" type="button" data-note="' + i + '">' +
      '<span class="dot"></span><span class="nb"><b>' + esc(e.t) + '</b><span>' + esc(e.m) + '</span></span>' +
      (e.amt != null ? '<span class="nv' + (e.amt < 0 ? ' dn' : '') + '">' + (e.amt > 0 ? '+' : '') + krs(e.amt) + '</span>' : '<span></span>') +
      '</button>').join('') + '</div>').join('') : '<div class="np-empty">Nothing yet.</div>';
}

function renderBanner() {
  if (bannerDismissed) { $('#bannerwrap').style.display = 'none'; return; }
  $('#bannerwrap').style.display = '';
  if (P().verified) {
    $('#bannerTitle').textContent = 'Needs a decision';
    $('#bannerTxt').innerHTML = '<b>Stark Byggecenter raised prices 4%</b> — 18.400 kr. of your realised materials discount falls away on 1 Oct unless the route changes.';
    $('#bannerGoTxt').textContent = 'Open the Bygma card';
    bannerTarget = 'b-bygma';
  } else {
    $('#bannerTitle').textContent = 'Estimated data';
    $('#bannerTxt').innerHTML = 'Every figure here is benchmarked from <b>' + PEERS + ' peer companies</b>, not your invoices. Your first pipeline card fixes that.';
    $('#bannerGoTxt').textContent = 'Open the upload card';
    bannerTarget = 'f-upload';
  }
}

/* ==========================================================================
   RENDER
   ========================================================================== */
let bannerDismissed = false, bannerTarget = null;
const readNotes = new Set();

function render() {
  renderAppbar(); renderNav(); renderBanner();
  const meta = VIEW_META[state.view] || VIEW_META.pipeline;
  const canvas = $('#canvas');
  const fkey = document.activeElement && document.activeElement.closest
    ? (document.activeElement.getAttribute('data-fkey') ||
       (document.activeElement.closest('[data-fkey]') ? document.activeElement.closest('[data-fkey]').getAttribute('data-fkey') : null))
    : null;

  let body;
  if (state.view === 'card') body = detailHTML();
  else if (state.view === 'pipeline') body = tilesHTML() + filtersHTML() + boardHTML();
  else if (state.view === 'ledger') body = ledgerHTML();
  else if (state.view === 'categories') body = tilesHTML() + categoriesHTML();
  else if (state.view === 'agreements') body = filtersHTML() + agreementsHTML();
  else body = activityHTML();

  const head = state.view === 'card' ? '' :
    '<header class="phead"><div class="ptitle"><div class="eyebrow"><i></i>' + esc(P().co) + '</div>' +
    '<h1>' + meta.title + '</h1><p>' + meta.lede + '</p></div></header>';

  canvas.innerHTML = '<div class="page' + (state.view === 'pipeline' ? ' full' : '') + '">' + head + body + '</div>';

  state.cards.forEach(c => { c.flash = false; });
  setTimeout(() => { state.bumped = false; }, 700);
  if (fkey) { const el = canvas.querySelector('[data-fkey="' + fkey + '"]'); if (el) el.focus({ preventScroll:true }); }
}

function openCard(id) {
  lastCardFocus = id;
  state.open = id; state.view = 'card';
  render();
  const h = $('#dtitle'); if (h) h.focus();
  $('#canvas').scrollTop = 0;
}
function closeCard() {
  state.open = null; state.view = 'pipeline';
  render();
  const el = lastCardFocus && $('[data-fkey="card:' + lastCardFocus + '"]');
  if (el) el.focus({ preventScroll:true });
}
let lastCardFocus = null;

/* ==========================================================================
   EVENTS
   ========================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) { closePops(); return; }
  const d = t.dataset;
  if (d.persona)  { closePops(); switchPersona(d.persona); return; }
  if ('signout' in d) { closePops(); signOut(); return; }
  if (d.login)    { loginAs(d.login); return; }
  if (d.nav)      { const n = NAV.find(x => x.id === d.nav); state.open = null; state.view = n.view; render(); return; }
  if (d.open)     { openCard(d.open); return; }
  if ('back' in d){ closeCard(); return; }
  if (d.mv)       { nudge(d.id, +d.mv); return; }
  if (d.keep)     { resolveConflict(d.lane, d.keep); return; }
  if (d.nudge && state.open) { nudge(state.open, +d.nudge); return; }
  if (d.stage && state.open) { setStage(state.open, d.stage); return; }
  if (d.task && state.open)  { toggleTask(state.open, d.task); return; }
  if (d.f)        { state[d.f] = !state[d.f]; render(); return; }
  if ('clearq' in d) { state.q = ''; $('#appSearch').value = ''; render(); return; }
  if (t.id === 'erpPill') {
    closePops();
    if (P().verified) toast('Visma.net sync is live — ' + kr(INVOICES_YEAR) + ' invoices read across ' + krs(TOTAL_SPEND) + ' of spend. Every figure on the board comes from them.');
    else if (byId('f-upload')) openCard('f-upload');
    return;
  }
  if (t.id === 'bellBtn')  { togglePop('bell'); return; }
  if (t.id === 'userBtn')  { togglePop('user'); return; }
  if (t.id === 'npAll')    { EVENTS[state.p].forEach((e, i) => readNotes.add(state.p + ':' + i)); renderAppbar(); return; }
  if (d.note !== undefined) { readNotes.add(state.p + ':' + d.note); renderAppbar(); return; }
  if (t.id === 'bannerX')  { bannerDismissed = true; renderBanner(); return; }
  if (t.id === 'bannerGo') { closePops(); if (bannerTarget && byId(bannerTarget)) openCard(bannerTarget); return; }
  if (t.id === 'railTog')  {
    const r = $('#rail'); const mini = r.classList.toggle('mini');
    t.setAttribute('aria-expanded', String(!mini));
    t.setAttribute('aria-label', mini ? 'Expand navigation' : 'Collapse navigation');
    return;
  }
  if (t.id === 'agentBtn') {
    const flagged = state.cards.filter(needsAttention);
    state.open = null; state.view = 'pipeline'; state.fFlag = flagged.length > 0; render();
    toast(flagged.length
      ? 'Saving assistant: ' + flagged.length + ' cards need you — ' + flagged.map(c => c.sup).join(', ') + '. Board filtered.'
      : 'Saving assistant: nothing needs you today.');
    return;
  }
  closePops();
});

function togglePop(which) {
  const bell = $('#npop'), user = $('#userPop');
  const bOn = which === 'bell' && !bell.classList.contains('on');
  const uOn = which === 'user' && !user.classList.contains('on');
  bell.classList.toggle('on', bOn); $('#bellBtn').classList.toggle('on', bOn);
  $('#bellBtn').setAttribute('aria-expanded', String(bOn));
  user.classList.toggle('on', uOn); $('#userBtn').setAttribute('aria-expanded', String(uOn));
}
function closePops() {
  $('#npop').classList.remove('on'); $('#bellBtn').classList.remove('on');
  $('#bellBtn').setAttribute('aria-expanded', 'false');
  $('#userPop').classList.remove('on'); $('#userBtn').setAttribute('aria-expanded', 'false');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#npop').classList.contains('on') || $('#userPop').classList.contains('on')) { closePops(); return; }
    if (state.view === 'card') { closeCard(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#appSearch').focus(); return; }
  const card = e.target.closest && e.target.closest('.pcard');
  if (!card || e.target.tagName === 'BUTTON') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); nudge(card.dataset.card, 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(card.dataset.card, -1); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(card.dataset.card); }
});

$('#appSearch').addEventListener('input', e => {
  state.q = e.target.value.trim();
  if (state.view !== 'pipeline' && state.view !== 'agreements') { state.open = null; state.view = 'pipeline'; }
  render();
});

/* drag — one of three ways to move a card, never the only one */
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.pcard'); if (!c) return;
  dragId = c.dataset.card; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragend', e => {
  const c = e.target.closest && e.target.closest('.pcard'); if (c) c.classList.remove('dragging');
  $$('.cell.drop').forEach(x => x.classList.remove('drop'));
  dragId = null;
});
document.addEventListener('dragover', e => {
  const cell = e.target.closest && e.target.closest('.cell'); if (!cell || !dragId) return;
  const c = byId(dragId);
  if (!c || cell.dataset.dropLane !== c.cat) return;   /* a card belongs to its category lane */
  e.preventDefault();
  $$('.cell.drop').forEach(x => x.classList.remove('drop'));
  cell.classList.add('drop');
});
document.addEventListener('drop', e => {
  const cell = e.target.closest && e.target.closest('.cell'); if (!cell || !dragId) return;
  e.preventDefault();
  const id = dragId; dragId = null; cell.classList.remove('drop');
  setStage(id, cell.dataset.dropStage);
});

/* ==========================================================================
   LOGIN — v2's pattern: .login-persona rows → loginAs → enterApp
   ========================================================================== */
function renderLogin() {
  $('#loginChoice').innerHTML = Object.values(PERSONAS).map(p =>
    '<button class="login-persona" type="button" data-login="' + p.key + '">' +
    '<span class="login-persona-av">' + p.init + '</span>' +
    '<span class="login-persona-txt"><b>' + esc(p.name) + '</b><span>' + esc(p.co) + ' · ' + esc(p.short) + '</span></span>' +
    '<svg class="login-persona-go" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</button>').join('');
}
function loginAs(key) { applyPersona(key); enterApp(); }
function applyPersona(key) {
  boot(key);
  bannerDismissed = false;
  readNotes.clear();
  const s = $('#appSearch'); if (s) s.value = '';
}
function enterApp() {
  document.body.classList.add('in-app');
  $('#app').classList.add('on');
  render();
  say('Signed in as ' + P().name + ', ' + P().co + '. ' + realisedLanes().length + ' lanes realised, ' +
      state.cards.filter(c => c.stage !== 'realised').length + ' open opportunities, ' +
      state.cards.filter(needsAttention).length + ' needing attention.');
}
function switchPersona(key) {
  applyPersona(key); render();
  toast('Now viewing ' + P().name + ' · ' + P().co + '. ' + (P().verified
    ? 'Verified figures from ' + kr(INVOICES_YEAR) + ' invoices.'
    : 'Everything estimated from ' + PEERS + ' peers — 0 kr. realised.'));
}
function signOut() {
  document.body.classList.remove('in-app');
  $('#app').classList.remove('on');
  renderLogin();
  say('Signed out.');
}

/* ======================== self-check =================================== */
(function selfCheck() {
  const s = CATS.reduce((a, c) => a + c.saving, 0);
  const cover = ['mat','tool','fuel','off','rent'].reduce((a, id) => a + CAT[id].spend, 0);
  const rs = ['mat','tool','fuel','off','rent'].reduce((a, id) => a + CAT[id].saving, 0);
  const b = bonusOf(cover);
  console.assert(TOTAL_SPEND === 4820000, 'spend', TOTAL_SPEND);
  console.assert(s === 423985, 'total saving', s);
  console.assert(cover === 4032800 && TOTAL_SPEND - cover === 787200, 'coverage split');
  console.assert(rs === 376441 && s - rs === 47544, 'realised/remaining split');
  console.assert(b === 60656, 'bonus', b);
  console.assert(rs + b === 437097, 'total realised');
  console.assert(seedBob().length === AGREEMENTS_TOTAL, 'agreement count', seedBob().length);
  console.assert(seedBob().filter(c => c.stage === 'realised').length === 5, 'realised count');
  console.assert(Math.round(423985 * CAPTURE) === 376441, 'capture anchor');
  console.assert(bonusOf(TOTAL_SPEND * VOL_CAPTURE) === 60656, 'bonus forecast anchor');
  console.assert(r1k(376441 * BAND * -1 + 376441) === '320.000' && r1k(376441 * (1 + BAND)) === '433.000', 'Fanny saving band');
  console.assert(r1k(60656 * (1 - BAND)) === '52.000' && r1k(60656 * (1 + BAND)) === '70.000', 'Fanny bonus band');
  console.assert(r1k(TOTAL_SPEND * (1 - BAND)) === '4.097.000', 'Fanny spend band');
})();

/* entry point is the login screen, not the board */
boot('bob');
renderLogin();
