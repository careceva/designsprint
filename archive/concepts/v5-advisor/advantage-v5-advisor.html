<!doctype html>
<!--
  ADVANTAGE v5 — "THE ADVISOR"

  THESIS
  Advantage is not a dashboard our customers come to analyse; it is an advisor that
  tells a busy builder the one thing to do next, in words a high-schooler reads in five
  seconds, and always offers to do it for him — by assistant or by a human specialist.

  WHO IT'S FOR
  Danish SMB owners and office managers in construction and the trades (Bob, accounting
  connected and verified; Fanny, brand new and estimated) for whom purchasing is not the
  main business and never will be.

  THE THREE DECISIONS THAT CARRY IT
  1. A sticky left column that is decisions only — one recommendation at a time, with
     "Do it", "Not now", and the two hand-offs. The right side is detail that scrolls.
     Nothing on the left is a number you have to interpret.
  2. One hero figure, one colour. The saving is the largest thing on the page and the
     only coloured figure; it counts up when you accept something, so the product's
     value visibly grows from your own action.
  3. Agreements are the product, so they are photographic tiles with supplier artwork
     and two states in plain words — "In use" and "Ready to use" — never "activated".

  WHAT I CUT FROM v2
  The five-destination rail (now three), the greeting paragraph, the four-tile situation
  strip, the donut and its legend and table fallback, the benchmark comparison cards,
  the data centre, the welcome modal, the notification centre, the activity rail, the
  search field, methodology copy, and every "up to". Roughly 90% of the prose.

  STRONGEST ARGUMENT AGAINST
  Deciding for the customer is a bet on our ranking being right. A single recommendation
  hides the whole opportunity, so a customer whose priorities differ from our score has
  to dig for the thing he actually wanted, and the advisor's confidence can read as a
  sales funnel rather than help. v2's menu never risked that.
-->

/* ==========================================================================

:root{

  --font-body:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-5xl:48px;

  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;

  --shadow-2xs:0 1px 0 0 #0000000d;

  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;

}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--font-body);background:var(--surface);color:var(--general-foreground);

h2{font-size:var(--text-2xl);letter-spacing:-.7px;line-height:1.18}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:44px;padding:0 var(--s6);border:1px solid transparent;cursor:pointer;
  border-radius:var(--rounded-full);font-size:var(--text-sm);font-weight:500;white-space:nowrap;
  transition:background-color var(--t-fast),color var(--t-fast),border-color var(--t-fast),

.btn:active:not([disabled]){transform:translateY(1px)}

/* ---------- body: rail + advisor + canvas ---------- */
.appbody{flex:1 1 auto;min-height:0;display:flex}

  border-right:1px solid var(--hairline);transition:width var(--t)}

  color:var(--sidebar-foreground);font-size:var(--text-sm);font-weight:500;text-align:left;
  transition:background-color var(--t-fast),color var(--t-fast)}
.ni:hover{background:var(--general-muted)}

/* ==========================================================================
   THE ADVISOR COLUMN — decisions only, its own scroll region so it never moves
   ========================================================================== */
.advisor{flex:0 0 auto;width:var(--advisor-w);overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--hairline);background:linear-gradient(180deg,#f7faff,#ffffff 320px);
  padding:var(--s8) var(--s6) var(--s12);display:flex;flex-direction:column;gap:var(--s6)}

.rec-done .ic{flex:0 0 auto;width:36px;height:36px;border-radius:var(--rounded-full);
  background:#d9f2ef;color:var(--sentiment-positive);display:grid;place-items:center}
.rec-done .ic svg{width:20px;height:20px}
.rec-done b{font-family:var(--font-sans);font-size:var(--text-lg);letter-spacing:-.3px}
.rec-done p{margin-top:2px;font-size:var(--text-sm);line-height:1.5;color:#3d5a5a}

/* the two hand-offs — the advisor role made concrete */
.hand{display:flex;flex-direction:column;gap:var(--s2)}
.hand-t{font-size:var(--text-xs);color:var(--general-muted-foreground);margin-bottom:var(--s1)}
.handoff{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  cursor:pointer;text-align:left;box-shadow:var(--shadow-xs);transition:var(--t-fast)}
.handoff:hover{border-color:var(--general-border);background:var(--brand-ice)}
.handoff .hic{flex:0 0 auto;width:34px;height:34px;border-radius:var(--rounded-full);display:grid;
  place-items:center;background:var(--brand-ice);color:var(--general-primary)}
.handoff .hic svg{width:18px;height:18px}
.handoff .hic img{width:20px;height:20px}
.handoff .hic.face{background:linear-gradient(135deg,#2170ed,#0b00ab);color:#fff;
  font-family:var(--font-sans);font-size:12px;font-weight:600}
.handoff .htx{flex:1 1 auto;min-width:0}
.handoff .htx b{display:block;font-size:var(--text-sm);font-weight:600}
.handoff .htx span{display:block;font-size:12px;color:var(--general-muted-foreground)}
.handoff .hgo{flex:0 0 auto;width:15px;height:15px;color:#a3a3a3}
.handoff:hover .hgo{color:var(--general-primary)}
.booked{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border-radius:var(--rounded-lg);background:#d9f2ef;color:#00635a;font-size:var(--text-xs);
  font-weight:600}
.booked svg{width:15px;height:15px;flex:0 0 auto}
.booked .spacer{flex:1}
.booked .linkbtn{color:#00635a;font-size:12px}
.putoff{font-size:var(--text-xs);color:var(--general-muted-foreground);
  padding-top:var(--s4);border-top:1px solid var(--hairline)}
.putoff .linkbtn{font-size:var(--text-xs)}
.legal{font-size:12px;color:#8f8f8f}
.legal summary{cursor:pointer}
.legal p{margin-top:var(--s2);line-height:1.6}

@media(max-width:1180px){:root{--advisor-w:344px}}
@media(max-width:1000px){
  .appbody{position:relative}
  .main{flex-direction:column;overflow:auto}
  .advisor{width:auto;border-right:none;border-bottom:1px solid var(--hairline);overflow:visible}
  .canvas{overflow:visible}
  .rail{position:absolute;z-index:10}
}

/* ==========================================================================
   RIGHT SIDE — the detail
   ========================================================================== */
.hero{display:flex;flex-direction:column;gap:var(--s3)}
.hero-l{font-size:var(--text-lg);color:var(--general-muted-foreground)}
.hero-v{font-family:var(--font-sans);font-weight:800;letter-spacing:-3.4px;line-height:.94;
  font-size:clamp(52px,9vw,104px);color:var(--general-primary);font-variant-numeric:tabular-nums}
.hero-v small{font-size:.34em;font-weight:700;letter-spacing:-1px;margin-left:.12em}
/* a range is two numbers wide — it needs a smaller size to stay on one line */
.hero-v.band{font-size:clamp(34px,5.4vw,60px);letter-spacing:-1.8px;line-height:1.05}
.hero-s{font-size:var(--text-lg);line-height:1.5;max-width:34ch}
.hero-s b{font-weight:600}
.hero-m{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;
  padding-top:var(--s4);border-top:1px solid var(--hairline);font-size:var(--text-sm);
  color:var(--general-muted-foreground)}
.hero-m b{color:var(--general-foreground);font-weight:600;font-variant-numeric:tabular-nums}

.sec{display:flex;flex-direction:column;gap:var(--s4)}
.sec-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.sec-h h2{font-size:var(--text-xl);letter-spacing:-.5px}
.sec-h .spacer{flex:1}
.sec-h p{font-size:var(--text-sm);color:var(--general-muted-foreground)}

/* nudge — the advisor noticing time has passed */
.nudge{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s6);
  border:1px solid var(--general-accent);border-radius:var(--rounded-xl);
  background:linear-gradient(150deg,#fff8f0,#ffffff 70%);box-shadow:var(--shadow-xs)}
.nudge .nic{flex:0 0 auto;width:38px;height:38px;border-radius:var(--rounded-full);display:grid;
  place-items:center;background:#fff2e0;color:#a35c00}
.nudge .nic svg{width:20px;height:20px}
.nudge .nbd{flex:1 1 auto;min-width:0}
.nudge h3{font-size:var(--text-lg)}
.nudge p{margin-top:var(--s2);font-size:var(--text-sm);line-height:1.55;
  color:var(--general-muted-foreground);max-width:52ch}
.nudge p b{color:var(--general-foreground);font-weight:600}
.nudge-act{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.nudge-x{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;background:none;
  border:none;cursor:pointer;border-radius:var(--rounded-sm);color:var(--general-muted-foreground)}
.nudge-x:hover{background:var(--general-muted);color:var(--general-foreground)}
.nudge-x svg{width:15px;height:15px}
.nudge.plain{border-color:var(--general-border);background:linear-gradient(150deg,#edf5ff,#fff 70%)}
.nudge.plain .nic{background:var(--brand-ice);color:var(--general-primary)}
.track{position:relative;height:6px;margin-top:var(--s4);border-radius:var(--rounded-full);
  background:var(--general-muted);overflow:hidden;max-width:320px}
.track i{position:absolute;inset:0 auto 0 0;width:0;border-radius:var(--rounded-full);
  background:linear-gradient(90deg,var(--brand-cornflower),var(--general-primary));
  transition:width .2s linear}

/* agreements — the product, so they get artwork and air */
.agr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
.agr{position:relative;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  box-shadow:var(--shadow-xs);text-align:left;cursor:pointer;
  transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.agr:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--general-border)}
.agr-chip{width:46px;height:46px;flex:0 0 auto;border-radius:var(--rounded-md);overflow:hidden;
  display:grid;place-items:center;border:1px solid var(--hairline);background:var(--surface)}
.agr-chip img{width:100%;height:100%;object-fit:contain;padding:5px;display:block}
.agr-chip .ini{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:700;
  letter-spacing:.02em;color:var(--general-muted-foreground)}
.agr-n{display:block;font-family:var(--font-sans);font-size:var(--text-base);font-weight:600;
  letter-spacing:-.3px;line-height:1.25}
.agr-c{display:block;font-size:12px;color:var(--general-muted-foreground);margin-top:2px}
.agr-f{display:flex;align-items:center;gap:var(--s2);margin-top:auto;padding-top:var(--s3);
  border-top:1px solid var(--hairline)}
.agr-f .spacer{flex:1}
.agr-v{font-family:var(--font-sans);font-size:var(--text-sm);font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.agr.idle{background:#fcfcfd}
.filters{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fchip{padding:6px 14px;border-radius:var(--rounded-full);border:1px solid var(--sidebar-border);
  background:var(--surface);cursor:pointer;font-size:var(--text-xs);font-weight:600;
  color:var(--general-muted-foreground);transition:var(--t-fast)}
.fchip:hover{background:var(--brand-ice);border-color:var(--general-border)}
.fchip[aria-pressed="true"]{background:var(--general-foreground);border-color:var(--general-foreground);
  color:var(--surface)}
.grp-h{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4)}
.grp-h h3{font-size:var(--text-base)}
.grp-h .spacer{flex:1}
.grp-h .ln{flex:1;height:1px;background:var(--hairline)}

/* where the money goes — hand-rolled bars */
.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-top:1px solid var(--hairline);width:100%;background:none;border-left:0;
  border-right:0;border-bottom:0;cursor:pointer;text-align:left;transition:var(--t-fast)}
.bar:hover{background:#fbfcfe}
.bar:first-child{border-top:none}
.bar-n{display:flex;align-items:center;gap:var(--s2);font-size:var(--text-sm);font-weight:500}
.bar-n .st{width:7px;height:7px;border-radius:var(--rounded-full);flex:0 0 auto;
  background:var(--general-primary)}
.bar-n .st.idle{background:var(--sidebar-border)}
.bar-t{display:block;height:8px;margin-top:6px;border-radius:var(--rounded-full);
  background:var(--general-muted);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:var(--rounded-full);background:var(--brand-cornflower);
  transition:width var(--t)}
.bar-t i.on{background:var(--general-primary)}
.bar-v{text-align:right;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600;
  font-variant-numeric:tabular-nums}
.bar-v span{display:block;font-family:var(--font-body);font-size:12px;font-weight:400;
  color:var(--general-muted-foreground)}

/* events */
.evs{display:flex;flex-direction:column}
.ev{display:flex;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--hairline)}
.ev:first-child{border-top:none}
.ev-d{flex:0 0 96px;font-size:12px;color:var(--general-muted-foreground);padding-top:2px}
.ev-b{flex:1 1 auto;min-width:0}
.ev-b b{font-size:var(--text-sm);font-weight:600}
.ev-b p{font-size:var(--text-sm);color:var(--general-muted-foreground);margin-top:1px}
.ev-v{flex:0 0 auto;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.ev-v.dn{color:var(--sentiment-negative)}

/* money view */
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}
.mtile{padding:var(--s6);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  background:var(--surface);box-shadow:var(--shadow-xs)}
.mtile .ml{font-size:var(--text-sm);color:var(--general-muted-foreground)}
.mtile .mv{font-family:var(--font-sans);font-size:var(--text-3xl);font-weight:700;letter-spacing:-1.2px;
  margin-top:var(--s2);font-variant-numeric:tabular-nums}
.mtile .mn{margin-top:var(--s2);font-size:var(--text-sm);line-height:1.5;
  color:var(--general-muted-foreground)}
.mtile.tot{background:var(--brand-ice);border-color:var(--general-border)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tbl th,.tbl td{padding:var(--s3) var(--s2);text-align:right;border-top:1px solid var(--hairline)}
.tbl th{font-family:var(--font-sans);font-size:12px;font-weight:600;
  color:var(--general-muted-foreground);border-top:none}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--general-foreground)}
.tblwrap{overflow-x:auto}

/* ==========================================================================
   ASSISTANT DRAWER + SPECIALIST DIALOG + TOAST
   ========================================================================== */
.asst{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(420px,100vw);
  display:flex;flex-direction:column;background:var(--surface);
  border-left:1px solid var(--hairline);box-shadow:var(--shadow-xl);
  transform:translateX(101%);transition:transform var(--t)}
.asst.on{transform:none}
.asst-h{flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);padding:var(--s6) var(--s5,20px) var(--s4)}
.asst-h img{width:24px;height:24px}
.asst-h b{flex:1;font-family:var(--font-sans);font-size:var(--text-lg);letter-spacing:-.4px}
.asst-x{width:32px;height:32px;display:grid;place-items:center;background:none;border:none;
  cursor:pointer;border-radius:var(--rounded-sm);color:var(--general-muted-foreground)}
.asst-x:hover{background:var(--general-muted);color:var(--general-foreground)}
.asst-x svg{width:16px;height:16px}
.asst-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 var(--s5,20px);
  display:flex;flex-direction:column;gap:var(--s4)}
.msg{max-width:88%;padding:var(--s3) var(--s4);border-radius:var(--rounded-lg);
  font-size:var(--text-sm);line-height:1.55}
.msg.me{align-self:flex-end;background:var(--general-primary);color:var(--general-primary-foreground);
  border-bottom-right-radius:var(--rounded-xs)}
.msg.ai{align-self:flex-start;background:#f6f7f9;border-bottom-left-radius:var(--rounded-xs)}
.msg.ai b{font-weight:600}
.asst-f{flex:0 0 auto;padding:var(--s4) var(--s5,20px) var(--s6);display:flex;flex-direction:column;
  gap:var(--s2)}
.pchip{align-self:flex-start;max-width:100%;padding:var(--s2) var(--s4);cursor:pointer;text-align:left;
  background:var(--general-muted);border:1px solid transparent;border-radius:var(--rounded-md);
  font-size:var(--text-xs);line-height:1.45;transition:var(--t-fast)}
.pchip:hover{background:var(--surface);border-color:var(--general-border);box-shadow:var(--shadow-xs)}
.asst-in{display:flex;align-items:center;gap:var(--s2);padding:var(--s2);margin-top:var(--s2);
  background:#f6f7f9;border:1px solid var(--sidebar-border);border-radius:var(--rounded-md)}
.asst-in:focus-within{border-color:var(--general-primary);box-shadow:0 0 0 3px #1b64dc1f}
.asst-in input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:var(--text-sm)}
.asst-send{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;
  border:none;border-radius:var(--rounded-sm);background:var(--general-foreground);color:var(--surface)}
.asst-send:hover{background:var(--general-primary)}
.asst-send svg{width:15px;height:15px}

.scrim{position:fixed;inset:0;z-index:55;background:#0f0f0f00;pointer-events:none;
  transition:background var(--t)}
.scrim.on{background:#0f0f0f33;pointer-events:auto;backdrop-filter:blur(2px)}
.dlg{position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow-y:auto;
  background:var(--surface);border-radius:var(--rounded-2xl);box-shadow:var(--shadow-xl);
  padding:var(--s8);opacity:0;pointer-events:none;
  transition:opacity var(--t),transform var(--t)}
.dlg.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.dlg-top{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s6)}
.dlg-top .portrait{width:52px;height:52px;flex:0 0 auto;border-radius:var(--rounded-full);display:grid;
  place-items:center;font-family:var(--font-sans);font-size:var(--text-base);font-weight:600;color:#fff;
  background:linear-gradient(135deg,#2170ed,#0b00ab);box-shadow:var(--shadow-sm)}
.dlg-top b{display:block;font-family:var(--font-sans);font-size:var(--text-lg);letter-spacing:-.3px}
.dlg-top span{display:block;font-size:var(--text-xs);color:var(--general-muted-foreground);margin-top:1px}
.dlg p{font-size:var(--text-sm);line-height:1.6;color:var(--general-muted-foreground)}
.slots{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s6)}
.slot{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);cursor:pointer;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  text-align:left;font-size:var(--text-sm);transition:var(--t-fast)}
.slot:hover{border-color:var(--general-border);background:var(--brand-ice)}
.slot[aria-pressed="true"]{border-color:var(--general-primary);background:var(--brand-ice);
  box-shadow:0 0 0 3px #1b64dc1a;font-weight:600}
.slot .sr-dot{width:16px;height:16px;flex:0 0 auto;border-radius:var(--rounded-full);
  border:1.6px solid var(--sidebar-border);display:grid;place-items:center}
.slot[aria-pressed="true"] .sr-dot{border-color:var(--general-primary);
  background:var(--general-primary);color:#fff}
.slot .sr-dot svg{width:10px;height:10px;opacity:0}
.slot[aria-pressed="true"] .sr-dot svg{opacity:1}
.dlg-act{display:flex;gap:var(--s2);margin-top:var(--s8)}
.dlg-act .btn{flex:1}

.toastc{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:var(--s6);
  pointer-events:none;background:#0f0f0f00;transition:background .3s ease}
.toastc.show{background:#0f0f0f14;backdrop-filter:blur(2px)}
.toastc-card{pointer-events:auto;display:flex;align-items:center;gap:var(--s6);
  max-width:min(540px,94vw);padding:var(--s8);border-radius:var(--rounded-2xl);text-align:left;
  background:var(--surface);border:1px solid var(--hairline);
  box-shadow:var(--shadow-xl),0 0 0 6px #00968914;
  opacity:0;transform:translateY(12px) scale(.9);
  transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
.toastc.show .toastc-card{opacity:1;transform:none}
.toastc-ic{flex:0 0 auto;width:56px;height:56px;border-radius:var(--rounded-full);
  background:#d9f2ef;color:var(--sentiment-positive);display:grid;place-items:center;
  box-shadow:0 0 0 8px #00968912}
.toastc-ic svg{width:30px;height:30px}
.toastc-tx b{font-family:var(--font-sans);font-size:var(--text-xl);letter-spacing:-.3px}
.toastc-tx p{margin-top:5px;font-size:var(--text-base);line-height:1.5;color:var(--general-muted-foreground)}
.toastc-tx p b{font-size:inherit;color:var(--general-foreground)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;
    transition-duration:.001s!important;scroll-behavior:auto!important}
  .toastc-card{transform:none}
}
</style>

const CHEV  = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLOCK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.5V12l3.2 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const CHAT  = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a7.5 7.5 0 01-7.5 7.5H8L4 22v-4.2A7.5 7.5 0 0112.5 4.5 7.5 7.5 0 0120 12z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLUG  = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-6 6 6 6 0 01-6-6V8zM12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SEND  = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAV_IC = {
  today: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l8 6v11H4V9l8-6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 20v-6h5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  agr:   '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 18V7M10 18V11M16 18V4M22 18H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};

/* ==========================================================================
   DATA — every figure derives from spend x rate, so nothing can disagree
   ========================================================================== */
const CATS = [
  {id:'mat',  n:'Building materials',        amt:2132300, rate:9,  sup:18, inv:424,
   agr:[['Stark Byggecenter',870000],['Bygma Framework',680000],['Ahlsell Nordic',427300],['Optimera Erhverv',155000]]},
  {id:'tool', n:'Tools & workwear',          amt:664800,  rate:11, sup:11, inv:178,
   agr:[['Hilti Erhverv',284000],['Würth Nordic',223800],['Engelbert Strauss',157000]]},
  {id:'fuel', n:'Fuel & transport',          amt:530700,  rate:8,  sup:5,  inv:223,
   agr:[['Q8 Fuel Card',423750],['Circle K Business',106950]]},
  {id:'off',  n:'Office supplies',           amt:205000,  rate:19, sup:5,  inv:62,
   agr:[['Lyreco Erhverv',132000],['Contorland',73000]]},
  {id:'rent', n:'Machine & equipment rental',amt:500000,  rate:6,  sup:6,  inv:112,
   agr:[['Cramo Danmark',285000],['Riwal Lifting',153000],['GSV Materieludlejning',62000]]},
  {id:'frg',  n:'Freight & delivery',        amt:328800,  rate:8,  sup:6,  inv:122,
   agr:[['DSV Road',191000],['GLS Erhverv',81300],['Danske Fragtmænd',56500]]},
  {id:'tel',  n:'Telecom & IT',              amt:290400,  rate:5,  sup:4,  inv:100,
   agr:[['Telenor Erhverv',266500],['Dustin IT',23900]]},
  {id:'site', n:'Site services & waste',     amt:168000,  rate:4,  sup:4,  inv:63,
   agr:[['Marius Pedersen',128000],['Ragn-Sells',40000]]}
];
/* Bob's six covered categories. Fanny starts with none. */
const BOB_IN_USE = ['mat','tool','fuel','off','rent','frg'];

/* real artwork where we have it, on the logo's own background colour */
const BRAND = {
  'Stark Byggecenter':  {f:'stark.jpeg', bg:'#f48222'},
  'Bygma Framework':    {f:'bygma-logo-png_seeklogo-381076.png', bg:'#ffffff'},
  'Ahlsell Nordic':     {f:'ahlsell.png', bg:'#ffffff'},
  'Q8 Fuel Card':       {f:'q8.png', bg:'#ffffff'},
  'Hilti Erhverv':      {f:'hilti.png', bg:'#d2091e'},
  'Lyreco Erhverv':     {f:'lyreco.png', bg:'#2e2e88'}
};

/* one short, plain sentence per category — why this one, in words a 15-year-old reads */
const WHY = {
  off:  'It is your smallest bill and your biggest gap. Five suppliers, 62 invoices — the least to change for the most back.',
  mat:  'This is where most of your money goes, and four agreements cover nearly all of it.',
  tool: 'You pay near list price on tools. The group rate is 11% below it.',
  rent: 'Three rental firms are already in the group. Same machines, lower day rate.',
  frg:  'Freight is billed per delivery, so the group rate lands on every single one.',
  fuel: 'Two fuel cards, one price. Nothing changes at the pump.',
  tel:  'Two agreements are sitting ready. Same phones, same lines, smaller bill.',
  site: 'The smallest one left. Worth doing once the bigger ones are running.'
};

const BONUS_TIERS = [
  {upTo:1000000, rate:1.0},
  {upTo:3000000, rate:1.5},
  {upTo:Infinity, rate:2.0}
];
/* a function, never a literal — the bonus has to follow the covered spend as
   agreements come into use */
function bonusOn(volume){
  let prev = 0, total = 0;
  const lines = [];
  for(const t of BONUS_TIERS){
    if(volume <= prev) break;
    const to = Math.min(volume, t.upTo);
    const paid = Math.round((to - prev) * t.rate / 100);
    lines.push({from:prev, to, vol:to - prev, rate:t.rate, paid});
    total += paid;
    prev = t.upTo;
  }
  return {total, lines};
}
/* split so the parts always re-sum to the whole — no stray krone anywhere */
function splitExact(total, weights){
  const sum = weights.reduce((a,b) => a + b, 0);
  const out = []; let used = 0;
  weights.forEach((w,i) => {
    const v = i === weights.length - 1 ? total - used : Math.round(total * w / sum);
    out.push(v); used += v;
  });
  return out;
}
const catSave = c => Math.round(c.amt * c.rate / 100);
/* agreement-level savings are derived from the category total, so the cards can
   can never total something other than the headline */
function agrRows(c){
  const parts = splitExact(catSave(c), c.agr.map(a => a[1]));
  return c.agr.map((a,i) => ({n:a[0], covers:a[1], save:parts[i]}));
}
const AGR_TOTAL = CATS.reduce((n,c) => n + c.agr.length, 0);

/* ==========================================================================
   STATE
   ========================================================================== */
const PERSONAS = {
  bob:   {user:'Bob Iversen', company:'Nordvik Byg A/S', estimated:false, connected:true,
          inUse:BOB_IN_USE, trade:'construction'},
  fanny: {user:'Fanny Kristensen', company:'Kristensen Elektro ApS', estimated:true, connected:false,
          inUse:[], trade:'electrical contracting'}
};
const SPECIALIST = {name:'Lars Møller', role:'Procurement specialist · Visma Advantage', ini:'LM'};

let persona = 'bob';
let state = {};
let view = 'today';
let railMini = false;
let inUse = new Set();
let deferred = [];
let accepted = [];              // ids accepted in this session, newest first
let booked = null;              // {slot, topic}
let nudgeShut = false;
let syncing = false;
let heroShown = 0;              // last painted hero value, for the count-up
let agrFilter = 'all';

function applyPersona(key){
  const p = PERSONAS[key];
  persona = key;
  state = {user:p.user, company:p.company, estimated:p.estimated,
           connected:p.connected, trade:p.trade};
  inUse = new Set(p.inUse);
  deferred = []; accepted = []; booked = null; nudgeShut = false; syncing = false;
  heroShown = 0; agrFilter = 'all'; view = 'today';
}

/* ---------- derived totals ---------- */
function totals(){
  const on  = CATS.filter(c => inUse.has(c.id));
  const off = CATS.filter(c => !inUse.has(c.id));
  const spend     = CATS.reduce((s,c) => s + c.amt, 0);
  const covered   = on.reduce((s,c) => s + c.amt, 0);
  const saved     = on.reduce((s,c) => s + catSave(c), 0);
  const available = off.reduce((s,c) => s + catSave(c), 0);
  const agrInUse  = on.reduce((n,c) => n + c.agr.length, 0);
  return {on, off, spend, covered, offSpend:spend - covered, saved, available,
          full:saved + available, agrInUse, agrOpen:AGR_TOTAL - agrInUse,
          bonus:bonusOn(covered), invoices:CATS.reduce((s,c) => s + c.inv, 0)};
}
/* the ±15% band a new customer sees, rounded to the nearest thousand */
const band = n => [Math.round(n * .85 / 1000) * 1000, Math.round(n * 1.15 / 1000) * 1000];
const bandTxt = n => { const b = band(n); return fmt(b[0]) + ' – ' + fmt(b[1]); };
/* estimated figures are a typical outcome, never a ceiling */
const saveFig = n => (state.estimated ? 'typically +' : '+') + fmt(n) + ' kr.';
const EST_CHIP = '<span class="est-chip">' + CLOCK + 'Estimated</span>';
const initialsOf = n => n.split(/[\s.\-]+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();

/* biggest win for the least effort: money back per invoice you have to move */
const effortScore = c => catSave(c) / c.inv;
function queue(){
  return CATS.filter(c => !inUse.has(c.id) && !deferred.includes(c.id))
             .sort((a,b) => effortScore(b) - effortScore(a));
}
const catById = id => CATS.find(c => c.id === id);

const VIEWS = [

/* ==========================================================================
   THE ADVISOR COLUMN
   ========================================================================== */
function renderAdvisor(){
  const q = queue();
  const parts = ['<div class="adv-head"><img src="assets/sda-mark.svg" alt="">' +
    '<span><b>Your advisor</b><span>One thing at a time</span></span></div>'];

  if(q.length){
    parts.push(recCard(q[0], q.length));
  } else {
    parts.push('<div class="rec-done"><span class="ic">' + TICK + '</span><div>' +
      '<b>Nothing left to do</b><p>Every agreement we have is in use. We will tell you the ' +
      'moment a new one is worth taking.</p></div></div>');
  }

  /* the two hand-offs — always both, on every recommendation */
  const topic = q.length ? q[0].n : 'my agreements';
  parts.push('<div class="hand"><p class="hand-t">Rather not do it yourself?</p>' +
    '<button class="handoff" data-ask="' + esc(topic) + '">' +
      '<span class="hic"><img src="assets/sda-mark.svg" alt=""></span>' +
      '<span class="htx"><b>Ask the assistant</b><span>Answers now, any hour</span></span>' +
      '<span class="hgo">' + CHEV + '</span></button>' +
    '<button class="handoff" data-book="' + esc(topic) + '">' +
      '<span class="hic face">' + SPECIALIST.ini + '</span>' +
      '<span class="htx"><b>Talk to a specialist</b><span>' + SPECIALIST.name +
        ' calls you back</span></span>' +
      '<span class="hgo">' + CHEV + '</span></button></div>');

  if(booked){
    parts.push('<div class="booked" role="status">' + CLOCK +
      '<span>' + SPECIALIST.name.split(' ')[0] + ' calls you ' + booked.slot + '</span>' +
      '<span class="spacer"></span><button class="linkbtn" id="unbook">Cancel</button></div>');
  }
  if(deferred.length){
    parts.push('<p class="putoff">Put off: ' +
      deferred.map(id => catById(id).n).join(', ') +
      ' · <button class="linkbtn" id="undoDefer">Bring back</button></p>');
  }
  parts.push('<details class="legal"><summary>The legal bits</summary><p>Group agreements are ' +
    'held by Visma Advantage on your behalf. You keep your own supplier account and can stop ' +
    'using an agreement whenever you like. Bonus is settled once a year on the spend that ' +
    'went through an agreement.</p></details>');

  $('#advisor').innerHTML = parts.join('');
  wireAdvisor();
}

function recCard(c, left){
  const save = catSave(c);
  const rows = agrRows(c);
  const est = state.estimated;
  const fig = '<div class="rec-fig"><b>' + (est ? 'typically +' : '+') + fmt(save) + '</b>' +
    '<span>kr. a year</span>' +
    (est ? '<i>An estimate from companies your size in ' + state.trade +
           '. Yours can come out more, or less.</i>' : '') + '</div>';

  const get = [
    c.rate + '% off what you pay today, on every invoice.',
    'Same supplier, same delivery. Only the price changes.',
    rows.length + ' agreement' + (rows.length === 1 ? '' : 's') + ' ready — we do the paperwork.'
  ];

  return '<div class="rec"><div class="rec-top"><span class="chip chip-rec">Do this next</span>' +
    (est ? EST_CHIP : '') + '</div>' +
    '<h2>' + c.n + '</h2>' +
    '<p class="rec-why">' + WHY[c.id] + '</p>' +
    fig +
    '<p class="rec-lbl">What you get</p>' +
    '<ul class="rec-get">' + get.map(g =>
      '<li><span class="tick">' + TICK + '</span><span>' + g + '</span></li>').join('') + '</ul>' +
    '<div class="rec-act">' +
      '<button class="btn btn-primary btn-lg btn-block" id="recYes">Yes, set it up</button>' +
      '<button class="btn btn-secondary btn-block" id="recNo">Not now</button>' +
    '</div>' +
    (left > 1 ? '<p class="rec-more">' + (left - 1) + ' more waiting · ' +
      '<button class="linkbtn" id="recSeeAll">see them all</button></p>' : '') +
    '</div>';
}

function wireAdvisor(){
  const yes = $('#recYes'), no = $('#recNo');
  if(yes) yes.addEventListener('click', () => accept(queue()[0]));
  if(no)  no.addEventListener('click', () => {
    const c = queue()[0];
    if(!c) return;
    deferred.push(c.id);
    renderAll();
  });
  const all = $('#recSeeAll');
  if(all) all.addEventListener('click', () => { view = 'agr'; $('#canvas').scrollTop = 0; renderAll(); });
  const un = $('#undoDefer');
  if(un) un.addEventListener('click', () => { deferred = []; renderAll(); });
  const ub = $('#unbook');
  if(ub) ub.addEventListener('click', () => { booked = null; renderAll(); });
  $$('#advisor [data-ask]').forEach(b =>
    b.addEventListener('click', () => askAbout(b.dataset.ask)));
  $$('#advisor [data-book]').forEach(b =>
    b.addEventListener('click', () => openBooking(b.dataset.book)));
}

function accept(c){
  if(!c) return;
  const btn = $('#recYes');
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Setting it up…';
  }
  const finish = () => {
    inUse.add(c.id);
    accepted.unshift(c.id);
    deferred = deferred.filter(id => id !== c.id);
    renderAll();
    toast(c);
  };
  RM ? finish() : setTimeout(finish, 900);
}

function toast(c){
  const wrap = document.createElement('div');
  wrap.className = 'toastc';
  wrap.setAttribute('role', 'status');
  wrap.innerHTML = '<div class="toastc-card"><span class="toastc-ic">' + TICK + '</span>' +
    '<div class="toastc-tx"><b>Done.</b><p>' + c.n + ' is in use. That is <b>' +
    saveFig(catSave(c)) + ' a year</b> on the invoices you already pay.</p></div></div>';
  const dismiss = () => { wrap.classList.remove('show'); setTimeout(() => wrap.remove(), 450); };
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));
  wrap.addEventListener('click', dismiss);
  setTimeout(dismiss, 4200);
}

function renderAll(){

  else if(view === 'agr') page.innerHTML = pageAgreements();

  wirePage();
}

function heroBlock(){

  const est = state.estimated;
  /* nothing in use yet and estimated: lead with what companies her size get —
     a benchmark, clearly labelled as one, not a promise about her */
  if(!t.saved && est){
    return '<section class="hero"><p class="hero-l">Companies your size in ' + state.trade +
      ' save</p>' +
      '<p class="hero-v band num" id="heroV">' + bandTxt(402745) + ' <small>kr.</small></p>' +
      '<p class="hero-s">a year, without changing supplier. Yours can be more or less. ' +
      EST_CHIP + '</p>' +
      '<p class="hero-m">Everything on the table for you comes to <b>' + fmt(t.full) +
      ' kr.</b> a year<span>·</span>' + AGR_TOTAL + ' agreements ready to use</p></section>';
  }
  const label = est ? 'You are saving, typically' : 'You are saving';
  return '<section class="hero"><p class="hero-l">' + label + '</p>' +
    '<p class="hero-v num" id="heroV" data-to="' + t.saved + '">' + fmt(t.saved) +
      ' <small>kr.</small></p>' +
    '<p class="hero-s">a year on the invoices you already pay. Same suppliers, same deliveries.' +
      (est ? ' ' + EST_CHIP : '') + '</p>' +
    '<p class="hero-m"><b>' + t.agrInUse + ' of ' + AGR_TOTAL + '</b> agreements in use' +
      '<span>·</span><b>' + fmt(t.available) + ' kr.</b> still on the table' +
      (state.connected ? '<span>·</span><b>' + fmt(t.invoices) + '</b> invoices read' : '') +
      '</p></section>';
}

function nudgeBlock(){
  if(nudgeShut) return '';
  if(!state.connected){
    return '<section class="nudge plain" id="nudge"><span class="nic">' + PLUG + '</span>' +
      '<div class="nbd"><h3>Connect your accounting and the guessing stops</h3>' +
      '<p>Right now every figure here is an estimate. Connect Visma.net and we read your own ' +
      'invoices — about <b>' + fmt(totals().invoices) + '</b> a year — so the numbers become ' +
      'yours.</p>' +
      '<div class="track" id="syncTrack" hidden><i></i></div>' +
      '<div class="nudge-act"><button class="btn btn-primary btn-sm" id="connectBtn">' +
      'Connect Visma.net</button>' +
      '<button class="btn btn-secondary btn-sm" data-ask="connecting Visma.net">' +
      'Ask the assistant</button>' +
      '<button class="btn btn-secondary btn-sm" data-book="connecting Visma.net">' +
      'Talk to a specialist</button></div></div>' +
      '<button class="nudge-x" id="nudgeX" aria-label="Hide this">' +
      '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></section>';
  }
  return '<section class="nudge" id="nudge"><span class="nic">' + CLOCK + '</span>' +
    '<div class="nbd"><h3>You last looked at Building materials 4 months ago</h3>' +
    '<p>Stark Byggecenter has raised prices <b>4%</b> since then. On what you buy from them ' +
    'that is about <b>18.400 kr.</b> a year. We can put it to them.</p>' +
    '<div class="nudge-act">' +
    '<button class="btn btn-secondary btn-sm" data-ask="the Stark Byggecenter price rise">' +
    'Ask the assistant</button>' +
    '<button class="btn btn-primary btn-sm" data-book="the Stark Byggecenter price rise">' +
    'Let ' + SPECIALIST.name.split(' ')[0] + ' handle it</button></div></div>' +
    '<button class="nudge-x" id="nudgeX" aria-label="Hide this">' +
    '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></section>';
}

function agrCard(c, a){
  const on = inUse.has(c.id);
  const b = BRAND[a.n];
  const chip = '<span class="agr-chip"' + (b ? ' style="background:' + b.bg + '"' : '') + '>' +
    (b ? '<img src="assets/company-logos/' + b.f + '" alt="">'
       : '<span class="ini">' + initialsOf(a.n) + '</span>') + '</span>';
  return '<button class="agr' + (on ? '' : ' idle') + '" data-agr="' + esc(a.n) +
    '" data-cat="' + c.id + '">' + chip +
    '<span><span class="agr-n">' + a.n + '</span>' +
    '<span class="agr-c">' + c.n + '</span></span>' +
    '<span class="agr-f"><span class="chip ' + (on ? 'chip-good' : 'chip-soft') + '">' +
      (on ? TICK + 'In use' : 'Ready to use') + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="agr-v">' + saveFig(a.save) + '</span></span></button>';
}

function pageToday(){
  const t = totals();
  /* the six most valuable agreements, so the product itself is on the front page */
  const flat = CATS.flatMap(c => agrRows(c).map(a => ({c, a})))
                   .sort((x,y) => y.a.save - x.a.save).slice(0, 6);
  return heroBlock() + nudgeBlock() +
    '<section class="sec"><div class="sec-h"><h2>Your agreements</h2>' +
      '<span class="spacer"></span>' +
      '<button class="linkbtn" data-go="agr">See all ' + AGR_TOTAL + '</button></div>' +
      '<div class="agr-grid">' + flat.map(x => agrCard(x.c, x.a)).join('') + '</div></section>' +
    '<section class="sec"><div class="sec-h"><h2>Where your money goes</h2>' +
      '<span class="spacer"></span><p>' + fmt(t.spend) + ' kr. a year</p></div>' +
      barsBlock() + '</section>' +
    '<section class="sec"><div class="sec-h"><h2>What happened lately</h2></div>' +
      evsBlock() + '</section>';
}

function barsBlock(){
  const max = Math.max.apply(null, CATS.map(c => c.amt));
  return '<div class="bars">' + CATS.map(c => {
    const on = inUse.has(c.id);
    return '<button class="bar" data-ask="' + esc(c.n) + '">' +
      '<span><span class="bar-n"><span class="st' + (on ? '' : ' idle') + '"></span>' + c.n +
      '</span><span class="bar-t"><i class="' + (on ? 'on' : '') + '" style="width:' +
      (c.amt / max * 100).toFixed(1) + '%"></i></span></span>' +
      '<span class="bar-v">' + fmt(c.amt) + '<span>' +
      (on ? 'saving ' + fmt(catSave(c)) : fmt(catSave(c)) + ' waiting') + '</span></span>' +
      '</button>';
  }).join('') + '</div>';
}

function evsBlock(){
  const evs = state.connected ? [
    ['4 days ago',  'Stark Byggecenter raised prices 4%', 'We caught it on your last three invoices.', '−18.400', true],
    ['1 week ago',  'Q8 rate confirmed on your latest invoice', 'The group price came through as agreed.', '+33.900', false],
    ['2 weeks ago', 'Circle K business case ready', '42.800 litres a year on your fuel cards.', '', false],
    ['3 weeks ago', 'Visma.net sync completed', fmt(totals().invoices) + ' invoices read.', '', false]
  ] : [
    ['Today',       'Account created', 'Welcome. Nothing connected yet, so every figure is an estimate.', '', false],
    ['Today',       '21 agreements ready to use', 'Negotiated for companies like yours.', '', false]
  ];
  return '<div class="evs">' + evs.map(e =>
    '<div class="ev"><span class="ev-d">' + e[0] + '</span>' +
    '<span class="ev-b"><b>' + e[1] + '</b><p>' + e[2] + '</p></span>' +
    (e[3] ? '<span class="ev-v' + (e[4] ? ' dn' : '') + '">' + e[3] + '</span>' : '') +
    '</div>').join('') + '</div>';
}

function pageAgreements(){
  const t = totals();
  const groups = CATS.map(c => {
    const rows = agrRows(c).filter(() =>
      agrFilter === 'all' ||
      (agrFilter === 'in' && inUse.has(c.id)) ||
      (agrFilter === 'ready' && !inUse.has(c.id)));
    return rows.length
      ? '<div class="grp-h"><h3>' + c.n + '</h3><span class="ln"></span>' +
        '<span class="chip chip-soft">' + saveFig(catSave(c)) + ' a year</span></div>' +
        '<div class="agr-grid">' + rows.map(a => agrCard(c, a)).join('') + '</div>'
      : '';
  }).join('');
  return '<section class="hero"><p class="hero-l">Your agreements</p>' +
      '<h1 style="font-size:var(--text-4xl);letter-spacing:-1.4px">' + t.agrInUse + ' in use, ' +
      t.agrOpen + ' ready to use</h1>' +
      '<p class="hero-s">Every one is the same deal: your supplier, your delivery, a lower ' +
      'price on the invoice.</p></section>' +
    '<div class="filters" role="group" aria-label="Filter agreements">' +
      fchip('all', 'All ' + AGR_TOTAL) + fchip('in', 'In use ' + t.agrInUse) +
      fchip('ready', 'Ready to use ' + t.agrOpen) + '</div>' +
    '<section class="sec">' + (groups || '<p class="muted">Nothing here yet.</p>') + '</section>';
}
const fchip = (id, t) => '<button class="fchip" data-filter="' + id + '" aria-pressed="' +
  (agrFilter === id) + '">' + t + '</button>';

function pageMoney(){
  const t = totals();
  const b = t.bonus;
  const est = state.estimated;
  const tierName = i => i === 0 ? 'First 1.000.000 kr.'
    : i === 1 ? 'Next 2.000.000 kr.' : 'Everything above 3.000.000 kr.';
  /* nothing running yet — lead with what is waiting, never with a zero */
  const hero = t.saved
    ? '<section class="hero"><p class="hero-l">Money back this year</p>' +
      '<p class="hero-v num">' + fmt(t.saved + b.total) + ' <small>kr.</small></p>' +
      '<p class="hero-s">It comes back two ways: a lower price on the invoice, and a bonus ' +
      'once a year.' + (est ? ' ' + EST_CHIP : '') + '</p></section>'
    : '<section class="hero"><p class="hero-l">Money waiting for you</p>' +
      '<p class="hero-v num">' + fmt(t.full) + ' <small>kr.</small></p>' +
      '<p class="hero-s">a year, once your agreements are in use. It comes back two ways: a ' +
      'lower price on the invoice, and a bonus once a year.' + (est ? ' ' + EST_CHIP : '') +
      '</p></section>';
  const bonusSec = b.lines.length
    ? '<section class="sec"><div class="sec-h"><h2>How the bonus is worked out</h2></div>' +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Spend through agreements</th>' +
      '<th>Rate</th><th>Bonus</th></tr></thead><tbody>' +
      b.lines.map((l,i) => '<tr><td>' + tierName(i) + '<br><span class="muted" ' +
        'style="font-size:12px">' + fmt(l.vol) + ' kr.</span></td><td>' +
        l.rate.toFixed(1).replace('.', ',') + '%</td><td>' + fmt(l.paid) + ' kr.</td></tr>').join('') +
      '</tbody><tfoot><tr><td>' + fmt(t.covered) + ' kr. of ' + fmt(t.spend) +
      ' kr.</td><td></td><td>' + fmt(b.total) + ' kr.</td></tr></tfoot></table></div></section>'
    : '<section class="sec"><div class="sec-h"><h2>How the bonus works</h2></div>' +
      '<p class="muted" style="font-size:var(--text-sm);line-height:1.6;max-width:56ch">' +
      'Once your spend runs through an agreement, you get a bonus on it once a year: 1,0% on ' +
      'the first million kroner, 1,5% on the next two million, 2,0% above that. Nothing yet, ' +
      'because nothing is in use.</p></section>';
  return hero +
    '<section class="money">' +
      '<div class="mtile"><p class="ml">Lower price on the invoice</p>' +
        '<p class="mv">' + fmt(t.saved) + ' kr.</p>' +
        '<p class="mn">Taken off as you buy, on ' + t.agrInUse + ' agreement' +
        (t.agrInUse === 1 ? '' : 's') + ' in use.</p></div>' +
      '<div class="mtile"><p class="ml">Bonus, paid once a year</p>' +
        '<p class="mv">' + fmt(b.total) + ' kr.</p>' +
        '<p class="mn">On the ' + fmt(t.covered) + ' kr. that went through an agreement.</p></div>' +
      '<div class="mtile tot"><p class="ml">Together</p>' +
        '<p class="mv">' + fmt(t.saved + b.total) + ' kr.</p>' +
        '<p class="mn">' + fmt(t.available) + ' kr. is still on the table.</p></div>' +
    '</section>' + bonusSec +
    '<section class="sec"><div class="sec-h"><h2>Category by category</h2></div>' +
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Category</th><th>You spend</th>' +
      '<th>Group rate</th><th>Saving</th><th>State</th></tr></thead><tbody>' +
      CATS.map(c => '<tr><td>' + c.n + '</td><td>' + fmt(c.amt) + '</td><td>' + c.rate +
        '%</td><td>' + fmt(catSave(c)) + '</td><td>' +
        (inUse.has(c.id) ? 'In use' : 'Ready to use') + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td>All ' + CATS.length + '</td><td>' + fmt(t.spend) +
      '</td><td></td><td>' + fmt(t.full) + '</td><td></td></tr></tfoot></table></div>' +
      '<p class="muted" style="font-size:var(--text-xs)">Of that, ' + fmt(t.saved) +
      ' kr. is running now and ' + fmt(t.available) + ' kr. is waiting.</p></section>';
}

function wirePage(){
  $$('#page [data-go]').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.go; $('#canvas').scrollTop = 0; renderAll();
  }));
  $$('#page [data-filter]').forEach(b => b.addEventListener('click', () => {
    agrFilter = b.dataset.filter; renderAll();
  }));
  $$('#page [data-ask]').forEach(b => b.addEventListener('click', () => askAbout(b.dataset.ask)));
  $$('#page [data-book]').forEach(b => b.addEventListener('click', () => openBooking(b.dataset.book)));
  $$('#page [data-agr]').forEach(b => b.addEventListener('click', () => openAgreement(b)));
  const x = $('#nudgeX');
  if(x) x.addEventListener('click', () => { nudgeShut = true; renderAll(); });
  const cb = $('#connectBtn');
  if(cb) cb.addEventListener('click', runSync);
  countUpHero();
}

/* the hero counts up from what was last on screen, so accepting something is felt */
function countUpHero(){
  const el = $('#heroV');
  if(!el || !el.dataset.to) return;
  const to = +el.dataset.to;
  const from = heroShown;
  heroShown = to;
  if(RM || from === to || !from){ return; }
  const t0 = performance.now(), dur = 700;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmt(from + (to - from) * e) + ' <small>kr.</small>';
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* Fanny connects: a short read, then her figures stop being estimates */
function runSync(){
  if(syncing) return;
  syncing = true;
  const btn = $('#connectBtn'), tr = $('#syncTrack');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Reading your invoices…';
  tr.hidden = false;
  const bar = tr.querySelector('i');
  let p = 0;
  const tick = () => {
    p = Math.min(100, p + 9 + Math.random() * 11);
    bar.style.width = p + '%';
    if(p < 100) setTimeout(tick, RM ? 20 : 170);
    else setTimeout(() => {
      state.connected = true;
      state.estimated = false;
      nudgeShut = true;
      syncing = false;
      heroShown = 0;
      renderAll();
    }, RM ? 20 : 420);
  };
  tick();
}

/* ==========================================================================
   HAND-OFF 1 — the assistant
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function answerFor(q){
  const t = totals();
  const low = q.toLowerCase();
  const cat = CATS.find(c => low.includes(c.n.toLowerCase().split(' ')[0]));
  if(low.includes('stark')){
    return 'Stark put their list price up <b>4%</b> in May. On your volume with them that is ' +
      'about <b>18.400 kr.</b> a year. Your group rate still holds, so the fix is a price ' +
      'check on the last three invoices — ' + SPECIALIST.name + ' can raise it with Stark ' +
      'directly. Want me to book that?';
  }
  if(low.includes('visma.net') || low.includes('connect')){
    return 'It takes about a minute. You sign in to Visma.net once, we read the invoices — ' +
      'roughly <b>' + fmt(t.invoices) + '</b> a year — and nothing is written back. After ' +
      'that every figure here is your own, not an estimate.';
  }
  if(low.includes('bonus')){
    return 'The bonus is paid once a year on the spend that went through an agreement — ' +
      '<b>' + fmt(t.covered) + ' kr.</b> for you. It is tiered: 1,0% on the first million, ' +
      '1,5% on the next two million, 2,0% above. That comes to <b>' + fmt(t.bonus.total) +
      ' kr.</b>';
  }
  if(low.includes('change') || low.includes('supplier') || low.includes('catch')){
    return 'Nothing changes in how you work. Same supplier, same driver, same delivery ' +
      'address. The only difference is the price printed on the invoice. You can stop using ' +
      'an agreement whenever you want.';
  }
  if(low.includes('sav') || low.includes('total') || low.includes('money')){
    return 'You are saving <b>' + fmt(t.saved) + ' kr.</b> a year on invoice prices, plus ' +
      '<b>' + fmt(t.bonus.total) + ' kr.</b> bonus once a year. <b>' + fmt(t.available) +
      ' kr.</b> is still on the table across ' + t.agrOpen + ' agreements you have not ' +
      'started using.';
  }
  if(cat){
    const rows = agrRows(cat);
    return 'On ' + cat.n.toLowerCase() + ' you spend <b>' + fmt(cat.amt) + ' kr.</b> a year ' +
      'across ' + cat.sup + ' suppliers and ' + cat.inv + ' invoices. The group rate is <b>' +
      cat.rate + '%</b> below what you pay, so that is <b>' + saveFig(catSave(cat)) +
      '</b> a year. ' + rows.length + ' agreement' + (rows.length === 1 ? '' : 's') +
      ' cover it: ' + rows.map(r => r.n).join(', ') + '. ' +
      (inUse.has(cat.id) ? 'It is in use already.' : 'It is ready to use — say the word.');
  }
  return 'I can look at any category, any supplier, or the bonus. Or I can hand you to ' +
    SPECIALIST.name + ', who does this for a living.';
}

const PROMPTS = ['What do I actually have to change?', 'How is the bonus worked out?',
  'How much am I leaving behind?'];

function renderAsstFoot(){
  $('#asstFoot').innerHTML =
    PROMPTS.map(p => '<button class="pchip">' + p + '</button>').join('') +
    '<div class="asst-in"><input id="asstIn" placeholder="Ask anything…" aria-label="Ask the assistant">' +
    '<button class="asst-send" id="asstSend" aria-label="Send">' + SEND + '</button></div>';
  $$('#asstFoot .pchip').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
  $('#asstSend').addEventListener('click', () => {
    const v = $('#asstIn').value.trim();
    if(v){ $('#asstIn').value = ''; ask(v); }
  });
  $('#asstIn').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); $('#asstSend').click(); }
  });
}
function ask(q){
  const body = $('#asstBody');
  body.insertAdjacentHTML('beforeend', '<div class="msg me">' + esc(q) + '</div>');
  body.scrollTop = body.scrollHeight;
  const wait = document.createElement('div');
  wait.className = 'msg ai';
  wait.textContent = 'Looking…';
  body.appendChild(wait);
  body.scrollTop = body.scrollHeight;
  setTimeout(() => {
    wait.innerHTML = answerFor(q);
    body.scrollTop = body.scrollHeight;
  }, RM ? 20 : 520);
}
function openAsst(){
  $('#asst').classList.add('on');
  $('#asst').setAttribute('aria-hidden', 'false');
  if(!$('#asstBody').children.length){
    $('#asstBody').innerHTML = '<div class="msg ai">Hi ' + state.user.split(' ')[0] +
      '. Ask me anything about your agreements — or hand it to ' + SPECIALIST.name +
      ' if you would rather a person did it.</div>';
    renderAsstFoot();
  }
  setTimeout(() => { const i = $('#asstIn'); if(i) i.focus(); }, 120);
}
function closeAsst(){
  $('#asst').classList.remove('on');
  $('#asst').setAttribute('aria-hidden', 'true');
}
$('#asstX').addEventListener('click', closeAsst);
function askAbout(topic){ openAsst(); ask('Tell me about ' + topic + '.'); }

/* ==========================================================================
   HAND-OFF 2 — a person
   ========================================================================== */
const SLOTS = ['today at 15:00', 'tomorrow at 09:30', 'Thursday at 10:00'];
let slotPick = 1;
function openBooking(topic){
  slotPick = 1;
  $('#dlg').innerHTML =
    '<div class="dlg-top"><span class="portrait">' + SPECIALIST.ini + '</span>' +
    '<span><b id="dlgT">' + SPECIALIST.name + '</b><span>' + SPECIALIST.role + '</span></span></div>' +
    '<p>Lars handles ' + esc(topic).toLowerCase() + ' for companies like yours every week. ' +
    'Pick a time and he calls you — no preparation needed.</p>' +
    '<div class="slots" role="group" aria-label="Pick a time">' +
    SLOTS.map((s,i) => '<button class="slot" data-slot="' + i + '" aria-pressed="' +
      (i === slotPick) + '"><span class="sr-dot">' + TICK + '</span>' +
      s.charAt(0).toUpperCase() + s.slice(1) + '</button>').join('') + '</div>' +
    '<div class="dlg-act"><button class="btn btn-secondary" id="dlgNo">Never mind</button>' +
    '<button class="btn btn-primary" id="dlgYes">Book the call</button></div>';
  $$('#dlg .slot').forEach(b => b.addEventListener('click', () => {
    slotPick = +b.dataset.slot;
    $$('#dlg .slot').forEach(o => o.setAttribute('aria-pressed', o === b));
  }));
  $('#dlgNo').addEventListener('click', closeDlg);
  $('#dlgYes').addEventListener('click', () => {
    booked = {slot:SLOTS[slotPick], topic};
    closeDlg();
    renderAll();
  });
  $('#scrim').classList.add('on');
  $('#dlg').classList.add('on');
  $('#dlg').setAttribute('aria-hidden', 'false');
  setTimeout(() => { const b = $('#dlgYes'); if(b) b.focus(); }, 120);
}
function openAgreement(btn){
  const c = catById(btn.dataset.cat);
  const a = agrRows(c).find(r => r.n === btn.dataset.agr);
  const on = inUse.has(c.id);
  const b = BRAND[a.n];
  $('#dlg').innerHTML =
    '<div class="dlg-top"><span class="agr-chip"' + (b ? ' style="background:' + b.bg + '"' : '') +
      '>' + (b ? '<img src="assets/company-logos/' + b.f + '" alt="">'
                : '<span class="ini">' + initialsOf(a.n) + '</span>') + '</span>' +
    '<span><b id="dlgT">' + a.n + '</b><span>' + c.n + ' · ' +
      (on ? 'in use' : 'ready to use') + '</span></span></div>' +
    '<p class="rec-lbl" style="margin-top:0">What you get</p>' +
    '<ul class="rec-get"><li><span class="tick">' + TICK + '</span><span>' + c.rate +
      '% off the price you pay today.</span></li>' +
    '<li><span class="tick">' + TICK + '</span><span>Covers <b>' + fmt(a.covers) +
      ' kr.</b> of your ' + c.n.toLowerCase() + ' — that is <b>' + saveFig(a.save) +
      '</b> a year.</span></li>' +
    '<li><span class="tick">' + TICK + '</span><span>Same supplier, same delivery. Only the ' +
      'price on the invoice changes.</span></li></ul>' +
    '<div class="dlg-act"><button class="btn btn-secondary" id="dlgNo">Close</button>' +
    (on ? '<button class="btn btn-secondary" id="dlgAsk">Ask about it</button>'
        : '<button class="btn btn-primary" id="dlgUse">Start using it</button>') + '</div>';
  $('#dlgNo').addEventListener('click', closeDlg);
  const askB = $('#dlgAsk');
  if(askB) askB.addEventListener('click', () => { closeDlg(); askAbout(a.n); });
  const useB = $('#dlgUse');
  if(useB) useB.addEventListener('click', () => {
    closeDlg();
    inUse.add(c.id);
    accepted.unshift(c.id);
    deferred = deferred.filter(id => id !== c.id);
    renderAll();
    toast(c);
  });
  $('#scrim').classList.add('on');
  $('#dlg').classList.add('on');
  $('#dlg').setAttribute('aria-hidden', 'false');
  setTimeout(() => { const t = $('#dlgNo'); if(t) t.focus(); }, 120);
}
function closeDlg(){
  $('#scrim').classList.remove('on');
  $('#dlg').classList.remove('on');
  $('#dlg').setAttribute('aria-hidden', 'true');
}
$('#scrim').addEventListener('click', closeDlg);
addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#dlg').classList.contains('on')) closeDlg();
  else if($('#asst').classList.contains('on')) closeAsst();
});

/* boot */
applyPersona('bob');
if(matchMedia('(max-width:1280px)').matches){ railMini = true; $('#rail').classList.add('mini'); }
</script>
