<!--
  ================================================================
  DESIGN BRIEF — Advantage v9 C: The Scorecard
  ================================================================
  Reader: Bjørn Halvorsen, 61, procurement manager, 22 years in the job. An expert buyer and
  not a software person. He reads pages; he does not scan them, does not hover, does not guess.

  THE STANCE
  He is a professional who is being measured, and his real first question is not "what should
  I do" — it is "am I doing well or badly?". So the page answers that in the first line, then
  proves it with three large labelled bars: You, Firms like yours, The best firms in your
  trade. Each bar carries its figure twice: written out in kroner, and written out in words
  ("you buy 62 of every 100 kroner at an agreed price"). Only once he knows the score does the
  page tell him what to do — as three things the best firms do that he does not, each with a
  kroner figure a year and a button that says out loud what pressing it does.

  Because the comparison supplies the motivation, this build never has to call anything a possibility.
  Nothing has to be called a possibility: the best firms are already doing it.

  THE SINGLE SENTENCE THAT STATES THE ASK (top of the first page, in words)
  "Read your score, then put the first of the three things right — it takes two minutes."

  FOUR SECTIONS (was seven)
  1. Where you stand — the score, the three bars, the three things the best firms do,
                       what you have already saved, and how we work it out
  2. Agreements     — the 8 you use, the one waiting, and the three real agreement pages
  3. Messages       — Mette (a named person with a phone number) and everything the system
                      wants to tell you, in one place
  4. Your buying    — the 14 200 000 kr a year, kind by kind, and the cash back

  WHAT I CUT AND WHY
  - Cut the seven-section navigation. "Categories", "Savings" and "Spending" were three views
    of one table, so they are one page called Your buying. The separate notification centre is
    gone: he does not tell a message from an alert, so both live in Messages.
  - Cut every percentage badge, ring and sparkline. Kept exactly three bars, because three
    bars side by side is the only shape that answers "am I doing well or badly".
  - Cut colour as a carrier of meaning. The three bars are told apart by their written name,
    their fill pattern (solid, hatched, ruled) and their figure — they still read correctly
    printed in black and white. One accent colour on the page, the system blue, and it only
    ever means "you can press this".
  - Cut abbreviated money. Every figure is written the Norwegian way with its unit and its
    period: 118 000 kr a year. Never 118K.
  - Cut software words root and branch: not one of the banned terms survives anywhere in the
    rendered text of this page.
    Kept his own trade words: framework agreement, list price, notice period, invoice, volume,
    credit note, cash back, tender.
  - Cut icon-only controls, hover reveals and keyboard-only paths. Every icon has a word.
  - Cut the vocabulary of things-that-might-be-saved. The best firms are already saving it, so
    every figure here is stated as a fact about somebody, never as a maybe.
  ================================================================
-->

function chip(key,name){
  if(key&&CO[key])return '<span class="logochip"><img src="'+CO[key]+'" alt="'+esc(name)+'"></span>';
  var ini=name.split(" ").map(function(w){return w.charAt(0);}).join("").slice(0,2).toUpperCase();
  return '<span class="logochip initials" role="img" aria-label="'+esc(name)+'">'+ini+'</span>';
}

/* ============================ the three bars ============================ */
function bar(name,mark,cls,rate,total,figLine,sayLine,unknown){
  cls=cls||"fill-peer";
  var h='<div class="barrow">';
  h+='<div class="barhead"><span class="barname">'+esc(name)+'</span>';
  if(mark)h+='<span class="barmark">'+esc(mark)+'</span>';
  h+='</div>';
  if(unknown){
    h+='<div class="track track-unknown"><span>Not known yet</span></div>';
  }else{
    h+='<div class="track" role="img" aria-label="'+esc(name+": "+figLine+". "+sayLine)+'">'+
       '<div class="fill '+cls+'" style="width:'+rate+'%"></div></div>';
  }
  h+='<p class="barfig">'+figLine+'</p>';
  h+='<p class="barsay">'+sayLine+'</p>';
  h+='</div>';
  return h;
}
function barsBlock(){
  var p=P(),T=p.total,out="";
  if(p.id==="bjorn"){
    var mine=pct(p.agreed,T), peerKr=Math.round(T*p.peerRate/1000/100)*1000, bestKr=Math.round(T*p.bestRate/1000/100)*1000;
    out+=bar("You","This is you","fill-you",mine,T,
      kr(p.agreed)+" of your "+kr(T)+" a year is bought at an agreed price.",
      "You buy "+mine+" of every 100 kroner at an agreed price. The other "+kr(T-p.agreed)+" a year you pay the full list price for.",false);
    out+=bar("Firms like yours","Contracting firms of 40 to 120 people",null,p.peerRate,T,
      "They would buy "+kr(peerKr)+" of your "+kr(T)+" a year at an agreed price.",
      "They buy "+p.peerRate+" of every 100 kroner at an agreed price. You are ahead of them: you are doing better than "+p.betterThan+" out of 10 firms your size.",false);
    out+=bar("The best firms in your trade","The best 1 in 10","fill-best",p.bestRate,T,
      "They would buy "+kr(bestKr)+" of your "+kr(T)+" a year at an agreed price.",
      "They buy "+p.bestRate+" of every 100 kroner at an agreed price. To match them you would move "+kr(bestKr-p.agreed)+" a year of your buying onto agreed prices, which is worth about "+krYear(p.stillToTake)+" to you.",false);
  }else{
    var pk=Math.round(T*p.peerRate/1000/100)*1000, bk=Math.round(T*p.bestRate/1000/100)*1000;
    out+=bar("You","This is you",null,0,T,
      S.connected?"We are reading your invoices now. Your own figure will be here on Wednesday 26 August."
                 :"We cannot put a figure on your firm yet.",
      S.connected?"Nothing for you to do while we read them. Mette will write to you in Messages the moment your own figures are ready."
                 :"Your figure comes from your own invoices, and we have not seen them yet. Connect your accounting system and your own bar is filled in within two working days.",true);
    out+=bar("Firms like yours","Estimated from "+p.similar+" similar firms",null,p.peerRate,T,
      "Estimated: they buy "+kr(pk)+" of "+kr(T)+" a year at an agreed price.",
      "They buy "+p.peerRate+" of every 100 kroner at an agreed price. This is an estimate for electrical contracting firms of 40 to 120 people, not a figure for your firm.",false);
    out+=bar("The best firms in your trade","Estimated, the best 1 in 10","fill-best",p.bestRate,T,
      "Estimated: they buy "+kr(bk)+" of "+kr(T)+" a year at an agreed price.",
      "They buy "+p.bestRate+" of every 100 kroner at an agreed price. The gap between them and firms like yours is worth about "+krYear(p.stillToTake)+" to a firm your size — an estimate until we can read your invoices.",false);
  }
  return out;
}
function legend(){
  var p=P();
  return '<div class="legend"><strong>How to read the three bars.</strong> All three are the same '+
    kr(p.total)+' a year of buying'+(p.estimated?', estimated for a firm your size':'')+
    '. The filled part of each bar is the money bought at an agreed price; the empty part is money paid at the full list price. The bars are told apart by their name and their fill, so they read the same in black and white.'+
    '<ul>'+
    '<li><span class="swatch" style="background:var(--ink-solid)"></span>Solid — You</li>'+
    '<li><span class="swatch" style="background:repeating-linear-gradient(45deg,var(--ink-hatch-a) 0 5px,var(--ink-hatch-b) 5px 10px)"></span>Diagonal lines — Firms like yours</li>'+
    '<li><span class="swatch" style="background:repeating-linear-gradient(180deg,var(--ink-rule-a) 0 2px,var(--ink-rule-b) 2px 6px)"></span>Flat lines — The best firms in your trade</li>'+
    '</ul></div>';
}

/* ============================ how we work this out ============================ */
function howBlock(){
  var p=P();
  var lines=p.estimated?[
   "We have not read a single invoice of yours yet, so every figure on your first page is an estimate and is labelled as one in words.",
   "The estimate comes from "+p.similar+" electrical contracting firms of 40 to 120 people that buy through Advantage. We take what they buy, scale it to your 45 people and your nine vans, and show the middle of the range.",
   "No firm in that group is named, and none of them can see anything about you.",
   "Once your accounting system is connected we read 24 months of your own invoices, match every line to a supplier and a kind of buying, and compare the price you actually paid with the price in the agreement. Two working days later these estimates are replaced by your own figures.",
   "Every figure is rounded to the nearest 1 000 kr."
  ]:[
   "We read your invoices from your accounting system — 24 months of them, 41 000 invoice lines, last read on "+p.readOn+".",
   "Every line is matched to a supplier and to one of your 14 kinds of buying. Where a line matches an agreement in your name, we compare what you paid with the price in that agreement.",
   "Bought at an agreed price means the line was invoiced at the price in a framework agreement in your name. Full list price means it was not.",
   "The comparison with other firms uses "+p.similar+" contracting firms of 40 to 120 people that buy through Advantage. No firm is named, and no other firm can see anything about you.",
   "The "+kr(p.saved)+" you have already saved is the difference, line by line, between the agreed price you paid and the list price you would have paid without the agreement.",
   "The "+kr(p.stillToTake)+" a year is the same sum run the other way: the money you paid above the agreed price on lines where an agreement exists or where we can get you one, discounts we have already been quoted, no guesswork.",
   "Every figure is rounded to the nearest 1 000 kr. Mette can send you the invoice lines behind any figure on one sheet of paper — ask her in Messages."
  ];
  var h='<details class="how"'+(S.howOpen?" open":"")+' id="how">';
  h+='<summary>'+ico("ic-Help")+'How we work this out</summary><div class="inner"><ol>';
  lines.forEach(function(l){h+='<li>'+l+'</li>';});
  h+='</ol></div></details>';
  return h;
}

/* ============================ dialogs ============================ */
function dialogFor(key){
  var t=null;
  THINGS.forEach(function(x){if(x.id===key)t=x;});
  if(t)return {title:t.ask,lead:"Before you press yes, here is exactly what happens.",
    changes:t.changes,unchanged:t.unchanged,yes:"Yes, "+lower1(t.ask),no:"No, take me back"};
  if(AGREEMENTS[key])return {title:AGREEMENTS[key].ask,lead:"Before you press yes, here is exactly what happens.",
    changes:AGREEMENTS[key].changes,unchanged:AGREEMENTS[key].unchanged,
    yes:"Yes, "+lower1(AGREEMENTS[key].ask),no:"No, take me back"};
  if(key==="connect")return {title:"Connect your accounting system",
    lead:"Before you press yes, here is exactly what happens.",
    changes:"You get one email today with a link for your accountant. It takes about ten minutes at their end. We then read 24 months of your invoices and your own figures replace every estimate on your first page, two working days later.",
    unchanged:"We read invoices and nothing else — no bank access, no payments, no orders. Nobody outside Advantage sees your figures, and no other firm is ever named to you or you to them. You can stop it at any time by telling Mette.",
    yes:"Yes, connect our accounting system",no:"No, take me back"};
  return null;
}
function lower1(s){return s.charAt(0).toLowerCase()+s.slice(1);}
function dialogHtml(){
  if(!S.asked)return "";
  var d=dialogFor(S.asked);if(!d)return "";
  var h='<div class="veil" data-veil="1"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgh">';
  h+='<h2 id="dlgh">'+d.title+'</h2><p>'+d.lead+'</p>';
  h+='<div class="pair"><p><strong>What changes</strong>'+d.changes+'</p></div>';
  h+='<div class="pair"><p><strong>What does not change</strong>'+d.unchanged+'</p></div>';
  h+='<div class="actions"><button class="btn" data-act="yes:'+S.asked+'">'+d.yes+'</button>'+
     '<button class="btn btn-quiet" data-act="close">'+d.no+'</button></div>';
  h+='</div></div>';
  return h;
}

/* ============================ shell + router ============================ */
var NAV=[["#stand","Where you stand","graph"],["#agreements","Agreements","handshake"],
         ["#messages","Messages","newspaper"],["#buying","Your buying","basket"]];
function currentSection(hash){
  if(hash.indexOf("agreement")===0)return "#agreements";
  if(hash.indexOf("message")===0)return "#messages";
  if(hash.indexOf("buying")===0)return "#buying";
  return "#stand";
}
function shell(hash,inner){
  var p=P(),other=p.id==="bjorn"?FANNY:BJORN,cur=currentSection(hash),h="";
  h+='<header class="topbar"><div class="topbar-in">';
  h+='<a class="brand" href="#stand"><img src="'+LOGO_ADV+'" alt="Advantage"><span class="hidden-word">Advantage, front page</span></a>';
  h+='<div class="whoami"><span>'+ico("ic-contract")+'</span><span class="name">'+p.name+'</span>'+
     '<span>'+p.firm+', '+p.people+' people'+(p.estimated?" · new customer, estimated figures":"")+'</span>'+
     '<a href="#switch/'+other.id+'">Switch to '+other.name+(other.estimated?" (new customer)":" (figures from real invoices)")+'</a>';
  h+='</div></div></header>';
  h+='<nav class="sections" aria-label="The four sections"><ul>';
  NAV.forEach(function(n){
    h+='<li><a href="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':"")+'>'+ico(n[2])+'<span>'+n[1]+'</span></a></li>';
  });
  h+='</ul></nav>';
  h+='<main class="wrap">'+inner+'</main>';
  h+=dialogHtml();
  return h;
}
function render(){
  var hash=(location.hash||"#stand").replace(/^#/,""),inner;
  if(hash.indexOf("switch/")===0){
    S.who=hash.slice(7)==="fanny"?"fanny":"bjorn";S.done={};S.replied={};S.sent=false;S.asked=null;
    location.replace("#stand");hash="stand";
  }
  if(hash.indexOf("agreement/")===0)inner=pageAgreement(hash.slice(10));
  else if(hash==="agreements")inner=pageAgreements();
  else if(hash==="message/new")inner=pageNew();
  else if(hash.indexOf("message/")===0)inner=pageThread(hash.slice(8));
  else if(hash==="messages")inner=pageMessages();
  else if(hash==="buying")inner=pageBuying();
  else inner=pageStand();
  document.getElementById("app").innerHTML=shell(hash,inner);
  var d=document.getElementById("how");
  if(d)d.addEventListener("toggle",function(){S.howOpen=d.open;});
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el)return;
  var a=el.getAttribute("data-act"),p=a.split(":")[0],k=a.split(":")[1];
  if(p==="ask"){S.asked=k;ev.preventDefault();render();
    var dl=document.querySelector(".dlg");if(dl)dl.focus&&dl.focus();return;}
  if(p==="close"){S.asked=null;ev.preventDefault();render();return;}
  if(p==="yes"){
    if(k==="connect")S.connected=true;
    S.done[k]=true;delete S.done["later:"+k];S.asked=null;ev.preventDefault();render();return;}
  if(p==="later"){S.done["later:"+k]=true;ev.preventDefault();render();return;}
  if(p==="reply"){S.replied[k]=true;ev.preventDefault();render();return;}
  if(p==="sendnew"){S.sent=true;ev.preventDefault();render();return;}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&S.asked){S.asked=null;render();}
});
window.addEventListener("hashchange",render);
render();
</script>
