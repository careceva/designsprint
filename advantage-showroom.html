<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F6F6">
<title>Advantage showroom</title>
<style>
:root{--canvas:#F4F6F6;--white:#fff;--ink:#1d1d1f;--soft:#6e6e73;--faint:#a1a1a6;
 --accent:#0071e3;--hair:#e6e7e8;--r:14px;--r-lg:20px;--r-full:999px;
 --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sf);background:var(--canvas);color:var(--ink);font-size:16px;
 line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3{letter-spacing:-.028em;font-weight:650;line-height:1.2}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.page{max-width:1280px;margin:0 auto;padding:44px 28px 88px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:34px}
.top p{color:var(--soft);margin-top:6px;max-width:62ch}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button,.filters button{min-height:42px;padding:0 18px;border:none;border-radius:var(--r-full);
 background:var(--white);font-weight:600;font-size:14.5px;color:var(--ink)}
.modes button.on,.filters button.on{background:var(--ink);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.hint{font-size:14px;color:var(--soft);margin:-10px 0 20px;display:none}
.hint.on{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--white);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;
 text-align:left;border:none;padding:0;transition:transform .18s ease}
.card:hover{transform:translateY(-2px)}
.card.sel{outline:3px solid var(--accent);outline-offset:0}
.shot{aspect-ratio:16/10;background:#e9ebec;position:relative;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot .g{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
 text-transform:uppercase;background:#ffffffe6;color:var(--soft);padding:5px 10px;border-radius:var(--r-full)}
.meta{padding:16px 20px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.meta h3{font-size:19px}
.meta .fn{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint)}
.meta p{font-size:14px;color:var(--soft);line-height:1.5;margin-top:4px}
.meta .act{margin-top:auto;padding-top:12px;font-size:14px;font-weight:600;color:var(--accent)}

/* theater */
.theater{position:fixed;inset:0;z-index:50;background:var(--canvas);display:none;flex-direction:column}
.theater.on{display:flex}
.stagebar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#edf5ff;
 border-bottom:1px solid #bdd7ff;flex-wrap:wrap}
.stagebar .nm{font-weight:650;font-size:16px;min-width:0}
.stagebar .nm span{color:var(--faint);font-weight:500;font-size:13px;margin-left:8px}
.stagebar .grow{flex:1}
.navbtn{min-height:40px;padding:0 14px;border:1px solid #bdd7ff;border-radius:var(--r-full);background:var(--white);font-weight:600;font-size:14px}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 13px;border:none;border-radius:var(--r-full);
 background:var(--white);font-size:13px;font-weight:600;color:var(--soft)}
.chips button.on{background:var(--accent);color:#fff}
.count{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;color:#1b64dc;
 background:var(--white);border:1px solid #bdd7ff;border-radius:var(--r-full);
 min-height:40px;display:inline-flex;align-items:center;padding:0 14px;white-space:nowrap}
.stage{flex:1;min-height:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

/* compare */
.compare{position:fixed;inset:0;z-index:50;background:var(--canvas);display:none;flex-direction:column}
.compare.on{display:flex}
.duo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--hair)}
.pane{background:#fff;display:flex;flex-direction:column;min-width:0}
.panebar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair)}
.panebar select{min-height:38px;padding:0 10px;border:1px solid var(--hair);border-radius:10px;
 background:var(--white);font-family:inherit;font-size:14px;font-weight:600;max-width:230px}
.panebar a{font-size:13px;font-weight:600;white-space:nowrap}
.pwrap{flex:1;min-height:0;position:relative;overflow:hidden}
.pwrap iframe{position:absolute;top:0;left:0;width:1440px;height:0;border:0;background:#fff;
 transform-origin:top left}
@media(max-width:860px){.duo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Advantage showroom</h1>
      <p>Every dashboard, live. Open one and flip between designs without losing your place,
      or put two side by side on the same screen.</p>
    </div>
    <div class="modes">
      <button id="mBrowse" class="on">Browse</button>
      <button id="mCompare">Compare two</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <p class="hint" id="cmpHint">Pick two dashboards to compare. First pick fills the left side.</p>
  <div class="grid" id="grid"></div>
</div>

<div class="theater" id="theater" role="dialog" aria-label="Prototype viewer">
  <div class="stagebar">
    <button class="navbtn" id="tClose">Close</button>
    <span class="nm" id="tName"></span>
    <div class="grow"></div>
    <div class="chips" id="tChips"></div>
    <div class="grow"></div>
    <button class="navbtn" id="tPrev">&#8592; Previous design</button>
    <span class="count" id="tCount" aria-live="polite"></span>
    <button class="navbtn primary" id="tNext">Next design &#8594;</button>
    <a class="navbtn" id="tOpen" target="_blank" style="display:inline-flex;align-items:center">Open in tab</a>
  </div>
  <div class="stage"><iframe id="tFrame" title="Prototype"></iframe></div>
</div>

<div class="compare" id="compare" role="dialog" aria-label="Compare prototypes">
  <div class="stagebar">
    <button class="navbtn" id="cClose">Close</button>
    <span class="nm">Side by side</span>
    <div class="grow"></div>
    <div class="chips" id="cChips"></div>
    <div class="grow"></div>
    <span style="font-size:13px;color:var(--soft)">Both panes show the same screen</span>
  </div>
  <div class="duo">
    <div class="pane">
      <div class="panebar"><select id="selA"></select><div class="grow" style="flex:1"></div><a id="openA" target="_blank">Open in tab</a></div>
      <div class="pwrap" id="wrapA"><iframe id="frA" title="Left prototype"></iframe></div>
    </div>
    <div class="pane">
      <div class="panebar"><select id="selB"></select><div class="grow" style="flex:1"></div><a id="openB" target="_blank">Open in tab</a></div>
      <div class="pwrap" id="wrapB"><iframe id="frB" title="Right prototype"></iframe></div>
    </div>
  </div>
</div>

const LABELS = [["overview", "Overview"], ["agreement", "An agreement"], ["category", "A category"], ["notifications", "Notifications"], ["messages", "Messages / inbox"], ["savings", "Savings"], ["spending", "Spending"]];
const $ = s => document.querySelector(s);

let mode='browse', filter='All', cur=0, route='overview', picks=[];

/* ---------- grid ---------- */
const GROUPS=['All','Plain language','Full product','History','Yours'];
function drawFilters(){
  $('#filters').innerHTML = GROUPS.map(g=>
    `<button data-g="${g}" class="${g===filter?'on':''}">${g}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>
    b.onclick=()=>{filter=b.dataset.g;drawFilters();drawGrid();});
}
function visible(){ return DATA.map((d,i)=>({...d,i})).filter(d=>filter==='All'||d.group===filter); }
function drawGrid(){
  $('#grid').innerHTML = visible().map(d=>`
    <button class="card ${picks.includes(d.i)?'sel':''}" data-i="${d.i}">
      <span class="shot"><img src="${d.thumb}" alt="Screenshot of ${d.title}"><span class="g">${d.group}</span></span>
      <span class="meta"><h3>${d.title}</h3><span class="fn">${d.file}</span>
      <p>${d.desc}</p>
      <span class="act">${mode==='browse'?'View live &rarr;':(picks.includes(d.i)?'Picked &#10003;':'Pick this one')}</span></span>
    </button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i;
    if(mode==='browse'){openTheater(i);}
    else{
      if(picks.includes(i)) picks=picks.filter(x=>x!==i); else picks=[...picks,i].slice(-2);
      drawGrid();
      if(picks.length===2) openCompare();
    }
  });
}
$('#mBrowse').onclick=()=>{mode='browse';picks=[];$('#mBrowse').classList.add('on');
  $('#mCompare').classList.remove('on');$('#cmpHint').classList.remove('on');drawGrid();};
$('#mCompare').onclick=()=>{mode='compare';$('#mCompare').classList.add('on');
  $('#mBrowse').classList.remove('on');$('#cmpHint').classList.add('on');drawGrid();};

/* ---------- routes ---------- */
function src(i,rt){
  const d=DATA[i];
  const key = d.routes[rt]!==undefined ? rt : 'overview';
  return d.file + (d.routes[key]||'');
}
function chipHtml(i,activeRoute){
  return LABELS.filter(([k])=>DATA[i].routes[k]!==undefined).map(([k,l])=>
    `<button data-r="${k}" class="${k===activeRoute?'on':''}">${l}</button>`).join('');
}

/* ---------- theater ---------- */
function openTheater(i){ cur=i; $('#theater').classList.add('on'); renderTheater(true); }
function renderTheater(reload){
  const d=DATA[cur];
  if(d.routes[route]===undefined) route='overview';
  $('#tName').innerHTML = d.title + `<span>${d.file}</span>`;
  $('#tCount').textContent = (cur+1) + ' / ' + DATA.length;
  $('#tChips').innerHTML = chipHtml(cur,route);
  document.querySelectorAll('#tChips button').forEach(b=>b.onclick=()=>{route=b.dataset.r;renderTheater(true);});
  $('#tOpen').href = src(cur,route);
  if(reload) $('#tFrame').src = src(cur,route);
}
function step(n){
  const next=(cur+n+DATA.length)%DATA.length;
  const wrapped = (n>0 && next<cur) || (n<0 && next>cur);
  cur=next; renderTheater(true);
  if(wrapped){ $('#tCount').textContent = (cur+1)+' / '+DATA.length+' · back to the start'; }
}
$('#tPrev').onclick=()=>step(-1);
$('#tNext').onclick=()=>step(1);
$('#tClose').onclick=()=>{$('#theater').classList.remove('on');$('#tFrame').src='about:blank';};

/* ---------- compare ---------- */
function fitPane(wrapId,frId){
  const w=$('#'+wrapId).getBoundingClientRect();
  const s=w.width/1440;
  const f=$('#'+frId);
  f.style.transform=`scale(${s})`;
  f.style.height=(w.height/s)+'px';
}
function openCompare(){
  $('#compare').classList.add('on');
  ['A','B'].forEach((side,idx)=>{
    const sel=$('#sel'+side);
    sel.innerHTML=DATA.map((d,i)=>`<option value="${i}" ${i===picks[idx]?'selected':''}>${d.title}</option>`).join('');
    sel.onchange=()=>{picks[idx]=+sel.value;renderCompare();};
  });
  renderCompare();
  requestAnimationFrame(()=>{fitPane('wrapA','frA');fitPane('wrapB','frB');});
}
function renderCompare(){
  const common = LABELS.filter(([k])=>DATA[picks[0]].routes[k]!==undefined&&DATA[picks[1]].routes[k]!==undefined);
  if(!common.some(([k])=>k===route)) route='overview';
  $('#cChips').innerHTML = common.map(([k,l])=>
    `<button data-r="${k}" class="${k===route?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('#cChips button').forEach(b=>b.onclick=()=>{route=b.dataset.r;renderCompare();});
  $('#frA').src=src(picks[0],route); $('#frB').src=src(picks[1],route);
  $('#openA').href=src(picks[0],route); $('#openB').href=src(picks[1],route);
  fitPane('wrapA','frA'); fitPane('wrapB','frB');
}
$('#cClose').onclick=()=>{$('#compare').classList.remove('on');
  $('#frA').src='about:blank';$('#frB').src='about:blank';picks=[];drawGrid();};
window.addEventListener('resize',()=>{ if($('#compare').classList.contains('on')){fitPane('wrapA','frA');fitPane('wrapB','frB');} });

/* keyboard as a shortcut, never the only path */
document.addEventListener('keydown',e=>{
  if($('#theater').classList.contains('on')){
    if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1);
    if(e.key==='Escape')$('#tClose').click();
  } else if($('#compare').classList.contains('on')&&e.key==='Escape'){ $('#cClose').click(); }
});

drawFilters();drawGrid();
</script>
</body>
</html>
