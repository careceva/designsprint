<!doctype html>
<!--
  ============================================================================
  ADVANTAGE — ALT 2 · "THE TRUST MACHINE"
  ============================================================================

  THESIS (2 sentences)
  Everything Advantage shows Fanny is a machine-generated claim about her own
  business, made from sector, size, location and scraped industry data, so the
  product's only real job is to make those claims checkable. Every pixel must
  therefore either build trust or spend it: this version deletes the surface
  that spends it and replaces it with an evidence system — provenance on every
  number, the peer distribution instead of a median, error bars that visibly
  narrow, a published track record of our own misses, and a first-class way for
  the customer to say "that's wrong" and change the model.

  REMOVED from advantage-v2-visual.html — and why
  · The semicircle savings gauge. It renders a best-case ceiling (35%) with the
    visual grammar of a forecast. A dial reads as "where you are"; this was
    "where nobody is". It is the single most misleading element on v2.
  · The "Easy deal — 35% discount" promo tile. Advertising inside a financial
    statement. It taught the reader that some numbers here are being sold to
    her, which retroactively taints the honest ones.
  · "Savings potential up to 35%" as a headline stat. "Up to" hedges without
    quantifying: it cannot be wrong, so it cannot be trusted. Replaced by a
    confidence-weighted total with an explicit ± and a P25 option.
  · The three generic saving-assistant tips (and the assistant panel that
    carried them). Assertions with no evidence attached, in a product whose
    whole problem is unattached assertions.
  · Decorative supplier photography on the agreement/category cards. Stock
    imagery of timber yards implies we have looked at her timber yard. Supplier
    LOGOS stay — they are identity, not implied knowledge.
  · The activity rail's empty state ("everything will show up here"), Weekly
    discovery, the announcement banner and the notification bell. Four pieces
    of chrome asking for attention on behalf of nothing.

  ADDED — and why
  · Provenance on every single figure. Every number is a real button: peer set
    (n=, how selected), method, named inputs, and what specifically would make
    it exact. No number without a source.
  · The peer distribution instead of the median. A hand-authored SVG of the
    148-company cohort with the IQR, the median tick and her own position, so a
    range is what she reads first. A point estimate about a stranger's business
    is a claim to knowledge we do not have.
  · Error bars with the arithmetic exposed, that actually narrow: ±15% sector
    only → ±8% with a spend report → ±3% with invoice history → ±0 once
    realised and reconciled. The narrowing is the product's argument for
    connecting data, made without a single persuasive adjective.
  · A track record. Seven quarters of our own estimates against actual
    outcomes, including the quarter we were 4,8% low and why. Mean absolute
    error is computed on screen. This is the most powerful trust device
    available and v2 has none of it.
  · "Challenge this number" as a first-class affordance. She supplies the
    correction, the model recomputes in front of her, the correction is logged
    and reversible, and the category's error bar changes. Disagreement is data.
  · Confidence-weighted totals with a median / conservative (P25) switch that
    really recomputes — including the volume bonus, which is tiered and so does
    not scale linearly. Verified personas cannot take a percentile of a
    measurement, and the control says so.
  · A method page in plain language that names the sources, including the
    scraped ones (supplier web-shop list prices, crawled weekly) and the
    minimum-cell rule that protects the cohort.

  STRONGEST OBJECTION TO THIS VERSION
  Nobody asked for an audit. Fanny opened a procurement product to find money,
  and this page answers with quartiles, calibration error and a method page —
  it is possible that honesty at this density reads as hedging, that showing
  "we were 6,2% high in Q3 2024" simply teaches her the numbers are unreliable,
  and that a cheerful gauge saying "35%" converts more people into connecting
  their ERP, at which point they get exact numbers anyway and the deception was
  temporary. The counter-argument is that this only holds for the first
  session: the gauge's credibility is spent once, on someone who cannot yet
  check it, and cannot be re-earned. But the objection is real, and it is an
  empirical question this prototype does not settle.
  ============================================================================
-->

<style>
/* ==========================================================================
   Advantage Design System — tokens copied verbatim from advantage-v2-visual.html
   ========================================================================== */
:root{
  --general-background:#fafafa;
  --general-foreground:#0f0f0f;
  --general-primary:#1b64dc;
  --general-primary-foreground:#fafafa;
  --general-secondary:#dbe9ff;
  --general-secondary-foreground:#1c1c1c;
  --general-muted:#f2f2f2;
  --general-muted-foreground:#707070;
  --general-accent:#ff9b3d;
  --general-accent-foreground:#1c1c1c;
  --general-destructive:#dc2626;
  --general-border:#bdd7ff;
  --general-input:#ffffff;

  --sidebar-border:#e0e0e0;

  --sentiment-positive:#009689;
  --sentiment-negative:#f54a00;

  --surface:#ffffff;
  --brand-midnight:#000a45;
  --brand-ice:#edf5ff;
  --brand-cornflower:#73abff;

  --font-sans:"Rethink Sans","Rethink Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;--text-5xl:48px;

  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;
  --rounded-xl:20px;--rounded-2xl:25px;--rounded-3xl:40px;--rounded-full:9999px;

  --shadow-2xs:0 1px 0 0 #0000000d;
  --shadow-xs:0 1px 2px 0 #0000000d;
  --shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --shadow-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --shadow-xl:0 20px 25px -5px #0000001a,0 8px 10px -6px #0000001a;

  /* 8pt spacing scale — note there is deliberately no --s5/--s7/--s9/--s10:
     in-between values are written var(--s5,20px) with an explicit fallback,
     because an unresolved var() silently voids the whole declaration. */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;

  --hairline:#ececec;

  --t-fast:.15s ease;
  --t:.28s cubic-bezier(.2,.7,.3,1);
  --t-slow:.5s cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--font-body);background:var(--surface);color:var(--general-foreground);
  font-size:var(--text-base);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-sans);font-weight:600;text-wrap:balance}
h1{font-size:var(--text-5xl);letter-spacing:-1.2px;line-height:1.1}
h2{font-size:var(--text-2xl);letter-spacing:-.7px;line-height:1.18}
h3{font-size:var(--text-lg);letter-spacing:-.3px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--general-muted-foreground)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
[tabindex="-1"]:focus-visible{outline:none}
::selection{background:var(--general-secondary)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  height:44px;padding:0 var(--s6);border:1px solid transparent;cursor:pointer;
  border-radius:var(--rounded-full);font-size:var(--text-sm);font-weight:500;white-space:nowrap;
  transition:background-color var(--t-fast),color var(--t-fast),border-color var(--t-fast),
             box-shadow var(--t-fast),opacity var(--t-fast),transform .1s ease}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn-primary{background:var(--general-primary);color:var(--general-primary-foreground);
  box-shadow:0 1px 2px #1b64dc40,inset 0 1px 0 #ffffff26}
.btn-primary:hover:not([disabled]){background:#1553bb}
.btn-primary[disabled]{background:var(--general-muted);color:#a3a3a3;box-shadow:none}
.btn-secondary{background:var(--surface);border-color:var(--sidebar-border);box-shadow:var(--shadow-xs)}
.btn-secondary:hover:not([disabled]){background:var(--brand-ice);border-color:var(--general-border)}
.btn-secondary[disabled]{background:var(--general-muted);border-color:transparent;color:#8f8f8f;box-shadow:none}
.btn-ghost{background:transparent;color:var(--general-primary);padding:0 var(--s3);height:36px}
.btn-ghost:hover{background:var(--brand-ice)}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 var(--s4);font-size:var(--text-xs)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--general-primary);
  font-size:var(--text-sm);font-weight:500;border-radius:var(--rounded-xs)}
.linkbtn:hover{text-decoration:underline}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rounded-full);
  font-size:13px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.chip svg{width:12px;height:12px}
.chip-soft{background:var(--general-muted);color:var(--general-muted-foreground)}
.chip-good{background:#d9f2ef;color:var(--sentiment-positive)}
.chip-warn{background:#fff2e0;color:#a35c00}
.est-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rounded-full);
  background:var(--general-muted);color:var(--general-muted-foreground);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.est-chip svg{width:11px;height:11px;flex:0 0 auto}
.est-chip.est{background:#fff2e0;color:#a35c00}
.est-chip.ver{background:#d9f2ef;color:var(--sentiment-positive)}
.est-chip.dec{background:var(--general-secondary);color:#123f8c}

.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-xl);
  box-shadow:var(--shadow-sm)}

/* ==========================================================================
   LOGIN — same pattern as v2
   ========================================================================== */
.flow{min-height:100vh;display:flex;flex-direction:column}
.stage{flex:1 1 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1 1 auto}
.scr.on{display:flex;flex-direction:column}
.scr.on.mid{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;
  padding:var(--s12) var(--s6)}
.scr.on>*{animation:rise var(--t-slow) both;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.login{width:420px;max-width:100%;text-align:center}
.login .mark{height:40px;width:auto;margin:0 auto var(--s8)}
.login h1{font-size:var(--text-5xl);letter-spacing:-2px}
.lead{font-size:var(--text-lg);color:var(--general-muted-foreground);line-height:1.55;
  max-width:52ch;margin-top:var(--s3)}
.login .lead{font-size:var(--text-base);margin:var(--s3) auto 0;max-width:36ch;text-align:center}
.login .card{margin-top:var(--s12);padding:var(--s8);text-align:left}
.login-choice{display:flex;flex-direction:column;gap:var(--s3)}
.login-persona{display:flex;align-items:center;gap:var(--s4);width:100%;padding:var(--s4);
  border:1px solid var(--hairline);border-radius:var(--rounded-lg);background:var(--surface);
  cursor:pointer;text-align:left;transition:var(--t-fast)}
.login-persona:hover,.login-persona:focus-visible{border-color:var(--general-border);background:var(--brand-ice)}
.login-persona-av{flex:0 0 auto;width:40px;height:40px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--brand-ice);color:var(--general-primary);
  font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.login-persona:hover .login-persona-av{background:var(--surface)}
.login-persona-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.login-persona-txt b{font-size:var(--text-sm);font-weight:600}
.login-persona-txt span{font-size:12px;color:var(--general-muted-foreground)}
.login-persona-go{flex:0 0 auto;width:16px;height:16px;color:#a3a3a3;transition:color var(--t-fast)}
.login-persona:hover .login-persona-go,.login-persona:focus-visible .login-persona-go{color:var(--general-primary)}
.tinyfoot{margin-top:var(--s6);font-size:var(--text-xs);color:#8f8f8f;text-align:center}

/* ==========================================================================
   APP SHELL — wrap / appbar / rail / canvas / page, as v2
   ========================================================================== */
body.in-app{background:var(--brand-midnight);overflow:hidden}
body.in-app .flow{display:none}
.app{display:none;flex-direction:column;height:100vh;height:100dvh}
.app.on{display:flex;animation:rise var(--t-slow) both}
.wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--rounded-2xl) var(--rounded-2xl) 0 0;overflow:hidden;
  box-shadow:0 -1px 0 #ffffff1a,var(--shadow-xl);margin-top:var(--s3)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);height:68px;padding:0 var(--s6);
  border-bottom:1px solid var(--hairline)}
.appbar .brand{display:flex;align-items:center;flex:0 0 auto}
.appbar .brand img{height:28px;width:auto;display:block}
.appbar .spacer{flex:1}
.basis{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s3);
  background:var(--surface);border:1px solid var(--sidebar-border);border-radius:var(--rounded-full);
  box-shadow:var(--shadow-2xs);cursor:pointer;transition:var(--t-fast);text-align:left}
.basis:hover{border-color:var(--general-border);background:var(--brand-ice)}
.basis .dot{width:8px;height:8px;flex:0 0 auto;border-radius:var(--rounded-full);
  background:var(--general-accent)}
.basis.verified .dot{background:var(--sentiment-positive)}
.basis .bt{display:flex;flex-direction:column;line-height:1.25}
.basis .bt b{font-size:var(--text-xs);font-weight:600;white-space:nowrap}
.basis .bt span{font-size:13px;color:var(--general-muted-foreground);font-family:var(--font-mono);
  white-space:nowrap}
@media(max-width:1100px){.basis .bt span{display:none}}
.userwrap{position:relative;flex:0 0 auto}
.user{display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 var(--s2);background:none;
  border:none;cursor:pointer;border-radius:var(--rounded-full);transition:var(--t-fast)}
.user:hover{background:var(--general-muted)}
.user .uav{width:30px;height:30px;flex:0 0 auto;border-radius:var(--rounded-full);display:grid;
  place-items:center;color:#fff;font-family:var(--font-sans);font-size:13px;font-weight:600;
  background:linear-gradient(135deg,#2170ed,#0b00ab)}
.user .un{font-size:var(--text-xs);font-weight:600;text-align:left;line-height:1.25;white-space:nowrap}
.user .un span{display:block;font-weight:400;color:var(--general-muted-foreground)}
.user .uc{width:14px;height:14px;color:var(--general-muted-foreground)}
@media(max-width:1000px){.user .un{display:none}}
.upop{position:absolute;top:calc(100% + 8px);right:0;z-index:35;width:260px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rounded-lg);
  box-shadow:var(--shadow-xl);opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity var(--t-fast),transform var(--t-fast)}
.upop.on{opacity:1;transform:none;pointer-events:auto}
.up-h{padding:var(--s4);border-bottom:1px solid var(--hairline)}
.up-h b{display:block;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:600}
.up-h span{display:block;font-size:13px;color:var(--general-muted-foreground);margin-top:1px}
.up-i{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);
  background:none;border:none;cursor:pointer;text-align:left;font-size:var(--text-sm);
  transition:var(--t-fast)}
.up-i:hover{background:var(--general-muted)}
.up-i svg{width:16px;height:16px;flex:0 0 auto;color:var(--general-muted-foreground)}
.up-sep{padding:var(--s3) var(--s4) var(--s1);border-top:1px solid var(--hairline);margin-top:var(--s1)}
.up-sep span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--general-muted-foreground)}
.up-persona-av{flex:0 0 auto;width:28px;height:28px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--brand-ice);color:var(--general-primary);
  font-family:var(--font-sans);font-size:12px;font-weight:600}
.up-persona-txt{display:flex;flex-direction:column;min-width:0}
.up-persona-txt span{font-size:12px;color:var(--general-muted-foreground)}
.up-f{padding:0 var(--s4) var(--s4);font-size:13px;color:#a3a3a3}

.appbody{flex:1 1 auto;min-height:0;display:flex}
.rail{flex:0 0 auto;width:236px;display:flex;flex-direction:column;padding:var(--s4) var(--s3);
  border-right:1px solid var(--hairline);transition:width var(--t)}
.rail.mini{width:76px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0}
.ni{position:relative;display:flex;align-items:center;gap:var(--s3);width:100%;height:44px;
  padding:0 var(--s3);background:none;border:none;cursor:pointer;border-radius:var(--rounded-md);
  font-size:var(--text-sm);font-weight:500;text-align:left;
  transition:background-color var(--t-fast),color var(--t-fast)}
.ni:hover{background:var(--general-muted)}
.ni.on{background:var(--brand-ice);color:var(--general-primary);font-weight:600}
.ni .nic{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center}
.ni .nic svg{width:20px;height:20px}
.ni .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity var(--t-fast)}
.ni .nb{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--rounded-full);
  display:grid;place-items:center;background:var(--general-secondary);color:#123f8c;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rail.mini .ni{justify-content:center;padding:0}
.rail.mini .ni .nt{opacity:0;width:0;flex:0 0 0}
.rail.mini .ni .nb{position:absolute;top:5px;right:9px;min-width:16px;height:16px;padding:0 4px;font-size:13px}
.rail.mini .ni::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;
  transform:translateY(-50%) translateX(-4px);padding:5px 10px;border-radius:var(--rounded-sm);
  background:var(--brand-midnight);color:var(--surface);font-size:var(--text-xs);font-weight:500;
  white-space:nowrap;pointer-events:none;opacity:0;z-index:5;box-shadow:var(--shadow-md);
  transition:opacity var(--t-fast),transform var(--t-fast)}
.rail.mini .ni:hover::after,.rail.mini .ni:focus-visible::after{opacity:1;transform:translateY(-50%)}
.railtog{display:flex;align-items:center;gap:var(--s3);flex:0 0 auto;height:40px;margin-top:var(--s3);
  padding:0 var(--s3);background:none;border:none;border-top:1px solid var(--hairline);cursor:pointer;
  color:var(--general-muted-foreground);font-size:var(--text-xs);font-weight:500;
  transition:color var(--t-fast)}
.railtog:hover{color:var(--general-foreground)}
.railtog svg{width:20px;height:20px;flex:0 0 auto;transition:transform var(--t)}
.rail.mini .railtog{justify-content:center;padding:0}
.rail.mini .railtog svg{transform:rotate(180deg)}
.rail.mini .railtog span{display:none}

.canvas{flex:1 1 auto;min-width:0;overflow:auto;background:var(--surface)}
.page{width:100%;max-width:1080px;margin:0 auto;padding:var(--s12) var(--s8) var(--s16);
  display:flex;flex-direction:column;gap:var(--s12)}
@media(max-width:760px){.page{padding:var(--s8) var(--s4) var(--s12)}}

/* ==========================================================================
   EVIDENCE COMPONENTS
   ========================================================================== */
.phead{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
.phead h1{font-size:var(--text-4xl);letter-spacing:-1.3px}
.phead p{font-size:var(--text-lg);line-height:1.55;color:var(--general-muted-foreground);max-width:68ch}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);font-weight:600;
  letter-spacing:.02em;color:var(--general-primary)}
.eyebrow i{width:6px;height:6px;border-radius:var(--rounded-full);background:var(--general-primary)}

.sec{display:flex;flex-direction:column;gap:var(--s6)}
.sec-h{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;
  padding-bottom:var(--s3);border-bottom:1px solid var(--hairline)}
.sec-h h2{font-size:var(--text-xl);letter-spacing:-.5px}
.sec-h .spacer{flex:1}
.sec-h p{flex:1 1 100%;font-size:var(--text-sm);line-height:1.6;color:var(--general-muted-foreground);
  max-width:78ch}

/* a figure that carries its provenance — the whole number is the button */
.fig{display:inline-flex;align-items:baseline;gap:6px;padding:1px 2px;background:none;border:none;
  cursor:pointer;font:inherit;color:inherit;border-radius:var(--rounded-xs);
  border-bottom:1px dashed var(--general-border);transition:var(--t-fast)}

/* the volume bonus, paid annually on what actually runs through the agreements */
const BONUS_TIERS = [
  {upTo:1000000,  rate:1.0},
  {upTo:3000000,  rate:1.5},
  {upTo:Infinity, rate:2.0}
];
function bonusOn(volume){
  let prev = 0, total = 0;
  const lines = [];
  for(const t of BONUS_TIERS){
    if(volume <= prev) break;
    const to = Math.min(volume, t.upTo);
    const paid = Math.round((to - prev) * t.rate / 100);
    lines.push({from:prev, to, rate:t.rate, paid});
    total += paid; prev = to;
  }
  return {total, lines};
}

const spendOf  = c => corrections[c.id] ? corrections[c.id].spend : c.spend;
const rateOf   = c => (corrections[c.id] && corrections[c.id].rate != null)
                        ? corrections[c.id].rate : c.rate;

/* the agreement slices for a leaking category, scaled to the current spend so
   they always sum to it exactly (last row absorbs the rounding) */
function slicesOf(c){
  if(isCovered(c)) return c.agr.map((a,i) => ({...a, covers:i === 0 ? spendOf(c) : 0, alt:i > 0}));
  const base = c.agr.reduce((s,a) => s + a.slice, 0);
  const spend = spendOf(c);
  let used = 0;
  return c.agr.map((a,i) => {
    const covers = i === c.agr.length - 1 ? spend - used : Math.round(spend * a.slice / base);
    used += covers;
    return {...a, covers, alt:false};
  });
}

function totals(){
  const scale = conservative ? P25_RATIO : 1;
  const cats = CATS.map(c => ({
    c, spend:Math.round(spendOf(c) * scale), rate:rateOf(c),
    saving:Math.round(savingOf(c) * scale), covered:isCovered(c), band:bandPctOf(c)
  }));
  const sum = k => cats.reduce((s,x) => s + x[k], 0);
  const spend = sum('spend'), saving = sum('saving');
  const covered = cats.filter(x => x.covered).reduce((s,x) => s + x.spend, 0);
  const leaking = spend - covered;
  const realised = cats.filter(x => x.covered).reduce((s,x) => s + x.saving, 0);
  const remaining = saving - realised;
  const bonus = bonusOn(covered);
  /* the total's band is the saving-weighted average of the per-category bands —
     arithmetic we show rather than assert */
  const wBand = saving ? cats.reduce((s,x) => s + x.saving * x.band, 0) / saving : 0;
  return {cats, spend, saving, covered, leaking, realised, remaining, bonus,
          value:realised + bonus.total, band:wBand, scale};
}

/* ==========================================================================
   6 · SVG · the peer distribution (hand-authored, no libraries)
   --------------------------------------------------------------------------
   SVG presentation attributes (fill=, stroke=, font-family=) are not a safe
   place for var() — support is patchy and a failed parse silently drops the
   colour. So the plots read the same design tokens out of the stylesheet once,
   at first paint, and interpolate the resolved values. Still one source of
   truth; no hex is duplicated in this file.
   ========================================================================== */
const C = new Proxy({}, {
  get(cache, name){
    if(!(name in cache)){
      cache[name] = getComputedStyle(document.documentElement)
        .getPropertyValue(name).trim() || 'currentColor';
    }
    return cache[name];
  }
});
function normCdf(z){
  /* Abramowitz & Stegun 7.1.26, good to ~1e-7 — enough for bin counts */
  const s = z < 0 ? -1 : 1, x = Math.abs(z) / Math.SQRT2;
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
            - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return 0.5 * (1 + s * y);
}
const LN_MU = Math.log(COHORT.median);
const LN_SIGMA = Math.log(COHORT.p75 / COHORT.p25) / 1.3490;   /* 2 × 0,6745 */
const lnPdf = v => Math.exp(-Math.pow(Math.log(v) - LN_MU, 2) / (2 * LN_SIGMA * LN_SIGMA))
                   / (v * LN_SIGMA * Math.sqrt(2 * Math.PI));
const lnCdf = v => normCdf((Math.log(v) - LN_MU) / LN_SIGMA);

const DIST = {x0:200000, x1:580000, W:760, H:250, padL:16, padR:16, padT:14, padB:56};
function distSvg(){
  const t = totals();
  const d = DIST;
  const X = v => d.padL + (v - d.x0) / (d.x1 - d.x0) * (d.W - d.padL - d.padR);
  const baseY = d.H - d.padB, topY = d.padT + 26;
  const samples = 140;
  let maxP = 0;
  const pts = [];
  for(let i = 0; i <= samples; i++){
    const v = d.x0 + (d.x1 - d.x0) * i / samples;
    const p = lnPdf(v);
    if(p > maxP) maxP = p;
    pts.push([v, p]);
  }
  const Y = p => baseY - (p / maxP) * (baseY - topY);
  const path = pts.map(([v, p], i) => `${i ? 'L' : 'M'}${X(v).toFixed(1)} ${Y(p).toFixed(1)}`).join(' ');
  const area = `${path} L${X(d.x1).toFixed(1)} ${baseY} L${X(d.x0).toFixed(1)} ${baseY} Z`;

  const you = t.realised;
  const bp = t.band;
  const lo = you * (1 - bp / 100), hi = you * (1 + bp / 100);
  const youColor = persona.verified ? C['--sentiment-positive'] : C['--general-accent'];
  const ticks = [250000, 300000, 350000, 400000, 450000, 500000, 550000];

  const desc = persona.verified
    ? `Distribution of realised annual savings across ${COHORT.n} peer companies. ` +
      `Cohort median ${kr(COHORT.median)}, interquartile range ${kr(COHORT.p25)} to ${kr(COHORT.p75)}. ` +
      `Your own measured figure is ${kr(you)}, with no uncertainty band because it is measured.`
    : `Distribution of realised annual savings across ${COHORT.n} peer companies. ` +
      `Cohort median ${kr(COHORT.median)}, interquartile range ${kr(COHORT.p25)} to ${kr(COHORT.p75)}. ` +
      `Your estimated position is ${kr(you)}, plus or minus ${pct(bp)}, ` +
      `a range from ${kr(Math.round(lo))} to ${kr(Math.round(hi))}.`;

  return `
  <svg viewBox="0 0 ${d.W} ${d.H}" role="img" aria-labelledby="distT distD" preserveAspectRatio="xMidYMid meet">

/* the plot's data-table alternative: cohort counts per 25.000 kr. bin,
   derived from the same fitted curve, so the picture and the table agree */
function distTable(){
  const step = 25000;
  const rows = [];
  let counted = 0;
  for(let lo = 225000; lo < 525000; lo += step){
    const n = Math.round(COHORT.n * (lnCdf(lo + step) - lnCdf(lo)));
    counted += n;
    rows.push(`<tr><td class="mono">${fmt(lo)} – ${fmt(lo + step)}</td>
      <td class="r mono">${n}</td></tr>`);
  }
  rows.push(`<tr><td class="mono">outside 225.000 – 525.000</td>
    <td class="r mono">${COHORT.n - counted}</td></tr>`);
  return `<div class="tbl-card"><div class="tbl-scroll"><table>
    <caption>Same data as the plot: how many of the ${COHORT.n} companies fall in each band,
      from the fitted curve. Counts are rounded to whole companies.</caption>
    <thead><tr><th scope="col">Realised annual saving</th><th scope="col" class="r">Companies</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div></div>`;
}

/* ==========================================================================
   7 · SVG · the error-bar ladder that narrows as inputs arrive
   ========================================================================== */
function errSvg(){
  const t = totals();
  const centre = t.realised;
  const rows = TIERS.map(tr => ({
    ...tr, have:tr.k === 'sector' || inputs.has(tr.k) || persona.verified
  }));
  if(persona.verified) rows.push({k:'measured', pct:0, have:true,
    label:'Realised and reconciled against your own invoices'});
  const cur = tierPct();
  const W = 760, rowH = 46, padT = 26, H = padT + rows.length * rowH + 22;
  const maxPct = 18;
  const cx = W * 0.56, half = W * 0.26;   /* leaves room for the row labels on the left */
  const X = p => cx + (p / maxPct) * half;

  const bars = rows.map((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    const isCur = (!persona.verified && r.pct === cur) || (persona.verified && r.k === 'measured');
    const col = isCur ? (persona.verified ? C['--sentiment-positive'] : C['--general-primary'])
                      : C['--sidebar-border'];
    const op = r.have ? 1 : .45;
    const lo = X(-r.pct), hi = X(r.pct);
    return `<g opacity="${op}">
      <text x="0" y="${y - 6}" font-family="${C['--font-body']}" font-size="12.5"
            fill="${C['--general-foreground']}" font-weight="${isCur ? 700 : 400}">${esc(r.label)}</text>
      <text x="0" y="${y + 12}" font-family="${C['--font-mono']}" font-size="11"
            fill="${C['--general-muted-foreground']}">±${dec(r.pct, 0)}% · ${fmt(Math.round(centre * (1 - r.pct / 100)))} – ${fmt(Math.round(centre * (1 + r.pct / 100)))} kr.</text>
      ${r.pct === 0
        ? `<circle cx="${cx}" cy="${y}" r="6" fill="${col}"/>`
        : `<line x1="${lo.toFixed(1)}" y1="${y}" x2="${hi.toFixed(1)}" y2="${y}" stroke="${col}" stroke-width="${isCur ? 4 : 3}" stroke-linecap="round"/>
           <line x1="${lo.toFixed(1)}" y1="${y - 8}" x2="${lo.toFixed(1)}" y2="${y + 8}" stroke="${col}" stroke-width="${isCur ? 4 : 3}"/>
           <line x1="${hi.toFixed(1)}" y1="${y - 8}" x2="${hi.toFixed(1)}" y2="${y + 8}" stroke="${col}" stroke-width="${isCur ? 4 : 3}"/>
           <circle cx="${cx}" cy="${y}" r="4" fill="${col}"/>`}
      ${isCur ? `<text x="${(hi + 12).toFixed(1)}" y="${y + 4}" font-family="${C['--font-sans']}" font-size="11.5"
            font-weight="700" fill="${col}">now</text>` : ''}
    </g>`;
  }).join('');

  const desc = rows.map(r => `${r.label}: plus or minus ${dec(r.pct, 0)} percent, ` +
    `${fmt(Math.round(centre * (1 - r.pct / 100)))} to ${fmt(Math.round(centre * (1 + r.pct / 100)))} kroner`).join('. ');

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="ebT ebD" preserveAspectRatio="xMidYMid meet">
    <title id="ebT">How the uncertainty narrows as inputs arrive</title>
    <desc id="ebD">${esc(desc + '. Centre line at ' + fmt(centre) + ' kroner.')}</desc>
    <line x1="${cx}" y1="${padT - 12}" x2="${cx}" y2="${H - 16}" stroke="${C['--hairline']}" stroke-width="1"/>
    <text x="${cx}" y="${padT - 18}" text-anchor="middle" font-family="${C['--font-mono']}"
      font-size="11" fill="${C['--general-muted-foreground']}">${fmt(centre)} kr.</text>
    ${bars}
  </svg>`;
}

/* ==========================================================================
   8 · SVG · the track record
   ========================================================================== */
function calSet(){ return persona.verified ? CAL_OWN : CAL_PEER; }
function calStats(){
  const rows = calSet().rows.map(r => ({...r, err:(r.est - r.act) / r.act * 100}));
  const mae = rows.reduce((s, r) => s + Math.abs(r.err), 0) / rows.length;
  const signed = rows.reduce((s, r) => s + r.err, 0) / rows.length;
  const worst = rows.reduce((a, b) => Math.abs(b.err) > Math.abs(a.err) ? b : a);
  return {rows, mae, signed, worst};
}
function calSvg(){
  const {rows} = calStats();
  const W = 760, H = 230, padL = 8, padR = 8, padB = 46;
  const zero = 108, scale = 9;                     /* px per percentage point */
  const colW = (W - padL - padR) / rows.length;
  const bars = rows.map((r, i) => {
    const x = padL + colW * i + colW / 2;
    const h = Math.abs(r.err) * scale;
    const up = r.err > 0;                          /* estimate above outcome */
    const y = up ? zero - h : zero;
    const col = Math.abs(r.err) < 1 ? C['--sentiment-positive']
              : (up ? C['--sentiment-negative'] : C['--general-primary']);
    return `<g>
      <rect x="${(x - 7).toFixed(1)}" y="${y.toFixed(1)}" width="14" height="${Math.max(h, 2).toFixed(1)}"
            rx="3" fill="${col}"/>
      <text x="${x.toFixed(1)}" y="${(up ? y - 8 : y + h + 16).toFixed(1)}" text-anchor="middle"
        font-family="${C['--font-mono']}" font-size="11" font-weight="700" fill="${col}">
        ${r.err > 0 ? '+' : ''}${dec(r.err)}%</text>
      <text x="${x.toFixed(1)}" y="${H - padB + 26}" text-anchor="middle" font-family="${C['--font-body']}"
        font-size="11" fill="${C['--general-muted-foreground']}">${esc(r.q)}</text>
    </g>`;
  }).join('');
  const desc = rows.map(r => `${r.q}: estimate ${fmt(r.est)}, outcome ${fmt(r.act)}, ` +
    `${dec(Math.abs(r.err))} percent ${r.err > 0 ? 'high' : 'low'}`).join('. ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="trT trD" preserveAspectRatio="xMidYMid meet">
    <title id="trT">Our estimate against the outcome, by quarter</title>
    <desc id="trD">${esc(desc + '.')}</desc>
    <line x1="${padL}" y1="${zero}" x2="${W - padR}" y2="${zero}" stroke="${C['--general-foreground']}" stroke-width="1.4"/>
    <text x="${padL}" y="${zero - 8}" font-family="${C['--font-mono']}" font-size="10.5"
      fill="${C['--general-muted-foreground']}">we were high ↑</text>
    <text x="${padL}" y="${zero + 18}" font-family="${C['--font-mono']}" font-size="10.5"
      fill="${C['--general-muted-foreground']}">we were low ↓</text>
    ${bars}
  </svg>`;
}

      <th scope="col" class="r">Rate</th><th scope="col" class="r">Discount / year</th>
      <th scope="col" class="r">Band</th><th scope="col">Basis</th><th scope="col" class="r">Disagree?</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr>
      <td>Total</td><td class="r amt">${fmt(t.spend)}</td><td class="r mono">—</td>
      <td class="r amt">${fmt(t.saving)}</td>
      <td class="r mono">±${dec(t.band, t.band % 1 === 0 ? 0 : 1)}%</td><td></td><td></td>
    </tr></tfoot>
  </table></div></div>

  <section class="sec" aria-labelledby="cat-agr-h">
    <div class="sec-h"><h2 id="cat-agr-h">The agreements behind those rows</h2>
      <p>No supplier photography: we have never seen these yards, sites or vans. A logo is
        identity; a photograph would be an implied claim to knowledge we do not have.</p></div>
    <div class="tbl-card"><div class="tbl-scroll"><table class="wide">
      <caption>${agrCount()} agreements, ${activeCount()} active. Slices in the three uncovered
        categories sum to that category's spend exactly.</caption>
      <thead><tr><th scope="col">Agreement</th><th scope="col">Category</th>
        <th scope="col" class="r">Covers</th><th scope="col" class="r">Discount</th>
        <th scope="col">Status</th></tr></thead>
      <tbody>${CATS.map(c => slicesOf(c).map((a, i) => {
        const cov = Math.round(a.covers * t.scale);
        const sav = a.alt ? 0 : Math.round(cov * rateOf(c) / 100);
        return `<tr>
          <td><div class="cellname">${logoChip(a.n)}<div><b>${esc(a.n)}</b></div></div></td>
          <td>${esc(c.n)}</td>
          <td class="r mono">${a.alt ? '—' : fmt(cov)}</td>
          <td class="r mono">${a.alt ? '—' : fmt(sav)}</td>

            ? (i === 0 ? `<span class="est-chip ver">${ICON.tick} Active</span>`
                       : `<span class="est-chip">${ICON.dash} Alternative — same spend, no extra discount</span>`)
            : `<span class="est-chip est">${ICON.dash} Candidate</span>`}</td>
        </tr>`;
      }).join('')).join('')}</tbody>
    </table></div></div>
  </section>`;
}

/* ---- TRACK RECORD ----------------------------------------------------- */
function viewTrack(){
  const cs = calStats();
  const rows = cs.rows.slice().reverse().map(r => `
    <tr>
      <td><b>${esc(r.q)}</b>${r.why ? `<span style="display:block;font-size:var(--text-xs);
        color:var(--general-muted-foreground);margin-top:3px;line-height:1.55">${esc(r.why)}</span>` : ''}</td>
      <td class="r mono">${fmt(r.est)}</td>
      <td class="r mono">${fmt(r.act)}</td>
      <td class="r err-txt ${Math.abs(r.err) < 1 ? 'err-ok' : (r.err > 0 ? 'err-hi' : 'err-lo')}">
        ${r.err > 0 ? '+' : ''}${dec(r.err)}%</td>
      <td>${Math.abs(r.err) < 1 ? 'on the number'
            : (r.err > 0 ? 'we were high' : 'we were low')}</td>
    </tr>`).join('');
  const sumLast4 = cs.rows.slice(-4).reduce((s, r) => s + r.act, 0);

  return `
  <header class="phead">
    <span class="eyebrow"><i></i>${persona.verified ? 'Predicted, then invoiced' : 'Published, then checked'}</span>
    <h1>Our track record, including the misses</h1>
    <p>${persona.verified
      ? 'Every quarter we predict what your agreements will return, then reconcile against your own invoices. Both numbers are kept.'
      : `Every quarter we publish an estimate for this cohort, then record what actually happened. We keep the quarters we got wrong, because a track record with the failures removed is not a track record.`}</p>
  </header>

  <section class="sec" aria-labelledby="tr-h">
    <div class="sec-h"><h2 id="tr-h">${esc(calSet().unit)}</h2>
      <span class="spacer"></span>
      <span class="chip chip-soft">Mean absolute error ${pct(cs.mae)}</span></div>
    <div class="plot">${calSvg()}
      <div class="plot-legend">
        <span><i class="sw" style="background:var(--sentiment-negative)"></i>Estimate above the outcome</span>
        <span><i class="sw" style="background:var(--general-primary)"></i>Estimate below the outcome</span>
        <span><i class="sw" style="background:var(--sentiment-positive)"></i>Within 1%</span>
      </div>
    </div>
    <div class="tbl-card"><div class="tbl-scroll"><table class="wide">
      <caption>Error is (estimate − outcome) ÷ outcome. ${persona.verified
        ? `The last four quarters' invoiced savings sum to ${kr(sumLast4)} — the same figure the Evidence page reports as collected.`
        : `Quarterly cohort medians do not sum to the annual median: re-taking a median on a
           quarter of the data is not additive, and we would rather say so than tidy it up.`}</caption>
      <thead><tr><th scope="col">Quarter</th><th scope="col" class="r">We estimated</th>
        <th scope="col" class="r">${persona.verified ? 'Your invoices showed' : 'Outcome was'}</th>
        <th scope="col" class="r">Error</th><th scope="col">Direction</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
    <div class="callout">${ICON.info}
      <div class="cb"><b>Why this is on the navigation, not in a footnote</b>
        <p>It is the only thing on this site that can be checked without trusting us first.
          ${persona.verified ? '' : `It is also the honest answer to "is your 35% real?" — over
          ${cs.rows.length} quarters we have been out by ${pct(cs.mae)} on average, in both directions.`}</p></div>
    </div>
  </section>`;
}

/* ---- CORRECTIONS ------------------------------------------------------- */
function viewCorrections(){
  const keys = Object.keys(corrections);
  const t = totals();
  const body = keys.length ? `<div class="corr">${keys.map(id => {
    const c = CATS.find(x => x.id === id), k = corrections[id];
    const before = Math.round(k.prevSpend * (k.prevRate != null ? k.prevRate : c.rate) / 100);
    const after = savingOf(c);
    return `<div class="corr-row">
      <span class="est-chip dec">${ICON.pen} Your figure</span>
      <div class="cb"><b>${esc(c.n)}</b>
        <p>Spend ${fmt(k.prevSpend)} → <b>${fmt(k.spend)}</b> kr.${k.rate != null
          ? ` · rate ${dec(k.prevRate, 0)}% → <b>${dec(k.rate, 0)}%</b>` : ''}
          · discount ${fmt(before)} → <b>${fmt(after)}</b> kr.
          ${k.reason ? `<br>Reason given: ${esc(k.reason)}` : ''}
          <br>Logged ${new Date(k.at).toLocaleString('da-DK')}. Band on this category is now
          ±${dec(DECLARED_PCT, 0)}% — declared by you, not audited by us.</p></div>
      <button class="btn btn-secondary btn-sm" type="button" data-undo="${id}">Undo</button>
    </div>`;
  }).join('')}</div>` : `<p class="empty">Nothing challenged yet. If a figure on this site is wrong
    about your business, the Categories page has a Challenge button on every row — the model
    changes, we log it, and you can undo it.</p>`;

  return `
  <header class="phead">
    <span class="eyebrow"><i></i>${keys.length} correction${keys.length === 1 ? '' : 's'}</span>
    <h1>Where you told us we were wrong</h1>
    <p>Disagreement is data. A correction outranks our benchmark for that category, carries its
      own ±${dec(DECLARED_PCT, 0)}% declared band, and is reversible — we do not quietly keep our
      own number underneath.</p>
  </header>
  <section class="sec" aria-labelledby="corr-h">
    <div class="sec-h"><h2 id="corr-h">Corrections on this account</h2>
      <span class="spacer"></span>
      <span class="chip chip-soft">Total now ${kr(t.value)}</span></div>
    ${body}
  </section>`;
}

/* ---- METHOD ------------------------------------------------------------ */
function viewMethod(){
  return `
  <header class="phead">
    <span class="eyebrow"><i></i>Plain language, no appendix</span>
    <h1>How we know what we claim to know</h1>
    <p>This page is reachable from the header on every screen and from every provenance
      popover. If a source is not listed here, it did not go into any number you have seen.</p>
  </header>

  <section class="sec" aria-labelledby="m-src-h">
    <div class="sec-h"><h2 id="m-src-h">Every source, named</h2></div>
    <div class="srclist">
      <div class="src"><span class="sn">1</span><div class="sb"><b>The public company register (CVR)</b>
        <p>Your NACE industry code, employee count and postcode. Public, exact, and the only thing
          we knew about you before you signed in.</p></div></div>
      <div class="src"><span class="sn">2</span><div class="sb"><b>Our own signed agreements</b>
        <p>The discount rate per category and the volume-bonus tiers (1,0% on the first million,
          1,5% to three million, 2,0% above). These are contractual, so they are exact — the
          uncertainty in any saving figure is never in the rate, only in the spend.</p></div></div>
      <div class="src"><span class="sn">3</span><div class="sb"><b>Aggregated invoice lines from ${COHORT.n} consenting customers</b>
        <p>Companies in the same industry code, size band and region that agreed to anonymous
          benchmarking. We never publish a figure computed from fewer than 8 companies, which is
          why some categories have wider bands than others.</p></div></div>
      <div class="src"><span class="sn">4</span><div class="sb"><b>Danmarks Statistik cost-structure tables</b>
        <p>Licensed industry statistics, used to sanity-check the category mix — if our cohort and
          the national statistics disagree by more than a tenth, we widen the band instead of
          picking a winner.</p></div></div>
      <div class="src scraped"><span class="sn">5</span><div class="sb"><b>Supplier web-shop list prices, crawled weekly</b>
        <p>Yes, scraped. A crawler reads the public web shops of the suppliers in our catalogue
          every week so a price index exists for categories where the cohort is thin. List prices
          are not the prices anyone actually pays, so this source only ever widens a band or
          ranks a category — it never sets a saving figure on its own.</p></div></div>
      <div class="src"><span class="sn">6</span><div class="sb"><b>Your corrections</b>
        <p>Anything you challenge outranks sources 3 to 5 for that category, and is marked
          "your figure" rather than "verified" until invoices back it.</p></div></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="m-how-h">
    <div class="sec-h"><h2 id="m-how-h">How a number is built</h2></div>
    <div class="prose">
      <p><b>Spend.</b> For a customer with nothing connected we take the cohort's median spend per
        employee, multiply by your employee count from the register, and split it using the
        cohort's category mix. That is a model of a company like yours — not of you. Once invoices
        arrive, this whole step is deleted and replaced by addition.</p>
      <p><b>Discount.</b> Spend × the contracted rate for that category. Nothing else.</p>
      <p><b>Bonus.</b> The tiers applied to the volume that actually runs through active
        agreements. Because the tiers step, the bonus does not scale linearly — which is why the
        conservative view recomputes it on the reduced volume instead of multiplying it.</p>
      <p><b>The band.</b> ±15% with register data only, ±8% once a 12-month spend report fixes the
        category mix, ±3% with line-level invoice history, ±0 once a quarter has closed and been
        reconciled. A figure you have declared yourself carries ±${dec(DECLARED_PCT, 0)}%. The total's band
        is the saving-weighted average of the eight category bands.</p>
      <p><b>The distribution.</b> Cohort median and quartiles are measured. The curve behind them
        is a lognormal fitted to those three numbers, σ = ln(P75/P25) ÷ 1,349 = ${dec(LN_SIGMA, 3)}.
        The conservative case is the cohort's own P25/median ratio, ${dec(P25_RATIO, 3)} — not a
        safety margin we invented.</p>
      <p><b>The track record.</b> Each quarter's estimate is archived when it is published and
        compared with the outcome when it lands. We do not restate old estimates.</p>
    </div>
  </section>

  <section class="sec" aria-labelledby="m-not-h">
    <div class="sec-h"><h2 id="m-not-h">What we deliberately do not show</h2></div>
    <div class="prose">
      <p><b>A savings gauge.</b> The best single category discount in our catalogue is 35%. Drawn
        as a dial it reads as your position; it is nobody's position. A ceiling is not a forecast,
        so it is not on this page.</p>
      <p><b>"Up to" anything.</b> A hedge that cannot be wrong cannot be trusted. Every number
        here carries a two-sided range instead.</p>
      <p><b>Offers.</b> There is no promotional tile in this product. If a category is worth
        acting on, the arithmetic says so; a badge would only teach you that some of these numbers
        are being sold to you.</p>
      <p><b>Tips without evidence.</b> An assistant that says "consider consolidating your freight
        suppliers" without showing the ${COHORT.n}-company basis is asking for trust it has not
        earned. Everything advisory in this version hangs off a figure with provenance.</p>
    </div>
  </section>`;
}

/* ---- render ------------------------------------------------------------ */
function render(){
  const page = $('#page');
  page.innerHTML = navAt === 'evidence' ? viewEvidence()
    : navAt === 'categories' ? viewCategories()
    : navAt === 'track' ? viewTrack()
    : navAt === 'corrections' ? viewCorrections()
    : viewMethod();
  wirePage();
  renderBasisPill();
  const h1 = page.querySelector('h1');
  if(h1){ h1.tabIndex = -1; h1.focus({preventScroll:true}); }
}

function renderBasisPill(){
  const p = $('#basisPill');
  p.className = 'basis' + (persona.verified ? ' verified' : '');
  p.innerHTML = `<span class="dot"></span><span class="bt">
    <b>${persona.verified ? 'Verified · ' + esc(persona.source) : 'Estimated · nothing connected'}</b>
    <span>${persona.verified ? fmt(invoiceCount()) + ' invoices' : '±' + pct(tierPct(), 0) + ' · n=' + COHORT.n}</span>
  </span>`;
  p.setAttribute('aria-label', persona.verified
    ? `Data basis: verified from ${fmt(invoiceCount())} invoices in ${persona.source}. Opens the method page.`
    : `Data basis: estimated, nothing connected, band plus or minus ${pct(tierPct(), 0)} from ${COHORT.n} peers. Opens the method page.`);
}

function wirePage(){
  $$('.fig').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openPop(b, b.dataset.prov, b.dataset.cat ? CATS.find(c => c.id === b.dataset.cat) : null);
  }));
  $$('[data-goto]').forEach(b => b.addEventListener('click', () => go(b.dataset.goto)));
  $$('[data-chal]').forEach(b => b.addEventListener('click', () => openChal(b.dataset.chal)));
  $$('[data-undo]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.undo, c = CATS.find(x => x.id === id);
    delete corrections[id];
    persist(); renderNav(); render();
    say(`Correction on ${c.n} removed. Total is now ${kr(totals().value)}.`);
  }));
  $$('[data-input]').forEach(i => i.addEventListener('change', () => {
    if(i.checked) inputs.add(i.dataset.input); else {
      inputs.delete(i.dataset.input);
      /* invoice history implies the spend report — dropping the report drops it too */
      if(i.dataset.input === 'report') inputs.delete('invoices');
    }
    if(i.dataset.input === 'invoices' && i.checked) inputs.add('report');
    persist(); render();
    say(`Confidence band is now plus or minus ${pct(tierPct(), 0)}.`);
  }));
  const med = $('#segMed'), p25 = $('#segP25');
  if(med) med.addEventListener('click', () => { conservative = false; persist(); render(); say('Showing the median case.'); });
  if(p25) p25.addEventListener('click', () => { conservative = true; persist(); render();
    say(`Showing the conservative P25 case, scaled by ${dec(P25_RATIO, 3)}.`); });
  const tog = $('#distTblTog');
  if(tog) tog.addEventListener('click', () => {
    const tbl = $('#distTbl'), open = tbl.hidden;
    tbl.hidden = !open;
    tog.setAttribute('aria-expanded', String(open));
    tog.textContent = open ? 'Hide table' : 'View as table';
  });
  const ct = $('#evChalTotal');
  if(ct) ct.addEventListener('click', () => { go('categories');
    say('Challenge any category row — the total is the sum of the eight.'); });
}

/* ==========================================================================
   10 · provenance popover
   ========================================================================== */
let popOwner = null;
function openPop(btn, key, cat){
  const p = provFor(key, cat);
  const el = $('#pop');
  el.innerHTML = `
    <div class="pop-h">
      <div class="pt"><span class="pl">${esc(p.label)}</span><h3 id="popT">${esc(p.title)}</h3></div>
      <button class="popx" type="button" id="popX" aria-label="Close provenance">${ICON.x}</button>
    </div>
    <dl class="pr" style="border-top:none;padding-top:0">
      <dt>Peer set</dt><dd>${esc(PEERSET())}</dd>
    </dl>
    <dl class="pr"><dt>Method</dt><dd><ul>${p.method.map(m => `<li>${m}</li>`).join('')}</ul></dd></dl>
    <dl class="pr"><dt>Inputs</dt><dd><ul>${p.inputs.map(m => `<li>${esc(m)}</li>`).join('')}</ul></dd></dl>
    <dl class="pr"><dt>Uncertainty</dt><dd>${p.band}</dd></dl>
    <dl class="pr"><dt>What would make it exact</dt><dd>${esc(p.exact)}</dd></dl>
    <div class="pop-acts">
      ${p.cat ? `<button class="btn btn-secondary btn-sm" type="button"
        data-popchal="${p.cat.id}">${ICON.pen} Challenge this number</button>` : ''}
      <button class="btn btn-ghost btn-sm" type="button" id="popMethod">Open method</button>
    </div>`;
  el.classList.add('on');
  el.setAttribute('aria-labelledby', 'popT');
  popOwner = btn;
  btn.setAttribute('aria-expanded', 'true');

  /* place under the trigger, clamped to the viewport */
  const r = btn.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(Math.max(12, r.left), innerWidth - w - 12);
  let top = r.bottom + 10;
  if(top + h > innerHeight - 12) top = Math.max(12, r.top - h - 10);
  el.style.left = left + 'px';
  el.style.top = top + 'px';

  $('#popX').addEventListener('click', closePop);
  $('#popMethod').addEventListener('click', () => { closePop(); go('method'); });
  const pc = el.querySelector('[data-popchal]');
  if(pc) pc.addEventListener('click', () => { const id = pc.dataset.popchal; closePop(); openChal(id); });
  $('#popX').focus();
}
function closePop(){
  const el = $('#pop');
  if(!el.classList.contains('on')) return;
  el.classList.remove('on');
  if(popOwner){
    popOwner.setAttribute('aria-expanded', 'false');
    if(document.body.contains(popOwner)) popOwner.focus();
  }
  popOwner = null;
}
$('#pop').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { closePop(); closeUser(); });
addEventListener('resize', closePop);
$('#canvas').addEventListener('scroll', closePop);

/* ==========================================================================
   11 · challenge dialog — a correction that really changes the model
   ========================================================================== */
let chalCat = null, chalReturn = null;
const parseKr = s => {
  const clean = String(s).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.');
  const v = parseFloat(clean);
  return isFinite(v) ? v : NaN;
};
function openChal(catId){
  const c = CATS.find(x => x.id === catId);
  if(!c) return;
  chalCat = c;
  chalReturn = document.activeElement;
  const cur = corrections[c.id];
  $('#chal').innerHTML = `
    <h2 id="chalT">That is not right for us</h2>
    <p class="dsub">We estimated <b>${kr(spendOf(c))}</b> of ${esc(c.n.toLowerCase())} spend a year
      at a <b>${dec(rateOf(c), 0)}%</b> agreement rate, which is where
      ${kr(savingOf(c))} comes from. Tell us what is actually true and the model changes now —
      not after a support ticket.</p>
    <form id="chalForm" novalidate>
      <div class="fgroup">
        <label class="flabel" for="chalSpend">Your actual annual spend in this category</label>
        <div class="field"><input id="chalSpend" type="text" inputmode="numeric"
          value="${fmt(cur ? cur.spend : spendOf(c))}" autocomplete="off"
          aria-describedby="chalSpendHelp"><span class="suf">kr.</span></div>
        <p class="fhelp" id="chalSpendHelp">Round figures are fine. Enter 0 if you do not buy this
          category at all — that is a correction too, and a common one.</p>
      </div>
      <div class="fgroup">
        <label class="flabel" for="chalRate">Discount you already get here, if any</label>
        <div class="field"><input id="chalRate" type="text" inputmode="decimal"
          value="${cur && cur.rate != null ? dec(cur.rate, 0) : ''}" placeholder="${dec(c.rate, 0)}"
          autocomplete="off" aria-describedby="chalRateHelp"><span class="suf">%</span></div>
        <p class="fhelp" id="chalRateHelp">Leave blank to keep our contracted rate of ${dec(c.rate, 0)}%.
          Anything above it and we will say so rather than quietly claim the difference.</p>
      </div>
      <div class="fgroup">
        <label class="flabel" for="chalReason">Why we were wrong (optional, but it improves the cohort)</label>
        <div class="field"><select id="chalReason">
          <option value="">Choose a reason</option>
          <option>We buy far less than that</option>
          <option>We buy far more than that</option>
          <option>We do not buy this category</option>
          <option>Our own deal is already better</option>
          <option>This spend sits in another category</option>
        </select></div>
      </div>
      <p class="ferr" id="chalErr" hidden></p>
      <div class="dlg-preview" id="chalPrev"></div>
      <div class="dlg-acts">
        ${cur ? `<button class="btn btn-ghost btn-sm" type="button" id="chalUndo">Remove my correction</button>` : ''}
        <button class="btn btn-secondary" type="button" id="chalCancel">Cancel</button>
        <button class="btn btn-primary" type="submit">Update the model</button>
      </div>
    </form>`;
  $('#chalScrim').classList.add('on');
  const d = $('#chal');
  d.classList.add('on');
  d.setAttribute('aria-hidden', 'false');
  const spend = $('#chalSpend'), rate = $('#chalRate');
  const preview = () => {
    const s = parseKr(spend.value), rr = rate.value.trim() === '' ? rateOf(c) : parseKr(rate.value);
    const prev = $('#chalPrev');
    if(!isFinite(s) || s < 0 || !isFinite(rr)){ prev.textContent = 'Enter a spend figure to see the effect.'; return; }
    const t0 = totals();
    const newSaving = Math.round(s * rr / 100);
    const delta = newSaving - savingOf(c);
    const declared = ` The band on this category becomes ±${dec(DECLARED_PCT, 0)}% — your figure, unaudited.`;
    const head = `This category's discount goes ${fmt(savingOf(c))} → <b>${fmt(newSaving)}</b> kr.`;
    if(isCovered(c)){
      /* a covered category moves the bonus too, because the tiers step —
         so preview the real recomputation rather than a multiplication */
      const covered = CATS.filter(isCovered).reduce((acc, x) => acc + (x === c ? s : spendOf(x)), 0);
      const bonusAfter = bonusOn(Math.round(covered * (conservative ? P25_RATIO : 1))).total;
      prev.innerHTML = head +
        `, the volume bonus ${fmt(t0.bonus.total)} → <b>${fmt(bonusAfter)}</b> kr.,` +
        ` and the headline total ${fmt(t0.value)} → <b>${fmt(t0.value + delta + bonusAfter - t0.bonus.total)}</b> kr.` +
        declared;
    } else {
      /* nothing is being collected here, so this moves the "not collected"
         figure — the headline is discount + bonus and does not move */
      prev.innerHTML = head +
        `, so the discount you are <em>not</em> collecting goes ${fmt(t0.remaining)} → ` +
        `<b>${fmt(t0.remaining + delta)}</b> kr. The headline total stays ${fmt(t0.value)} kr.` +
        ` until this category is on an agreement.` + declared;
    }
  };
  spend.addEventListener('input', preview);
  rate.addEventListener('input', preview);
  preview();
  $('#chalCancel').addEventListener('click', closeChal);
  const undo = $('#chalUndo');
  if(undo) undo.addEventListener('click', () => {
    delete corrections[c.id]; closeChal(); persist(); renderNav(); render();
    say(`Correction on ${c.n} removed.`);
  });
  $('#chalForm').addEventListener('submit', e => {
    e.preventDefault();
    const err = $('#chalErr');
    const s = parseKr(spend.value);
    const rTxt = rate.value.trim();
    const rr = rTxt === '' ? null : parseKr(rTxt);
    if(!isFinite(s) || s < 0){
      err.textContent = 'Enter your annual spend as a number — 0 is allowed.';
      err.hidden = false; spend.focus(); return;
    }
    if(rr !== null && (!isFinite(rr) || rr < 0 || rr > 40)){
      err.textContent = 'A discount rate between 0 and 40% please, or leave it blank.';
      err.hidden = false; rate.focus(); return;
    }
    err.hidden = true;
    corrections[c.id] = {
      spend:Math.round(s), rate:rr, reason:$('#chalReason').value || '',
      at:Date.now(), prevSpend:spendOf(c), prevRate:rateOf(c)
    };
    closeChal();
    persist(); renderNav(); render();
    say(`${c.n} updated to ${kr(Math.round(s))}. The total is now ${kr(totals().value)}.`);
  });
  setTimeout(() => spend.focus(), 60);
}
function closeChal(){
  $('#chalScrim').classList.remove('on');
  const d = $('#chal');
  d.classList.remove('on');
  d.setAttribute('aria-hidden', 'true');
  chalCat = null;
  if(chalReturn && document.body.contains(chalReturn)) chalReturn.focus();
  chalReturn = null;
}
$('#chalScrim').addEventListener('click', closeChal);
$('#chal').addEventListener('keydown', e => {
  /* keep focus inside the dialog while it is open */
  if(e.key !== 'Tab') return;
  const f = $$('#chal button, #chal input, #chal select').filter(x => !x.disabled);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#chal').classList.contains('on')) closeChal();
  else if($('#pop').classList.contains('on')) closePop();
  else closeUser();
});

/* ==========================================================================
   12 · shell plumbing
   ========================================================================== */
const SUFFIX = /^(a\/s|aps|as|ab|ivs|k\/s|p\/s|oy|ltd|gmbh|inc)$/i;
function initials(name){
  const w = name.trim().split(/\s+/).filter(s => !SUFFIX.test(s));
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
}
function setRail(mini){
  $('#rail').classList.toggle('mini', mini);
  const t = $('#railTog');
  t.setAttribute('aria-expanded', String(!mini));
  t.setAttribute('aria-label', mini ? 'Expand navigation' : 'Collapse navigation');
}
$('#railTog').addEventListener('click', () => {
  railTouched = true;
  setRail(!$('#rail').classList.contains('mini'));
});
const NARROW = matchMedia('(max-width:900px)');
const syncRail = () => { if(!railTouched) setRail(NARROW.matches); };
NARROW.addEventListener('change', syncRail);

function closeUser(){
  $('#userPop').classList.remove('on');
  $('#userPop').inert = true;
  $('#userBtn').setAttribute('aria-expanded', 'false');
}
$('#userBtn').addEventListener('click', e => {
  e.stopPropagation();
  const on = $('#userPop').classList.toggle('on');
  $('#userPop').inert = !on;
  $('#userBtn').setAttribute('aria-expanded', String(on));
});
$('#userPop').addEventListener('click', e => e.stopPropagation());
$('#restartBtn').addEventListener('click', () => {
  try{ sessionStorage.removeItem(SKEY); }catch(e){}
  location.href = location.pathname;
});
$('#methodTop').addEventListener('click', () => go('method'));
$('#basisPill').addEventListener('click', () => go('method'));

function applyPersona(key){
  persona = PERSONAS[key];
  inputs = new Set(['sector']);
  corrections = {};
  conservative = false;
}
function paintIdentity(){
  $('#userName').textContent = persona.user;
  $('#userCo').textContent = persona.company;
  $('#upName').textContent = persona.user;
  $('#upCo').textContent = persona.company;
  $('#userAv').textContent = initials(persona.user);
  document.title = `Advantage — Evidence · ${persona.company}`;
}
function enterApp(){
  paintIdentity();
  renderNav();
  syncRail();
  document.body.classList.add('in-app');
  $('#app').classList.add('on');
  inApp = true;
  persist();
  render();
}
$('#loginBob').addEventListener('click', () => { applyPersona('bob'); enterApp(); });
$('#loginFanny').addEventListener('click', () => { applyPersona('fanny'); enterApp(); });
$('#personaBob').addEventListener('click', () => { closeUser(); applyPersona('bob'); persist(); paintIdentity(); renderNav(); render(); });
$('#personaFanny').addEventListener('click', () => { closeUser(); applyPersona('fanny'); persist(); paintIdentity(); renderNav(); render(); });

/* ==========================================================================
   13 · boot
   ========================================================================== */
$('#userPop').inert = true;
if(restore()) enterApp();
</script>
