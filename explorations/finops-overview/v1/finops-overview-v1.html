<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advantage — overview as a cost dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
<style>
/* tokens, copied from advantage-main.html */
:root{
  --general-background:#fafafa;--general-foreground:#0f0f0f;--general-primary:#1b64dc;--general-primary-deep:#12459f;
  --general-primary-foreground:#fafafa;--general-secondary:#dbe9ff;--general-muted:#f2f2f2;
  --general-muted-foreground:#6e6e6e;--general-border:#bdd7ff;--general-input:#ffffff;
  --sidebar-border:#e0e0e0;--surface:#ffffff;--surface-tile:#f5f6f7;--surface-tile-pressed:#eef0f2;--brand-ice:#edf5ff;--brand-midnight:#000a45;
  --sentiment-positive:#009689;--sentiment-positive-ink:#007c71;--sentiment-positive-ink-on-tint:#00796e;
  --sentiment-negative:#f54a00;--sentiment-negative-ink-on-tint:#c43b00;
  --font-sans:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;--text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;
  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;--rounded-xl:20px;--rounded-full:9999px;
  --shadow-xs:0 1px 2px 0 #0000000d;--shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;--shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;
  --hairline:#ececec;--card-stroke:#e7e7ea;--t-fast:.15s ease;
  /* the two tints the main file already uses for a landed saving and an idle agreement */
  --tint-pos:#d9f2ef;--tint-idle:#ffe9dd;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:var(--font-sans);background:var(--general-background);color:var(--general-foreground);
  font-size:var(--text-sm);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* three kinds of money, as the main file draws them: landed money is green, an exact
   potential read from a document is blue, an estimate is a muted dotted range */
.fig-pos{color:var(--sentiment-positive-ink)}
.fig-doc{color:var(--general-primary)}
.fig-neg{color:var(--sentiment-negative-ink-on-tint)}
.fig-est{font-weight:inherit;color:var(--general-muted-foreground);text-decoration:underline dotted currentColor;
  text-decoration-thickness:1.5px;text-underline-offset:.16em;text-decoration-skip-ink:none}
.sep{color:var(--general-muted-foreground);font-weight:400;margin:0 2px}
.none{color:var(--general-muted-foreground)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:var(--s6);height:56px;padding:0 var(--s6);background:var(--surface);border-bottom:1px solid var(--hairline)}
.mark{display:flex;align-items:center}
.mark img{height:22px;display:block}
.tabs{display:flex;gap:2px}
.tabs button{height:32px;padding:0 var(--s3);border-radius:var(--rounded-sm);font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground);white-space:nowrap}
.tabs button:hover{color:var(--general-foreground)}
.tabs button[aria-current]{color:var(--general-foreground);background:var(--general-muted);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);height:30px;padding:0 var(--s3);border:1px solid var(--hairline);
  border-radius:var(--rounded-full);font-size:var(--text-xs);color:var(--general-muted-foreground);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--sentiment-positive)}
.pill.docs i{background:var(--general-primary)}
.pill b{color:var(--general-foreground);font-weight:600}
.who{position:relative}
.who select{appearance:none;-webkit-appearance:none;height:32px;padding:0 var(--s8) 0 var(--s3);border:1px solid var(--card-stroke);border-radius:var(--rounded-sm);
  background:var(--surface);font-weight:600;font-size:var(--text-sm);cursor:pointer}
.who svg{position:absolute;right:10px;top:9px;width:14px;height:14px;pointer-events:none;color:var(--general-muted-foreground)}

/* ---------- the filter row: one row, above everything it scopes ---------- */
.bar{display:flex;align-items:center;gap:var(--s3) var(--s5);padding:var(--s3) var(--s6);flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:var(--s2)}
.ctl>span{font-size:var(--text-xs);color:var(--general-muted-foreground);font-weight:500}
.seg{display:inline-flex;padding:2px;border-radius:var(--rounded-sm);box-shadow:inset 0 0 0 1px var(--card-stroke);background:var(--surface)}
.seg button{height:26px;padding:0 var(--s3);border-radius:6px;font-size:var(--text-xs);font-weight:600;color:var(--general-muted-foreground);white-space:nowrap;
  transition:background var(--t-fast),color var(--t-fast)}
.seg button:hover{color:var(--general-foreground)}
.seg button[aria-pressed="true"]{background:var(--general-muted);color:var(--general-foreground)}
.bar-sp{flex:1 1 auto}
.key{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--text-xs);color:var(--general-muted-foreground)}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.key i.dash{background:none;border:1.5px dashed var(--general-muted-foreground)}
.asof{font-size:var(--text-xs);color:var(--general-muted-foreground);white-space:nowrap}

/* ---------- the board: three bands 16px apart, panels inside a band 12px apart ---------- */
.board{display:flex;flex-direction:column;gap:var(--s4);padding:0 var(--s6) var(--s12)}
.panel{position:relative;background:var(--surface);border:1px solid var(--card-stroke);border-radius:var(--rounded-md);min-width:0}
.ph{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:0 var(--s4);border-bottom:1px solid var(--hairline)}
.ph h2{font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.ph .cnt{font-size:var(--text-xs);color:var(--general-muted-foreground);font-weight:500;white-space:nowrap}
.ph .sp{flex:1 1 auto}
.pf{display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:var(--s2) var(--s4);border-top:1px solid var(--hairline);
  font-size:var(--text-xs);color:var(--general-muted-foreground)}
.pf .sp{flex:1 1 auto}
.linkbtn{color:var(--general-primary);font-weight:600;font-size:var(--text-xs);white-space:nowrap}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- KPI strip: one surface, hairlines between tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{position:relative;display:flex;flex-direction:column;gap:2px;padding:var(--s4);min-width:0}
.kpi+.kpi{border-left:1px solid var(--hairline)}
.kpi .l{font-size:var(--text-xs);color:var(--general-muted-foreground);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:64px}
.kpi .v{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;margin-top:var(--s1)}
.kpi .v small{font-size:var(--text-xs);font-weight:500;color:var(--general-muted-foreground);letter-spacing:0;margin-left:3px}
.kpi .v .fig-est{font-size:var(--text-xl)}
.kpi .c{font-size:var(--text-xs);color:var(--general-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .spk{position:absolute;right:var(--s4);top:var(--s4);width:56px;height:22px}
.spk rect{fill:var(--k)}

/* ---------- the two-column body ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:var(--s3);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--s3);min-width:0}

/* ---------- the chart ---------- */
.chart-body{position:relative;padding:var(--s4) var(--s4) var(--s2)}
svg.ch{display:block;width:100%;height:268px;overflow:visible}
.ch text{font-family:var(--font-sans);font-size:var(--text-xs);fill:var(--general-muted-foreground)}
.ch .grid-l{stroke:var(--hairline);stroke-width:1;shape-rendering:crispEdges}
.ch .hit{fill:transparent}
.ch .hit:hover,.ch .hit:focus{fill:rgb(27 100 220 / .05);outline:none}
.ch .col-g rect,.ch .col-g path{transition:opacity var(--t-fast)}
.ch .col-g.dim rect,.ch .col-g.dim path{opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);padding:var(--s2) var(--s4) var(--s4);list-style:none}
.legend li{display:flex;align-items:center;gap:var(--s2);font-size:var(--text-xs);min-height:24px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--k);flex:0 0 auto}
.legend i.est{background:repeating-linear-gradient(45deg,var(--k) 0 1.5px,transparent 1.5px 4px)}
.legend b{font-weight:600}
.legend span{color:var(--general-muted-foreground)}
.tip{position:absolute;z-index:3;pointer-events:none;min-width:200px;padding:var(--s2) var(--s3) var(--s3);background:var(--surface);
  border:1px solid var(--card-stroke);border-radius:var(--rounded-sm);box-shadow:var(--shadow-md);font-size:var(--text-xs)}
.tip[hidden]{display:none}
.tip h4{font-size:var(--text-xs);font-weight:600;color:var(--general-muted-foreground);margin-bottom:var(--s1)}
.tip ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.tip li{display:flex;align-items:center;gap:var(--s2)}
.tip li i{width:10px;height:2px;border-radius:1px;background:var(--k);flex:0 0 auto}
.tip li i.est{background:repeating-linear-gradient(90deg,var(--k) 0 2px,transparent 2px 4px)}
.tip li b{font-weight:600;min-width:64px;font-variant-numeric:tabular-nums}
.tip li span{color:var(--general-muted-foreground);flex:1 1 auto;white-space:nowrap}
.tip .tot{display:flex;justify-content:space-between;gap:var(--s3);margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--hairline);font-weight:600}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--text-xs)}
th{height:34px;padding:0 var(--s3);text-align:left;font-weight:600;color:var(--general-muted-foreground);border-bottom:1px solid var(--hairline);white-space:nowrap}
th.r{text-align:right}
th button{display:inline-flex;align-items:center;gap:3px;height:34px;color:inherit;font-weight:inherit;white-space:nowrap}
th button:hover{color:var(--general-foreground)}
th button svg{width:12px;height:12px;opacity:0}
th[aria-sort] button{color:var(--general-foreground)}
th[aria-sort] button svg{opacity:1}
th[aria-sort="ascending"] button svg{transform:rotate(180deg)}
td{height:36px;padding:0 var(--s3);border-bottom:1px solid var(--hairline);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-tile)}
tbody tr.focus td{background:var(--brand-ice)}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.sub{color:var(--general-muted-foreground)}
tfoot td{border-top:1px solid var(--card-stroke);border-bottom:0;font-weight:600;height:38px;background:var(--surface)}
tfoot td.note{font-weight:500;color:var(--general-muted-foreground)}
.ent{display:flex;align-items:center;gap:var(--s2);min-width:0;max-width:300px}
.ent img.art{width:20px;height:20px;object-fit:contain;flex:0 0 auto;user-select:none}
.ent .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ent .sb{color:var(--general-muted-foreground);overflow:hidden;text-overflow:ellipsis}
.ent .nm+.sb::before{content:"·";margin:0 6px 0 0;color:var(--general-muted-foreground)}
.lg{position:relative;width:24px;height:24px;border-radius:6px;background:var(--surface-tile);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.lg b{font-size:var(--text-xs);font-weight:700;letter-spacing:0;color:var(--general-muted-foreground)}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.cb{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--general-secondary);vertical-align:middle;margin-right:var(--s2);overflow:hidden}
.cb i{display:block;height:100%;border-radius:3px;background:var(--general-primary)}
.cb.pos{background:var(--tint-pos)}.cb.pos i{background:var(--sentiment-positive)}
.cb.est{background:repeating-linear-gradient(45deg,var(--general-secondary) 0 1.5px,transparent 1.5px 4px)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 var(--s2);border-radius:var(--rounded-xs);font-size:var(--text-xs);font-weight:600;
  background:var(--general-muted);color:var(--general-muted-foreground);white-space:nowrap}
.chip.land{background:var(--tint-pos);color:var(--sentiment-positive-ink-on-tint)}
.chip.pend{background:var(--general-secondary);color:var(--general-primary-deep)}
.chip.idle{background:var(--tint-idle);color:var(--sentiment-negative-ink-on-tint)}
.chip.new,.chip.avail{background:var(--brand-ice);color:var(--general-primary)}
.rs{display:inline-block;width:52px;height:18px;vertical-align:middle}
.rs rect{fill:var(--k)}
.pct{color:var(--general-muted-foreground);margin-left:var(--s1)}

/* ---------- the side lists ---------- */
.list{list-style:none}
.list li{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--hairline)}
.list li:last-child{border-bottom:0}
.list li.act{cursor:pointer;transition:background var(--t-fast)}
.list li.act:hover{background:var(--surface-tile)}
.list .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.list .t b{font-weight:600;font-size:var(--text-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .t span{font-size:var(--text-xs);color:var(--general-muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{text-align:right;font-size:var(--text-xs);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.list .v small{display:block;font-weight:500;color:var(--general-muted-foreground)}
.ic{width:28px;height:28px;border-radius:var(--rounded-sm);display:grid;place-items:center;background:var(--surface-tile);color:var(--general-muted-foreground);flex:0 0 auto}
.ic svg{width:16px;height:16px}
.ic.neg{background:var(--tint-idle);color:var(--sentiment-negative-ink-on-tint)}
.ic.doc{background:var(--brand-ice);color:var(--general-primary)}
.ic.pos{background:var(--tint-pos);color:var(--sentiment-positive-ink-on-tint)}
.rk{width:20px;text-align:right;font-size:var(--text-xs);color:var(--general-muted-foreground);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- agreement health ---------- */
.hrow{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--hairline)}
.hrow:last-child{border-bottom:0}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);font-size:var(--text-xs)}
.hl b{font-weight:600}
.hl span{color:var(--general-muted-foreground)}
.hl .big{font-size:var(--text-base);font-weight:600;font-variant-numeric:tabular-nums}
.sbar{display:flex;gap:2px;height:8px}
.sbar i{border-radius:2px;background:var(--k);min-width:3px}
.sbar i.est{background:repeating-linear-gradient(45deg,var(--k) 0 2px,transparent 2px 5px)}
.hk{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:var(--text-xs);color:var(--general-muted-foreground)}
.hk span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hk i{width:8px;height:8px;border-radius:2px;background:var(--k)}
.hk b{color:var(--general-foreground);font-weight:600;font-variant-numeric:tabular-nums}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.rate{display:flex;flex-direction:column;gap:1px}
.rate b{font-size:var(--text-lg);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rate span{font-size:var(--text-xs);color:var(--general-muted-foreground);text-wrap:pretty}

@media(max-width:1180px){.grid{grid-template-columns:1fr}}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--hairline)}
  .tabs{display:none}
}
@media(max-width:720px){
  .top,.bar,.board{padding-left:var(--s4);padding-right:var(--s4)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:1px solid var(--hairline)}
  .kpi:nth-child(3),.kpi:nth-child(5){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--hairline)}
  .pill{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1 class="sr">Advantage overview</h1>
<header class="top">
  <a class="mark" href="../../../advantage-main.html" aria-label="Advantage"><img src="../../../assets/advantage-logo.svg" alt=""></a>
  <nav class="tabs" aria-label="Main">
    <button type="button" aria-current="page">Overview</button>
    <button type="button">Suppliers</button>
    <button type="button">Reports</button>
    <button type="button">Areas</button>
    <button type="button">Agreements</button>
  </nav>
  <div class="top-r">
    <span class="pill" id="src"></span>
    <label class="who"><span class="sr">Company</span>
      <select id="who">
        <option value="bob">Nordvik Byg A/S</option>
        <option value="kari">Solheim Installasjon AS</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </label>
  </div>
</header>

<div class="bar">
  <div class="ctl"><span>Period</span>
    <div class="seg" role="group" aria-label="Period" data-set="period">
      <button type="button" data-v="y">Last 12 months</button>
      <button type="button" data-v="ytd">Year to date</button>
      <button type="button" data-v="q">Last 3 months</button>
    </div>
  </div>
  <div class="ctl"><span>Group by</span>
    <div class="seg" role="group" aria-label="Group by" data-set="group">
      <button type="button" data-v="area">Area</button>
      <button type="button" data-v="agr">Agreement</button>
      <button type="button" data-v="sup">Supplier</button>
    </div>
  </div>
  <span class="bar-sp"></span>
  <div class="key" id="key" aria-label="How to read the figures"></div>
  <span class="asof" id="asof"></span>
</div>

<main class="board">
  <section class="panel kpis" id="kpis" aria-label="Headline figures"></section>
  <div class="grid">
    <div class="col">
      <section class="panel" id="chartP" aria-labelledby="chT">
        <div class="ph"><h2 id="chT"></h2><span class="cnt" id="chC"></span><span class="sp"></span>
          <div class="seg" role="group" aria-label="Measure" data-set="measure">
            <button type="button" data-v="spend">Spend</button>
            <button type="button" data-v="thru">Through agreements</button>
            <button type="button" data-v="saved">Saved</button>
          </div>
        </div>
        <div class="chart-body" id="chB"><svg class="ch" id="ch" role="img"></svg><div class="tip" id="tip" hidden></div></div>
        <ul class="legend" id="legend"></ul>
      </section>
      <section class="panel" id="tableP" aria-labelledby="tbT">
        <div class="ph"><h2 id="tbT"></h2><span class="cnt" id="tbC"></span><span class="sp"></span><span class="cnt" id="tbU"></span></div>
        <div class="tw" id="tb"></div>
        <div class="pf" id="tbF" hidden></div>
      </section>
    </div>
    <aside class="col" aria-label="Attention, health and open savings">
      <section class="panel" aria-labelledby="atT">
        <div class="ph"><h2 id="atT">Needs attention</h2><span class="cnt" id="atC"></span></div>
        <ul class="list" id="attn"></ul>
      </section>
      <section class="panel" aria-labelledby="heT">
        <div class="ph"><h2 id="heT">Agreement health</h2></div>
        <div id="health"></div>
      </section>
      <section class="panel" aria-labelledby="opT">
        <div class="ph"><h2 id="opT">Open savings, ranked</h2><span class="cnt" id="opC"></span></div>
        <ul class="list" id="open"></ul>
        <div class="pf" id="opF"></div>
      </section>
    </aside>
  </div>
  <section class="panel" aria-labelledby="ldT">

}

/* a 12-month sparkline: the months the period covers in the accent, the rest ghosted */
function spark(s12, hue, w = 56, h = 22){
  const Y = year12(), inW = new Set(MODEL.W.map(x => x.m)), max = Math.max(1, ...Y.map(x => s12[x.m]));
  const bw = Math.max(2, Math.floor((w - 11 * 1.5) / 12)), gap = (w - bw * 12) / 11;
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${Y.map((x, i) => {
    const bh = Math.max(1.5, s12[x.m] / max * h), on = inW.has(x.m);
    return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="1" style="--k:${on ? ink(hue, .85) : ink(REST.b, REST.a)}"/>`;
  }).join('')}</svg>`;
}

/* ---- the chart: stacked columns of the measure, grouped as the filter row says ---- */
const GROUP_N = {area:'area', agr:'agreement', sup:'supplier'};
function seriesFor(){
  const m = MODEL, k = S.measure, key12 = k === 'spend' ? 'spend12' : k === 'thru' ? 'spend12' : 'saved12';
  let rows;
  if(S.group === 'area') rows = m.areas.map(A => ({id:A.id, n:A.n, s12:k === 'spend' ? A.spend12 : k === 'thru' ? A.thru12 : A.saved12, est:k === 'spend' && !A.whole}));
  else if(S.group === 'agr') rows = m.agrs.filter(x => x.st === 'land').map(x => ({id:x.id, n:x.n, s12:x[key12], est:false}));
  else rows = m.sups.map(x => ({id:x.id, n:x.n, s12:k === 'spend' ? x.spend12 : k === 'thru' ? (x.thru ? x.spend12 : null) : (x.saved ? splitExact(x.agr.save, byAreaProp(x.r.id)) : null), est:k === 'spend' && !(x.thru || areaWhole(x.r.id))}));
  rows = rows.filter(r => r.s12 && r.s12.some(v => v > 0));
  /* rank on the whole year, so the period never repaints a series */
  rows.forEach(r => r.total12 = r.s12.reduce((a, b) => a + b, 0));
  rows.sort((a, b) => b.total12 - a.total12);
  const hue = HUE[k], own = rows.slice(0, TINT.length).map((r, i) => ({...r, ink:{b:hue, a:TINT[i]}}));
  const rest = rows.slice(TINT.length);
  if(rest.length){
    const s = Array.from({length:12}, (_, i) => rest.reduce((t, r) => t + r.s12[i], 0));
    own.push({id:'other', n:rest.length === 1 ? rest[0].n : `Other ${GROUP_N[S.group]}s`, s12:s, ink:REST, est:rest.some(r => r.est) && rest.every(r => r.est), total12:s.reduce((a, b) => a + b, 0), count:rest.length});
  }
  /* grouped by agreement, spend that ran outside every agreement is its own series —
     available agreements overlap, so only a held agreement pins an exact amount */
  if(S.group === 'agr' && k === 'spend'){
    const s = Array.from({length:12}, (_, i) => m.spend12[i] - m.thru12[i]);
    own.push({id:'outside', n:'Outside agreements', s12:s, ink:REST, est:!!m.outsideM.est, total12:s.reduce((a, b) => a + b, 0)});
  }
  return own;
}
function byAreaProp(id){ const A = MODEL.areas.find(x => x.id === id); return A ? A.prop : Array(12).fill(1 / 12); }
let CH = {series:[], cols:[]};
function renderChart(){

  const svg = $('#ch'), box = $('#chB');
  const width = Math.max(320, box.clientWidth - 32), height = 268, padL = 44, padR = 8, padT = 10, padB = 24;
  const pw = width - padL - padR, ph = height - padT - padB, ceil = rdCeil(Math.max(...totals, 1));

  });

  svg.setAttribute('aria-label', title);
  svg.innerHTML = out;
  $('#legend').innerHTML = series.map(s => { const v = W.reduce((t, x) => t + s.s12[x.m], 0);
    return `<li><i class="${s.est ? 'est' : ''}" style="--k:${ink(s.ink.b, s.ink.a)}"></i><b>${esc(s.n)}</b><span class="num">${s.est ? `<span class="fig-est">${estRange(v)}</span>` : fmt(v)} · ${totW ? Math.round(v / totW * 100) : 0}%</span></li>`; }).join('');

function wireChart(){
  const svg = $('#ch'), tip = $('#tip'), box = $('#chB');
  const show = (i, px) => {

  $('#tb').querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sort; S.sort = S.sort.k === k ? {k, dir:-S.sort.dir} : {k, dir:k === 'n' || k === 'st' || k === 'renew' ? 1 : -1}; renderTable(); }));
  const all = $('#tbAll'); if(all) all.addEventListener('click', () => { S.all = !S.all; renderTable(); });
  if(S.focus){ const tr = $('#tb').querySelector('tr.focus'); if(tr) tr.scrollIntoView({block:'center', behavior:'smooth'}); }
}

/* ---- needs attention ---- */
const IC = {
  rise:'<path d="M6 17L17 6M10.5 6H17v6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  idle:'<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M10 9v6M14 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  wait:'<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.6V12l3.1 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  new:'<path d="M12 3l1.9 4.3 4.6.6-3.4 3.2.9 4.7-4-2.3-4 2.3.9-4.7L5.5 7.9l4.6-.6L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  doc:'<path d="M13 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9l-6-6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 3v6h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
};
const icon = (k, tone) => `<span class="ic ${tone}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${IC[k]}</svg></span>`;
function renderAttention(){
  const m = MODEL, items = [];
  const rise = m.agrs.find(x => x.n === PRICE_RISE.agr && x.a.req);
  if(rise) items.push({ic:icon('rise', 'neg'), t:`Price rise at ${rise.n}`, s:`+${PRICE_RISE.pct}% ${PRICE_RISE.when} · on a live agreement`, v:`<span class="fig-neg">+${fmt(PRICE_RISE.cost)}</span>`, u:'kr. a year', agr:rise.n});
  m.idle.forEach(x => items.push({ic:icon('idle', 'neg'), t:`${x.n} is live but unused`, s:`No invoice through it for ${x.quiet} days · ${esc(x.sub)}`, v:fmt(x.a.save), u:'kr. a year held', agr:x.n}));
  m.pend.forEach(x => items.push({ic:icon('wait', 'doc'), t:`${x.n} awaits its first invoice`, s:`Requested · supplier confirmed · ${esc(x.sub)}`, v:`<span class="fig-doc">+${fmt(x.a.save)}</span>`, u:'kr. a year', agr:x.n}));
  if(m.fresh.length) items.push({ic:icon('new', 'doc'), t:`${m.fresh.length} agreements negotiated this quarter`, s:m.fresh.map(x => x.n).join(', '),
    v:mHTML(m.fresh.reduce((t, x) => mAdd(t, x.openM), M()), {plus:true, cls:'fig-doc'}), u:'kr. a year', agr:m.fresh[0].n});
  if(isKari()){
    const noDoc = m.areas.filter(A => !A.whole && !A.land.length);
    if(noDoc.length) items.push({ic:icon('doc', ''), t:`No document for ${noDoc.length} areas`, s:noDoc.map(A => A.n).join(', '),
      v:mHTML(noDoc.reduce((t, A) => mAdd(t, A.openM), M()), {plus:true}), u:'kr. a year, estimated'});
  }
  $('#atC').textContent = items.length ? `${items.length}` : '';
  $('#attn').innerHTML = items.length ? items.map(it => `<li${it.agr ? ` class="act" data-agr="${esc(it.agr)}" tabindex="0" role="button"` : ''}>${it.ic}
    <span class="t"><b>${it.t}</b><span>${it.s}</span></span>
    <span class="v">${it.v}<small>${it.u}</small></span></li>`).join('')
    : `<li><span class="t"><span>Nothing needs you right now.</span></span></li>`;
  $('#attn').querySelectorAll('[data-agr]').forEach(li => { const go = () => focusAgreement(li.dataset.agr);
    li.addEventListener('click', go); li.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } }); });
}
function focusAgreement(name){ S.group = 'agr'; S.all = true; S.focus = name; S.sort = {k:'spend', dir:-1}; renderChrome(); renderChart(); renderTable(); }

/* ---- agreement health: coverage, what the held agreements are doing, two rates ---- */
function renderHealth(){
  const m = MODEL, spend = mMid(m.spendM), outside = mMid(m.outsideM);
  const held = m.savA + m.pend.reduce((s, x) => s + x.a.save, 0) + m.idle.reduce((s, x) => s + x.a.save, 0);
  const pendS = m.pend.reduce((s, x) => s + x.a.save, 0), idleS = m.idle.reduce((s, x) => s + x.a.save, 0), n = m.land.length + m.pend.length + m.idle.length;
  const seg = (v, tot, k, est) => v > 0 ? `<i class="${est ? 'est' : ''}" style="--k:${k};flex:${(v / tot).toFixed(4)} 1 0"></i>` : '';
  const effRate = m.thru ? pctStr(m.saved / m.thru * 100) : '—';
  const openRate = outside ? (m.openM.est || m.outsideM.est ? `<span class="fig-est">${pctStr(mMid(m.openM) / outside * 100)}</span>` : pctStr(m.openM.exact / outside * 100)) : '—';
  $('#health').innerHTML = `
    <div class="hrow">
      <div class="hl"><b>Coverage</b><span class="big">${pctHTML(m.thru, m.spendM)}</span></div>
      <div class="sbar" role="img" aria-label="Through agreements ${fmt(m.thru)} of ${fmt(spend)} kr.">${seg(m.thru, spend, ink(HUE.thru, 1))}${seg(outside, spend, ink(REST.b, REST.a), !!m.outsideM.est)}</div>
      <div class="hk"><span><i style="--k:${ink(HUE.thru, 1)}"></i>Through agreements <b>${fmt(m.thru)}</b></span><span><i style="--k:${ink(REST.b, REST.a)}"></i>Outside <b>${mHTML(m.outsideM)}</b></span></div>
    </div>
    <div class="hrow">
      <div class="hl"><b>What the ${n} held agreement${n === 1 ? '' : 's'} ${n === 1 ? 'does' : 'do'}</b><span class="big">${fmt(held)} <span class="pct">kr./yr</span></span></div>
      <div class="sbar" role="img" aria-label="${fmt(m.savA)} landing, ${fmt(pendS)} awaiting invoice, ${fmt(idleS)} idle">${seg(m.savA, held, ink(HUE.saved, 1))}${seg(pendS, held, ink(HUE.thru, .55))}${seg(idleS, held, 'var(--sentiment-negative)')}</div>
      <div class="hk"><span><i style="--k:${ink(HUE.saved, 1)}"></i>${m.land.length} landing <b>${fmt(m.savA)}</b></span>${pendS ? `<span><i style="--k:${ink(HUE.thru, .55)}"></i>${m.pend.length} awaiting invoice <b>${fmt(pendS)}</b></span>` : ''}${idleS ? `<span><i style="--k:var(--sentiment-negative)"></i>${m.idle.length} idle <b>${fmt(idleS)}</b></span>` : ''}</div>
    </div>
    <div class="hrow rates">
      <div class="rate"><b class="fig-pos">${effRate}</b><span>Saved on what ran through agreements</span></div>
      <div class="rate"><b>${openRate}</b><span>Open on what still runs outside them</span></div>
    </div>`;
}

/* ---- open savings, ranked ---- */
function renderOpen(){
  const m = MODEL, rows = [...m.openA].sort((a, b) => mMid(b.openM) - mMid(a.openM)), top = rows.slice(0, 8);
  $('#opC').textContent = `${rows.length} agreements`;
  $('#open').innerHTML = top.map((x, i) => `<li class="act" data-agr="${esc(x.n)}" tabindex="0" role="button">
    <span class="rk">${i + 1}</span>${logoHTML(x.n)}
    <span class="t"><b>${esc(x.n)}${x.st === 'new' ? ` ${chip('new', 'New')}` : ''}</b><span>${esc(x.sub)} · ${x.rate}% under ${x.est ? 'list price' : 'what you pay'}</span></span>
    <span class="v">${mHTML(x.openM, {plus:true, cls:'fig-doc'})}<small>kr. a year</small></span></li>`).join('');
  $('#opF').innerHTML = `<span>${rows.length} open · ${mHTML(m.openM, {plus:true, cls:'fig-doc'})} kr. a year in all</span><span class="sp"></span><button type="button" class="linkbtn" id="opAll">All agreements</button>`;
  $('#opAll').addEventListener('click', () => { S.group = 'agr'; S.all = true; S.focus = null; S.sort = {k:'open', dir:-1}; renderChrome(); renderChart(); renderTable(); });
  $('#open').querySelectorAll('[data-agr]').forEach(li => { const go = () => focusAgreement(li.dataset.agr);
    li.addEventListener('click', go); li.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } }); });
}

/* ---- the ledger: a sample of lines, newest first. No total row, so it claims no sum ---- */
let LINES = [];
function buildLedger(){
  const m = MODEL, W = m.W, start = W[0].d.getTime(), span = Math.max(1, NOW - start), out = [];
  m.areas.forEach(A => {
    const r = A.r, n = isKari() ? r.inv : Math.min(r.inv, 6); if(!n) return;
    const rnd = rngOf('led:' + r.id + ':' + S.who), items = BASKET[r.id], share = A.covA / r.amt;
    const off = [...(r.top || '').split('·').map(s => s.trim()), ...(OFF_SUP[r.id] || [])].filter(s => s && !A.land.some(a => sameSup(a.n, s)));
    const exportArea = isKari() && KARI_DOCS.reports[0].areas.includes(r.id);
    for(let i = 0; i < n; i++){
      const thru = A.land.length && (rnd() < share || (isKari() && r.inv === 1));
      const a = thru ? A.land[Math.floor(rnd() * A.land.length)] : null;
      const amt = Math.round((r.amt / Math.max(r.inv, 1)) * (0.5 + rnd() * 1.4) / 10) * 10;
      let d = new Date(start + rnd() * span);
      if(isKari()){ const inv = a && KARI_DOCS.invoices.find(x => x.sup === a.n); if(inv) d = new Date(inv.date);
        else if(exportArea) d = new Date(2026, 3 + Math.floor(rnd() * 3), 1 + Math.floor(rnd() * 27)); }
      out.push({d, inv:'F-' + (100000 + Math.floor(rnd() * 900000)), sup:a ? a.n : off[Math.floor(rnd() * off.length)] || 'Other suppliers',
        item:items[Math.floor(rnd() * items.length)], area:r.n, art:r.id, amt, agr:a ? a.n : null, save:a ? Math.round(amt * a.save / a.covers) : 0});
    }
  });
  const inWin = new Set(W.map(x => `${x.y}-${x.m}`));
  LINES = out.filter(l => inWin.has(`${l.d.getFullYear()}-${l.d.getMonth()}`)).sort((a, b) => b.d - a.d);
}
function renderLedger(){
  const m = MODEL, shown = LINES.slice(0, S.ledgerN), per = PER[S.period].l;
  $('#ldC').textContent = isKari() ? `${LINES.length} lines from your documents, ${per}` : `${fmt(m.invoices)} invoices, ${per}`;
  const dt = d => `${d.getDate()} ${MONTH_ABBR[d.getMonth()]}${d.getFullYear() !== NOW.getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`;
  $('#ledger').innerHTML = `<table><caption class="sr">Latest invoice lines</caption><thead><tr>
      <th scope="col">Date</th><th scope="col">Invoice</th><th scope="col">Supplier</th><th scope="col">Line</th><th scope="col">Area</th><th scope="col">Agreement</th><th scope="col" class="r">Amount</th><th scope="col" class="r">Saving</th></tr></thead>
    <tbody>${shown.map(l => `<tr>
      <td class="sub num">${dt(l.d)}</td><td class="sub num">${l.inv}</td>
      <td><span class="ent">${logoHTML(l.agr || l.sup)}<span class="nm">${esc(l.sup)}</span></span></td>
      <td>${esc(l.item)}</td>
      <td><span class="ent">${catArt(l.art)}<span class="sb" style="color:inherit">${esc(l.area)}</span></span></td>
      <td>${l.agr ? chip('land', esc(l.agr)) : '<span class="none">Outside agreements</span>'}</td>
      <td class="r">${fmt(l.amt)}</td>
      <td class="r">${l.save ? `<span class="fig-pos">${fmt(l.save)}</span>` : '<span class="none">—</span>'}</td></tr>`).join('') || `<tr><td colspan="8" class="sub">No lines in this period.</td></tr>`}</tbody></table>`;
  const more = LINES.length > S.ledgerN;
  $('#ldF').innerHTML = `<span>${isKari() ? `Showing ${shown.length} of ${LINES.length} · ${KARI_DOCS.invoices.length} supplier reports and the ${KARI_DOCS.reports[0].name}` : `Showing ${shown.length} of ${fmt(m.invoices)} · the rest in Reports`}</span><span class="sp"></span>${more ? `<button type="button" class="linkbtn" id="ldMore">Show 10 more</button>` : ''}`;
  const b = $('#ldMore'); if(b) b.addEventListener('click', () => { S.ledgerN += 10; renderLedger(); });
}

function render(){
  MODEL = build();
  renderChrome(); renderKpis(); renderChart(); renderTable(); renderAttention(); renderHealth(); renderOpen(); buildLedger(); renderLedger();
}
document.querySelectorAll('.seg[data-set]').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if(!b) return;
  const k = seg.dataset.set; if(S[k] === b.dataset.v) return;
  S[k] = b.dataset.v; if(k === 'group'){ S.all = false; S.focus = null; S.sort = {k:'spend', dir:-1}; }
  if(k === 'period'){ S.ledgerN = 10; render(); } else { renderChrome(); renderChart(); renderTable(); }
}));
$('#who').addEventListener('change', e => { S.who = e.target.value; S.all = false; S.focus = null; S.ledgerN = 10; S.sort = {k:'spend', dir:-1};
  try{ history.replaceState(null, '', S.who === 'bob' ? location.pathname : `?who=${S.who}`); }catch(err){} render(); });
let rT; new ResizeObserver(() => { clearTimeout(rT); rT = setTimeout(() => { if(MODEL) renderChart(); }, 80); }).observe($('#chB'));
render();
</script>
