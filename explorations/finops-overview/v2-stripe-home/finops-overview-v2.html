<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advantage — overview as a payments-style home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
<style>
/* tokens, copied from advantage-main.html */
:root{
  --general-background:#fafafa;--general-foreground:#0f0f0f;--general-primary:#1b64dc;--general-primary-deep:#12459f;
  --general-primary-foreground:#fafafa;--general-secondary:#dbe9ff;--general-muted:#f2f2f2;
  --general-muted-foreground:#6e6e6e;--general-border:#bdd7ff;--general-input:#ffffff;
  --sidebar-border:#e0e0e0;--surface:#ffffff;--surface-tile:#f5f6f7;--brand-ice:#edf5ff;--brand-midnight:#000a45;
  --sentiment-positive:#009689;--sentiment-positive-ink:#007c71;--sentiment-positive-ink-on-tint:#00796e;
  --sentiment-negative:#f54a00;--sentiment-negative-ink-on-tint:#c43b00;
  --font-sans:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --text-xs:13px;--text-sm:14px;--text-base:16px;--text-lg:18px;--text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:36px;
  --rounded-xs:4px;--rounded-sm:8px;--rounded-md:12px;--rounded-lg:16px;--rounded-xl:20px;--rounded-full:9999px;
  --shadow-xs:0 1px 2px 0 #0000000d;--shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;--shadow-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;
  --hairline:#ececec;--card-stroke:#e7e7ea;--t-fast:.15s ease;
  --tint-pos:#d9f2ef;--tint-idle:#ffe9dd;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:var(--font-sans);background:var(--surface);color:var(--general-foreground);font-size:var(--text-base);line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
a{color:var(--general-primary);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline;text-underline-offset:3px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--general-primary);outline-offset:2px;border-radius:var(--rounded-xs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.fig-pos{color:var(--sentiment-positive-ink)}
.fig-doc{color:var(--general-primary)}
.fig-neg{color:var(--sentiment-negative-ink-on-tint)}
.fig-est{font-weight:inherit;color:var(--general-muted-foreground);text-decoration:underline dotted currentColor;text-decoration-thickness:1.5px;text-underline-offset:.16em;text-decoration-skip-ink:none}
.sep{color:var(--general-muted-foreground);font-weight:400;margin:0 3px}
.none{color:var(--general-muted-foreground)}

/* ---------- the shell: a white sidebar and a centred content column ---------- */
.app{display:flex;min-height:100vh}
.side{flex:0 0 232px;position:sticky;top:0;height:100vh;overflow:auto;padding:var(--s3) var(--s3) var(--s6);border-right:1px solid var(--hairline);display:flex;flex-direction:column;gap:var(--s5)}
.acct-w{position:relative}
.acct{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2);border-radius:var(--rounded-sm)}
.acct:hover,.acct[aria-expanded="true"]{background:var(--surface-tile)}
/* the company menu: both companies, the person who runs each, and where its figures come from */
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;padding:var(--s2);background:var(--surface);border:1px solid var(--card-stroke);
  border-radius:var(--rounded-md);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:2px}
.menu[hidden]{display:none}
.menu-h{padding:var(--s1) var(--s2) var(--s2);font-size:var(--text-sm);color:var(--general-muted-foreground)}
.menu button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2);border-radius:var(--rounded-sm)}
.menu button:hover{background:var(--surface-tile)}
.menu .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.menu .t b{font-size:var(--text-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .t span{font-size:var(--text-sm);color:var(--general-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .tick{width:16px;height:16px;color:var(--general-primary);visibility:hidden;flex:0 0 auto}
.menu button[aria-checked="true"] .tick{visibility:visible}
.acct .av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--brand-ice);color:var(--general-primary);font-size:var(--text-xs);font-weight:700}
.acct .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acct .t b{font-size:var(--text-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .t span{font-size:var(--text-sm);color:var(--general-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct>svg{width:14px;height:14px;color:var(--general-muted-foreground);flex:0 0 auto}
.nav{list-style:none;display:flex;flex-direction:column;gap:1px}
.nav li button{display:flex;align-items:center;gap:var(--s3);width:100%;height:34px;padding:0 var(--s2);border-radius:var(--rounded-sm);font-size:var(--text-sm);font-weight:500;color:var(--general-foreground)}
.nav li button:hover{background:var(--surface-tile)}
.nav li button[aria-current]{color:var(--general-primary);font-weight:600}
.nav li button svg{width:16px;height:16px;flex:0 0 auto;color:var(--general-muted-foreground)}
.nav li button[aria-current] svg{color:var(--general-primary)}
.nav li button .chev{margin-left:auto;width:14px;height:14px}
.nav-h{padding:0 var(--s2);font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.nav-g{display:flex;flex-direction:column;gap:var(--s2)}
.canvas{flex:1 1 auto;min-width:0;display:flex;justify-content:center;padding:var(--s4) var(--s6) var(--s24)}
.wrap{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:var(--s12)}

/* ---------- the top row: search and the icons ---------- */
.topbar{display:flex;align-items:center;gap:var(--s4)}
.search{display:flex;align-items:center;gap:var(--s2);width:300px;height:36px;padding:0 var(--s3);border-radius:var(--rounded-sm);background:var(--surface-tile);color:var(--general-muted-foreground)}
.search svg{width:16px;height:16px;flex:0 0 auto}
.search input{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;font-size:var(--text-base);color:var(--general-foreground)}
.search input::placeholder{color:var(--general-muted-foreground)}
.topbar .pill{margin-left:auto}
.icons{display:flex;align-items:center;gap:var(--s1)}
@media(max-width:900px){.icons{margin-left:auto}}
.icons button{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--rounded-sm);color:var(--general-muted-foreground)}
.icons button:hover{background:var(--surface-tile);color:var(--general-foreground)}
.icons button svg{width:16px;height:16px}
.icons .plus{background:var(--general-primary);color:#fff;border-radius:50%;width:24px;height:24px;margin-left:var(--s2)}
.icons .plus:hover{background:var(--general-primary-deep);color:#fff}
.icons .plus svg{width:14px;height:14px}

/* ---------- sections ---------- */
.sec-h{display:flex;align-items:center;gap:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--hairline)}
.sec-h h1,.sec-h h2{font-size:var(--text-3xl);font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sec-h .sp{flex:1 1 auto}
.sec-h.plain{border:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 var(--s4);border-radius:var(--rounded-sm);
  border:1px solid var(--card-stroke);background:var(--surface);box-shadow:var(--shadow-xs);font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-tile)}
.btn svg{width:14px;height:14px}
.btn[disabled]{color:var(--general-muted-foreground);box-shadow:none;cursor:default}
.btn[disabled]:hover{background:var(--surface)}
.sec{display:flex;flex-direction:column;gap:var(--s5)}

/* ---------- this month: figures, one thin line, and the two facts beside it ---------- */
.td{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s8)}
.td-l{display:flex;flex-direction:column;gap:var(--s12)}
.figs{display:flex;gap:var(--s12)}
.fig{display:flex;flex-direction:column;gap:2px}
.dd{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-base);font-weight:500;color:var(--general-foreground);position:relative}
.dd svg{width:14px;height:14px;color:var(--general-muted-foreground)}
.fig b{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.015em;line-height:1.3}
.fig b small{font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground);letter-spacing:0}
.fig small{font-size:var(--text-sm);color:var(--general-muted-foreground)}
.tl-w{display:flex;flex-direction:column;gap:6px}
svg.tl{display:block;width:100%;height:96px;overflow:visible}
.xl{display:flex;justify-content:space-between;font-size:var(--text-sm);color:var(--general-muted-foreground)}
.td-r{display:flex;flex-direction:column}
.mini{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) 0 var(--s6)}
.mini+.mini{padding-top:var(--s6);border-top:1px solid var(--hairline)}
.mini-h{display:flex;align-items:baseline;gap:var(--s3)}
.mini-h b{font-size:var(--text-base);font-weight:600;flex:1 1 auto}
.mini-h a{font-size:var(--text-sm)}
.mini-v{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.015em;line-height:1.3}
.mini-v small{font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground);letter-spacing:0;margin-left:3px}
.mini span.c{font-size:var(--text-sm);color:var(--general-muted-foreground)}

/* ---------- your overview: the control row ---------- */
.ctl-row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;height:32px;padding:0 var(--s2) 0 var(--s3);border:1px solid var(--card-stroke);border-radius:var(--rounded-full);
  background:var(--surface);font-size:var(--text-sm);white-space:nowrap;cursor:pointer}
.chip:hover{background:var(--surface-tile)}
.chip .cl{color:var(--general-muted-foreground);font-weight:500;padding-right:var(--s2);margin-right:var(--s2);border-right:1px solid var(--hairline)}
.chip .cv{color:var(--general-primary);font-weight:600}
.chip svg{width:14px;height:14px;color:var(--general-primary);margin-left:3px}
.chip .x{display:grid;place-items:center;width:16px;height:16px;margin:0 2px 0 -4px;color:var(--general-muted-foreground)}
.chip .x svg{width:14px;height:14px;color:inherit;margin:0}
.chip select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.chip.off .cv{color:var(--general-muted-foreground)}
.chip.off svg{color:var(--general-muted-foreground)}
.ctl-row .sp{flex:1 1 auto}

/* ---------- the cards ---------- */
/* one ice-blue mat holds every overview card: 8px around and 8px between, so the
   borders merge into a single surface; a deeper-ice hairline edges the mat */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);padding:var(--s2);background:var(--brand-ice);border-radius:var(--rounded-lg);box-shadow:0 0 0 1px var(--general-secondary)}
.card{display:flex;flex-direction:column;gap:var(--s4);min-height:320px;padding:var(--s5);border:0;border-radius:var(--rounded-sm);background:var(--surface);box-shadow:var(--shadow-xs);min-width:0}
/* title, figure and its comparison are one tight group; the plot or the rows sit a step below */
.card-top{display:flex;flex-direction:column;gap:var(--s1)}
.card-h{display:flex;align-items:center;gap:6px}
.card-h h3{font-size:var(--text-base);font-weight:600}
.card-h .i{width:16px;height:16px;color:var(--general-muted-foreground);display:inline-grid;place-items:center}
.card-h .i svg{width:15px;height:15px}
.card-h .sp{flex:1 1 auto}
.card-h .tag{font-size:var(--text-sm);color:var(--general-muted-foreground);font-weight:500}
.card .v{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.015em;line-height:1.3}
.card .v small{font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground);letter-spacing:0;margin-left:3px}
.card .cmp{font-size:var(--text-sm);color:var(--general-muted-foreground)}
.card .plot{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:120px;position:relative}
svg.ln{display:block;width:100%;height:110px;overflow:visible}
.card .foot{display:flex;justify-content:space-between;gap:var(--s3);font-size:var(--text-sm);color:var(--general-muted-foreground)}
.rows{list-style:none;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s1) 0;border-bottom:1px solid var(--hairline)}
.rows li:last-child{border-bottom:0}
.rows .k{width:8px;height:8px;border-radius:50%;background:var(--k);flex:0 0 auto}
.rows .k.est{background:repeating-linear-gradient(45deg,var(--k) 0 1.5px,transparent 1.5px 3.5px)}
.rows .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rows .t b{font-weight:500;font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .t span{font-size:var(--text-sm);color:var(--general-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .a{text-align:right;font-size:var(--text-base);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.rows .a small{display:block;font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.rows li.sum{color:var(--general-muted-foreground);font-size:var(--text-sm);min-height:36px}
.rows li.sum .t b{font-size:var(--text-sm)}
.rows li.sum .a{font-size:var(--text-sm);color:var(--general-muted-foreground)}
.rows.rk li{min-height:56px}
.lg{position:relative;width:32px;height:32px;border-radius:8px;background:var(--surface-tile);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.lg b{font-size:var(--text-xs);font-weight:700;letter-spacing:.02em;color:var(--general-muted-foreground)}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-tile);color:var(--general-muted-foreground);flex:0 0 auto}
.ic svg{width:16px;height:16px}
.ic.neg{background:var(--tint-idle);color:var(--sentiment-negative-ink-on-tint)}
.ic.doc{background:var(--brand-ice);color:var(--general-primary)}
.sbar{display:flex;gap:2px;height:6px;margin:var(--s1) 0 var(--s2)}
.sbar i{border-radius:2px;background:var(--k);min-width:3px}
.sbar i.est{background:repeating-linear-gradient(45deg,var(--k) 0 2px,transparent 2px 5px)}
.empty{flex:1 1 auto;display:grid;place-items:center;border:1px dashed var(--card-stroke);border-radius:var(--rounded-sm);min-height:180px}
.empty span{padding:var(--s2) var(--s3);border-radius:var(--rounded-sm);background:var(--surface-tile);font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.ln text,.tl text{font-family:var(--font-sans);font-size:var(--text-xs);fill:var(--general-muted-foreground)}
.ln .hit,.tl .hit{fill:transparent}
.ln .cross,.tl .cross{stroke:var(--card-stroke);stroke-width:1}
.tip{position:absolute;z-index:3;pointer-events:none;padding:var(--s2) var(--s3);background:var(--surface);border:1px solid var(--card-stroke);border-radius:var(--rounded-sm);
  box-shadow:var(--shadow-md);font-size:var(--text-sm);white-space:nowrap;display:flex;flex-direction:column;gap:2px}
.tip[hidden]{display:none}
.tip h4{font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.tip div{display:flex;align-items:center;gap:var(--s2)}
.tip i{width:10px;height:2px;border-radius:1px;background:var(--k);flex:0 0 auto}
.tip i.prev{background:repeating-linear-gradient(90deg,var(--k) 0 2px,transparent 2px 4px)}
.tip b{font-weight:600;font-variant-numeric:tabular-nums}
.tip span{color:var(--general-muted-foreground)}

/* ---------- all your purchasing areas: the spend review, in this page's own idiom ---------- */
.card.areas{grid-column:1 / -1;min-height:0;padding:0;gap:0}
.card.areas>.card-h{padding:var(--s4) var(--s5);border-bottom:1px solid var(--hairline);flex-wrap:wrap;row-gap:var(--s2)}
.key{display:inline-flex;align-items:center;gap:var(--s3);font-size:var(--text-sm);color:var(--general-muted-foreground);white-space:nowrap}
.key span{display:inline-flex;align-items:center;gap:5px}
.key svg{width:14px;height:14px}
.key .ok{color:var(--sentiment-positive-ink)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border:1px solid var(--card-stroke);border-radius:var(--rounded-full);
  font-size:var(--text-sm);font-weight:500;color:var(--general-foreground);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--general-accent)}
.pill.done i{background:var(--sentiment-positive)}
.rv{--cols:minmax(0,1fr) 170px 120px 230px 20px}
.rv-th{display:grid;grid-template-columns:var(--cols);gap:var(--s4);padding:var(--s3) var(--s5) var(--s2);font-size:var(--text-sm);font-weight:500;color:var(--general-muted-foreground)}
.rv-th .r{text-align:right}
.rv-tr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:var(--s4);min-height:56px;padding:var(--s2) var(--s5);border-top:1px solid var(--hairline);transition:background var(--t-fast)}
.rv-tr.stop{background:rgb(245 74 0 / .05)}
.rv details summary{list-style:none;cursor:pointer}
.rv details summary::-webkit-details-marker{display:none}
.rv details summary:hover .rv-tr{background:var(--surface-tile)}
.rv details[open] summary .rv-tr{background:var(--brand-ice)}
.rv details summary:focus-visible{outline:2px solid var(--general-primary);outline-offset:-2px}
.rv-area{display:flex;align-items:center;gap:var(--s3);min-width:0}
.rv-ic{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;color:var(--general-muted-foreground)}
.rv-ic svg{width:20px;height:20px}
.rv-name{min-width:0}
.rv-name b{display:block;font-size:var(--text-base);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-name span{display:block;font-size:var(--text-sm);color:var(--general-muted-foreground);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-num{text-align:right;font-size:var(--text-base);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv-num .ok{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:4px;color:var(--sentiment-positive-ink)}
.rv-num .fig-est{font-weight:500}
.rv-st{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-sm);font-weight:500;color:var(--general-foreground);white-space:nowrap}
.rv-st svg{width:14px;height:14px;flex:0 0 auto}
.rv-st.muted{color:var(--general-muted-foreground)}
.rv-st.neg{color:var(--sentiment-negative-ink-on-tint)}
.rv-st.pos{color:var(--sentiment-positive-ink)}
.rv-st.doc{color:var(--general-primary)}
.rv-x{display:grid;place-items:center;width:20px;height:20px;color:var(--general-muted-foreground);transition:transform .18s ease}
.rv-x svg{width:16px;height:16px}
.rv details[open] .rv-x{transform:rotate(180deg)}
/* the editor: one soft tile under the open row */
.rv-ed{margin:0 var(--s5) var(--s5);padding:var(--s5);border-radius:var(--rounded-sm);background:var(--surface-tile);display:flex;flex-direction:column;gap:var(--s5)}
.rv-ed .lead{font-size:var(--text-sm);color:var(--general-foreground);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rv-ed .lead svg{width:14px;height:14px;color:var(--general-muted-foreground)}
.rv-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5)}
.rv-col{display:flex;flex-direction:column;gap:var(--s4)}
.rv-f{display:flex;flex-direction:column;gap:6px}
.rv-f label{font-size:var(--text-sm);font-weight:600}
.rv-f label i{font-style:normal;font-weight:400;color:var(--general-muted-foreground)}
.rv-f .help{font-size:var(--text-sm);color:var(--general-muted-foreground)}

function splitExact(total, weights){ const out = []; let used = 0; const s = weights.reduce((a, b) => a + b, 0) || 1;
  weights.forEach((w, i) => { const v = i === weights.length - 1 ? total - used : Math.round(total * w / s); out.push(v); used += v; }); return out; }
function bonusOn(volume){ let prev = 0, total = 0; for(const t of BONUS_TIERS){ if(volume <= prev) break; const to = Math.min(volume, t.upTo); total += Math.round((to - prev) * t.rate / 100); prev = t.upTo; } return total; }

/* =====================================================================================
   MODEL — a day for each of the trailing 365 days. Each area's year is split into
   months on the seeded seasonal weights the Reports page uses, each month into its
   days on weights keyed by day-of-month, so the two partial Octobers at the ends of
   the window together make exactly one October and the year sums to the roster.
   Agreement volume and saving are split in proportion to spend, so a day can never
   put more through an agreement than it spent.
   ===================================================================================== */
const DAYS = Array.from({length:365}, (_, i) => new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - (364 - i)));
const DI = Object.fromEntries(DAYS.map((d, i) => [dayKey(d), i]));
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
function roster(){
  const src = isKari() ? ROWS_KARI : ROWS_BOB;
  const rows = src.map(r => ({...r, agr:r.agr.map(a => ({...a}))}));
  (NEW6_BY[S.who] || []).forEach(x => { const r = rows.find(row => row.id === x.cat); if(r && !r.agr.some(a => a.n === x.n)) r.agr.push({n:x.n, covers:x.covers, save:x.save, req:false, isNew:true}); });
  return rows;
}
function daySeries(total, key){
  const m12 = splitExact(total, monthlyShares(key)), out = new Array(365).fill(0);
  for(let m = 0; m < 12; m++){
    const n = 31, rnd = rngOf(key + ':dom:' + m), w = Array.from({length:n}, () => 0.7 + rnd() * 0.6), parts = splitExact(m12[m], w);
    /* give the month's krone to whichever year's copy of that day sits in the window;
       a day a short month does not have hands its part to the month's last day */
    let carry = 0;
    for(let dom = n; dom >= 1; dom--){
      let v = parts[dom - 1] + carry; carry = 0; let placed = false;
      for(const y of [NOW.getFullYear() - 1, NOW.getFullYear()]){
        if(dom > dim(y, m)) continue;
        const i = DI[`${y}-${m}-${dom}`]; if(i == null) continue;
        out[i] += v; placed = true; break;
      }
      if(!placed) carry = v;
    }
    if(carry){ /* a day outside the window entirely: fold it into the nearest day of that month in the window */
      for(let dom = n; dom >= 1; dom--){ let done = false; for(const y of [NOW.getFullYear() - 1, NOW.getFullYear()]){ const i = DI[`${y}-${m}-${dom}`]; if(i != null){ out[i] += carry; done = true; break; } } if(done) break; }
    }
  }

}
const propSplit = (total, base) => splitExact(total, base.map(v => Math.max(v, 0)));
let MODEL = null;
function build(){
  const R = roster();
  const areas = R.map(r => {
    const spendD = daySeries(r.amt, 'area:' + r.id);
    const land = r.agr.filter(isLanding), pend = r.agr.filter(isPending), idle = r.agr.filter(isDormant), open = r.agr.filter(a => !a.req);
    const covA = land.reduce((s, a) => s + a.covers, 0), savA = land.reduce((s, a) => s + a.save, 0);
    const pendCov = pend.reduce((s, a) => s + a.covers, 0), idleCov = idle.reduce((s, a) => s + a.covers, 0);
    return {id:r.id, n:r.n, r, land, pend, idle, open, whole:areaWhole(r.id), spendD, thruD:propSplit(covA, spendD), savedD:propSplit(savA, spendD), covA, savA,
      pendD:propSplit(pendCov, spendD), idleD:propSplit(idleCov, spendD),
      openM:open.reduce((m, a) => mAdd(m, isEst(a) ? M(0, a.save) : M(a.save, 0)), M())};
  });
  const agrs = []; R.forEach(r => r.agr.forEach(a => agrs.push({n:a.n, a, r, st:stateOf(a), est:isEst(a), rate:Math.round(a.save / a.covers * 100), quiet:quietDays(a)})));
  /* suppliers, as v1 builds them: the landing agreement's supplier with its exact volume, then the roster's names */
  const sups = [];
  areas.forEach(A => {
    const r = A.r, names = [];
    A.land.forEach(a => names.push({n:a.n, agr:a, land:true}));
    [...(r.top || '').split('·').map(s => s.trim()).filter(Boolean), ...(OFF_SUP[r.id] || [])].forEach(nm => { if(!names.some(x => sameSup(x.n, nm))) names.push({n:nm}); });
    names.forEach(x => { if(!x.agr){ const a = r.agr.find(ag => sameSup(ag.n, x.n)); if(a) x.agr = a; } });
    const take = names.slice(0, r.sup), others = take.filter(x => !x.land), rnd = rngOf('sup:' + r.id);
    const parts = splitExact(r.amt - A.covA, others.map((x, i) => 1 / (i + 1.3) * (0.8 + rnd() * 0.4)));
    others.forEach((x, i) => x.spendA = parts[i]); take.forEach(x => { if(x.land) x.spendA = x.agr.covers; });
    take.forEach(x => sups.push({n:x.n, area:r.n, agr:x.agr, st:x.agr ? stateOf(x.agr) : 'none', exact:x.land || A.whole, spendD:propSplit(x.spendA, A.spendD)}));
  });
  const sumD = (xs, k) => { const o = new Array(365).fill(0); xs.forEach(x => x[k].forEach((v, i) => o[i] += v)); return o; };

  return {R, areas, agrs, sups, land, pend, idle, openA, fresh:openA.filter(x => x.st === 'new'),
    spendD:sumD(areas, 'spendD'), spendExactD:sumD(areas.filter(A => A.whole), 'spendD'), spendEstD:sumD(areas.filter(A => !A.whole), 'spendD'),
    thruD:sumD(areas, 'thruD'), savedD:sumD(areas, 'savedD'), pendCovD:sumD(areas, 'pendD'), idleCovD:sumD(areas, 'idleD'),
    covA:areas.reduce((s, A) => s + A.covA, 0), savA:areas.reduce((s, A) => s + A.savA, 0), openM:areas.reduce((m, A) => mAdd(m, A.openM), M()),
    bonus:bonusOn(areas.reduce((s, A) => s + A.covA, 0)), invoices:areas.reduce((s, A) => s + A.r.inv, 0), suppliers:areas.reduce((s, A) => s + A.r.sup, 0)};
}

/* ---- windows and buckets ---- */
function rangeDays(){ const r = RANGES[S.range]; if(r.days) return r.days; const jan = new Date(NOW.getFullYear(), 0, 1); return Math.round((NOW - jan) / 864e5) + 1; }
const canCompare = () => rangeDays() * 2 <= 365;
const winIdx = (back = 0) => { const n = rangeDays(), end = 365 - back * n; return Array.from({length:n}, (_, i) => end - n + i).filter(i => i >= 0); };
const sumIdx = (d, idx) => idx.reduce((s, i) => s + d[i], 0);
function buckets(idx){
  const g = S.gran, out = [];
  idx.forEach(i => { const d = DAYS[i];
    const k = g === 'day' ? dayKey(d) : g === 'week' ? Math.floor((i - idx[0]) / 7) : `${d.getFullYear()}-${d.getMonth()}`;
    let b = out[out.length - 1]; if(!b || b.k !== k){ b = {k, idx:[], d}; out.push(b); } b.idx.push(i); });
  return out;
}
const bLabel = (b, long) => { const d = b.d, dd = `${d.getDate()} ${MONTH_ABBR[d.getMonth()]}`;
  if(S.gran === 'month') return `${MONTH_ABBR[d.getMonth()]} ${long ? d.getFullYear() : String(d.getFullYear()).slice(2)}`;
  if(S.gran === 'week'){ const e = DAYS[b.idx[b.idx.length - 1]]; return long ? `${dd} – ${e.getDate()} ${MONTH_ABBR[e.getMonth()]}` : dd; }
  return long ? `${dd} ${d.getFullYear()}` : dd; };

/* ---- a thin line: the series, a dotted previous period, a dotted baseline, end label ---- */
function lineSVG(svg, {pts, prev, color, est, labels, dottedTail = 0, tipEl, host}){
  const w = Math.max(200, svg.clientWidth || 400), h = parseFloat(getComputedStyle(svg).height) || 110, padT = 8, padB = 6, padR = 52;
  const all = [...pts, ...(prev || [])], max = Math.max(1, ...all) * 1.08, n = pts.length + dottedTail;
  const x = i => n > 1 ? (w - padR) * i / (n - 1) : 0, y = v => padT + (h - padT - padB) * (1 - v / max);
  const path = s => s.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  let out = `<line x1="0" x2="${(w - padR).toFixed(1)}" y1="${(h - padB).toFixed(1)}" y2="${(h - padB).toFixed(1)}" stroke="${GHOST}" stroke-width="1" stroke-dasharray="2 4"/>`;
  if(prev && prev.length) out += `<path d="${path(prev)}" fill="none" stroke="${GHOST}" stroke-width="1.5" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/>`;
  out += `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="1.5"${est ? ' stroke-dasharray="4 3"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
  if(dottedTail){ const lx = x(pts.length - 1), ly = y(pts[pts.length - 1]);
    out += `<path d="M${lx.toFixed(1)},${ly.toFixed(1)} L${(w - padR).toFixed(1)},${(h - padB).toFixed(1)}" fill="none" stroke="${GHOST}" stroke-width="1" stroke-dasharray="2 4"/>`; }
  const last = pts[pts.length - 1];
  out += `<text x="${(w - padR + 8).toFixed(1)}" y="${(y(last) + 4.5).toFixed(1)}">${fmtCompact(last)}</text>`;
  out += `<line class="cross" id="${svg.id}-cross" x1="0" x2="0" y1="${padT}" y2="${h - padB}" style="display:none"/>`;
  const slot = n > 1 ? (w - padR) / (n - 1) : w;
  pts.forEach((v, i) => { out += `<rect class="hit" data-i="${i}" x="${(x(i) - slot / 2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${h}"/>`; });
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.innerHTML = out;
  if(!tipEl) return;
  const cross = svg.querySelector('.cross');
  const show = i => { cross.style.display = ''; cross.setAttribute('x1', x(i).toFixed(1)); cross.setAttribute('x2', x(i).toFixed(1));
    tipEl.innerHTML = `<h4>${labels[i]}</h4><div><i style="--k:${color}"></i><b>${fmt(pts[i])}</b><span>kr.</span></div>${prev && prev[i] != null ? `<div><i class="prev" style="--k:${GHOST}"></i><b>${fmt(prev[i])}</b><span>previous period</span></div>` : ''}`;
    tipEl.hidden = false; const hb = host.getBoundingClientRect(), sb = svg.getBoundingClientRect(), tw = tipEl.offsetWidth;
    let left = sb.left - hb.left + x(i) * (sb.width / w) + 12; if(left + tw > hb.width - 4) left = sb.left - hb.left + x(i) * (sb.width / w) - tw - 12;
    tipEl.style.left = Math.max(0, left) + 'px'; tipEl.style.top = (sb.top - hb.top) + 'px'; };
  const hide = () => { cross.style.display = 'none'; tipEl.hidden = true; };
  svg.querySelectorAll('.hit').forEach(r => { r.addEventListener('pointermove', () => show(+r.dataset.i)); r.addEventListener('pointerleave', hide); });
}

/* =====================================================================================
   ALL YOUR PURCHASING AREAS — the spend review, in this page's idiom. One flat list,
   reported figures first: an area on an agreement carries its trend, an idle one
   says when it stopped, a requested one that it is starting, and every other area
   is Not reviewed until the person gives a figure. A row opens into the editor:
   your annual spend, your supplier, or the documents that say it for you. A typed
   figure is your own and prints as a band; Save keeps it, Send files a request to
   Peter, keeping your own supplier parks the area. Annual figures throughout — the
   units a spend is typed in — so this card does not follow the period chips.
   ===================================================================================== */
const RVKEY = 'finops-v2-review';
let RV = null;
function rvStore(){
  if(!RV){ try{ RV = JSON.parse(localStorage.getItem(RVKEY) || 'null'); }catch(e){ RV = null; } if(!RV || typeof RV !== 'object' || Array.isArray(RV)) RV = {}; }
  RV[S.who] = RV[S.who] || {review:{}, tune:{}, reqs:[]};
  return RV[S.who];
}
function rvSave(){ try{ localStorage.setItem(RVKEY, JSON.stringify(RV)); }catch(e){ /* private mode */ } }
const spTyped = {};                 /* {areaId: kr. a year} typed and not yet saved */
let RV_OPEN = null;                 /* the row that is open, kept across a re-render */
const TUNE_BAND = .07;
const bandRange = (lo, hi) => `${fmtCompact(Math.round(lo))}–${fmtCompact(Math.round(hi))}`;
const tuneStr = save => `+${bandRange(save * (1 - TUNE_BAND), save * (1 + TUNE_BAND))}`;
const figHTML = (v, est, plus = true) => est ? `<span class="fig-est">${plus ? '+' : ''}${estRange(v)}</span>` : `<span class="fig-doc">${plus ? '+' : ''}${fmt(v)}</span>`;
const spNum = s => { const d = String(s).replace(/[^\d]/g, ''); return d ? +d : null; };
const TICK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV_D = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DASH_O = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3"/></svg>';
const DOC_I = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.5 12.5l6.2-6.2a3.2 3.2 0 014.5 4.5l-7.4 7.4a5 5 0 01-7.1-7.1L11.6 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const UP_I = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V5M7 10l5-5 5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const SPARK_I = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6L12 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z" fill="currentColor"/></svg>';

const SEND_I = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-7-5 16-3-6.5L4 12z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 14.5L20 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const rvRev = id => rvStore().review[id] || {};
const rvReq = id => rvStore().reqs.find(q => q.catId === id) || null;
const rvIdx = (a, b) => Array.from({length:b - a}, (_, i) => a + i);

/* the rows, one per area, reported figures first */
function rvRows(){
  const m = MODEL, st = rvStore(), rows = [];
  const since = MONTH_ABBR[(NOW.getMonth() + 9) % 12];
  m.areas.forEach(A => {
    const r = A.r, tuned = st.tune[r.id], rv = rvRev(r.id);
    const row = {id:r.id, A, r, n:r.n, art:r.id, rate:r.rate, exact:A.whole, openN:A.open.length, sup:(r.top || '').split('·')[0].trim(),
      doc:isKari() ? `the ${KARI_DOCS.reports[0].name}` : `Visma.net · ${fmt(r.inv)} reports`, docs:rv.docs || []};
    if(A.land.length){
      const names = A.land.map(a => a.n).join(' and ');
      const cur = sumIdx(A.thruD, rvIdx(274, 365)), prev = sumIdx(A.thruD, rvIdx(183, 274)), pct = prev ? Math.round((cur - prev) / prev * 100) : 0;
      Object.assign(row, {kind:'land', spend:A.whole ? r.amt : A.covA, reported:true, saved:A.savA,
        sub:A.whole ? `${fmt(A.covA)} through ${names}` : `Through ${names} · the rest is not reported`,
        st:Math.abs(pct) < 8 ? {t:'Steady', c:''} : pct < 0 ? {t:`Down ${-pct}% since ${since}`, c:'neg'} : {t:`Up ${pct}% since ${since}`, c:'pos'}});
    } else if(A.idle.length){
      const a = A.idle[0], d = new Date(NOW); d.setDate(d.getDate() - quietDays(a));
      Object.assign(row, {kind:'idle', spend:r.amt, reported:true, saved:0, stop:true,
        sub:`0 through ${a.n} since ${MONTH_ABBR[d.getMonth()]} · was ${fmt(a.covers)}`, st:{t:`Stopped in ${MONTH_ABBR[d.getMonth()]}`, c:'neg'}});
    } else if(A.pend.length){
      const a = A.pend[0];
      Object.assign(row, {kind:'pend', spend:r.amt, reported:true, saved:0, sub:`${a.n} requested · supplier confirmed`, st:{t:'Starting · awaiting first report', c:'doc'}});
    } else {
      const amt = tuned != null ? tuned : r.amt;
      Object.assign(row, {kind:'open', amt, on:tuned != null, spend:amt, reported:A.whole, saved:0});
      const s = rvStatus(row); row.s = s;
      row.st = s === 'skip' ? {t:'Own supplier, kept', c:'muted'} : s === 'sent' ? {t:'With Peter for review', c:'doc'} : s === 'dirty' ? {t:'Reviewing', c:'doc'}
             : s === 'saved' ? {t:'Reviewed', c:'pos', tick:true} : {t:'Not reviewed', c:'muted', chev:true};
      row.sub = s === 'saved' || s === 'sent' ? `Your figure${rv.sup ? ' · ' + esc(rv.sup) : ''}${row.docs.length ? ` · ${row.docs.length} document${row.docs.length === 1 ? '' : 's'}` : ''}`
              : s === 'skip' ? `Kept ${rv.sup ? esc(rv.sup) : 'your own supplier'}`
              : A.whole ? row.sup : `${row.openN} agreement${row.openN === 1 ? '' : 's'} available · ${r.rate}% under list price`;
    }
    rows.push(row);
  });
  rows.sort((a, b) => ((b.reported || b.on) - (a.reported || a.on)) || (b.spend - a.spend));
  return rows;
}
function rvStatus(row){
  if(rvRev(row.id).skip) return 'skip';
  if(rvReq(row.id)) return 'sent';
  if(spTyped[row.id] != null && spTyped[row.id] !== row.amt) return 'dirty';
  if(row.on || rvRev(row.id).sup || row.docs.length) return 'saved';
  return 'none';
}
const rvCan = row => row.exact || row.on || spTyped[row.id] != null || row.docs.length > 0;
/* the saving an open area could still make, live under the input */
function rvPotHTML(row){
  const typed = spTyped[row.id], amt = typed != null ? typed : row.amt, save = Math.round(amt * row.rate / 100), s = rvStatus(row);
  if(s === 'skip') return '';
  const fig = s === 'dirty' || row.on ? `<span class="fig-est">${tuneStr(save)}</span>` : figHTML(save, !row.exact);
  return `Could save ${fig} kr. a year on the ${row.openN} agreement${row.openN === 1 ? '' : 's'} available here.`;
}
function rvSpendCell(row){
  if(row.kind !== 'open') return `${fmt(row.spend)}<span class="ok" aria-label="reported">${TICK}</span>`;

}
const rvStCell = row => `<span class="rv-st ${row.st.c}">${row.st.tick ? TICK : ''}${row.st.t}${row.st.chev ? CHEV_R : ''}</span>`;
const rvAreaCell = row => `<span class="rv-area"><span class="rv-ic" aria-hidden="true">${catArt(row.art)}</span><span class="rv-name"><b>${esc(row.n)}</b><span>${row.sub}</span></span></span>`;
function rvEditor(row){
  const rv = rvRev(row.id), s = row.s, sent = s === 'sent', typed = spTyped[row.id], can = rvCan(row);
  const sup = rv.sup != null ? rv.sup : row.exact ? row.sup : '';

          <div class="rv-in${sent ? ' ro' : ''}"><input id="rvSup-${row.id}" data-rv-sup="${row.id}" value="${esc(sup)}" placeholder="Who do you buy from?"${sent ? ' readonly' : ''}></div></div>
      </div>
      <div class="rv-col rv-f"><label>Or let your documents do it</label>
        <label class="rv-drop${sent ? ' ro' : ''}" data-rv-drop="${row.id}">${UP_I}<b>Drop reports or contracts</b><span>PDF, Excel or CSV</span>
          <input type="file" multiple accept=".pdf,.xls,.xlsx,.csv" data-rv-file="${row.id}"${sent ? ' disabled' : ''}></label>
        <div class="rv-docs">${row.docs.map(d => `<span>${DOC_I}<span class="file">${esc(d)}</span></span>`).join('')}
          <span>${SPARK_I}Reports fill in spend. Contracts add renewal dates.</span>
          <span>${LOCK_I}Used only for your map. Never shared with suppliers.</span></div>
      </div>
    </div>
    <div class="rv-act">${sent
      ? `<span class="rv-sent">${TICK}Sent · Peter compares and replies here within two working days</span><span class="spacer"></span><button type="button" class="linkbtn quiet" data-rv-act="withdraw" data-rv-id="${row.id}">Withdraw</button>`
      : `<button type="button" class="linkbtn quiet" data-rv-act="${s === 'skip' ? 'undo' : 'skip'}" data-rv-id="${row.id}">${s === 'skip' ? 'Review it after all' : 'We keep our own supplier'}</button><span class="spacer"></span>
         <span class="note">Peter compares and replies here within two working days</span>
         <button type="button" class="btn" data-rv-act="save" data-rv-id="${row.id}"${can ? '' : ' disabled'}>Save</button>
         <button type="button" class="btn btn-primary" data-rv-act="send" data-rv-id="${row.id}"${can ? '' : ' disabled'}>${SEND_I}Send for review</button>`}
    </div></div>`;
}
function rvRow(row){
  const cells = `${rvAreaCell(row)}<span class="rv-num" data-rv-sp="${row.id}">${rvSpendCell(row)}</span>
    <span class="rv-num c-sv">${row.saved ? `<span class="fig-pos">${fmt(row.saved)}</span>` : '<span class="none">—</span>'}</span>
    <span data-rv-st="${row.id}">${rvStCell(row)}</span><span class="rv-x" aria-hidden="true">${row.kind === 'open' ? CHEV_D : ''}</span>`;
  return row.kind === 'open'
    ? `<details name="rvrow" data-rv-row="${row.id}"${RV_OPEN === row.id ? ' open' : ''}><summary><div class="rv-tr">${cells}</div></summary>${rvEditor(row)}</details>`
    : `<div class="rv-tr${row.stop ? ' stop' : ''}">${cells}</div>`;
}
function renderAreas(){
  const rows = rvRows(), todo = rows.filter(r => r.kind === 'open' && (r.s === 'none' || r.s === 'dirty')), done = rows.length - todo.length;
  const anyEst = rows.some(r => !r.reported && !r.on);
  $('#areas').innerHTML = `
    <div class="card-h"><h3 id="arT">All your purchasing areas</h3>${INFO}<span class="sp"></span>
      <span class="key"><span><svg class="ok" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Reported</span>${anyEst ? `<span>${DASH_O}Estimated</span>` : ''}</span>
      <span class="tag">Sorted by spend</span></div>
    <div class="rv">
      <div class="rv-th"><span>Area</span><span class="r">Spend / year</span><span class="r c-sv">Saved</span><span>Status</span><span></span></div>
      ${rows.map(rvRow).join('')}
    </div>
    <div class="rv-foot"><span>${todo.length ? `${todo.length} area${todo.length === 1 ? '' : 's'} still to review. Each takes about a minute.` : 'Every area is reviewed.'}</span><span class="sp"></span>
      ${todo.length ? `<button type="button" class="btn btn-primary" data-rv-next>Review next area</button>` : ''}</div>`;
  const pill = $('#revPill'); if(pill){ pill.className = 'pill' + (todo.length ? '' : ' done'); pill.innerHTML = `<i></i>${done} of ${rows.length} areas reviewed`; }
}
/* a keystroke moves the row's figure, its status and the saving under the input,
   without rebuilding anything the person is typing in */
function rvLive(id){
  const row = rvRows().find(r => r.id === id); if(!row) return;
  document.querySelectorAll(`#areas [data-rv-sp="${id}"]`).forEach(el => el.innerHTML = rvSpendCell(row));
  document.querySelectorAll(`#areas [data-rv-st="${id}"]`).forEach(el => el.innerHTML = rvStCell(row));
  document.querySelectorAll(`#areas [data-rv-pot="${id}"]`).forEach(el => el.innerHTML = rvPotHTML(row));
  document.querySelectorAll(`#areas [data-rv-act="save"][data-rv-id="${id}"],#areas [data-rv-act="send"][data-rv-id="${id}"]`).forEach(b => b.disabled = !rvCan(row));
}
function rvAct(act, id){
  const row = rvRows().find(r => r.id === id); if(!row) return;
  const st = rvStore(), supIn = $(`#areas [data-rv-sup="${id}"]`), sup = supIn ? supIn.value.trim() : (rvRev(id).sup || '');
  const write = () => {
    const typed = spTyped[id];
    if(typed != null){ if(Math.abs(typed - row.r.amt) < 1) delete st.tune[id]; else st.tune[id] = typed; }
    st.review[id] = {...rvRev(id), sup}; delete spTyped[id];
  };
  if(act === 'save') write();
  else if(act === 'send'){ write();
    st.reqs.push({id:'rv-' + id + '-' + Date.now(), kind:'review', catId:id, catName:row.n, sup, docs:rvRev(id).docs || [],
      spend:st.tune[id] != null ? st.tune[id] : row.r.amt, ref:'RV-' + String(seedOf(row.n + WHO[S.who].company) % 100000).padStart(5, '0'), when:Date.now()}); }
  else if(act === 'skip'){ st.review[id] = {...rvRev(id), sup, skip:true}; delete spTyped[id]; }
  else if(act === 'undo'){ const v = {...rvRev(id)}; delete v.skip; st.review[id] = v; }
  else if(act === 'withdraw'){ st.reqs = st.reqs.filter(q => q.catId !== id); }
  else if(act === 'files'){ return; }
  rvSave();
  RV_OPEN = act === 'skip' ? null : id;
  const y = window.scrollY; renderAreas(); window.scrollTo(0, y);
}
function rvAddFiles(id, files){
  const names = Array.from(files || []).map(f => f.name).filter(Boolean); if(!names.length) return;
  const st = rvStore(), v = rvRev(id); st.review[id] = {...v, docs:[...(v.docs || []), ...names]}; rvSave();
  RV_OPEN = id; const y = window.scrollY; renderAreas(); window.scrollTo(0, y);
}
(() => {
  /* wired on the grid, which is stable: the areas card is rebuilt with the cards */
  const el = $('#cards');
  el.addEventListener('input', e => { const inp = e.target.closest('input[data-rv-live]'); if(!inp) return;
    const id = inp.dataset.rvLive, v = spNum(inp.value); if(v == null) delete spTyped[id]; else spTyped[id] = v; rvLive(id); });
  el.addEventListener('change', e => {
    const f = e.target.closest('input[data-rv-file]'); if(f){ rvAddFiles(f.dataset.rvFile, f.files); return; }
    const inp = e.target.closest('input[data-rv-live]'); if(!inp) return; const v = spNum(inp.value); if(v != null) inp.value = fmt(v); });
  el.addEventListener('click', e => {
    if(e.target.closest('[data-rv-next]')){
      const row = rvRows().find(r => r.kind === 'open' && (r.s === 'none' || r.s === 'dirty')); if(!row) return;
      RV_OPEN = row.id; renderAreas();
      const det = $(`#areas details[data-rv-row="${row.id}"]`); if(!det) return;
      det.scrollIntoView({block:'center', behavior:'smooth'});
      const inp = det.querySelector('input[data-rv-live]'); if(inp) inp.focus({preventScroll:true});
      return;
    }
    const b = e.target.closest('[data-rv-act]'); if(!b) return; e.preventDefault(); rvAct(b.dataset.rvAct, b.dataset.rvId);
  });
  el.addEventListener('dragover', e => { const z = e.target.closest('.rv-drop'); if(!z || z.classList.contains('ro')) return; e.preventDefault(); z.classList.add('over'); });
  el.addEventListener('dragleave', e => { const z = e.target.closest('.rv-drop'); if(z) z.classList.remove('over'); });
  el.addEventListener('drop', e => { const z = e.target.closest('.rv-drop'); if(!z || z.classList.contains('ro')) return; e.preventDefault(); z.classList.remove('over'); rvAddFiles(z.dataset.rvDrop, e.dataTransfer.files); });
  el.addEventListener('toggle', e => { const d = e.target.closest('details[data-rv-row]'); if(!d) return;
    if(d.open) RV_OPEN = d.dataset.rvRow; else if(RV_OPEN === d.dataset.rvRow) RV_OPEN = null; }, true);
})();

function render(){ MODEL = build(); renderNav(); renderToday(); renderControls(); renderCards(); }
$('#range').addEventListener('change', e => { S.range = e.target.value; S.gran = RANGES[S.range].g; renderControls(); renderCards(); });
$('#gran').addEventListener('change', e => { S.gran = e.target.value; renderControls(); renderCards(); });
$('#cmp').addEventListener('change', e => { S.cmp = e.target.value === 'on'; renderControls(); renderCards(); });
$('#acctBtn').addEventListener('click', () => menuOpen($('#acctMenu').hidden));
document.addEventListener('click', e => { if(!e.target.closest('.acct-w')) menuOpen(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#acctMenu').hidden){ menuOpen(false); $('#acctBtn').focus(); } });
let rT; new ResizeObserver(() => { clearTimeout(rT); rT = setTimeout(() => { if(MODEL){ renderToday(); CHARTS.forEach(f => f()); } }, 80); }).observe($('.wrap'));
render();
</script>
</body>
